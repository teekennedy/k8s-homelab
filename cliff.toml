# https://git-cliff.org/docs/configuration
#
# Versioning and release notes for the devenv image. Used by
# scripts/release-devenv.sh; `git cliff --bumped-version` shows the next version.

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
  {{ commit.message | split(pat="\n") | first | upper_first }} ({{ commit.id | truncate(length=8, end="") }})\
  {% if commit.breaking %} **BREAKING**{% endif %}
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
tag_pattern = "devenv-[0-9]+\\.[0-9]+\\.[0-9]+"
# Only changes to what DevenvContainer builds count towards a release; keep in
# sync with its Include list in .dagger/main.go.
include_paths = ["devenv.nix", "devenv.yaml", "devenv.lock", "cmd/lab/**"]
# Any conventional commit touching those paths releases at least a patch, so a
# Renovate `chore(deps)` lockfile bump publishes a refreshed image.
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^(chore|build|ci|docs|style|test)", group = "Other" },
]
