# https://woodpecker-ci.org/docs/usage/workflow-syntax
#
# Tags releases for all projects; release.yaml publishes each artifact.
when:
  - event: push
    branch: main
    path:
      include:
        - devenv.nix
        - devenv.yaml
        - devenv.lock
        - "cmd/lab/**"
        - "k8s/platform/forgejo/files/forgejo-resources/**"
        - "k8s/apps/openhands/files/sandbox/**"

# Tags are needed to find the last release and the full history, trees included,
# to find what changed. A partial or shallow clone would make git lazily fetch
# missing objects, which fails: only the clone step has credentials.
clone:
  git:
    # default clone image, must be explicitly specified when changing settings
    image: woodpeckerci/plugin-git@sha256:b49127ebd592cde07fb7a08c68025b1ea2f44f21cd4bd1440dbfe042a02c1581
    # https://github.com/woodpecker-ci/plugin-git/blob/main/docs.md
    settings:
      tags: true
      partial: false
      depth: 0
      lfs: false
      recursive: false

steps:
  # Finds the Nix-built artifacts whose image this commit leaves unchanged, so
  # they are not tagged and published again.
  - name: plan-release
    # Only devenv's images are Nix-built; see cliff.toml's include_paths.
    when:
      - path:
          include:
            - devenv.nix
            - devenv.yaml
            - devenv.lock
            - "cmd/lab/**"
    image: alpine:3@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    environment:
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: "kube-pod://dagger-engine-dagger-helm-engine-0?namespace=dagger-engine&container=dagger-engine"
      DAGGER_NO_NAG: "1"
    backend_options:
      kubernetes:
        serviceAccountName: dagger-pipeline
    # Without a plan, tag-release releases every artifact with changes, as it
    # did before plans existed.
    failure: ignore
    commands:
      - apk add --no-cache curl kubectl jq git
      # The CLI must match the in-cluster engine, so take its version from there.
      - export DAGGER_VERSION="$(sed -n 's|^ *ref:[[:space:]]*registry.dagger.io/engine:v||p' k8s/platform/dagger-engine/values.yaml)"
      - test -n "$DAGGER_VERSION"
      - curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR=/usr/local/bin sh
      # Export the run's traces, logs and metrics to Grafana (Tempo/Loki/Prometheus).
      - . scripts/dagger-otel-env.sh
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - scripts/release-plan.sh "$CI_WORKSPACE/release-plan.json"

  - name: tag-release
    # The only image release_bot_token is released to; see
    # k8s/platform/woodpecker/values.yaml.
    image: alpine/git@sha256:ac6c828f15d82775d204d3d75112e1d34af8945da80ccf922713c9891ba68e7a
    environment:
      FORGEJO_TOKEN:
        from_secret: release_bot_token
    commands:
      - apk add --no-cache curl jq git-cliff
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - |
        if [ -s "$CI_WORKSPACE/release-plan.json" ]; then
          export RELEASE_PLAN="$CI_WORKSPACE/release-plan.json"
        else
          echo "No release plan; releasing every artifact with changes"
        fi
        scripts/release.sh
      # plan-release refreshes the record when devenv-ci's image is unchanged.
      - |
        if jq -e '.["devenv-ci"].changed == false' "$CI_WORKSPACE/release-plan.json" >/dev/null 2>&1; then
          scripts/record-devenv-ci.sh
        fi
