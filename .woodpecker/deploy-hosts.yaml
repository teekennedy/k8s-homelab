# https://woodpecker-ci.org/docs/usage/workflow-syntax
#
# NixOS continuous deployment.
#
# This builds and stages a new NixOS generation on every borg host and then
# kicks off a job to perform the rollout. It deliberately does not wait for any
# reboot: while this pipeline runs, the WoodpeckerPipelineRunning gate
# (k8s/foundation/kured) blocks kured, so waiting here would deadlock.
when:
  - event: push
    branch: main
    path:
      include:
        - flake.nix
        - flake.lock
        - "nix/**"

steps:
  - name: build
    image: alpine/kubectl:1.37.0
    backend_options:
      kubernetes:
        serviceAccountName: nixos-deploy
    environment:
      SSH_USER: deploybot
      CERT_SECRET: deploybot-ssh-cert
      KNOWN_HOSTS: k8s/platform/woodpecker/files/known_hosts
    commands:
      # alpine/kubectl is kubectl on bare Alpine and nothing else, so both the
      # ssh client and jq have to be installed here. alpine/k8s, which this
      # replaced, carried them (and ~280 MB of other tooling) in the image.
      - apk add --no-cache openssh-client jq
      # The credential is an SSH certificate that is regularly reissued by the
      # deploybot-ssh-cert-issuer CronJob in cert-system. Reading it here at
      # runtime keeps it out of Woodpecker's own secret store entirely.
      - install -d -m 700 "$HOME/.ssh"
      - |
        set -e
        kubectl get secret "$CERT_SECRET" -o json > /tmp/cert.json
        jq -r '.data.id_ed25519 | @base64d' /tmp/cert.json > "$HOME/.ssh/id_ed25519"
        jq -r '.data["id_ed25519-cert.pub"] | @base64d' /tmp/cert.json > "$HOME/.ssh/id_ed25519-cert.pub"
        rm -f /tmp/cert.json
        chmod 600 "$HOME/.ssh/id_ed25519"
      - cp "$KNOWN_HOSTS" "$HOME/.ssh/known_hosts"
      - |
        # Build the updated NixOS derivation on every host, canary first.
        set -e

        # Read the host list from the rollout CronJob so it can act as the
        # single source of truth.
        HOST_ORDER=$(kubectl get cronjob nixos-rollout \
          -o jsonpath='{.spec.jobTemplate.spec.template.spec.containers[0].env[?(@.name=="HOST_ORDER")].value}')
        test -n "$HOST_ORDER"

        # Choose the node with the most CPU as the canary. Once the canary is
        # done building, it acts as a package cache (Nix substituter) for the
        # rest of the cluster.
        NAMES=$(for entry in $HOST_ORDER; do echo "$${entry%%=*}"; done | jq -R . | jq -s .)
        CANARY=$(kubectl get nodes -o json | jq -r --argjson names "$NAMES" '
          [.items[] | select(.metadata.name as $n | $names | index($n))
                     | {name: .metadata.name, cpu: (.status.capacity.cpu | tonumber)}]
          | max_by(.cpu) | .name
        ')
        test -n "$CANARY" && [ "$CANARY" != "null" ]

        build_on() {
          name=$1
          ip=$2
          # Ensure the build times out before the entire pipeline is killed,
          # leaving time for the rest of this step's output to be collected.
          timeout 40m ssh -n -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -i "$HOME/.ssh/id_ed25519" \
            -o CertificateFile="$HOME/.ssh/id_ed25519-cert.pub" \
            "$SSH_USER@$ip" "build $CI_COMMIT_SHA" \
            >"/tmp/build.$name.log" 2>&1
        }

        canary_ip=""
        for entry in $HOST_ORDER; do
          name=$${entry%%=*}
          ip=$${entry##*=}
          [ "$name" = "$CANARY" ] && canary_ip=$ip
        done
        test -n "$canary_ip"

        echo "=== building $CANARY first"
        if ! build_on "$CANARY" "$canary_ip"; then
          echo "=== $CANARY: FAILED to build $CI_COMMIT_SHA"
          cat "/tmp/build.$CANARY.log"
          exit 1
        fi
        echo "=== $CANARY: built $CI_COMMIT_SHA"
        cat "/tmp/build.$CANARY.log"

        # Build remaining hosts in parallel
        : >/tmp/build.pids
        for entry in $HOST_ORDER; do
          name=$${entry%%=*}
          ip=$${entry##*=}
          [ "$name" = "$CANARY" ] && continue
          build_on "$name" "$ip" &
          echo "$! $name" >>/tmp/build.pids
        done

        rc=0
        while read -r pid name; do
          if wait "$pid"; then
            echo "=== $name: built $CI_COMMIT_SHA"
          else
            echo "=== $name: FAILED to build $CI_COMMIT_SHA"
            rc=1
          fi
          cat "/tmp/build.$name.log"
        done </tmp/build.pids
        exit $rc

  - name: stage
    image: alpine/kubectl:1.37.0
    depends_on: [build]
    backend_options:
      kubernetes:
        serviceAccountName: nixos-deploy
    environment:
      SSH_USER: deploybot
      CERT_SECRET: deploybot-ssh-cert
      KNOWN_HOSTS: k8s/platform/woodpecker/files/known_hosts
    commands:
      - apk add --no-cache openssh-client jq
      - install -d -m 700 "$HOME/.ssh"
      - |
        set -e
        kubectl get secret "$CERT_SECRET" -o json > /tmp/cert.json
        jq -r '.data.id_ed25519 | @base64d' /tmp/cert.json > "$HOME/.ssh/id_ed25519"
        jq -r '.data["id_ed25519-cert.pub"] | @base64d' /tmp/cert.json > "$HOME/.ssh/id_ed25519-cert.pub"
        rm -f /tmp/cert.json
        chmod 600 "$HOME/.ssh/id_ed25519"
      - cp "$KNOWN_HOSTS" "$HOME/.ssh/known_hosts"
      - |
        set -e

        HOST_ORDER=$(kubectl get cronjob nixos-rollout \
          -o jsonpath='{.spec.jobTemplate.spec.template.spec.containers[0].env[?(@.name=="HOST_ORDER")].value}')
        test -n "$HOST_ORDER"

        : >/tmp/stage.pids
        for entry in $HOST_ORDER; do
          name=$${entry%%=*}
          ip=$${entry##*=}
          ( timeout 10m ssh -n -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
              -i "$HOME/.ssh/id_ed25519" \
              -o CertificateFile="$HOME/.ssh/id_ed25519-cert.pub" \
              "$SSH_USER@$ip" "stage $CI_COMMIT_SHA" \
          ) >"/tmp/stage.$name.log" 2>&1 &
          echo "$! $name" >>/tmp/stage.pids
        done

        rc=0
        while read -r pid name; do
          if wait "$pid"; then
            echo "=== $name: staged $CI_COMMIT_SHA"
          else
            echo "=== $name: FAILED to stage $CI_COMMIT_SHA"
            rc=1
          fi
          cat "/tmp/stage.$name.log"
        done </tmp/stage.pids
        exit $rc

  - name: rollout
    image: alpine/kubectl:1.37.0
    depends_on: [stage]
    backend_options:
      kubernetes:
        serviceAccountName: nixos-deploy
    commands:
      # Drop any rollout still in flight from an earlier push so the newest
      # revision wins, rather than two rollouts racing across the fleet.
      - kubectl delete job -l app.kubernetes.io/name=nixos-rollout --ignore-not-found --wait
      - kubectl create job --from=cronjob/nixos-rollout "nixos-rollout-$(date +%s)"
      # Reboots start once this pipeline exits and the kured gate clears.
      - echo "rollout job created; kured reboots begin once this pipeline finishes"
