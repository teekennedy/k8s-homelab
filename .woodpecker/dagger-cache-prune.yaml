# https://woodpecker-ci.org/docs/usage/workflow-syntax
when:
  - event: manual

steps:
  - name: prune-cache
    image: alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    environment:
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: "kube-pod://dagger-engine-dagger-helm-engine-0?namespace=dagger-engine&container=dagger-engine"
      # Don't prompt for dagger cloud sign up
      DAGGER_NO_NAG: "1"
    backend_options:
      kubernetes:
        serviceAccountName: dagger-pipeline
    commands:
      # kubectl is needed for dagger cli to communicate with the runner host
      - apk add --no-cache curl kubectl
      # The CLI must match the engine that is running now, which is not necessarily
      # the version in values.yaml until the change is deployed.
      - export DAGGER_VERSION="$(kubectl --namespace dagger-engine get pod dagger-engine-dagger-helm-engine-0 --output jsonpath='{.spec.containers[?(@.name=="dagger-engine")].image}' | sed -E 's|^.*:v([^:@]+)(@.*)?$|\1|')"
      - test -n "$DAGGER_VERSION"
      - curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR=/usr/local/bin sh
      # Export the run's traces, logs and metrics to Grafana (Tempo/Loki/Prometheus).
      - . scripts/dagger-otel-env.sh
      - timeout 25m dagger core engine local-cache prune
