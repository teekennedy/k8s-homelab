when:
  - event: tag
    ref:
      - refs/tags/devenv-ci-*
      - refs/tags/devenv-shell-*
      - refs/tags/forgejo-resources-*
      - refs/tags/openhands-sandbox-*

# git-cliff needs the tagged project's complete history and sibling artifact tags.
clone:
  git:
    image: woodpeckerci/plugin-git@sha256:b49127ebd592cde07fb7a08c68025b1ea2f44f21cd4bd1440dbfe042a02c1581
    settings:
      tags: true
      partial: false
      depth: 0
      lfs: false
      recursive: false

steps:
  - name: publish-release
    image: alpine:3.24.4@sha256:93b41ef40b1677fce8fcc64ff4af09daddfacf5040afde618bc46c1e2d1cc7d4
    environment:
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: "kube-pod://dagger-engine-dagger-helm-engine-0?namespace=dagger-engine&container=dagger-engine"
      DAGGER_NO_NAG: "1"
      GHCR_ACCESS_TOKEN:
        from_secret: ghcr_access_token
    backend_options:
      kubernetes:
        serviceAccountName: dagger-pipeline
    commands:
      - apk add --no-cache curl kubectl jq git git-cliff openssh-client
      # The CLI must match the in-cluster engine, so take its version from there.
      - export DAGGER_VERSION="$(sed -n 's|^ *ref:[[:space:]]*registry.dagger.io/engine:v||p' k8s/platform/dagger-engine/values.yaml)"
      - test -n "$DAGGER_VERSION"
      - curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR=/usr/local/bin sh
      # Export the run's traces, logs and metrics to Grafana (Tempo/Loki/Prometheus).
      - . scripts/dagger-otel-env.sh
      # Remote Nix builds on the borg hosts: dagger.toml's ci env.
      - . scripts/nix-ci-ssh-agent.sh
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - scripts/release-metadata.sh "$CI_COMMIT_TAG" > /tmp/release-metadata.json
      - dagger --env ci api call release publish --tag="$CI_COMMIT_TAG" --username=teekennedy --token=env:GHCR_ACCESS_TOKEN --metadata=/tmp/release-metadata.json
      # Record the published devenv-ci image for the next step to commit.
      - |
        case "$CI_COMMIT_TAG" in
          devenv-ci-*) dagger api call nix devenv ci-release --tag="$CI_COMMIT_TAG" export --path=.dagger/modules/nix/devenv-ci.json ;;
        esac

  # Commits the record to main, so the ci toolchain pulls this image while the
  # files it was built from are unchanged (Devenv.CiToolchain).
  - name: record-devenv-ci
    when:
      - evaluate: 'CI_COMMIT_TAG startsWith "devenv-ci-"'
    image: alpine/git:2.54.0@sha256:ac6c828f15d82775d204d3d75112e1d34af8945da80ccf922713c9891ba68e7a
    environment:
      FORGEJO_TOKEN:
        from_secret: release_bot_token
    commands:
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - scripts/record-devenv-ci.sh
