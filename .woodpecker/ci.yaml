# https://woodpecker-ci.org/docs/usage/workflow-syntax
when:
  - event: pull_request

# The devenv toolchain is pulled from the nearest devenv-ci release instead of
# built when nothing it is built from changed since, which takes the release
# tags and enough history to tell which one HEAD descends from.
clone:
  git:
    # default clone image, must be explicitly specified when changing settings
    image: woodpeckerci/plugin-git@sha256:550075c844fcec0af41d9d28f9860aa5d8c43e1e9419be4b9266dc02c2f29804
    # https://github.com/woodpecker-ci/plugin-git/blob/main/docs.md
    settings:
      tags: true
      partial: false
      depth: 0
      lfs: false
      recursive: false

steps:
  - name: ci
    image: alpine:3@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    environment:
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: "kube-pod://dagger-engine-dagger-helm-engine-0?namespace=dagger-engine&container=dagger-engine"
      # Don't prompt for dagger cloud sign up
      DAGGER_NO_NAG: "1"
    backend_options:
      kubernetes:
        serviceAccountName: dagger-pipeline
    commands:
      # kubectl is needed for dagger cli to communicate with the runner host
      - apk add --no-cache curl git kubectl
      # The CLI must match the in-cluster engine, so take its version from there.
      - export DAGGER_VERSION="$(sed -n 's|^ *ref:[[:space:]]*registry.dagger.io/engine:v||p' k8s/platform/dagger-engine/values.yaml)"
      - test -n "$DAGGER_VERSION"
      - curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR=/usr/local/bin sh
      # A warm run takes ~18m; a cold engine cache with other runs in flight can
      # take far longer. Kept well under the pipeline timeout so a check that
      # drifts this slow still fails loudly.
      - timeout 40m dagger check --progress=report --parallel 8
