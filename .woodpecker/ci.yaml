when:
  - event: pull_request
  # Renovate will hold off on creating a PR for an update until the feature branch has a pending status check.
  # CI check needs to run on renovate branch or PR will never be created.
  - branch: renovate/*

steps:
  - name: ci
    image: alpine:3@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    environment:
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: "kube-pod://dagger-engine-dagger-helm-engine-0?namespace=dagger-engine&container=dagger-engine"
      # Don't prompt for dagger cloud sign up
      DAGGER_NO_NAG: "1"
      DAGGER_VERSION: "0.21.4"
    backend_options:
      kubernetes:
        serviceAccountName: dagger-pipeline
    commands:
      # kubectl is needed for dagger cli to communicate with the runner host
      - apk add --no-cache curl kubectl
      - curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR=/usr/local/bin sh
      - dagger check
