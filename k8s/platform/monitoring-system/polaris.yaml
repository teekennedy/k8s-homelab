exemptions:
  - controllerNames:
      - monitoring-system-prometheus-node-exporter
    rules:
      # node-exporter needs hostNetwork to expose true node-level network
      # stats and to bind on the node IP, and hostPID to see host process/
      # systemd state via the mounted /proc and dbus socket.
      - hostNetworkSet
      - hostPIDSet
  - controllerNames:
      - monitoring-system-alloy
    rules:
      # alloy must run as root to read host log paths like /var/log/pods
      # (mode 750, owned by root:root) and /var/log/journal across nodes
      # with varying systemd-journal GIDs. Verified on-cluster 2026-07-01.
      - runAsRootAllowed
  # node-exporter reads host metrics from /proc, /sys and the root filesystem.
  - controllerNames:
      - monitoring-system-prometheus-node-exporter
    rules:
      - hostPathSet
  # alloy tails the host's pod and journal logs.
  - controllerNames:
      - monitoring-system-alloy
    rules:
      - hostPathSet
  # Helm test pods run once and exit.
  - controllerNames:
      - monitoring-system-grafana-test
    rules:
      - readinessProbeMissing
      - livenessProbeMissing
  # The k8s-sidecar config watchers have no health endpoint at this version.
  - controllerNames:
      - monitoring-system-grafana
      - monitoring-system-loki
    rules:
      - readinessProbeMissing
      - livenessProbeMissing
  # The alloy chart has no probe settings for its config-reloader sidecar.
  - controllerNames:
      - monitoring-system-alloy
    containerNames:
      - config-reloader
    rules:
      - readinessProbeMissing
      - livenessProbeMissing
  # Helm test pods come from upstream charts with no resource settings.
  - controllerNames:
      - monitoring-system-grafana-test
    rules:
      - cpuRequestsMissing
      - memoryRequestsMissing
      - memoryLimitsMissing
  # The Tempo chart cannot label its volumeClaimTemplate; the labelled PVC it
  # adopts is declared in templates/tempo-pvc.yaml.
  - controllerNames:
      - monitoring-system-tempo
    rules:
      - longhornGroupStatefulSet
