# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/monitoring.coreos.com/prometheusrule_v1.json
#
# Temperatures come from node-exporter's hwmon collector and disk health from
# smartctl_exporter (see templates/scrape-config-smartctl.yaml).
#
# Temperature rules compare each sensor to its own critical limit rather than a
# fixed number: CPUs, DDR5 DIMMs (spd5118) and NVMe controllers all report
# different limits. Default label matching (not on(instance, chip, sensor))
# matters: during a node-exporter rollout both pods' series overlap and an
# on() join fails with "many-to-many matching not allowed".
#
# borg-3's CPU touches its critical temperature under load in bursts of up to
# ~8 minutes; the `for` durations here are longer than that.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hardware-rules
  namespace: {{ .Release.Namespace }}
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: hardware-temperature
      interval: 1m
      rules:
        - alert: NodeTemperatureHigh
          expr: |
            node_hwmon_temp_celsius > (node_hwmon_temp_crit_celsius - 10)
              and node_hwmon_temp_crit_celsius > 0
          for: 15m
          labels:
            severity: warning
            component: hardware
          annotations:
            summary: {{ "{{ $labels.instance }} sensor {{ $labels.chip }}/{{ $labels.sensor }} is running hot" | quote }}
            description: {{ "{{ $labels.chip }}/{{ $labels.sensor }} on {{ $labels.instance }} has been within 10°C of its critical temperature for 15 minutes (now {{ $value }}°C)." | quote }}

        - alert: NodeTemperatureCritical
          expr: |
            node_hwmon_temp_celsius >= node_hwmon_temp_crit_celsius
              and node_hwmon_temp_crit_celsius > 0
          for: 10m
          labels:
            severity: critical
            component: hardware
          annotations:
            summary: {{ "{{ $labels.instance }} sensor {{ $labels.chip }}/{{ $labels.sensor }} is at its critical temperature" | quote }}
            description: {{ "{{ $labels.chip }}/{{ $labels.sensor }} on {{ $labels.instance }} has been at or above its critical temperature for 10 minutes (now {{ $value }}°C). Expect throttling; DIMMs past this point risk memory errors." | quote }}

    - name: hardware-disks
      interval: 5m
      rules:
        - alert: DiskSmartFailed
          expr: smartctl_device_smart_status == 0
          labels:
            severity: critical
            component: hardware
          annotations:
            summary: {{ "SMART health check failed for {{ $labels.device }} on {{ $labels.instance }}" | quote }}
            description: {{ "The drive's own SMART self-assessment for {{ $labels.device }} on {{ $labels.instance }} reports FAILED. Replace it." | quote }}

        - alert: NvmeCriticalWarning
          expr: smartctl_device_critical_warning > 0
          labels:
            severity: critical
            component: hardware
          annotations:
            summary: {{ "NVMe {{ $labels.device }} on {{ $labels.instance }} reports a critical warning" | quote }}
            description: {{ "The NVMe critical warning bitmask for {{ $labels.device }} on {{ $labels.instance }} is {{ $value }} (1 spare low, 2 temperature, 4 reliability degraded, 8 read-only, 16 backup device failed)." | quote }}

        - alert: NvmeSpareBelowThreshold
          expr: smartctl_device_available_spare < smartctl_device_available_spare_threshold
          labels:
            severity: critical
            component: hardware
          annotations:
            summary: {{ "NVMe {{ $labels.device }} on {{ $labels.instance }} is out of spare blocks" | quote }}
            description: {{ "Available spare on {{ $labels.device }} ({{ $value }}%) has dropped below the vendor threshold." | quote }}

        - alert: NvmeWearHigh
          expr: smartctl_device_percentage_used > 80
          labels:
            severity: warning
            component: hardware
          annotations:
            summary: {{ "NVMe {{ $labels.device }} on {{ $labels.instance }} is {{ $value }}% worn" | quote }}
            description: {{ "{{ $labels.device }} on {{ $labels.instance }} has used {{ $value }}% of its rated write endurance. Plan a replacement." | quote }}

        - alert: DiskMediaErrors
          expr: increase(smartctl_device_media_errors[1h]) > 0
          labels:
            severity: warning
            component: hardware
          annotations:
            summary: {{ "{{ $labels.device }} on {{ $labels.instance }} logged media errors" | quote }}
            description: {{ "{{ $labels.device }} on {{ $labels.instance }} recorded {{ $value }} new unrecovered media errors in the last hour." | quote }}

        # SAS drives report health through SCSI error counters, SATA drives
        # through ATA attributes, and NVMe drives through the NVMe health log.
        # Each rule below only has data for its own kind of drive.
        - alert: DiskUncorrectedErrors
          expr: |
            increase(smartctl_read_total_uncorrected_errors[1h]) > 0
              or increase(smartctl_write_total_uncorrected_errors[1h]) > 0
          labels:
            severity: warning
            component: hardware
          annotations:
            summary: {{ "{{ $labels.device }} on {{ $labels.instance }} has uncorrected read/write errors" | quote }}
            description: {{ "{{ $labels.device }} on {{ $labels.instance }} recorded new uncorrected errors in the last hour." | quote }}

        - alert: DiskGrownDefects
          expr: increase(smartctl_scsi_grown_defect_list[24h]) > 0
          labels:
            severity: warning
            component: hardware
          annotations:
            summary: {{ "{{ $labels.device }} on {{ $labels.instance }} is remapping sectors" | quote }}
            description: {{ "The grown defect list on {{ $labels.device }} increased by {{ $value }} in the last day. A steadily growing list means the drive is failing." | quote }}

        # SATA: sectors the drive has remapped to spares. A few over a disk's
        # life is normal; a rising count means the surface is failing.
        - alert: DiskReallocatedSectors
          expr: increase(smartctl_device_attribute{attribute_name="Reallocated_Sector_Ct", attribute_value_type="raw"}[24h]) > 0
          labels:
            severity: warning
            component: hardware
          annotations:
            summary: {{ "{{ $labels.device }} on {{ $labels.instance }} is reallocating sectors" | quote }}
            description: {{ "{{ $labels.device }} on {{ $labels.instance }} reallocated {{ $value }} more sectors in the last day." | quote }}

        # SATA: sectors that failed to read and are waiting to be remapped on
        # the next write. Data in them may already be lost.
        - alert: DiskPendingSectors
          expr: smartctl_device_attribute{attribute_name=~"Current_Pending_Sector|Offline_Uncorrectable", attribute_value_type="raw"} > 0
          for: 1h
          labels:
            severity: warning
            component: hardware
          annotations:
            summary: {{ "{{ $labels.device }} on {{ $labels.instance }} has unreadable sectors" | quote }}
            description: {{ "{{ $labels.device }} on {{ $labels.instance }} reports {{ $value }} {{ $labels.attribute_name }}. Run a long self-test (`smartctl -t long`) and check the ZFS pool or filesystem for errors." | quote }}

        - alert: DiskReportedUncorrectable
          expr: increase(smartctl_device_attribute{attribute_name="Reported_Uncorrect", attribute_value_type="raw"}[1h]) > 0
          labels:
            severity: warning
            component: hardware
          annotations:
            summary: {{ "{{ $labels.device }} on {{ $labels.instance }} returned uncorrectable errors" | quote }}
            description: {{ "{{ $labels.device }} on {{ $labels.instance }} reported {{ $value }} new errors that ECC could not correct in the last hour." | quote }}

        # SATA: checksum errors on the link, almost always a bad cable or
        # backplane connection rather than the drive itself.
        - alert: DiskInterfaceCRCErrors
          expr: increase(smartctl_device_attribute{attribute_name="UDMA_CRC_Error_Count", attribute_value_type="raw"}[1h]) > 0
          labels:
            severity: warning
            component: hardware
          annotations:
            summary: {{ "{{ $labels.device }} on {{ $labels.instance }} has link CRC errors" | quote }}
            description: {{ "{{ $labels.device }} on {{ $labels.instance }} logged {{ $value }} interface CRC errors in the last hour. Reseat or replace the SATA cable." | quote }}
