# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/monitoring.coreos.com/prometheusrule_v1.json
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: maintenance-gate-rules
  namespace: {{ .Release.Namespace }}
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: maintenance-gates
      interval: 30s
      rules:
        - alert: CoreDNSUnavailable
          expr: kube_deployment_status_replicas_available{namespace="kube-system", deployment="coredns"} < 1
          for: 1m
          labels:
            severity: critical
            component: dns
          annotations:
            summary: {{ "CoreDNS has no available replicas" | quote }}
            description: {{ "CoreDNS has had zero available replicas for at least 1 minute. Automated node reboots should stop because service discovery is impaired." | quote }}

        - alert: PrometheusUnavailable
          expr: kube_statefulset_status_replicas_ready{namespace="monitoring-system", statefulset="prometheus-monitoring-system-kube-pro"} < 1
          for: 1m
          labels:
            severity: critical
            component: monitoring
          annotations:
            summary: {{ "Prometheus is not ready" | quote }}
            description: {{ "Prometheus has had no ready replicas for at least 1 minute. Kured should also fail closed when it cannot query Prometheus, but this alert makes the outage visible." | quote }}

        - alert: KubeStateMetricsUnavailable
          expr: |
            absent(kube_deployment_status_replicas_available{namespace="monitoring-system", deployment="monitoring-system-kube-state-metrics"})
            or kube_deployment_status_replicas_available{namespace="monitoring-system", deployment="monitoring-system-kube-state-metrics"} < 1
          for: 1m
          labels:
            severity: critical
            component: monitoring
          annotations:
            summary: {{ "kube-state-metrics is not available" | quote }}
            description: {{ "kube-state-metrics is absent or has zero available replicas. Many Kubernetes health alerts depend on it, so automated node reboots should stop." | quote }}

        - alert: LonghornManagerNotReady
          expr: |
            kube_daemonset_status_number_ready{namespace="longhorn-system", daemonset="longhorn-manager"}
              < kube_daemonset_status_desired_number_scheduled{namespace="longhorn-system", daemonset="longhorn-manager"}
          for: 1m
          labels:
            severity: critical
            component: storage
          annotations:
            summary: {{ "Longhorn manager is not ready on every scheduled node" | quote }}
            description: {{ "Longhorn manager DaemonSet readiness is below desired for at least 1 minute. Automated node reboots should stop until Longhorn control-plane recovery completes." | quote }}

        - alert: LonghornCSINotReady
          expr: |
            kube_daemonset_status_number_ready{namespace="longhorn-system", daemonset="longhorn-csi-plugin"}
              < kube_daemonset_status_desired_number_scheduled{namespace="longhorn-system", daemonset="longhorn-csi-plugin"}
          for: 1m
          labels:
            severity: critical
            component: storage
          annotations:
            summary: {{ "Longhorn CSI plugin is not ready on every scheduled node" | quote }}
            description: {{ "Longhorn CSI readiness is below desired for at least 1 minute. Automated node reboots should stop because volume attach and mount operations may fail." | quote }}

        - alert: CNPGInstanceNotReady
          expr: |
            kube_pod_status_ready{condition="true", namespace=~"auth-system|crowdsec|gitea", pod=~".*-psql-[0-9]+"} == 0
          for: 2m
          labels:
            severity: critical
            component: database
          annotations:
            summary: {{ "CloudNativePG instance {{ $labels.namespace }}/{{ $labels.pod }} is not ready" | quote }}
            description: {{ "A CloudNativePG Postgres instance pod has been unready for at least 2 minutes. Automated node reboots should stop until database readiness recovers." | quote }}
