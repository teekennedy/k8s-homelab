# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/monitoring.coreos.com/prometheusrule_v1.json
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: maintenance-gate-rules
  namespace: {{ .Release.Namespace }}
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: maintenance-gates
      interval: 30s
      rules:
        - alert: CNPGInstanceNotReady
          expr: |
            kube_pod_status_ready{condition="true", namespace=~"auth-system|crowdsec|forgejo", pod=~".*-psql-[0-9]+"} == 0
          for: 2m
          labels:
            severity: critical
            component: database
          annotations:
            summary: {{ "CloudNativePG instance {{ $labels.namespace }}/{{ $labels.pod }} is not ready" | quote }}
            description: {{ "A CloudNativePG Postgres instance pod has been unready for at least 2 minutes." | quote }}

        # Jellyfin's gates (JellyfinStreamActive and friends) are not here:
        # they ship with the jellyfin chart, in
        # k8s/apps/jellyfin/templates/jellyfin-exporter-prometheusrule.yaml.

        - alert: ResticBackupRunning
          expr: node_systemd_unit_state{name=~"restic-backups-.+\\.service", state="active"} == 1
          labels:
            severity: info
            component: backup
          annotations:
            summary: {{ "Restic backup {{ $labels.name }} is running on {{ $labels.instance }}" | quote }}
            description: {{ "A restic backup systemd unit is currently active. Automated node reboots are blocked until the backup completes." | quote }}
