{{- $cfg := .Values.gitSync }}
{{- $grafanaSvc := printf "http://%s-grafana.%s.svc" .Release.Name .Release.Namespace }}
---
# Applies the Git Sync Repository to Grafana. The Repository lives in Grafana's
# own API (provisioning.grafana.app), not in the cluster, so it can't be a
# manifest here. Re-sending the token on every sync picks up a rotated one.
#
# Create must be a POST, not a server-side apply: on the apply-create path the
# object reaches storage without apiVersion/kind, and Grafana 13.2 then rejects
# the inline token's owner reference ("owner reference must have a valid API
# group..."). Dry runs skip that step, so they don't catch it.
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-git-sync
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    helm.sh/hook: post-install,post-upgrade
spec:
  backoffLimit: 10
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: apply
          image: "{{ $cfg.image.repository }}:{{ $cfg.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          env:
            - name: GRAFANA_URL
              value: {{ $grafanaSvc | quote }}
            - name: GRAFANA_USER
              valueFrom: { secretKeyRef: { name: {{ index .Values "kube-prometheus-stack" "grafana" "admin" "existingSecret" }}, key: username } }
            - name: GRAFANA_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ index .Values "kube-prometheus-stack" "grafana" "admin" "existingSecret" }}, key: password } }
            - name: GIT_TOKEN
              valueFrom: { secretKeyRef: { name: {{ $cfg.tokenSecretName }}, key: token } }
          command: ["/bin/sh", "-euc"]
          args:
            - |
              until curl -fsS "$GRAFANA_URL/api/health" >/dev/null; do
                echo "waiting for Grafana"; sleep 5
              done

              # Forgejo tokens are hex, so they're safe to embed in JSON as-is.
              cat > /tmp/repository.json <<EOF
              {
                "apiVersion": "provisioning.grafana.app/v0alpha1",
                "kind": "Repository",
                "metadata": { "name": {{ $cfg.name | quote }} },
                "spec": {
                  "title": {{ $cfg.name | quote }},
                  "type": "git",
                  "git": {
                    "url": {{ $cfg.url | quote }},
                    "branch": {{ $cfg.branch | quote }},
                    "path": {{ $cfg.path | quote }},
                    "tokenUser": {{ $cfg.tokenUser | quote }}
                  },
                  "sync": {
                    "enabled": true,
                    "target": "folder",
                    "intervalSeconds": {{ $cfg.intervalSeconds }}
                  },
                  "workflows": ["branch"]
                },
                "secure": { "token": { "create": "$GIT_TOKEN" } }
              }
              EOF

              repos="$GRAFANA_URL/apis/provisioning.grafana.app/v0alpha1/namespaces/default/repositories"
              code=$(curl -sS -o /tmp/response.json -w '%{http_code}' \
                -u "$GRAFANA_USER:$GRAFANA_PASSWORD" "$repos/{{ $cfg.name }}")
              case "$code" in
                404) method=POST; url="$repos"; type=application/json ;;
                200) method=PATCH; url="$repos/{{ $cfg.name }}"; type=application/merge-patch+json ;;
                *) echo "GET repository: HTTP $code"; cat /tmp/response.json; exit 1 ;;
              esac

              if ! curl -sS --fail-with-body -o /tmp/response.json \
                -u "$GRAFANA_USER:$GRAFANA_PASSWORD" \
                -X "$method" -H "Content-Type: $type" \
                --data-binary @/tmp/repository.json "$url"
              then
                cat /tmp/response.json; exit 1
              fi
              echo "$method repository {{ $cfg.name }}: ok"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
