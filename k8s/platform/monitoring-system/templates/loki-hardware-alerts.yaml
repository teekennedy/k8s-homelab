apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-alert-rules
  namespace: {{ .Release.Namespace }}
data:
  hardware-alerts.yaml: |
    groups:
      - name: hardware_errors
        interval: 1m
        rules:
          - alert: NodeNvmeFailure
            expr: |
              sum by (host) (
                count_over_time(
                  {job="dmesg"} |~ `nvme.*(controller is down|reset failure|Disabling device after reset)`
                  [5m]
                )
              ) > 0
            for: 0m
            labels:
              severity: critical
              component: hardware
            annotations:
              summary: {{ `"NVMe controller failure on {{ $labels.host }}"` }}
              description: {{ `"dmesg on {{ $labels.host }} is reporting NVMe controller errors. The node may lose its local disk. Check immediately with: ssh {{ $labels.host }} sudo dmesg | grep nvme"` }}

          - alert: NodeFilesystemError
            expr: |
              sum by (host) (
                count_over_time(
                  {job="dmesg"} |~ `(EXT4-fs error|EXT4-fs (error|warning).*error -[0-9]+|EXT4-fs.*abort|ext4_error|BTRFS.*error|XFS.*error.*corruption)`
                  [5m]
                )
              ) > 0
            for: 0m
            labels:
              severity: critical
              component: hardware
            annotations:
              summary: {{ `"Filesystem error on {{ $labels.host }}"` }}
              description: {{ `"dmesg on {{ $labels.host }} is reporting filesystem errors indicating possible disk corruption or failure."` }}

          - alert: NodeBlockDeviceIOError
            expr: |
              sum by (host) (
                count_over_time(
                  {job="dmesg"} |~ `(blk_update_request: I/O error|Buffer I/O error on dev|end_request: I/O error)`
                  [5m]
                )
              ) > 0
            for: 0m
            labels:
              severity: critical
              component: hardware
            annotations:
              summary: {{ `"Block device I/O error on {{ $labels.host }}"` }}
              description: {{ `"dmesg on {{ $labels.host }} is reporting block device I/O errors. A storage device may be failing."` }}

          - alert: NodeMachineCheckError
            expr: |
              sum by (host) (
                count_over_time(
                  {job="dmesg"} |~ `(?i)(machine check exception|mce.*hardware error|EDAC.*error)`
                  [5m]
                )
              ) > 0
            for: 0m
            labels:
              severity: critical
              component: hardware
            annotations:
              summary: {{ `"Machine check error on {{ $labels.host }}"` }}
              description: {{ `"dmesg on {{ $labels.host }} is reporting machine check exceptions, indicating hardware-level CPU/memory errors."` }}

  systemd-alerts.yaml: |
    groups:
      - name: systemd_failures
        interval: 1m
        rules:
          - alert: SystemdUnitFailed
            expr: |
              sum by (host, systemd_unit) (
                count_over_time(
                  {job="systemd-journal", systemd_unit=~".+\\.service"}
                  |~ `(Failed with result|entered failed state)`
                  [10m]
                )
              ) > 0
            for: 0m
            labels:
              severity: warning
              component: system
            annotations:
              summary: {{ `"Systemd unit {{ $labels.systemd_unit }} failed on {{ $labels.host }}"` }}
              description: {{ `"{{ $labels.systemd_unit }} has entered a failed state on {{ $labels.host }}. Check with: journalctl -u {{ $labels.systemd_unit }} --since '-1h'"` }}
