# https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
kube-prometheus-stack:
  ## Setting to true produces cleaner resource names, but requires a data migration because the name of the persistent volume changes. Therefore this should only be set once on initial installation.
  ##
  cleanPrometheusOperatorObjectNames: true
  ## Grafana subchart values: https://github.com/grafana-community/helm-charts/blob/main/charts/grafana/values.yaml
  grafana:
    admin:
      existingSecret: monitoring-system-grafana
      userKey: username
      passwordKey: password
    enabled: true
    defaultDashboardsEnabled: false
    deploymentStrategy:
      type: Recreate
    # fsGroup (472) already sets volume ownership on mount; the chown init
    # container is redundant and only exists to run as root.
    initChownData:
      enabled: false
    serviceMonitor:
      labels: {}
    ingress:
      enabled: true
      hosts:
        - &host grafana.msng.to
      tls:
        - hosts:
            - *host
    persistence:
      storageClassName: longhorn
      accessModes:
        - ReadWriteOnce
      enabled: true
      size: 10Gi
      type: pvc
      labels:
        recurring-job.longhorn.io/source: "enabled"
        recurring-job-group.longhorn.io/backup: "enabled"
    sidecar:
      dashboards:
        enabled: true
        searchNamespace: ALL
      datasources:
        enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 256Mi
    additionalDataSources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://monitoring-system-loki:3100
        isDefault: false
        editable: false
        jsonData:
          timeInterval: 30s
          # OTLP log records keep their trace_id as structured metadata.
          derivedFields:
            - name: TraceID
              matcherType: label
              matcherRegex: trace_id
              datasourceUid: tempo
              url: "${__value.raw}"
              urlDisplayLabel: View trace
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://monitoring-system-tempo:3200
        isDefault: false
        editable: false
        jsonData:
          nodeGraph:
            enabled: true
          # Dagger's exec output reaches Loki as OTLP logs with trace_id and
          # span_id in structured metadata, not in the log line.
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-1m"
            spanEndTimeShift: "1m"
            customQuery: true
            query: '{service_name=~"dagger-(cli|engine)"} | trace_id="${__trace.traceId}" | span_id="${__span.spanId}"'
          # Dagger's per-exec CPU, memory, IO and network metrics are labelled
          # with the span that ran the exec.
          tracesToMetrics:
            datasourceUid: prometheus
            spanStartTimeShift: "-1m"
            spanEndTimeShift: "1m"
            queries:
              - name: Exec resource metrics
                query: '{dagger_io_metrics_span="${__span.spanId}"}'
      - name: VictoriaMetrics
        type: prometheus
        uid: victoriametrics
        access: proxy
        url: http://victoria-metrics-server.victoria-metrics.svc:8428
        isDefault: false
        editable: false
        jsonData:
          # Matches VictoriaMetrics' 5m stream-aggregation interval.
          timeInterval: 5m
    # Plaintext client secret for the Authelia OIDC client (see
    # k8s/platform/auth-system, oidcClientSecrets.clients.grafana and
    # templates/grafana-oidc.yaml). Authelia only ever sees the bcrypt hash of
    # this value, hashed by the auth-system sync job; Grafana needs the
    # plaintext to authenticate at the token endpoint.
    envValueFrom:
      GRAFANA_SSO_CLIENT_SECRET:
        secretKeyRef:
          name: grafana-oidc-authelia
          key: client-secret
    grafana.ini:
      server:
        root_url: https://grafana.msng.to
      plugins:
        # Pin the Grafana Drilldown app plugins so they are reinstalled to these
        # exact versions on startup. The default preinstall list installs the
        # latest version only when a plugin is MISSING and never upgrades one
        # already present on the persistent PVC, so across a Grafana major bump
        # the stale frontend stops loading ("App not found"). Pinning via
        # preinstall overwrites a mismatched on-disk version on boot. Versions
        # are kept current by Renovate (custom.grafana-plugins datasource).
        preinstall: grafana-lokiexplore-app@3.0.0,grafana-metricsdrilldown-app@3.0.0
      auth.generic_oauth:
        enabled: true
        # Auto-provision Grafana accounts for anyone Authelia lets through,
        # and skip Grafana's own login screen straight to Authelia SSO.
        allow_sign_up: true
        auto_login: true
        name: Authelia
        client_id: grafana
        client_secret: $__env{GRAFANA_SSO_CLIENT_SECRET}
        use_pkce: true
        scopes: openid profile email groups offline_access
        auth_url: https://authelia.msng.to/api/oidc/authorization
        token_url: https://authelia.msng.to/api/oidc/token
        api_url: https://authelia.msng.to/api/oidc/userinfo
        # Maps LDAP groups (see auth-system files/lldap-bootstrap/group-configs)
        # onto Grafana's built-in roles via the groups claim. full-admin (the
        # cluster-wide admin group) also grants Grafana Admin. Anyone
        # authenticated but in none of these groups falls back to
        # auto_assign_org_role (Viewer).
        role_attribute_path: >-
          contains(groups[*], 'grafana-admins') && 'Admin' ||
          contains(groups[*], 'full-admin') && 'Admin' ||
          contains(groups[*], 'grafana-editors') && 'Editor' ||
          contains(groups[*], 'grafana-viewers') && 'Viewer'

    resources:
      requests:
        cpu: 50m
        memory: 1Gi
      limits:
        memory: 2Gi
  homepage-grafana:
    enabled: true
    user:
      name: homepage
      email: homepage@msng.to
    secret:
      name: homepage-grafana-credentials

  defaultRules:
    create: false
  ## Configuration for alertmanager
  alertmanager:
    enabled: true

    alertmanagerSpec:
      replicas: 3
      secrets:
        - alertmanager-secrets
      configMaps:
        - alert-templates
      nodeSelector:
        node.msng.to/cnpg-storage: "true"
      podAntiAffinity: hard
      storage:
        volumeClaimTemplate:
          metadata:
            labels:
              recurring-job.longhorn.io/source: "enabled"
              recurring-job-group.longhorn.io/ephemeral: "enabled"
          spec:
            storageClassName: longhorn-strict-local
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 2Gi

    config:
      templates:
        - /etc/alertmanager/configmaps/alert-templates/*.tmpl
      global:
        resolve_timeout: 5m
      route:
        receiver: discord
        group_by: ['alertname', 'severity', 'namespace', 'node']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        routes:
          - receiver: "null"
            matchers:
              - alertname = "Watchdog"
          # Maintenance gates: these exist to block kured, not to tell anyone
          # anything. kured reads firing alerts from Prometheus directly, so
          # dropping them here silences the notification without weakening the
          # gate. JellyfinStuckSession is deliberately not in this list -- a
          # session stuck for twelve hours is a real problem worth a ping.
          - receiver: "null"
            matchers:
              - alertname =~ "ResticBackupRunning|JellyfinStreamActive|WoodpeckerPipelineRunning|LonghornVolumeDegraded"

      receivers:
        - name: "null"
        - name: discord
          discord_configs:
            - send_resolved: true
              title: '{{ template "__discord_subject" . }}'
              message: '{{ template "__discord_alert_list" . }}'
              webhook_url_file: /etc/alertmanager/secrets/alertmanager-secrets/discord_webhook_url

  ## Install Prometheus Operator CRDs
  ##
  crds:
    enabled: true
    ## The CRD upgrade job mitigates the limitation of helm not being able to upgrade CRDs.
    ## The job will apply the CRDs to the cluster before the operator is deployed, using helm hooks.
    ## It deploy a corresponding clusterrole, clusterrolebinding and serviceaccount to apply the CRDs.
    ## This feature is in preview, off by default and may change in the future.
    upgradeJob:
      enabled: true
      forceConflicts: true
      # The chart omits the pod template's metadata entirely when this is unset.
      podLabels:
        app.kubernetes.io/component: crds-upgrade
      image:
        busybox:
          tag: "1.37.0"
        kubectl:
          tag: "v1.34.0"
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          memory: 128Mi

  ##
  global:
    rbac:
      create: true

      ## Create ClusterRoles that extend the existing view, edit and admin ClusterRoles to interact with prometheus-operator CRDs
      ## Ref: https://kubernetes.io/docs/reference/access-authn-authz/rbac/#aggregated-clusterroles
      createAggregateClusterRoles: true

  # k3s bundles kubelet, apiserver controllermanager, scheduler, and etcd into a single binary.
  # Scrape kubelet for all metrics
  kubelet:
    enabled: true
    serviceMonitor:
      ## MetricRelabelConfigs to apply to samples after scraping, but before ingestion.
      ## ref: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#relabelconfig
      ##
      metricRelabelings:
        # Drop apiserver, etcd client, and scheduler histograms and gauges that
        # no dashboard or rule reads.
        - action: drop
          sourceLabels: [__name__]
          regex: (apiserver|etcd)_(request_duration_seconds|request_body_size_bytes|response_sizes|watch_cache_read_wait_seconds|watch_events_sizes)_bucket
        - action: drop
          sourceLabels: [__name__]
          regex: apiserver_(watch_events_dispatch_duration_seconds|storage_list_duration_seconds|watch_list_duration_seconds|watch_cache_initialization_duration_seconds|admission_controller_admission_duration_seconds|admission_step_admission_duration_seconds|admission_webhook_admission_duration_seconds|flowcontrol_(request_execution_seconds|request_wait_duration_seconds|work_estimated_seats|read_vs_write_current_requests|priority_level_seat_utilization|priority_level_request_utilization|demand_seats|request_concurrency_in_use))_bucket
        - action: drop
          sourceLabels: [__name__]
          regex: apiserver_(storage_list_[a-z_]+_total|watch_cache_[a-z_]+|resource_size_estimate_bytes|longrunning_requests|(storage_list|watch_list|watch_events_dispatch)_duration_seconds_(sum|count))
        - action: drop
          sourceLabels: [__name__]
          regex: etcd_request_duration_seconds_bucket|scheduler_(plugin_execution_duration_seconds|event_handling_duration_seconds|framework_extension_point_duration_seconds)_bucket|kubernetes_feature_enabled
        # The apiserver SLO recording rules (apiserver_request:burnrate*) only
        # read the 1s, 5s, 30s and +Inf buckets of this histogram.
        - action: drop
          sourceLabels: [__name__, le]
          regex: apiserver_request_sli_duration_seconds_bucket;(0\.05|0\.1|10|60)(\.0)?
        # Reduce bucket cardinality of kubelet storage operations.
        # (from values.yaml default)
        - action: drop
          sourceLabels: [__name__, le]
          regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
      # Replaces the chart default, so its rules are repeated here before ours.
      cAdvisorMetricRelabelings:
        - sourceLabels: [__name__]
          action: drop
          regex: 'container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)'
        - sourceLabels: [__name__]
          action: drop
          regex: 'container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)'
        - sourceLabels: [__name__]
          action: drop
          regex: 'container_memory_(mapped_file|swap)'
        - sourceLabels: [__name__]
          action: drop
          regex: 'container_(file_descriptors|tasks_state|threads_max)'
        - sourceLabels: [__name__, interface]
          action: drop
          regex: 'container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*'
        - sourceLabels: [__name__]
          action: drop
          regex: 'container_spec.*'
        - sourceLabels: [id, pod]
          action: drop
          regex: '.+;'
        # Unused by any dashboard or rule.
        - sourceLabels: [__name__]
          action: drop
          regex: 'container_(blkio_device_usage_total|memory_failures_total|pressure_[a-z_]+|ulimits_soft)'
  # k3s serves the apiserver's metrics from the kubelet endpoint too, so a
  # separate apiserver scrape would only duplicate them.
  kubeApiServer:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false

  ## Manages Prometheus and Alertmanager components
  ##
  prometheusOperator:
    # Running off of my fork of prometheus-operator to test discord webhookURLFile fix
    image:
      registry: ghcr.io
      repository: teekennedy/prometheus-operator
      tag: discord-webhook-file-fix@sha256:9214d2f42956c8a6f95c8c662389fd4d3933ba88b2a5cb5b847321dc9138c076
      pullPolicy: IfNotPresent
    ## Create Endpoints objects for kubelet targets.
    kubeletEndpointsEnabled: false
    ## Create EndpointSlice objects for kubelet targets.
    kubeletEndpointSliceEnabled: true

    ## Operator Environment
    ##  env:
    ##    VARIABLE: value
    env:
      GOGC: "30"
      TZ: America/Denver

    securityContext:
      fsGroup: 65534
      runAsGroup: 65534
      runAsNonRoot: true
      runAsUser: 65534
      seccompProfile:
        type: RuntimeDefault

    ## Container-specific security context configuration
    ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
    ##
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    admissionWebhooks:
      patch:
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 128Mi
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
      limits:
        memory: 192Mi

  prometheus:
    ingress:
      enabled: true
      pathType: Prefix
      hosts:
        - &promHost prometheus.msng.to
      tls:
        - hosts:
            - *promHost
    ## Settings affecting prometheusSpec
    ## ref: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#prometheusspec
    ##
    prometheusSpec:
      externalUrl: https://prometheus.msng.to

      # The operator only maintains an EndpointSlice for kubelet targets
      # (prometheusOperator.kubeletEndpointsEnabled is false), so discovery
      # through v1 Endpoints would find no kubelets.
      serviceDiscoveryRole: EndpointSlice

      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: 2000m
          memory: 4Gi

      # By default, if you don't specify a selector for prometheus CRDs, it will write a selector that matches only the CRDs that are defined in this helm release
      # Disabling this to pick up all relevant CRDs
      # https://stackoverflow.com/q/68085831
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      scrapeConfigSelectorNilUsesHelmValues: false

      # Remote write to VictoriaMetrics for long-term storage
      remoteWrite:
        - url: "http://victoria-metrics-server.victoria-metrics.svc:8428/api/v1/write"

      # Push endpoint (/api/v1/otlp/v1/metrics) for the OpenTelemetry
      # Collector, which forwards OTLP metrics from Dagger. service.name and
      # service.instance.id become job/instance; other resource attributes
      # only land on target_info.
      enableOTLPReceiver: true

      # Prometheus docs say to set this to maximum 80-85% of the volume size
      # https://prometheus.io/docs/prometheus/latest/storage/#operational-aspects
      retention: "7d"
      retentionSize: "160GiB"
      # Set retentionTime to empty value so prometheus relies solely on retentionSize
      retrentionTime: ""

      storageSpec:
        volumeClaimTemplate:
          metadata:
            labels:
              recurring-job.longhorn.io/source: "enabled"
              recurring-job-group.longhorn.io/ephemeral: "enabled"
          spec:
            storageClassName: longhorn
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 220Gi

  prometheus-node-exporter:
    containerSecurityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
    # Replaces the chart default, so its filesystem excludes are repeated here.
    # /cache/var/lib/kubelet and /run/k3s/containerd are impermanence and k3s
    # paths that otherwise add a series per pod volume.
    extraArgs:
      - --collector.systemd
      - --collector.zfs
      - --collector.textfile.directory=/var/node-exporter-textfiles
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/credentials/.+|run/containerd/.+|run/k3s/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+|cache/var/lib/kubelet/.+)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
    prometheus:
      monitor:
        metricRelabelings:
          # Alerts only read the active and failed states.
          - action: drop
            sourceLabels: [__name__, state]
            regex: node_systemd_unit_state;(activating|deactivating|inactive)
    extraVolumes:
      - name: dbus-socket
        hostPath:
          path: /run/dbus/system_bus_socket
          type: Socket
      - name: os-release
        hostPath:
          path: /etc/os-release
          type: File
      - name: textfile-dir
        hostPath:
          path: /var/lib/prometheus/node-exporter-textfiles
          type: DirectoryOrCreate
    extraVolumeMounts:
      - name: dbus-socket
        mountPath: /var/run/dbus/system_bus_socket
      - name: os-release
        mountPath: /etc/os-release
        readOnly: true
      - name: textfile-dir
        mountPath: /var/node-exporter-textfiles
        readOnly: true
    resources:
      requests:
        cpu: 30m
        memory: 64Mi
      limits:
        memory: 192Mi
  kube-state-metrics:
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
      limits:
        memory: 256Mi
    # No dashboard or rule reads these resources' metrics.
    collectorsExclude:
      - certificatesigningrequests
      - configmaps
      - endpointslices
      - ingresses
      - leases
      - mutatingwebhookconfigurations
      - networkpolicies
      - secrets
      - services
      - storageclasses
      - validatingwebhookconfigurations
      - volumeattachments
    # Unused per-object metadata. kube_replicaset_owner is kept: the workload
    # recording rules join on it.
    metricDenylist:
      - kube_replicaset_(created|metadata_generation|spec_replicas|status_[a-z_]+|annotations|labels)
      - kube_pod_(tolerations|status_qos_class|status_scheduled|status_scheduled_time|status_initialized_time|status_ready_time|status_container_ready_time|service_account|scheduler|restart_policy|ips|created|spec_volumes_[a-z_]+|init_container_state_started|container_state_started)
      - kube_[a-z_]+_(created|annotations)
      - kube_(pod|deployment|statefulset|daemonset|node|namespace|cronjob|persistentvolume|poddisruptionbudget)_labels
    rbac:
      extraRules:
        - apiGroups: ["longhorn.io"]
          resources: ["volumes"]
          verbs: ["list", "watch"]
    customResourceState:
      enabled: true
      config:
        kind: CustomResourceStateMetrics
        spec:
          resources:
            # Longhorn's own exporter has no metric for volume conditions.
            - groupVersionKind:
                group: longhorn.io
                version: v1beta2
                kind: Volume
              metricNamePrefix: kube_longhorn_volume
              labelsFromPath:
                volume: [metadata, name]
                data_locality: [spec, dataLocality]
                pvc: [status, kubernetesStatus, pvcName]
                pvc_namespace: [status, kubernetesStatus, namespace]
              metrics:
                - name: status_condition
                  help: Longhorn volume condition, 1 when the condition is True.
                  each:
                    type: Gauge
                    gauge:
                      path: [status, conditions]
                      labelsFromPath:
                        type: [type]
                        reason: [reason]
                      valueFrom: [status]

prometheus-blackbox-exporter:
  fullnameOverride: blackbox-exporter
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
  config:
    modules:
      http_2xx:
        http:
          # Probe as a browser. Without an Accept header, apps that do their
          # own OIDC (e.g. mod_auth_openidc in FreshRSS) treat the request as
          # an API call and return 401 instead of redirecting to the IdP.
          headers:
            Accept: "text/html,*/*"

# HTTPS endpoints probed through blackbox-exporter by templates/probe-https.yaml.
# Redirects are followed, so endpoints behind Authelia succeed when the login
# page loads: that still covers DNS, ingress, TLS and the auth path.
blackboxProbes:
  - https://msng.to
  - https://authelia.msng.to
  - https://ci.msng.to
  - https://files.msng.to
  - https://git.msng.to
  - https://grafana.msng.to
  - https://jellyfin.msng.to
  - https://rss.msng.to
  - https://terraria.msng.to

loki:
  enabled: true
  deploymentMode: SingleBinary
  # The loki-helm-test hook pod (only ever run via `helm test`) has no
  # values-exposed securityContext or pinned tag in this chart version, so
  # it can't be brought into polaris compliance without vendoring a patched
  # template. It's not part of the running deployment; disable it instead.
  test:
    enabled: false
  loki:
    # TCP rather than /ready, which fails while the ingester replays its WAL.
    livenessProbe:
      tcpSocket:
        port: http-metrics
      periodSeconds: 30
      failureThreshold: 5
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    # Pattern ingester adds CPU/memory overhead; disable if it is too expensive.
    pattern_ingester:
      enabled: true
    storage:
      type: filesystem
    compactor:
      retention_enabled: true
      compaction_interval: 30m
      delete_request_store: filesystem
      working_directory: /tmp/retention
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
    limits_config:
      retention_period: 744h # 31 days
    schemaConfig:
      configs:
        - from: 2026-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    rulerConfig:
      rule_path: /tmp/ruler-scratch
      alertmanager_url: http://monitoring-system-kube-pro-alertmanager.monitoring-system.svc.cluster.local:9093
      enable_alertmanager_v2: true
      # Used to build the "Links: [query]" explore URL on fired alerts:
      # external_url + "/explore?left=...". Must be the plain Grafana base
      # URL (classic Explore route), not the grafana-lokiexplore-app path.
      # datasource_uid must match the Loki datasource's uid below so the
      # generated link actually loads the query instead of falling back to
      # the default Explore view.
      external_url: https://grafana.msng.to
      datasource_uid: loki
      ring:
        kvstore:
          store: inmemory
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 50Gi
      storageClass: longhorn
      labels:
        recurring-job.longhorn.io/source: "enabled"
        recurring-job-group.longhorn.io/ephemeral: "enabled"
    extraVolumes:
      - name: loki-rules
        configMap:
          name: loki-alert-rules
    extraVolumeMounts:
      - name: loki-rules
        mountPath: /var/loki/rules/fake
    resources:
      requests:
        cpu: 180m
        memory: 1Gi
      limits:
        memory: 2Gi
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  gateway:
    livenessProbe:
      tcpSocket:
        port: http-metrics
      periodSeconds: 30
      failureThreshold: 5
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  lokiCanary:
    livenessProbe:
      tcpSocket:
        port: http-metrics
      periodSeconds: 30
      failureThreshold: 5
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 192Mi
  sidecar:
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
      limits:
        memory: 192Mi
  memcachedExporter:
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        memory: 128Mi

promtail:
  enabled: true
  livenessProbe:
    tcpSocket:
      port: http-metrics
    periodSeconds: 30
    failureThreshold: 5
  config:
    clients:
      - url: http://monitoring-system-loki:3100/loki/api/v1/push
    # The chart default positions filename is /run/promtail/positions.yaml,
    # which is tmpfs and so is destroyed on reboot. Promtail seeks to `now -
    # max_age` when it has no saved cursor, resulting in logs getting
    # re-processed after reboot. Nix-impermanence is configured to persist the
    # /var/lib/promtail folder.
    positions:
      filename: /var/lib/promtail/positions.yaml
    snippets:
      extraScrapeConfigs: |
        - job_name: systemd-journal
          journal:
            path: /var/log/journal
            max_age: 24h
            labels:
              job: systemd-journal
          relabel_configs:
            - source_labels: ['__journal__systemd_unit']
              target_label: 'systemd_unit'
            - source_labels: ['__journal__hostname']
              target_label: 'host'
        - job_name: dmesg
          journal:
            path: /var/log/journal
            max_age: 24h
            matches: _TRANSPORT=kernel
            labels:
              job: dmesg
          relabel_configs:
            - source_labels: ['__journal__hostname']
              target_label: 'host'
  # These paths are coupled to services.journald.storage in
  # nix/modules/common/journald.nix: journald writes to /var/log/journal only
  # while storage is "persistent". If that ever goes back to "volatile" the
  # journal moves to /run/log/journal and promtail collects nothing at all,
  # silently — there is no error for an empty journal directory.
  extraVolumes:
    - name: journal
      hostPath:
        path: /var/log/journal
        type: DirectoryOrCreate
    - name: machine-id
      hostPath:
        path: /etc/machine-id
        type: File
    - name: positions
      hostPath:
        path: /var/lib/promtail
        type: DirectoryOrCreate
  extraVolumeMounts:
    - name: journal
      mountPath: /var/log/journal
      readOnly: true
    - name: machine-id
      mountPath: /etc/machine-id
      readOnly: true
    # Writable: this is the one thing promtail persists. The container has
    # readOnlyRootFilesystem, so the positions file has to live on a mount.
    - name: positions
      mountPath: /var/lib/promtail
  resources:
    requests:
      cpu: 110m
      memory: 384Mi
    limits:
      memory: 512Mi

# Trace store. Monolithic Tempo 3: no ingester or compactor, the live-store
# serves recent spans and everything runs in one process. Fed only by
# opentelemetry-collector below, never directly by clients.
tempo:
  enabled: true
  tempo:
    reportingEnabled: false
    # Applied by both the backend scheduler and worker.
    retention: 336h # 14 days
    queryFrontend:
      metrics:
        # TraceQL metrics (`{...} | rate()`, `quantile_over_time`) over up to a
        # week of spans; the default is 24h.
        max_duration: 168h
    overrides:
      defaults:
        global:
          # A whole `dagger check` run is one trace. A fully cached CI run is
          # already ~17k spans and ~7MB, over the 5MB default, and Tempo drops
          # every span past the limit (tempo_discarded_spans_total
          # reason=trace_too_large), including the root span.
          max_bytes_per_trace: 50000000
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 30Gi
  serviceMonitor:
    enabled: true

# Single OTLP entry point for traces, metrics and logs: Dagger clients (CI and
# local, via otel.msng.to) and the dagger engine push here, and it fans out to
# Tempo, Prometheus' OTLP receiver and Loki's OTLP endpoint.
opentelemetry-collector:
  enabled: true
  mode: deployment
  fullnameOverride: otel-collector
  # The chart requires a distribution; k8s has every component used below.
  image:
    repository: otel/opentelemetry-collector-k8s
  command:
    name: otelcol-k8s
  ports:
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false
    metrics:
      enabled: true
  serviceMonitor:
    enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
  # The otel.msng.to HTTPRoute is templates/otel-collector-httproute.yaml.
  # Replaces the chart's default config instead of merging with it: as a
  # subchart, `null` can't remove its default jaeger/zipkin/prometheus
  # receivers (helm/helm#12879).
  alternateConfig:
    extensions:
      # Required by the chart's probes.
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch: {}
      # Dagger sends client metrics as deltas, which Prometheus rejects.
      delta_to_cumulative: {}
      # Span metrics cover only Dagger module function calls and checks, the
      # spans with a name that is stable across runs.
      filter/dagger-calls:
        error_mode: ignore
        traces:
          span:
            - attributes["dagger.io/module.function.name"] == nil and attributes["dagger.io/check.name"] == nil
      # span_metrics groups by resource, and each run's resource is unique
      # (session, process, CI tags). service.name is required by span_metrics.
      transform/drop-run-resource:
        error_mode: ignore
        trace_statements:
          - keep_keys(resource.attributes, ["service.name"])
      # One span per CI `dagger check` run: the CLI's root span, which is an
      # error when any check failed.
      filter/dagger-ci-runs:
        error_mode: ignore
        traces:
          span:
            - not IsRootSpan()
            - resource.attributes["deployment.environment.name"] != "ci"
            - not IsMatch(name, "^dagger(-[^ ]+)? check( |$)")
      # The commit and pipeline run are resource attributes; span_metrics
      # dimensions are read from the span.
      transform/dagger-ci-run-attributes:
        error_mode: ignore
        trace_statements:
          - set(span.attributes["vcs.ref.head.revision"], resource.attributes["vcs.ref.head.revision"])
          - set(span.attributes["cicd.pipeline.run.id"], resource.attributes["cicd.pipeline.run.id"])
          - keep_keys(resource.attributes, ["service.name"])
    connectors:
      # A `dagger_ci_runs_calls_total` series per CI run, labelled with its
      # commit and status, so a commit with both a failed and a passing run
      # (a restart that went green) shows up as a flake. Every run is a new
      # series, so these are left out of VictoriaMetrics.
      span_metrics/dagger-ci-runs:
        namespace: dagger.ci.runs
        histogram:
          disable: true
        dimensions:
          - name: vcs.ref.head.revision
          - name: cicd.pipeline.run.id
        exclude_dimensions: [span.name, span.kind, collector.instance.id]
        # Stop exporting a run's series a day after it ended.
        metrics_expiration: 24h
      # Duration histograms per check and per module function, for trends
      # beyond Tempo's retention. A function's cache outcome is for the call
      # itself, not for the execs it returns (see dagger-engine/README.md).
      span_metrics:
        histogram:
          unit: s
          explicit:
            buckets: [100ms, 1s, 5s, 15s, 30s, 1m, 2m, 5m, 10m, 20m]
        dimensions:
          - name: dagger.io/module.function.name
          - name: dagger.io/cache.outcome
          - name: dagger.io/check.name
          - name: dagger.io/check.passed
        # span.name repeats the function or check name, and
        # collector.instance.id would start new series on every restart.
        exclude_dimensions: [service.name, span.name, span.kind, collector.instance.id]
        aggregation_cardinality_limit: 5000
    exporters:
      otlp_grpc/tempo:
        endpoint: monitoring-system-tempo:4317
        tls:
          insecure: true
      otlp_http/prometheus:
        metrics_endpoint: http://monitoring-system-kube-pro-prometheus:9090/api/v1/otlp/v1/metrics
      otlp_http/loki:
        logs_endpoint: http://monitoring-system-loki:3100/otlp/v1/logs
    service:
      extensions: [health_check]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: ${env:MY_POD_IP}
                    port: 8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp_grpc/tempo]
        traces/span-metrics:
          receivers: [otlp]
          processors: [memory_limiter, filter/dagger-calls, transform/drop-run-resource]
          exporters: [span_metrics]
        traces/dagger-ci-runs:
          receivers: [otlp]
          processors: [memory_limiter, filter/dagger-ci-runs, transform/dagger-ci-run-attributes]
          exporters: [span_metrics/dagger-ci-runs]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, delta_to_cumulative, batch]
          exporters: [otlp_http/prometheus]
        metrics/span-metrics:
          receivers: [span_metrics, span_metrics/dagger-ci-runs]
          processors: [batch]
          exporters: [otlp_http/prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp_http/loki]
