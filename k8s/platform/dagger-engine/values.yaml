# https://github.com/dagger/dagger/blob/main/helm/dagger/values.yaml
dagger-helm:
  engine:
    image:
      ref: registry.dagger.io/engine:v0.21.10
    # https://docs.dagger.io/reference/configuration/engine/
    # insecureRootCapabilities: effectively equivalent to running actions with `docker run --privileged`
    configJson: |
      {
        "logLevel": "info",
        "security": {
          "insecureRootCapabilities": true
        },
        "gc": {
          "enabled": true,
          "maxUsedSpace": "55GB",
          "minFreeSpace": "15%"
        }
      }
    kind: StatefulSet
    resources:
      limits:
        cpu: "8"
        memory: 16Gi
      requests:
        cpu: "4"
        memory: 8Gi
    # Mount files/dagger-entrypoint.sh over the image's entrypoint; the script
    # explains why. Helm values cannot compute a checksum of the script, so the
    # annotation that restarts the pod when it changes is added by helmfile
    # (values.yaml.gotmpl). Rendered with plain Helm, a change to the script
    # needs `kubectl rollout restart` to take effect.
    volumes:
      - name: entrypoint
        configMap:
          name: dagger-engine-entrypoint
          defaultMode: 0755
    volumeMounts:
      - name: entrypoint
        mountPath: /usr/local/bin/dagger-entrypoint.sh
        subPath: dagger-entrypoint.sh
    # use local-path PVC instead of host path for data volume
    hostPath:
      dataVolume:
        enabled: false

    statefulSet:
      persistentVolumeClaim:
        enabled: true
        storageClassName: local-path
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 80Gi
