psql:
  clusterName: gitea-psql
  image: ghcr.io/cloudnative-pg/postgresql:18.4-standard-bookworm

gitea:
  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 1000
  image:
    tag: "1.26.1"
    rootless: true
  # git.msng.to now belongs to Forgejo (k8s/platform/forgejo). Gitea keeps
  # running for the duration of the migration but claims no hostname, so the
  # two never contend for the same Ingress host, DNS record, or certificate.
  # Reach it with `kubectl -n gitea port-forward svc/gitea-http 3000:3000`.
  ingress:
    enabled: false
  postgresql-ha:
    enabled: false
  postgresql:
    enabled: false

  valkey-cluster:
    enabled: true
    persistence:
      storageClass: longhorn-rc1
      labels:
        recurring-job.longhorn.io/source: "enabled"
        recurring-job-group.longhorn.io/ephemeral: "enabled"
    valkey:
      # Default preset of 'nano' resulted in ~33% CPU throttling.
      # Preset definitions: https://github.com/bitnami/charts/blob/948f461f839ebd068afec65b8c6ff9ba871d1ff7/bitnami/common/templates/_resources.tpl#L15
      resourcesPreset: micro
      # Most fields in a statefulset are immutable
      # Tell ArgoCD to delete-then-create the resource to sync changes
      podAnnotations:
        argocd.argoproj.io/sync-options: Force=true,Replace=true

  persistence:
    storageClass: longhorn
    labels:
      recurring-job.longhorn.io/source: "enabled"
      recurring-job-group.longhorn.io/backup: "enabled"

  strategy:
    type: Recreate

  gitea:
    admin:
      existingSecret: gitea-admin-secret
    additionalConfigFromEnvs:
      - name: GITEA__DATABASE__HOST
        valueFrom:
          secretKeyRef:
            name: gitea-psql-app
            key: host
      - name: GITEA__DATABASE__NAME
        valueFrom:
          secretKeyRef:
            name: gitea-psql-app
            key: dbname
      - name: GITEA__DATABASE__USER
        valueFrom:
          secretKeyRef:
            name: gitea-psql-app
            key: username
      - name: GITEA__DATABASE__PASSWD
        valueFrom:
          secretKeyRef:
            name: gitea-psql-app
            key: password
    config:
      server:
        HTTP_PORT: 3000
        LANDING_PAGE: explore
        ROOT_URL: https://git.msng.to
        OFFLINE_MODE: true
      database:
        DB_TYPE: postgres
      repository:
        DISABLED_REPO_UNITS: repo.wiki,repo.projects,repo.packages
        DISABLE_STARS: true
        DEFAULT_BRANCH: main
      service:
        DISABLE_REGISTRATION: false
        ALLOW_ONLY_EXTERNAL_REGISTRATION: true
        SHOW_REGISTRATION_BUTTON: false
        ENABLE_PASSWORD_SIGNIN_FORM: true
        # Force users to log in to view any page or to use the API.
        REQUIRE_SIGNIN_VIEW: true
      service.explore:
        DISABLE_USERS_PAGE: true
      actions:
        ENABLED: true
      webhook:
        ALLOWED_HOST_LIST: private
      oauth2_client:
        ENABLE_AUTO_REGISTRATION: true
        USERNAME: preferred_username
        # LDAP's email is authoritative and Authelia is the only IdP, so
        # silently linking by email on first OIDC login is safe here and
        # preserves the existing tkennedy user (and its Gitea user ID, which
        # Woodpecker keys repo ownership on).
        ACCOUNT_LINKING: auto
      openid:
        ENABLE_OPENID_SIGNIN: false

# Gitea is being retired in favour of Forgejo (k8s/platform/forgejo) and this
# job is deliberately inert for the rest of its life. It reconciled two shared
# resources that forgejo-resources now owns — the argocd-repo-k8s-homelab
# repository credential and argocd-secret's webhook.gogs.secret — both keyed on
# https://git.msng.to/ops/k8s-homelab, which now resolves to Forgejo. Left
# active, whichever job synced last would overwrite the other's credential and
# break ArgoCD's clone or the push webhook.
#
# Gitea itself keeps running (reachable via
# `kubectl -n gitea port-forward svc/gitea-http 3000:3000`, local admin login)
# until the chart is deleted.
gitea-resources:
  users: []
  runners: []
  oauth2Apps: []
  organizations: []
  repositories: []
