psql:
  clusterName: gitea-psql
  image: ghcr.io/cloudnative-pg/postgresql:18.4-standard-bookworm

gitea:
  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 1000
  image:
    tag: "1.26.1"
    rootless: true
  ingress:
    enabled: true
    annotations:
      helm.sh/hook: post-install,post-upgrade
    hosts:
      - host: &host git.msng.to
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - *host
  postgresql-ha:
    enabled: false
  postgresql:
    enabled: false

  valkey-cluster:
    enabled: true
    persistence:
      storageClass: longhorn-rc1
      labels:
        recurring-job.longhorn.io/source: "enabled"
        recurring-job-group.longhorn.io/ephemeral: "enabled"
    valkey:
      # Default preset of 'nano' resulted in ~33% CPU throttling.
      # Preset definitions: https://github.com/bitnami/charts/blob/948f461f839ebd068afec65b8c6ff9ba871d1ff7/bitnami/common/templates/_resources.tpl#L15
      resourcesPreset: micro
      # Most fields in a statefulset are immutable
      # Tell ArgoCD to delete-then-create the resource to sync changes
      podAnnotations:
        argocd.argoproj.io/sync-options: Force=true,Replace=true

  persistence:
    storageClass: longhorn
    labels:
      recurring-job.longhorn.io/source: "enabled"
      recurring-job-group.longhorn.io/backup: "enabled"

  strategy:
    type: Recreate

  gitea:
    admin:
      existingSecret: gitea-admin-secret
    additionalConfigFromEnvs:
      - name: GITEA__DATABASE__HOST
        valueFrom:
          secretKeyRef:
            name: gitea-psql-app
            key: host
      - name: GITEA__DATABASE__NAME
        valueFrom:
          secretKeyRef:
            name: gitea-psql-app
            key: dbname
      - name: GITEA__DATABASE__USER
        valueFrom:
          secretKeyRef:
            name: gitea-psql-app
            key: username
      - name: GITEA__DATABASE__PASSWD
        valueFrom:
          secretKeyRef:
            name: gitea-psql-app
            key: password
    config:
      server:
        HTTP_PORT: 3000
        LANDING_PAGE: explore
        ROOT_URL: https://git.msng.to
        OFFLINE_MODE: true
      database:
        DB_TYPE: postgres
      repository:
        DISABLED_REPO_UNITS: repo.wiki,repo.projects,repo.packages
        DISABLE_STARS: true
        DEFAULT_BRANCH: main
      service:
        DISABLE_REGISTRATION: false
        ALLOW_ONLY_EXTERNAL_REGISTRATION: true
        SHOW_REGISTRATION_BUTTON: false
        ENABLE_PASSWORD_SIGNIN_FORM: true
        # Force users to log in to view any page or to use the API.
        REQUIRE_SIGNIN_VIEW: true
      service.explore:
        DISABLE_USERS_PAGE: true
      actions:
        ENABLED: true
      webhook:
        ALLOWED_HOST_LIST: private
      oauth2_client:
        ENABLE_AUTO_REGISTRATION: true
        USERNAME: preferred_username
        # LDAP's email is authoritative and Authelia is the only IdP, so
        # silently linking by email on first OIDC login is safe here and
        # preserves the existing tkennedy user (and its Gitea user ID, which
        # Woodpecker keys repo ownership on).
        ACCOUNT_LINKING: auto
      openid:
        ENABLE_OPENID_SIGNIN: false

gitea-resources:
  users:
    - name: renovate
      fullName: Renovate
      email: bot@renovateapp.com
      secretName: renovate-gitea-user
      secretNamespace: renovate
      accessTokens:
        - name: renovate
          scopes:
            - write:repository
            - read:user
            - write:issue
            - read:organization
            - read:misc
    - name: homepage
      fullName: Homepage
      email: homepage@msng.to
      secretName: homepage-gitea-credentials
      secretNamespace: gitea
      accessTokens:
        - name: homepage
          scopes:
            - read:issue
            - read:notification
            - read:organization
            - read:repository
            - read:user
    - name: argocd
      fullName: ArgoCD
      email: argocd@msng.to
      secretName: argocd-gitea-credentials
      secretNamespace: argocd
      accessTokens:
        - name: argocd
          scopes:
            - read:repository
          # Writes the token into a separate labeled repository-credential
          # Secret that ArgoCD auto-discovers by repo URL, keeping this
          # token distinct from the account password used above (which
          # gitea-resources itself needs for API login).
          repoCredential:
            secretName: argocd-repo-k8s-homelab
            secretNamespace: argocd
            url: https://git.msng.to/ops/k8s-homelab
    - name: tkennedy
      fullName: Terrance Kennedy
      email: terrance@missingtoken.net
      secretName: tkennedy-gitea-user
      secretNamespace: gitea
      admin: true
  runners: []
  oauth2Apps:
    - name: woodpecker
      redirectURIs:
        - https://ci.msng.to/authorize
      secretName: woodpecker-gitea-oauth2
      secretNamespace: woodpecker
  # Where `gitea admin auth` and any future exec-only reconciliation runs.
  # Shared by every config entry below that needs it (currently just oidc).
  podExec:
    namespace: gitea
    labelSelector: app.kubernetes.io/name=gitea
  oidc:
    name: authelia
    clientID: gitea
    clientSecretName: gitea-oidc-authelia
    clientSecretNamespace: gitea
    autoDiscoverURL: https://authelia.msng.to/.well-known/openid-configuration
    iconURL: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/authelia.svg
    scopes:
      - openid
      - profile
      - email
      - groups
    groupClaimName: groups
    adminGroup: gitea-admins
  organizations:
    - name: ops
      description: Operations
      teams:
        - name: Owners
          members:
            - tkennedy
        - name: Bots
          permission: write
          members:
            - renovate
  repositories:
    - name: k8s-homelab
      owner: ops
      description: my bare-metal k8s homelab
      private: false
      webhook:
        # Gitea has no native ArgoCD hook type, but ArgoCD's /api/webhook
        # endpoint natively understands the Gogs payload format, which Gitea
        # can emit. Patches the shared secret into argocd-secret's
        # webhook.gogs.secret key (additive, doesn't touch ArgoCD's other
        # auto-managed keys there).
        url: http://argocd-server.argocd.svc.cluster.local/api/webhook
        branchFilter: main
        secretName: argocd-secret
        secretNamespace: argocd
        secretKey: webhook.gogs.secret
