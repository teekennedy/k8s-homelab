---
apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-resources
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    helm.sh/hook: post-install,post-upgrade
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: gitea-resources-job
      restartPolicy: Never
      containers:
        - name: apply
          image: golang:1.26-alpine
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
          env:
            - name: GOCACHE
              value: /tmp/go-cache
            - name: GOMODCACHE
              value: /tmp/go-modules
            - name: HOME
              value: /tmp
            - name: GITEA_HOST
              value: http://gitea-http:3000
            - name: GITEA_USER
              valueFrom:
                secretKeyRef:
                  name: gitea-admin-secret
                  key: username
            - name: GITEA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitea-admin-secret
                  key: password
          workingDir: /go/src/gitea-resources
          command:
            - sh
            - -c
          args:
            - |
              # wait for gitea to become available
              timeout 300 sh -c 'until wget -q "$GITEA_HOST" -O /dev/null; do sleep 5; done'
              go run .
          volumeMounts:
            - name: source
              mountPath: /go/src/gitea-resources
              readOnly: true
            - name: go-cache
              mountPath: /tmp/go-cache
              subPath: go-cache
            - name: go-modules
              mountPath: /tmp/go-modules
              subPath: go-modules
      volumes:
        - name: source
          configMap:
            name: gitea-resources-config
        - name: go-cache
          persistentVolumeClaim:
            claimName: gitea-resources-go-cache
        - name: go-modules
          persistentVolumeClaim:
            claimName: gitea-resources-go-cache
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-resources-go-cache
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-resources-config
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |
    {{- index .Values "gitea-resources" | toYaml | nindent 4 }}
  {{ (.Files.Glob "files/config/*").AsConfig | nindent 2 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-resources-job
  namespace: {{ .Release.Namespace }}
---

# Generate a single Role per secret namespace,
# that is only allowed to manage the defined secrets in that namespace.
{{- $users := index .Values "gitea-resources" "users" | default (list) }}
{{- $runners := index .Values "gitea-resources" "runners" | default (list) }}
{{- $oauth2Apps := index .Values "gitea-resources" "oauth2Apps" | default (list) }}
{{- $oidcClients := list }}
{{- if index .Values "gitea-resources" "oidc" }}
  {{- $oidcClients = list (index .Values "gitea-resources" "oidc") }}
{{- end }}
{{- $namespaceSecrets := dict }}

{{- range $users }}
  {{- $ns := .secretNamespace }}
  {{- $secret := .secretName }}
  {{- if not (hasKey $namespaceSecrets $ns) }}
    {{- $_ := set $namespaceSecrets $ns (list $secret) }}
  {{- else }}
    {{- $_ := set $namespaceSecrets $ns (append (get $namespaceSecrets $ns) $secret) }}
  {{- end }}
  {{- range .accessTokens }}
    {{- if .repoCredential }}
      {{- $rcNs := .repoCredential.secretNamespace }}
      {{- $rcSecret := .repoCredential.secretName }}
      {{- if not (hasKey $namespaceSecrets $rcNs) }}
        {{- $_ := set $namespaceSecrets $rcNs (list $rcSecret) }}
      {{- else }}
        {{- $_ := set $namespaceSecrets $rcNs (append (get $namespaceSecrets $rcNs) $rcSecret) }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
{{- range $runners }}
  {{- $ns := .secretNamespace }}
  {{- $secret := .secretName }}
  {{- if not (hasKey $namespaceSecrets $ns) }}
    {{- $_ := set $namespaceSecrets $ns (list $secret) }}
  {{- else }}
    {{- $_ := set $namespaceSecrets $ns (append (get $namespaceSecrets $ns) $secret) }}
  {{- end }}
{{- end }}
{{- range $oauth2Apps }}
  {{- $ns := .secretNamespace }}
  {{- $secret := .secretName }}
  {{- if not (hasKey $namespaceSecrets $ns) }}
    {{- $_ := set $namespaceSecrets $ns (list $secret) }}
  {{- else }}
    {{- $_ := set $namespaceSecrets $ns (append (get $namespaceSecrets $ns) $secret) }}
  {{- end }}
{{- end }}
{{- range $oidcClients }}
  {{- $ns := .clientSecretNamespace }}
  {{- $secret := .clientSecretName }}
  {{- if not (hasKey $namespaceSecrets $ns) }}
    {{- $_ := set $namespaceSecrets $ns (list $secret) }}
  {{- else }}
    {{- $_ := set $namespaceSecrets $ns (append (get $namespaceSecrets $ns) $secret) }}
  {{- end }}
{{- end }}
{{- range index .Values "gitea-resources" "repositories" | default (list) }}
  {{- if .webhook }}
    {{- $ns := .webhook.secretNamespace }}
    {{- $secret := .webhook.secretName }}
    {{- if not (hasKey $namespaceSecrets $ns) }}
      {{- $_ := set $namespaceSecrets $ns (list $secret) }}
    {{- else }}
      {{- $_ := set $namespaceSecrets $ns (append (get $namespaceSecrets $ns) $secret) }}
    {{- end }}
  {{- end }}
{{- end }}

{{- range $ns, $secrets := $namespaceSecrets }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-resources-secret-writer
  namespace: {{ $ns }}
rules:
  # The create permission is incompatible with specific resource names
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
{{- range $secrets }}
      - {{ . }}
{{- end }}
    verbs: ["get", "create", "update", "patch"]
---
{{- end }}

# Generate a single RoleBinding per secret namespace
{{- $users := index .Values "gitea-resources" "users" | default (list) }}
{{- $runners := index .Values "gitea-resources" "runners" | default (list) }}
{{- $oauth2Apps := index .Values "gitea-resources" "oauth2Apps" | default (list) }}
{{- $oidcClients := list }}
{{- if index .Values "gitea-resources" "oidc" }}
  {{- $oidcClients = list (index .Values "gitea-resources" "oidc") }}
{{- end }}
{{- $seenNamespaces := dict }}

{{- range $users }}
  {{- $ns := .secretNamespace }}
  {{- if not (hasKey $seenNamespaces $ns) }}
    {{- $_ := set $seenNamespaces $ns true }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-resources-secret-writer-binding
  namespace: {{ $ns }}
subjects:
  - kind: ServiceAccount
    name: gitea-resources-job
    namespace: {{ $.Release.Namespace }}
roleRef:
  kind: Role
  name: gitea-resources-secret-writer
  apiGroup: rbac.authorization.k8s.io
---
  {{- end }}
  {{- range .accessTokens }}
    {{- if .repoCredential }}
      {{- $rcNs := .repoCredential.secretNamespace }}
      {{- if not (hasKey $seenNamespaces $rcNs) }}
        {{- $_ := set $seenNamespaces $rcNs true }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-resources-secret-writer-binding
  namespace: {{ $rcNs }}
subjects:
  - kind: ServiceAccount
    name: gitea-resources-job
    namespace: {{ $.Release.Namespace }}
roleRef:
  kind: Role
  name: gitea-resources-secret-writer
  apiGroup: rbac.authorization.k8s.io
---
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
{{- range $runners }}
  {{- $ns := .secretNamespace }}
  {{- if not (hasKey $seenNamespaces $ns) }}
    {{- $_ := set $seenNamespaces $ns true }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-resources-secret-writer-binding
  namespace: {{ $ns }}
subjects:
  - kind: ServiceAccount
    name: gitea-resources-job
    namespace: {{ $.Release.Namespace }}
roleRef:
  kind: Role
  name: gitea-resources-secret-writer
  apiGroup: rbac.authorization.k8s.io
---
  {{- end }}
{{- end }}
{{- range $oauth2Apps }}
  {{- $ns := .secretNamespace }}
  {{- if not (hasKey $seenNamespaces $ns) }}
    {{- $_ := set $seenNamespaces $ns true }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-resources-secret-writer-binding
  namespace: {{ $ns }}
subjects:
  - kind: ServiceAccount
    name: gitea-resources-job
    namespace: {{ $.Release.Namespace }}
roleRef:
  kind: Role
  name: gitea-resources-secret-writer
  apiGroup: rbac.authorization.k8s.io
---
  {{- end }}
{{- end }}
{{- range $oidcClients }}
  {{- $ns := .clientSecretNamespace }}
  {{- if not (hasKey $seenNamespaces $ns) }}
    {{- $_ := set $seenNamespaces $ns true }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-resources-secret-writer-binding
  namespace: {{ $ns }}
subjects:
  - kind: ServiceAccount
    name: gitea-resources-job
    namespace: {{ $.Release.Namespace }}
roleRef:
  kind: Role
  name: gitea-resources-secret-writer
  apiGroup: rbac.authorization.k8s.io
---
  {{- end }}
{{- end }}
{{- range index .Values "gitea-resources" "repositories" | default (list) }}
  {{- if .webhook }}
    {{- $ns := .webhook.secretNamespace }}
    {{- if not (hasKey $seenNamespaces $ns) }}
      {{- $_ := set $seenNamespaces $ns true }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-resources-secret-writer-binding
  namespace: {{ $ns }}
subjects:
  - kind: ServiceAccount
    name: gitea-resources-job
    namespace: {{ $.Release.Namespace }}
roleRef:
  kind: Role
  name: gitea-resources-secret-writer
  apiGroup: rbac.authorization.k8s.io
---
    {{- end }}
  {{- end }}
{{- end }}

# Grant the job exec access into the gitea pod, needed by config entries
# (e.g. oidc) that reconcile state only reachable via `gitea admin` CLI
# commands with no REST API equivalent.
{{- if index .Values "gitea-resources" "podExec" }}
{{- $podExec := index .Values "gitea-resources" "podExec" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-resources-pod-exec
  namespace: {{ $podExec.namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-resources-pod-exec-binding
  namespace: {{ $podExec.namespace }}
subjects:
  - kind: ServiceAccount
    name: gitea-resources-job
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: gitea-resources-pod-exec
  apiGroup: rbac.authorization.k8s.io
{{- end }}
