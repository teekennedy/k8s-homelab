# Daily base backup of gitea-psql to s3proxy → /storage/nas/backups/postgres/gitea-psql/
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/scheduledbackup_v1.json
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ .Values.psql.clusterName }}-daily
  namespace: {{ .Release.Namespace }}
spec:
  schedule: "18 5 * * *"
  backupOwnerReference: self
  cluster:
    name: {{ .Values.psql.clusterName }}

# Credentials for CNPG to authenticate to s3proxy.
---
apiVersion: v1
kind: Secret
metadata:
  name: cnpg-s3-credentials
  namespace: {{ .Release.Namespace }}
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: "s3proxy/s3proxy-credentials"
data: {}
