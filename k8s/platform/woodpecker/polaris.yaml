exemptions:
  # Woodpecker CI pipelines exec into the Dagger Engine pod to run container builds.
  # The dagger-pipeline-exec Role explicitly grants pods/exec in the dagger-engine
  # namespace so the CI agent's service account can reach the engine.
  - controllerNames:
      - dagger-pipeline-exec
    rules:
      - rolePodExecAttach
  - controllerNames:
      - dagger-pipeline-exec-binding
    rules:
      - rolebindingRolePodExecAttach
  # nixos-rollout apk-installs openssh-client at runtime, which needs root and a
  # writable root filesystem (see the identical pattern in
  # foundation/cert-system/polaris.yaml for the SSH CA workloads). It also polls
  # node readiness via `kubectl get node`, which needs the ServiceAccount token
  # automounted. No PriorityClass resources are defined anywhere in this cluster.
  - controllerNames:
      - nixos-rollout
    rules:
      - runAsRootAllowed
      - notReadOnlyRootFilesystem
      - automountServiceAccountToken
      - priorityClassNotSet
  # woodpecker-resources-config carries the job's Go source and its config.yaml.
  # Polaris flags it on the strength of the word "secret" appearing throughout —
  # in field NAMES (`secretName`, `tokenSecret`, `mirrorSecret`) and in the
  # base64 module hashes in go.sum, neither of which is a credential. Every
  # actual value the job handles comes from a Secret at runtime; the only thing
  # it ever writes into a ConfigMap is source code.
  - controllerNames:
      - woodpecker-resources-config
    rules:
      - sensitiveConfigmapContent
