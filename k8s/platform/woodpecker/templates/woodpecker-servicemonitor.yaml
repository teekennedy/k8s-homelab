# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/monitoring.coreos.com/servicemonitor_v1.json
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: woodpecker-server
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: woodpecker
      app.kubernetes.io/name: server
  endpoints:
    - port: http
      # Woodpecker 3.18 serves Prometheus metrics at /metrics, not
      # /api/metrics/prometheus (server/api/metrics/prometheus.go's route is
      # gone); the old path 404s through to the SPA's catch-all handler,
      # which answers 200 text/html and makes Prometheus mark the target down
      # with "unsupported Content-Type".
      path: /metrics
      interval: 30s
      authorization:
        credentials:
          name: woodpecker-prometheus-secret
          key: WOODPECKER_PROMETHEUS_AUTH_TOKEN
