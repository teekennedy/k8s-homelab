---
apiVersion: v1
kind: Secret
metadata:
  name: woodpecker-prometheus-secret
  namespace: {{ .Release.Namespace }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: "WOODPECKER_PROMETHEUS_AUTH_TOKEN"
    secret-generator.v1.mittwald.de/encoding: "hex"
    secret-generator.v1.mittwald.de/length: "32"
type: Opaque
data: {}
# The server 404s /api/metrics/prometheus entirely unless
# WOODPECKER_PROMETHEUS_AUTH_TOKEN is set (server/api/metrics/prometheus.go),
# so this both enables the endpoint and secures it.
