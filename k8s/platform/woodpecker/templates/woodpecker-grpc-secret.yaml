---
apiVersion: v1
kind: Secret
metadata:
  name: woodpecker-grpc-secret
  namespace: {{ .Release.Namespace }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: "WOODPECKER_GRPC_SECRET"
    secret-generator.v1.mittwald.de/encoding: "hex"
    secret-generator.v1.mittwald.de/length: "32"
type: Opaque
data: {}
# WOODPECKER_GRPC_SECRET is auto-generated as a 32-character hex string,
# matching upstream's own `openssl rand -hex 32` recommendation. It signs the
# JWTs agents use to authenticate over gRPC; leaving it unset makes the
# server mint a new random secret on every restart, which invalidates every
# agent's token.
