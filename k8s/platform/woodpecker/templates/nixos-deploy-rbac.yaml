{{- $rollout := .Values.nixosRollout }}
# Identities for the NixOS continuous deployment path.
#
# Two consumers, deliberately separate:
#   nixos-deploy   the .woodpecker/deploy-hosts.yaml step. Reads the deploybot
#                  credential, stages every host, then hands off by creating a
#                  rollout Job. It never waits for a reboot.
#   nixos-rollout  the Job that does wait. It walks the fleet in k3s upgrade
#                  order, so it has to survive its own node being rebooted --
#                  which a Woodpecker step cannot.
#
# Neither holds anything nix-related. All they can do is present a short-lived
# SSH certificate to a login whose shell is a three-verb script; see
# nix/modules/selfupdate.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nixos-deploy
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nixos-rollout
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nixos-deploy
  namespace: {{ .Release.Namespace }}
rules:
  # The SSH credential is read at step runtime rather than held as a
  # Woodpecker-native secret, so it never lands in Woodpecker's database.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $rollout.certSecretName | quote }}]
    verbs: ["get"]
  # `kubectl create job --from=cronjob/nixos-rollout`, plus deleting any
  # in-flight rollout first so the newest revision wins instead of two
  # rollouts racing each other across the fleet.
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: ["nixos-rollout"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nixos-deploy
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: nixos-deploy
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: nixos-deploy
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nixos-rollout
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $rollout.certSecretName | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nixos-rollout
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: nixos-rollout
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: nixos-rollout
  apiGroup: rbac.authorization.k8s.io
---
# Read-only, and only nodes: the rollout job watches for a node going NotReady
# and coming back Ready to know that kured has finished with it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nixos-rollout-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nixos-rollout-nodes
subjects:
  - kind: ServiceAccount
    name: nixos-rollout
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: nixos-rollout-nodes
  apiGroup: rbac.authorization.k8s.io
---
# Lets the SSH cert issuer in cert-system publish the short-lived credential
# into this namespace. The RBAC lives with the consumer so each chart owns the
# resources in its own namespace, mirroring how dagger-rbac.yaml grants this
# namespace's SA access over in dagger-engine.
#
# `create` cannot be narrowed by resourceNames (RBAC does not support that for
# create), so it is namespace-wide; everything that reads or overwrites an
# existing secret is pinned to the one name.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deploybot-ssh-cert-writer
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $rollout.certSecretName | quote }}]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deploybot-ssh-cert-writer
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: deploybot-ssh-cert-issuer
    namespace: {{ $rollout.issuerNamespace }}
roleRef:
  kind: Role
  name: deploybot-ssh-cert-writer
  apiGroup: rbac.authorization.k8s.io
