exemptions:
  # CSI drivers require privileged access and host networking to perform kernel-level
  # volume mount/unmount operations. These are standard requirements for any CSI node plugin.
  - controllerNames:
      - csi-smb-node
      - csi-smb-node-win
    rules:
      - hostNetworkSet
      - runAsPrivileged
      - runAsRootAllowed
      - privilegeEscalationAllowed
  - controllerNames:
      - csi-smb-controller
    rules:
      - hostNetworkSet
      - runAsPrivileged
      - runAsRootAllowed
      - privilegeEscalationAllowed
  # CSI node plugins register with the kubelet and mount volumes under
  # /var/lib/kubelet.
  - controllerNames:
      - csi-smb-node
    rules:
      - hostPathSet
  # The driver container gets its liveness from the liveness-probe sidecar. The
  # chart has no settings for readiness, or for probing the CSI sidecars.
  - controllerNames:
      - csi-smb-node
      - csi-smb-controller
    rules:
      - readinessProbeMissing
      - livenessProbeMissing
