---
# Secret consumed by the oauth2-proxy subchart via config.existingSecret.
# - client-id matches the Authelia OIDC client_id (oauth2-proxy-internal).
# - client-secret is autogenerated by mittwald. auth-system mirrors this Secret
#   in via reflector and bcrypt-hashes client-secret into the Secret Authelia
#   mounts, so no hash is ever produced by hand — see
#   k8s/platform/auth-system/files/oidc-client-secrets/README.md.
# - cookie-secret encrypts the session cookie (32 bytes -> AES-256).
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-internal-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: cookie-secret,client-secret
    secret-generator.v1.mittwald.de/length: "32"
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: auth-system
type: Opaque
stringData:
  client-id: oauth2-proxy-internal
