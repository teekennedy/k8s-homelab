---
# Exposes syncthing.msng.to on the internal traefik-gateway's websecure (HTTPS)
# listener. All traffic goes to this oauth2-proxy instance, which authenticates
# (Authelia SSO + syncthing-admins) and reverse-proxies to the syncthing GUI.
# external-dns-internal resolves the hostname to the gateway VIP (10.69.80.100)
# in Unifi DNS; no entrypoint annotation is set, so only the internal instance
# picks it up.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oauth2-proxy-internal
  labels:
    app.kubernetes.io/name: oauth2-proxy-internal
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - {{ .Values.host }}
  rules:
    - backendRefs:
        - name: oauth2-proxy-internal
          port: 80
