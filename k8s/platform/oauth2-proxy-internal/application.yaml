apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oauth2-proxy-internal
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    name: in-cluster
    namespace: oauth2-proxy-internal
  ignoreDifferences:
    # cookie-secret and client-secret are auto-generated by mittwald.
    - jsonPointers:
        - /data
        - /stringData
      kind: Secret
      name: oauth2-proxy-internal-secrets
      namespace: oauth2-proxy-internal
  project: default
  source:
    path: k8s/platform/oauth2-proxy-internal
    repoURL: http://gitea-http.gitea:3000/ops/k8s-homelab
    targetRevision: main
  syncPolicy:
    # Label the namespace so the internal traefik-gateway's HTTPRoute
    # namespacePolicy (from: Selector) permits this app's HTTPRoute to attach.
    managedNamespaceMetadata:
      labels:
        internal-gateway-access: "true"
    automated:
      prune: true
    retry:
      backoff:
        duration: 1m
        factor: 2
        maxDuration: 16m
      limit: 10
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
