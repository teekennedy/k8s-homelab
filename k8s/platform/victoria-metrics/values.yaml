victoria-metrics-single:
  server:
    # default server name is <namespace>-<chart name>-server, in this case "victoria-metrics-victoria-metrics-single-server"
    fullnameOverride: victoria-metrics-server
    image:
      image: victoriametrics/victoria-metrics
      tag: "v1.154.1@sha256:c7884f32920dd45a9d86542a717227e63af03e060e53bbf8031e6e6fd0e1e05d"
    retentionPeriod: "4y"
    resources:
      requests:
        cpu: 300m
        memory: 768Mi
      limits:
        memory: 3Gi
    persistentVolume:
      enabled: true
      storageClass: longhorn
      # 4y of the allowlisted 5m data is ~1.5Gi; the rest is room for the
      # allowlist to grow and for merges. See "Capacity" in README.md.
      # Changing this needs the procedure under "Resizing the volume".
      size: 10Gi
      extraLabels:
        recurring-job.longhorn.io/source: "enabled"
        recurring-job-group.longhorn.io/ephemeral: "enabled"
    podSecurityContext:
      enabled: true
      fsGroup: 65534
    securityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      allowPrivilegeEscalation: false

    # Stream aggregation (community-edition feature) downsamples every
    # incoming sample to ~5m resolution before it's written to disk.
    extraArgs:
      streamAggr.config: /etc/vm/stream-aggr/config.yml
      streamAggr.dropInput: true
      # Refuse writes while there's still room to merge. Below ~20% free
      # VictoriaMetrics can't run optimal background merges, and the default
      # 100MB guard lets the volume reach that state and then fill completely.
      # Keep at ~20% of persistentVolume.size.
      storage.minFreeDiskSpaceBytes: 2GB

    extraVolumes:
      - name: stream-aggr-config
        configMap:
          name: victoria-metrics-stream-aggr-config
    extraVolumeMounts:
      - name: stream-aggr-config
        mountPath: /etc/vm/stream-aggr

    # Required by the disk alerts in templates/prometheus-alert-rules.yaml --
    # without this nothing scrapes vmsingle's own vm_* metrics. The operator
    # labels the targets job=<service name>, i.e. job="victoria-metrics-server".
    serviceMonitor:
      enabled: true

    # Allowlist of what is worth keeping for years: capacity and usage trends,
    # availability, hardware wear, and alert history. Everything else stays in
    # Prometheus' 7d raw window only. Container usage comes from the pod-free
    # namespace_container:* rules in
    # k8s/platform/monitoring-system/templates/prometheus-rule-longterm.yaml.
    # Each regex line is joined with `|`.
    relabel:
      enabled: true
      config:
        - action: keep
          source_labels: [__name__]
          regex:
            # Availability and alert history
            - up
            - ALERTS
            - probe_success
            - probe_duration_seconds
            # Nodes
            - instance:node_(cpu_utilisation:rate5m|load1_per_cpu:ratio|memory_utilisation:ratio|num_cpu:sum)
            - instance:node_network_(receive|transmit)_bytes_physical:rate5m
            - instance_device:node_disk_io_time_seconds:rate5m
            - node_memory_(MemTotal|MemAvailable)_bytes
            - node_filesystem_(size|avail)_bytes
            - node_disk_(read|written)_bytes_total
            - node_pressure_[a-z_]+_seconds_total
            - node_boot_time_seconds
            # Hardware
            - node_hwmon_temp_celsius
            - node_edac_(correctable|uncorrectable)_errors_total
            - smartctl_device_(percentage_used|temperature|available_spare|bytes_read|bytes_written|power_on_seconds|media_errors)
            - zpool_(health|size_bytes|allocated_bytes|free_bytes|fragmentation_ratio)
            # Workloads
            - namespace_container:.+
            - namespace_(cpu|memory):kube_pod_container_resource_(requests|limits):sum
            - kube_node_status_(capacity|allocatable)
            # Storage growth
            - kubelet_volume_stats_(used|capacity)_bytes
            - longhorn_volume_(actual_size|capacity)_bytes
            - longhorn_disk_(usage|capacity)_bytes
            - cnpg_pg_database_size_bytes
            - etcd_mvcc_db_total_size_in_bytes
            - vm_data_size_bytes
            - prometheus_tsdb_(head_series|storage_blocks_bytes)
            # Traffic and apps
            - exported_service_code:traefik_service_requests:rate5m
            - certmanager_certificate_expiration_timestamp_seconds
            - jellyfin_(active_streams|active_video_transcodes|active_audio_transcodes|paused_streams)
            - qbittorrent_global_(alltime_downloaded_bytes|alltime_uploaded_bytes|ratio|torrents|free_space_on_disk_bytes)
            - cs_active_decisions
            - woodpecker_pipeline_count
            # CI: Dagger function and check durations (mean and count). The
            # buckets would be ~10k series, so percentiles stay in Prometheus.
            - traces_span_metrics_duration_seconds_(sum|count)
        # Labels that change whenever a pod is replaced: `pod`, and `instance`
        # when it is a pod IP (pod CIDR 10.42.0.0/16). Without this every
        # restart starts a new series. Series that only differed by these
        # labels merge, which is fine for the gauges kept above (merged `up`
        # becomes the fraction of a job's targets that are up) but would
        # corrupt per-pod counters; those go through a recording rule instead.
        - action: labeldrop
          regex: pod
        - if: '{instance=~"10\\.42\\..+"}'
          action: labeldrop
          regex: instance

    # vmsingle re-reads -relabelConfig and -streamAggr.config on /-/reload but
    # has no file-watch interval of its own. This calls it whenever either
    # mounted ConfigMap changes, so config edits apply without a restart.
    extraContainers:
      - name: config-reloader
        image: quay.io/prometheus-operator/prometheus-config-reloader:v0.94.2@sha256:a1897c67478bc23434534e91ad3855280771196b1daf17144db9dbcb655bef71
        args:
          - --reload-url=http://127.0.0.1:8428/-/reload
          - --watched-dir=/etc/vm/stream-aggr
          - --watched-dir=/relabelconfig
          - --listen-address=:8081
        ports:
          - name: reloader
            containerPort: 8081
        volumeMounts:
          - name: stream-aggr-config
            mountPath: /etc/vm/stream-aggr
            readOnly: true
          - name: relabelings-assets
            mountPath: /relabelconfig
            readOnly: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: reloader
        readinessProbe:
          httpGet:
            path: /healthz
            port: reloader
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            memory: 32Mi

# Daily vmbackup CronJob writing to a NAS-backed PV.
backup:
  # After Longhorn's 2:30am recurring-job window.
  schedule: "15 3 * * *"
  activeDeadlineSeconds: 7200
  image:
    # Keep in sync with victoria-metrics-single.server.image.tag.
    tag: "v1.153.0"
  nfs:
    server: borg-2.msng.to
    path: /backups/victoriametrics
    capacity: 100Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
