victoria-metrics-single:
  server:
    # default server name is <namespace>-<chart name>-server, in this case "victoria-metrics-victoria-metrics-single-server"
    fullnameOverride: victoria-metrics-server
    image:
      image: victoriametrics/victoria-metrics
      tag: "v1.135.0"
    retentionPeriod: "12"  # 12 months
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    persistentVolume:
      enabled: true
      storageClass: longhorn
      size: 150Gi
      labels:
        recurring-job.longhorn.io/source: "enabled"
        recurring-job-group.longhorn.io/backup: "enabled"
    podSecurityContext:
      enabled: true
      fsGroup: 65534
    securityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      allowPrivilegeEscalation: false
