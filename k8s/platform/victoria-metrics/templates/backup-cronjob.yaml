---
# vmbackup reads TSDB files directly, so this mounts vmsingle's RWO PVC and
# must be scheduled on the same node (podAffinity).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: victoria-metrics-backup
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: victoria-metrics-backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: {{ .Values.backup.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: victoria-metrics-backup
        spec:
          restartPolicy: OnFailure
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/instance: victoria-metrics
                      app.kubernetes.io/name: victoria-metrics-single
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
          containers:
            - name: vmbackup
              image: "victoriametrics/vmbackup:{{ .Values.backup.image.tag }}"
              args:
                - -storageDataPath=/storage
                - -snapshot.createURL=http://victoria-metrics-server.{{ .Release.Namespace }}.svc:8428/snapshot/create
                - -snapshot.deleteURL=http://victoria-metrics-server.{{ .Release.Namespace }}.svc:8428/snapshot/delete
                - -dst=fs:///backup-dest/latest
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: vm-data
                  mountPath: /storage
                  readOnly: true
                - name: backup-dest
                  mountPath: /backup-dest
              resources: {{ toYaml .Values.backup.resources | nindent 16 }}
          volumes:
            - name: vm-data
              persistentVolumeClaim:
                claimName: server-volume-victoria-metrics-server-0
            - name: backup-dest
              persistentVolumeClaim:
                claimName: victoria-metrics-backups
