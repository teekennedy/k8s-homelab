# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/postgresql.cnpg.io/cluster_v1.json
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: crowdsec-psql
  namespace: {{ .Release.Namespace }}
spec:
  instances: 3
  imageName: {{ .Values.psql.image }}
  primaryUpdateStrategy: unsupervised
  storage:
    size: 20Gi
    # Node-local single replica: CNPG's own streaming replication provides HA,
    # so Longhorn's cross-node replication only added fsync latency. strict-local
    # keeps each instance's replica on the node its pod runs on.
    storageClass: longhorn-strict-local
  enableSuperuserAccess: true
  postgresql:
    # postgresql configuration options (postgresql.conf)
    parameters:
      # CrowdSec has relatively low connection needs
      max_connections: "100"
      shared_buffers: 128MB
      # Reduce checkpoint frequency to lower I/O spikes (default 5min)
      checkpoint_timeout: 15min
      # HA replication slots handle replica WAL retention; keep_size adds no value and wastes disk
      max_wal_size: 512MB
      wal_keep_size: "0"
      # Cap how much WAL an HA slot may pin. Default is -1 (unlimited).
      # A standby that missed a segment not covered by WAL can get stuck
      # replicating forever, and the WAL would continue to grow unbounded.
      # Sized so that maximum volume usage (db + max_wal_size +
      # max_slot_wal_keep_size) is less than the volume capacity.
      max_slot_wal_keep_size: 2GB
      # This cluster deliberately has no backups: losing it just means CrowdSec
      # re-downloads the blocklists, and the live bans are ephemeral. CNPG's
      # default archive_timeout of 5min forces a 16MB segment switch every five
      # minutes purely to feed an archive that does not exist. It was
      # generating 4.6GB/day of near-empty segments against ~92MB/day of real
      # WAL. At 1h that drops ~92%.
      archive_timeout: "1h"
  monitoring:
    enablePodMonitor: true
  enablePDB: true
  affinity:
    enablePodAntiAffinity: true
    # required (not preferred): with strict-local storage, two instances on the
    # same node would share one physical disk and lose fault isolation.
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    # Constrain instances to nodes that actually host Longhorn storage.
    nodeSelector:
      node.msng.to/cnpg-storage: "true"
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  bootstrap:
    initdb:
      database: crowdsec
      owner: crowdsec
