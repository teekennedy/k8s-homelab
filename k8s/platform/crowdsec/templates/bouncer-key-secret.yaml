{{- if .Values.traefikBouncer.enabled }}
# API key shared by the Traefik bouncer plugin (read through a secret URN in
# the Middleware) and LAPI (registered from BOUNCER_KEY_traefik at startup).
apiVersion: v1
kind: Secret
metadata:
  name: crowdsec-bouncer-key
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: crowdsec
    app.kubernetes.io/component: traefik-bouncer
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: apiKey
    secret-generator.v1.mittwald.de/length: "64"
    secret-generator.v1.mittwald.de/encoding: hex
type: Opaque
data: {}
{{- end }}
