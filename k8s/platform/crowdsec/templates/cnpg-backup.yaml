# Daily base backup of crowdsec-psql to s3proxy → /storage/nas/backups/postgres/crowdsec-psql/
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: crowdsec-psql
  namespace: {{ .Release.Namespace }}
spec:
  configuration:
    endpointURL: http://s3proxy.s3-proxy.svc.cluster.local
    destinationPath: s3://postgres/
    s3Credentials:
      accessKeyId:
        name: cnpg-s3-credentials
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-s3-credentials
        key: AWS_SECRET_ACCESS_KEY
    data:
      compression: bzip2
  retentionPolicy: "14d"
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/scheduledbackup_v1.json
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: crowdsec-psql-daily
  namespace: {{ .Release.Namespace }}
spec:
  schedule: "50 57 3 * * *"
  backupOwnerReference: self
  cluster:
    name: crowdsec-psql
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io

# Credentials for CNPG to authenticate to s3proxy.
---
apiVersion: v1
kind: Secret
metadata:
  name: cnpg-s3-credentials
  namespace: {{ .Release.Namespace }}
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: "s3-proxy/s3proxy-credentials"
data: {}
