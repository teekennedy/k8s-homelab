# CrowdSec Helm Chart Values
# https://github.com/crowdsecurity/helm-charts/blob/main/charts/crowdsec/README.md

psql:
  # Deliberately in values.yaml so that renovate can pick it up.
  image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:5bf4a23aa13fb560903fba932676773ba4ba2729c162e587b09bf539a2e3df56

crowdsec:
  # Container runtime used by k3s
  container_runtime: containerd
  image:
    repository: crowdsecurity/crowdsec
    tag: v1.8.2-slim@sha256:aa9f6343424bd76f042e9c347fc13b37c2db86dcc763465c2e47744b2442a4c7

  config:
    config.yaml.local: |
      api:
        server:
          auto_registration: # Activate if not using TLS for authentication
            enabled: true
            token: "${REGISTRATION_TOKEN}" # /!\ Do not modify this variable (auto-generated and handled by the chart)
            allowed_ranges:
              - "127.0.0.1/32"
              - "10.69.0.0/16"
              - "10.42.0.0/16"
              - "10.43.0.0/16"
      db_config:
        flush:
          # Crowdsec agents are registered based on their pod name, which
          # changes when the pod gets recreated (e.g. DaemonSet upgrade, pod
          # deletion). Auto-prune agents that haven't been seen in awhile.
          # Provide enough time for a pod to come online after a bad upgrade or
          # failed node reboot.
          agents_autodelete:
            cert: 24h # This is TLS client authentication
            login_password: 24h # This includes the auto registration token as well
          # LAPI adds a `traefik-bouncer@<pod IP>` entry each time a Traefik
          # pod comes up on a new IP, all sharing one API key. Live pods pull
          # every updateInterval, so only entries from gone pods age out.
          bouncers_autodelete:
            api_key: 7d
        type: pgx
        host: crowdsec-psql-rw.crowdsec.svc
        port: 5432
        user: crowdsec
        password: "${DB_PASSWORD}"
        db_name: crowdsec
        sslmode: require
        decision_bulk_size: 2000
        max_open_conns: 50

  secrets:
    externalSecret:
      name: crowdsec-secrets
      csLapiSecretKey: csLapiSecret
      registrationTokenKey: registrationToken

  # LAPI (Local API) configuration
  lapi:
    # Resources for the LAPI pod
    resources:
      limits:
        # Unsets the chart's default CPU limit.
        cpu: null
        memory: 256Mi
      requests:
        cpu: 125m
        memory: 128Mi

    # Persistent storage for LAPI database. The chart cannot label its PVCs,
    # so they are defined in templates/lapi-pvcs.yaml instead.
    persistentVolume:
      config:
        existingClaim: crowdsec-config-pvc
      data:
        enabled: true
        existingClaim: crowdsec-db-pvc

    # Environment variables for LAPI
    env:
      # LOCAL_API_URL is already set by the upstream chart's lapi-deployment
      # template based on .Values.tls.enabled; setting it here duplicates
      # that entry (and breaks server-side apply's env-list merge).
      - name: ENROLL_KEY
        valueFrom:
          secretKeyRef:
            name: crowdsec-secrets   # your existing secrets
            key: enrollKey
      - name: ENROLL_INSTANCE_NAME
        value: "k8s-homelab"
      - name: ENROLL_TAGS
        value: 'k8s nixos homelab'
      - name: DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: crowdsec-psql-app
            key: password
      # Registers the Traefik bouncer as "traefik" at startup. LAPI only adds
      # a bouncer whose name is new, so a changed key needs
      # `cscli bouncers delete traefik` and LAPI and Traefik restarts (see
      # README.md).
      - name: BOUNCER_KEY_traefik
        valueFrom:
          secretKeyRef:
            name: crowdsec-bouncer-key
            key: apiKey

    # Dashboard metrics
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  # Agent configuration (collects logs and sends to LAPI)
  agent:
    # Acquire logs from Traefik pods
    acquisition:
      - namespace: kube-system
        podName: traefik-*
        program: traefik
        poll_without_inotify: true

    # Resources for agent pods
    resources:
      limits:
        # Unsets the chart's default CPU limit.
        cpu: null
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi

    # Environment variables for agent
    env:
      # Install collections for parsing Traefik logs
      - name: COLLECTIONS
        value: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/base-http-scenarios"
      # Parse JSON format logs
      - name: PARSERS
        value: "crowdsecurity/traefik-logs"

    # Run agent as DaemonSet to collect logs from all nodes
    # This is needed because Traefik runs on control plane nodes
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

  # AppSec (WAF). Virtual-patching and generic rules run in-band: they are
  # narrow, cheap, and rarely misfire, so a match blocks the request. The
  # OWASP CRS runs out-of-band: AppSec answers the bouncer before evaluating
  # it, and matches only feed the crowdsec-appsec-outofband scenario, whose
  # ban reaches Traefik on its next decision pull.
  appsec:
    enabled: true
    replicas: 2
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  k8s-app: crowdsec
                  type: appsec
    acquisitions:
      - source: appsec
        listen_addr: "0.0.0.0:7422"
        path: /
        appsec_configs:
          - homelab/appsec
        # Each routine finishes a request's out-of-band pass before taking
        # the next request, so a burst can queue behind CRS evaluation.
        routines: 4
        labels:
          type: appsec
    env:
      - name: COLLECTIONS
        value: "crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules crowdsecurity/appsec-crs"
    configs:
      appsec.yaml: |
        name: homelab/appsec
        default_remediation: ban
        inband_rules:
          - crowdsecurity/base-config
          - crowdsecurity/vpatch-*
          - crowdsecurity/generic-*
        outofband_rules:
          - homelab/crs-allow-http3
          - homelab/crs-skip-unparsed-body
          - homelab/crs-skip-hosts
          - crowdsecurity/crs
    rules:
      # The bundled CRS only allows HTTP/1.x and HTTP/2, so every HTTP/3
      # request matches rule 920430 and a single page load is enough to get
      # banned. This custom rule adds HTTP/3 to the list of allowed versions.
      # TODO: remove this once CRS rules are updated upstream. See
      # https://github.com/crowdsecurity/hub/issues/1939 for context.
      crs-allow-http3.yaml: |
        name: homelab/crs-allow-http3
        description: "Add HTTP/3 to the CRS allowed HTTP versions"
        seclang_rules:
          - SecAction "id:9003,phase:1,pass,nolog,noauditlog,setvar:'tx.allowed_http_versions=HTTP/1.0 HTTP/1.1 HTTP/2 HTTP/2.0 HTTP/3 HTTP/3.0'"
      # CRS spends ~9ms of CPU per KB scanning a body it can't parse (e.g. a
      # 1 MiB application/octet-stream upload took 9s, vs 6ms as JSON), and
      # a busy routine delays every request queued behind it. Such bodies
      # get no body inspection; their URI and headers are still checked.
      crs-skip-unparsed-body.yaml: |
        name: homelab/crs-skip-unparsed-body
        description: "Skip CRS body inspection for bodies it has no parser for"
        seclang_rules:
          - SecRule REQUEST_HEADERS:Content-Type "!@rx ^(?:application/(?:x-www-form-urlencoded|(?:[a-z0-9.+-]+\+)?json|(?:[a-z0-9.+-]+\+)?xml)|multipart/form-data|text/)" "id:9001,phase:1,pass,nolog,noauditlog,ctl:requestBodyAccess=Off"
          - SecRule &REQUEST_HEADERS:Content-Type "@eq 0" "id:9002,phase:1,pass,nolog,noauditlog,ctl:requestBodyAccess=Off"
      # Jellyfin's normal traffic (playback progress reports every 10s, web
      # UI bundles) repeatedly matches CRS and gets streaming clients banned.
      # Removing the CRS ID range takes effect on the next rule, unlike
      # ctl:ruleEngine=Off, which waits for the next phase. In-band rules
      # still apply to these hosts.
      crs-skip-hosts.yaml: |
        name: homelab/crs-skip-hosts
        description: "Skip CRS for hosts whose normal traffic it misflags"
        seclang_rules:
          - SecRule REQUEST_HEADERS:Host "@rx ^jellyfin\.msng\.to(?::[0-9]+)?$" "id:9004,phase:1,pass,nolog,noauditlog,ctl:requestBodyAccess=Off,ctl:ruleRemoveById=900000-999999"
    resources:
      limits:
        # Unsets the chart's default CPU limit.
        cpu: null
        memory: 384Mi
      requests:
        cpu: 100m
        # ~110Mi with 4 routines under load.
        memory: 160Mi

# Traefik bouncer middleware configuration
traefikBouncer:
  # Enable the Traefik middleware
  enabled: true

  # CrowdSec mode: "stream" (recommended) or "live"
  # - stream: Decisions cached locally, updated every updateInterval seconds
  # - live: Query LAPI for every request (higher latency but immediate updates)
  mode: stream

  # Update frequency for stream mode (seconds)
  updateInterval: 60

  # Default action: "ban" or "captcha"
  defaultAction: ban

  # Log level for the bouncer plugin: DEBUG, INFO, WARN, ERROR
  logLevel: INFO

  # Send requests to the AppSec component (crowdsec.appsec above).
  appsec:
    enabled: true
    # Bytes of request body forwarded for inspection (64 KiB). In-band rules
    # add ~2ms at this size, ~5ms at 256 KiB and ~20ms at 1 MiB; attack
    # payloads are small.
    bodyLimit: 65536
