apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oauth2-proxy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    name: in-cluster
    namespace: oauth2-proxy
  ignoreDifferences:
    # cookie-secret is auto-generated by mittwald secret-generator
    - jsonPointers:
        - /data
        - /stringData
      kind: Secret
      name: oauth2-proxy-secrets
      namespace: oauth2-proxy
  project: default
  source:
    path: k8s/platform/oauth2-proxy
    repoURL: http://gitea-http.gitea:3000/ops/k8s-homelab
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
    retry:
      backoff:
        duration: 1m
        factor: 2
        maxDuration: 16m
      limit: 10
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
