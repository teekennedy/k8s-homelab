---
# Secret consumed by the oauth2-proxy subchart via config.existingSecret.
# - client-id is a stable identifier matching the Authelia OIDC client_id.
# - client-secret is autogenerated by mittwald. Authelia stores a bcrypt hash
#   of this value directly in its configmap (see auth-system/values.yaml).
# - cookie-secret encrypts the session cookie (32 bytes -> AES-256).
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: cookie-secret,client-secret
    secret-generator.v1.mittwald.de/length: "32"
type: Opaque
stringData:
  client-id: oauth2-proxy
