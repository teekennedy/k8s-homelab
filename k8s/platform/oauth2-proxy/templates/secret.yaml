---
# Secret consumed by the oauth2-proxy subchart via config.existingSecret.
# - client-id is a stable identifier matching the Authelia OIDC client_id.
# - client-secret is empty: this is a public PKCE client (see auth-system).
# - cookie-secret is autogenerated by mittwald secret-generator (32 bytes,
#   valid for AES-256 cookie encryption).
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: cookie-secret
    secret-generator.v1.mittwald.de/length: "32"
type: Opaque
stringData:
  client-id: oauth2-proxy
  client-secret: ""
