---
# Secret consumed by the oauth2-proxy subchart via config.existingSecret.
# - client-id is a stable identifier matching the Authelia OIDC client_id.
# - client-secret is autogenerated by mittwald and mirrored into the
#   auth-system namespace by reflector so Authelia can read the same value.
# - cookie-secret encrypts the session cookie (32 bytes -> AES-256).
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: cookie-secret,client-secret
    secret-generator.v1.mittwald.de/length: "32"
    # Mirror this secret into auth-system so Authelia's OIDC client config can
    # read the shared client-secret. Reflector creates and keeps in sync a
    # secret of the same name in the target namespace.
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "auth-system"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "auth-system"
type: Opaque
stringData:
  client-id: oauth2-proxy
