---
# Renovate's post-upgrade tasks run `dagger generate` and friends, which
# reach the shared engine over `kube-pod://` — that is `kubectl exec` through the
# apiserver, so the renovate ServiceAccount needs get and exec on the engine
# pod, and nothing else. Same grant as dagger-pipeline in the woodpecker chart.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: renovate-dagger-exec
  namespace: {{ .Values.daggerEngine.namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: [{{ .Values.daggerEngine.pod | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    resourceNames: [{{ .Values.daggerEngine.pod | quote }}]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: renovate-dagger-exec-binding
  namespace: {{ .Values.daggerEngine.namespace }}
subjects:
  - kind: ServiceAccount
    name: renovate
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: renovate-dagger-exec
  apiGroup: rbac.authorization.k8s.io
---
# files/dagger.sh reads the short-lived nix-ci SSH certificate, which
# cert-system publishes beside the pipelines' copy in woodpecker, to give the
# post-upgrade tasks' Nix builds the remote builders. get on that one secret,
# and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: renovate-nix-builders
  namespace: {{ .Values.nixBuilders.certNamespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.nixBuilders.certSecretName | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: renovate-nix-builders
  namespace: {{ .Values.nixBuilders.certNamespace }}
subjects:
  - kind: ServiceAccount
    name: renovate
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: renovate-nix-builders
  apiGroup: rbac.authorization.k8s.io
