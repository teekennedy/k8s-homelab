apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/component: valkey
spec:
  serviceName: valkey
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
      app.kubernetes.io/component: valkey
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/component: valkey
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: valkey
        image: valkey/valkey:9-alpine
        securityContext:
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 6379
          name: valkey
        env:
        - name: VALKEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.authelia.secret.existingSecret }}
              key: session.redis.password.txt
        # maxmemory tracks the container memory limit (in bytes via the
        # downward API) so resizing resources.limits.memory propagates to
        # Valkey's eviction threshold without manual config updates.
        - name: VALKEY_MAXMEMORY
          valueFrom:
            resourceFieldRef:
              containerName: valkey
              resource: limits.memory
              divisor: "1"
        command:
        - sh
        - -c
        - exec valkey-server /etc/valkey/valkey.conf --requirepass "$VALKEY_PASSWORD" --maxmemory "$VALKEY_MAXMEMORY"
        volumeMounts:
        - name: config
          mountPath: /etc/valkey
          readOnly: true
        - name: data
          mountPath: /data
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - valkey-cli -a "$VALKEY_PASSWORD" --no-auth-warning ping
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - valkey-cli -a "$VALKEY_PASSWORD" --no-auth-warning ping
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: config
        configMap:
          name: valkey-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: longhorn
      resources:
        requests:
          storage: 5Gi
