---
# Headless service: gives every StatefulSet pod a stable DNS name
# (valkey-N.valkey-headless.<ns>.svc) that Sentinel and replicas track across
# reschedules. publishNotReadyAddresses lets peers resolve each other during
# bootstrap before readiness passes.
apiVersion: v1
kind: Service
metadata:
  name: valkey-headless
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/component: valkey
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
  - port: 6379
    targetPort: valkey
    protocol: TCP
    name: valkey
  - port: 26379
    targetPort: sentinel
    protocol: TCP
    name: sentinel
  selector:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/component: valkey
---
# Sentinel discovery service: a stable ClusterIP fronting all three Sentinels,
# used as the authelia client's entry point (in addition to the explicit node
# list). Clients ask any Sentinel here for the current primary address.
apiVersion: v1
kind: Service
metadata:
  name: valkey-sentinel
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/component: valkey-sentinel
spec:
  type: ClusterIP
  ports:
  - port: 26379
    targetPort: sentinel
    protocol: TCP
    name: sentinel
  selector:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/component: valkey
