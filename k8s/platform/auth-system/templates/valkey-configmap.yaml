apiVersion: v1
kind: ConfigMap
metadata:
  name: valkey-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/component: valkey
data:
  valkey.conf: |
    bind 0.0.0.0
    port 6379
    maxmemory-policy allkeys-lru
    appendonly yes
    appendfsync everysec
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    dir /data
    protected-mode yes
