{{- include "authSystem.validateOidcClientSources" . -}}
{{- $ctx := .Values.oidcClientSecrets -}}
---
# The `authelia-oidc-client-secrets` Secret that Authelia mounts is NOT defined
# here — it is created and maintained by the sync job below, which bcrypt-hashes
# each client's mittwald-generated plaintext out of the consuming app's own
# namespace. Templating it would mean ArgoCD applying an empty `data: {}` over
# the live hashes partway through a sync, so the job owns it outright (the same
# arrangement as authelia-oidc-jwks).
#
# Adding a new OIDC client is therefore: add the client to
# authelia.configMap.identity_providers.oidc.clients, add one line to
# oidcClientSecrets.clients pointing at the app's Secret, and grant reflector
# access from the app chart (see files/oidc-client-secrets/README.md).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: authelia-oidc-client-secrets-sync
  namespace: "{{ .Release.Namespace }}"
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/hook-weight: "2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: authelia-oidc-client-secrets-sync
  namespace: "{{ .Release.Namespace }}"
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/hook-weight: "3"
rules:
  # Create the reflector mirror Secrets, read the plaintexts reflector puts in
  # them, and maintain the aggregate hash Secret. All in this namespace only —
  # the plaintexts come in via reflector rather than a cross-namespace read, so
  # this needs no ClusterRole.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "patch", "delete"]
  # Restart Authelia when a client secret is rotated; it resolves the secret
  # files at startup only.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
    resourceNames: ["{{ $ctx.autheliaDeployment | default (printf "%s-authelia" .Release.Name) }}"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authelia-oidc-client-secrets-sync
  namespace: "{{ .Release.Namespace }}"
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/hook-weight: "4"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: authelia-oidc-client-secrets-sync
subjects:
  - kind: ServiceAccount
    name: authelia-oidc-client-secrets-sync
    namespace: "{{ .Release.Namespace }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-oidc-client-secrets-sync
  namespace: "{{ .Release.Namespace }}"
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/hook-weight: "4"
data:
  # Only the script is mounted: its PEP-723 header carries its own dependencies,
  # so `uv run --script` needs nothing else. The sibling pyproject.toml exists
  # for pytest and black in CI.
  sync.py: |
{{ .Files.Get "files/oidc-client-secrets/sync.py" | indent 4 }}
---
# PreSync so a client's hash is always in place before Authelia's ConfigMap is
# updated to reference it. If a plaintext never arrives the hook fails, the sync
# is blocked, and the running Authelia pods keep serving the old config — which
# is what makes adding a client safe even when this app syncs before the app
# chart that owns the plaintext (ArgoCD's retry backoff covers the gap).
apiVersion: batch/v1
kind: Job
metadata:
  name: authelia-oidc-client-secrets-sync
  namespace: "{{ .Release.Namespace }}"
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/hook-weight: "5"
    helm.sh/hook: pre-install,pre-upgrade
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: authelia-oidc-client-secrets-sync
      restartPolicy: OnFailure
      containers:
        - name: sync
          image: "{{ $ctx.image.repository }}:{{ $ctx.image.tag }}"
          imagePullPolicy: {{ $ctx.image.pullPolicy }}
          command:
            - sh
            - -c
            - |-
              set -eu
              # Copy out of the read-only ConfigMap mount so uv can create its
              # ephemeral environment alongside the script.
              cp -rL /scripts/. /project/
              cd /project
              uv run --no-cache --link-mode copy --script sync.py
          env:
            - name: HOME
              value: /project
            # Without this, stdout is block-buffered and only flushes when the
            # script exits, so a failure's stderr lands *above* the progress
            # lines that led to it and a slow sync looks like it is doing
            # nothing at all.
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NAMESPACE
              value: "{{ .Release.Namespace }}"
            - name: TARGET_SECRET
              value: "{{ $ctx.targetSecret }}"
            - name: MIRROR_PREFIX
              value: "{{ $ctx.mirrorPrefix }}"
            - name: SOURCE_KEY
              value: "{{ $ctx.sourceKey }}"
            - name: BCRYPT_COST
              value: "{{ $ctx.bcryptCost }}"
            - name: REFLECTION_TIMEOUT
              value: "{{ $ctx.reflectionTimeout }}"
            - name: AUTHELIA_DEPLOYMENT
              value: "{{ $ctx.autheliaDeployment | default (printf "%s-authelia" .Release.Name) }}"
            # <client_id>=<namespace>/<secret-name>[:<key>], comma-separated.
            - name: CLIENT_SOURCES
              value: "{{ include "authSystem.oidcClientSources" . }}"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: project
              mountPath: /project
          {{- with $ctx.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $ctx.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: scripts
          configMap:
            name: authelia-oidc-client-secrets-sync
        - name: project
          emptyDir: {}
