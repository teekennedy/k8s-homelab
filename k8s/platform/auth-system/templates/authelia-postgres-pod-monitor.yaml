# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/monitoring.coreos.com/podmonitor_v1.json
---
# Replaces the operator's PodMonitor (spec.monitoring.enablePodMonitor, which
# CNPG deprecated). Named apart from the cluster so CNPG deleting the PodMonitor
# it owns can't take this one with it; the job label keeps its old value.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: authelia-psql-metrics
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: authelia-psql
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      relabelings:
        - targetLabel: job
          replacement: {{ .Release.Namespace }}/authelia-psql
      # One series per postgres setting per instance; nothing reads them.
      metricRelabelings:
        - action: drop
          sourceLabels: [__name__]
          regex: cnpg_pg_settings_setting
