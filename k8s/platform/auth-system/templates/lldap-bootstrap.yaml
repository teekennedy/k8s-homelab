---
apiVersion: batch/v1
kind: Job
metadata:
  name: lldap-bootstrap
  namespace: "{{ .Release.Namespace }}"
  # Next annotations are required if the job managed by Argo CD,
  # so Argo CD can relaunch the job on every app sync action
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    helm.sh/hook: post-install,post-upgrade
spec:
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: lldap-bootstrap
          # Same image as the lldap deployment (see app-template.controllers.lldap
          # in values.yaml) so renovate updates both together and they never drift.
          image: "{{ (index .Values "app-template" "controllers" "lldap" "containers" "lldap" "image" "repository") }}:{{ (index .Values "app-template" "controllers" "lldap" "containers" "lldap" "image" "tag") }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }

          command:
            - /bootstrap/bootstrap.sh

          env:
            - name: LLDAP_URL
              value: https://lldap.msng.to

            - name: LLDAP_ADMIN_USERNAME
              valueFrom: { secretKeyRef: { name: lldap-admin-user, key: lldap-ldap-user } }

            - name: LLDAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: lldap-admin-user, key: lldap-ldap-user-pass } }

            # env vars for bootstrap.sh
            - name: USER_CONFIGS_DIR
              value: /bootstrap/user-configs
            - name: GROUP_CONFIGS_DIR
              value: /bootstrap/group-configs
            - name: USER_SCHEMAS_DIR
              value: /bootstrap/user-schemas
            - name: GROUP_SCHEMAS_DIR
              value: /bootstrap/group-schemas
            - name: DO_CLEANUP
              value: "true"

          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap/bootstrap.sh
              readOnly: true
              subPath: bootstrap.sh

            - name: user-configs
              mountPath: /bootstrap/user-configs
              readOnly: true

            - name: group-configs
              mountPath: /bootstrap/group-configs
              readOnly: true

            - name: authelia-bind-user-secret
              mountPath: /bootstrap/secrets/authelia-bind-user
              readOnly: true

            - name: jellyfin-bind-user-secret
              mountPath: /bootstrap/secrets/jellyfin-bind-user
              readOnly: true
      volumes:
        - name: bootstrap
          configMap:
            name: lldap-bootstrap-script
            defaultMode: 0555
            items:
              - key: bootstrap.sh
                path: bootstrap.sh

        - name: user-configs
          configMap:
            name: lldap-bootstrap-user-configs

        - name: group-configs
          configMap:
            name: lldap-bootstrap-group-configs

        - name: authelia-bind-user-secret
          secret:
            secretName: lldap-authelia-bind-user

        - name: jellyfin-bind-user-secret
          secret:
            secretName: lldap-jellyfin-bind-user

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "lldap-bootstrap-script"
  namespace: "{{ .Release.Namespace }}"
data:
  bootstrap.sh: |-
    {{- $.Files.Get "files/lldap-bootstrap/bootstrap.sh" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "lldap-bootstrap-user-configs"
  namespace: "{{ .Release.Namespace }}"
data:
  # Stub for locally defined users. Allows additional users while respecting email privacy
  local.json: ""
{{- range $path, $_ :=  .Files.Glob  "files/lldap-bootstrap/user-configs/*.json" }}
  {{ $path | base }}: |-
    {{- $.Files.Get $path | nindent 4 }}
{{ end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "lldap-bootstrap-group-configs"
  namespace: "{{ .Release.Namespace }}"
data:
{{- range $path, $_ :=  .Files.Glob  "files/lldap-bootstrap/group-configs/*.json" }}
  {{ $path | base }}: |-
    {{- $.Files.Get $path | nindent 4 }}
{{ end }}
