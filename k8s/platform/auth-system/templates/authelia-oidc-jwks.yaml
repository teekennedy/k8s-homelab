---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: authelia-oidc-jwks
  namespace: "{{ .Release.Namespace }}"
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/hook-weight: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: authelia-oidc-jwks
  namespace: "{{ .Release.Namespace }}"
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/hook-weight: "-1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authelia-oidc-jwks
  namespace: "{{ .Release.Namespace }}"
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/hook-weight: "0"
subjects:
  - kind: ServiceAccount
    name: authelia-oidc-jwks
    namespace: "{{ .Release.Namespace }}"
roleRef:
  kind: Role
  name: authelia-oidc-jwks
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: authelia-oidc-jwks
  namespace: "{{ .Release.Namespace }}"
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/hook-weight: "1"
    helm.sh/hook: pre-install,pre-upgrade
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: authelia-oidc-jwks
      restartPolicy: OnFailure
      initContainers:
        - name: generate-key
          # step-cli runs as uid 1000 (non-root) and generates PKCS#8 RSA private keys
          image: "{{ .Values.oidcJwks.stepCliImage }}"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
          command:
            - bash
            - "-c"
            - |
              set -euo pipefail

              step crypto keypair \
                --kty=RSA \
                --size=2048 \
                --no-password \
                --insecure \
                /keys/oidc.jwk.RS256{.pub,}.pem

              step crypto keypair \
                --kty=EC \
                --crv=P-256 \
                --no-password \
                --insecure \
                /keys/oidc.jwk.ES256{.pub,}.pem
          volumeMounts:
            - name: keys
              mountPath: /keys
      containers:
        - name: generate
          # alpine/k8s has kubectl pre-installed; runs as uid 1000 to match step-cli's
          # key file ownership (mode 600, uid 1000) so the file is readable
          image: "{{ .Values.oidcJwks.kubectlImage }}"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -euo pipefail
              namespace="{{ .Release.Namespace }}"
              secret_name="authelia-oidc-jwks"

              if kubectl -n "${namespace}" get secret "${secret_name}" >/dev/null 2>&1; then
                echo "Secret ${secret_name} already exists"
                exit 0
              fi

              kubectl -n "${namespace}" create secret generic "${secret_name}" \
                --from-file=oidc.jwk.RS256.pem=/keys/oidc.jwk.RS256.pem \
                --from-file=oidc.jwk.ES256.pem=/keys/oidc.jwk.ES256.pem
          volumeMounts:
            - name: keys
              mountPath: /keys
              readOnly: true
      volumes:
        - name: keys
          emptyDir: {}
