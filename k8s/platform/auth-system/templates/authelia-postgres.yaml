# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/postgresql.cnpg.io/cluster_v1.json
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authelia-psql
  namespace: {{ .Release.Namespace }}
spec:
  instances: 3
  imageName: {{ .Values.psql.image }}
  primaryUpdateStrategy: unsupervised
  # Promote an up-to-date replica before restarting the primary, so an image
  # update never takes the primary down in place. Falls back to a plain
  # restart when there is no replica.
  primaryUpdateMethod: switchover
  # Pooled clients never disconnect on their own, so a smart shutdown always
  # waits out its full timeout (default 180s) before escalating to fast.
  smartShutdownTimeout: 15
  # Every lease renewal is an etcd write. Renew every 10s instead of 2s;
  # an abrupt primary loss now waits up to 40s (was 15s) before a replica
  # may promote, and the primary rides out 30s (was 10s) without the API
  # server before stopping postgres. Takes effect when the primary restarts.
  primaryLease:
    leaseDurationSeconds: 40
    renewDeadlineSeconds: 30
    retryPeriodSeconds: 10
  # CNPG copies these labels onto the PVCs it creates. Postgres is recovered
  # through CNPG, not Longhorn backups, so the volumes only get trimmed.
  inheritedMetadata:
    labels:
      recurring-job.longhorn.io/source: "enabled"
      recurring-job-group.longhorn.io/ephemeral: "enabled"
  storage:
    size: 5Gi
    # Node-local single replica: CNPG's own streaming replication provides HA,
    # so Longhorn's cross-node replication only added fsync latency.
    storageClass: longhorn-strict-local
  enableSuperuserAccess: true
  postgresql:
    # postgresql configuration options (postgresql.conf)
    parameters:
      max_connections: "300"
      shared_buffers: 512MB
      # Reduce checkpoint frequency to lower I/O spikes (default 5min)
      checkpoint_timeout: 15min
      # Increase WAL size to allow less frequent checkpoints
      max_wal_size: 2GB
      # Cap how much WAL an HA slot may pin. Default is -1 (unlimited).
      # A standby that missed a segment not covered by WAL can get stuck
      # replicating forever, and the WAL would continue to grow unbounded.
      # Sized so that maximum volume usage (db + max_wal_size +
      # max_slot_wal_keep_size) is less than the volume capacity.
      max_slot_wal_keep_size: 1GB
      # Barman archives WAL to object storage. CNPG's default archive_timeout
      # of 5min forced a 16MB segment switch every five minutes on a mostly
      # idle database, ~4.6GB/day of near-empty WAL per instance. Standbys
      # stream every commit, so the archive only matters if all instances
      # are lost at once.
      archive_timeout: "1h"
  enablePDB: true
  affinity:
    enablePodAntiAffinity: true
    # required (not preferred): with strict-local storage, two instances on the
    # same node would share one physical disk and lose fault isolation.
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    # Constrain instances to nodes that actually host Longhorn storage.
    nodeSelector:
      node.msng.to/cnpg-storage: "true"
  resources:
    requests:
      memory: "512Mi"
    limits:
      memory: "2Gi"
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: authelia-psql
  bootstrap:
    initdb:
      database: {{ .Values.authelia.configMap.storage.postgres.database }}
      owner: {{ .Values.authelia.configMap.storage.postgres.username }}
