# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/postgresql.cnpg.io/cluster_v1.json
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authelia-psql
  namespace: {{ .Release.Namespace }}
spec:
  instances: 3
  imageName: {{ .Values.psql.image }}
  primaryUpdateStrategy: unsupervised
  storage:
    size: 5Gi
    # Node-local single replica: CNPG's own streaming replication provides HA,
    # so Longhorn's cross-node replication only added fsync latency.
    storageClass: longhorn-strict-local
  enableSuperuserAccess: true
  postgresql:
    # postgresql configuration options (postgresql.conf)
    parameters:
      max_connections: "300"
      shared_buffers: 512MB
      # Reduce checkpoint frequency to lower I/O spikes (default 5min)
      checkpoint_timeout: 15min
      # Increase WAL size to allow less frequent checkpoints
      max_wal_size: 2GB
  monitoring:
    enablePodMonitor: true
  enablePDB: true
  affinity:
    enablePodAntiAffinity: true
    # required (not preferred): with strict-local storage, two instances on the
    # same node would share one physical disk and lose fault isolation.
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    # Constrain instances to nodes that actually host Longhorn storage.
    nodeSelector:
      node.msng.to/cnpg-storage: "true"
  resources:
    requests:
      memory: "512Mi"
    limits:
      memory: "2Gi"
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: authelia-psql
  bootstrap:
    initdb:
      database: {{ .Values.authelia.configMap.storage.postgres.database }}
      owner: {{ .Values.authelia.configMap.storage.postgres.username }}
