---
apiVersion: v1
kind: Secret
metadata:
  name: lldap-admin-user
  namespace: {{ .Release.Namespace }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: lldap-jwt-secret,lldap-ldap-user-pass,lldap-key-seed
data:
  lldap-ldap-user: {{ "admin" | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.authelia.configMap.authentication_backend.ldap.password.secret_name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: password
data: {}
---
# Bind credentials for the Jellyfin LDAP-Auth plugin. Unlike Authelia's bind
# user this one only ever reads (Jellyfin never changes LLDAP passwords), so it
# gets lldap_strict_readonly instead of lldap_password_manager.
#
# Not reflected into the jellyfin namespace: the plugin stores its config in
# LDAP-Auth.xml on the jellyfin PVC, entered through the Jellyfin UI, so the
# password is copied out of here by hand once. See k8s/apps/jellyfin/README.md.
apiVersion: v1
kind: Secret
metadata:
  name: lldap-jellyfin-bind-user
  namespace: {{ .Release.Namespace }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: password
data: {}

