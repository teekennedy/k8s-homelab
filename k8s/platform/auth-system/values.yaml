# source https://github.com/authelia/chartrepo/tree/master/charts/authelia
# yaml-language-server: $schema=https://raw.githubusercontent.com/authelia/chartrepo/refs/heads/master/charts/authelia/values.schema.json
authelia:
  rbac:
    enabled: true
  ingress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: wspublic
      # External-dns cannot autodetect the load balancer IP for a Traefik IngressRoute
      # Explicitly set an A record target.
      external-dns.alpha.kubernetes.io/target: 10.69.80.120
    # TLS configuration is used to encrypt traffic between traefik and authelia
    tls:
      enabled: true
      # secret name defaults to "authelia-tls"
      secret: authelia-tls-certificate
    traefikCRD:
      enabled: true
      disableIngressRoute: false
      strategy: wrr
      entryPoints: ["websecure", "wspublic"]
      tls:
        # Use Traefik's `default` TLS options, like every other router here.
        #
        # The chart otherwise renders a TLSOption of its own and points this
        # IngressRoute at it. Traefik's snicheck compares the TLS *options name*
        # of the connection's SNI against the one on the router that matched the
        # Host header, and answers 421 Misdirected Request when they differ.
        # Browsers coalesce HTTP/2 connections across hosts that share an IP and
        # a certificate (all of *.msng.to), so the first hop from any app to the
        # login portal — files.msng.to -> authelia.msng.to — reused the app's
        # connection, hit the mismatch and got a 421 that needed a reload to
        # clear. Reproduce with:
        #   curl -so /dev/null -w '%{http_code}\n' --http2 \
        #     -H 'Host: authelia.msng.to' https://files.msng.to/
        #
        # So: no per-router TLS options anywhere. If a cipher/version floor is
        # ever wanted, the only shape that doesn't reintroduce this is a single
        # TLSOption literally named `default` in Traefik's namespace, which
        # applies to every router at once. (The list dropped here was the
        # chart's own default, and included the non-PFS
        # TLS_RSA_WITH_AES_256_GCM_SHA384 — Traefik's default list is better.)
        # The chart still renders the TLSOption resource itself (it is gated on
        # tls.options being set, which neither null nor {} can unset through
        # Helm's value coalescing). Nothing references it now, so it is inert.
        disableTLSOptions: true
  configMap:
    theme: auto
    extraConfigs:
      - /config/ca-trust-store.yaml
    server:
      # read timeout > Traefik's idleConnTimeout (default 90s) so Traefik
      # closes pooled keepalive connections first. Avoids fasthttp logging
      # every reaped idle connection as a 408 error.
      timeouts:
        read: 120s
        write: 30s
        idle: 120s
    definitions:
      network:
        internal:
          - 10.69.0.0/16
    # https://www.authelia.com/configuration/security/access-control/#rule-matching
    access_control:
      default_policy: 'deny'
      rules:
        - domain: msng.to
          networks:
            - internal
          policy: bypass
        - domain: msng.to
          policy: bypass
          resources:
            - '^/api/'
            - '^/_next/static/'
        - domain: argocd.msng.to
          policy: two_factor
        - domain:
            - msng.to
            - '*.msng.to'
          policy: one_factor
    # Modified from example authelia lldap config at https://github.com/lldap/lldap/blob/main/example_configs/authelia_config.yml
    authentication_backend:
      # Password reset through authelia works normally.
      password_reset:
        disable: false
      # How often authelia should check if there is a user update in LDAP.
      # Kept long to keep LDAP off the forward-auth hot path; group/disable
      # changes propagate within this window or on next login.
      refresh_interval: 1h
      ldap:
        enabled: true
        implementation: lldap
        address: ldaps://lldap.auth-system.svc.cluster.local:6360
        # Set base dn that you configured in LLDAP
        base_dn: dc=msng,dc=to
        # The username and password of the bind user.
        # "authelia_bind_user" should be the username you created for authentication with the "lldap_strict_readonly" permission. It is not recommended to use an actual admin account here.
        # If you are configuring Authelia to change user passwords, then the account used here needs the "lldap_password_manager" permission instead.
        user: uid=authelia_bind_user,ou=people,dc=msng,dc=to
        additional_users_dn: ou=people
        # Password can also be set using a secret: https://www.authelia.com/configuration/methods/secrets/
        password:
          secret_name: lldap-authelia-bind-user
          path: 'password.txt'

        # Configure TLS for LDAPS
        tls:
          minimum_version: TLS1.2

        # Enable connection pooling with enough parallel connections to handle
        # Homepage's concurrent forward-auth requests during webpage load
        pooling:
          enable: true
          count: 5

        # Allow sign in with either username or email
        users_filter: "(&(|({username_attribute}={input})({mail_attribute}={input}))(objectClass=person))"

    ntp:
      # effectively disables ntp, relying on the system time of the host instead
      disable_startup_check: true
    storage:
      postgres:
        enabled: true
        deploy: false
        # Address hostname and port can be found under the <cluster-name>-app secret
        address: tcp://authelia-psql-rw:5432
        password:
          secret_name: authelia-psql-app
          path: password.txt
    notifier:
      smtp:
        enabled: true
        address: smtp://email-smtp.us-west-2.amazonaws.com:587

        # @schema
        # required: false
        # @schema
        # -- The sender is used to construct both the SMTP command MAIL FROM and to add the FROM header. This address must
        # be in RFC5322 format.
        sender: 'Authelia <authelia@msng.to>'

        # @schema
        # required: false
        # @schema
        # -- HELO/EHLO Identifier. Some SMTP Servers may reject the default of localhost.
        identifier: msng.to

        # @schema
        # required: false
        # @schema
        # -- Subject configuration of the emails sent.
        # {title} is replaced by the text from the notifier
        subject: '[msng.to] {title}'

        # @schema
        # required: false
        # @schema
        # -- This address is used during the startup check to verify the email configuration is correct.
        # It's not important what it is except if your email server only allows local delivery.
        startup_check_address: 'terrance@missingtoken.net'

        password:
          # @schema
          # required: false
          # @schema
          # -- The secret name. The ~ name is special as it is the secret we generate either automatically or via the
          # secret_value option below.
          secret_name: smtp-creds

          # -- The path to the secret. If it has a '/' prefix it's assumed to be an absolute path within the pod. Otherwise
          # it uses the format '{mountPath}/{secret_name}/{path}' where '{mountPath}' refers to the 'secret.mountPath'
          # value, '{secret_name}' is the secret_name above, and '{path}' is this value.
          path: 'notifier.smtp.password.txt'
    session:
      # session encryption secret is auto-generated in authelia-secret

      # Allow sending cookie when following a cross-site link to this domain
      # ("lax" is the default)
      same_site: lax
      # How long before session needs to be refreshed
      inactivity: 12h
      # How long before user needs to re-authenticate
      expiration: 24h
      # How long before user needs to re-authenticate when _Remember me_ is checked
      remember_me: 1y
      cookies:
        - domain: 'msng.to'
          subdomain: authelia
          default_redirection_url: 'https://msng.to'

      # Highly-available Valkey: a 3-node replication set fronted by Sentinel
      # (one Sentinel co-located per pod, quorum 2 of 3). Authelia is a
      # Sentinel-aware client: it asks the Sentinels for the current primary and
      # follows failovers automatically, so a node loss no longer takes the
      # session store offline. See k8s/platform/auth-system/files/*-entrypoint.sh
      # and templates/valkey-statefulset.yaml.
      redis:
        enabled: true
        # host/port point at the Sentinel discovery service and are used as an
        # additional entry point; the authoritative Sentinel list is `nodes`.
        host: valkey-sentinel.auth-system.svc.cluster.local
        port: 26379
        database_index: 0
        high_availability:
          enabled: true
          # Must match `sentinel monitor mymaster ...` in sentinel-entrypoint.sh.
          sentinel_name: mymaster
          # Sentinel password is wired automatically from the
          # session.redis.sentinel.password.txt secret key.
          nodes:
            - host: valkey-0.valkey-headless.auth-system.svc.cluster.local
              port: 26379
            - host: valkey-1.valkey-headless.auth-system.svc.cluster.local
              port: 26379
            - host: valkey-2.valkey-headless.auth-system.svc.cluster.local
              port: 26379
    # TODO setup metrics
    telemetry:
      metrics:
        enabled: false
    identity_providers:
      oidc:
        enabled: true
        enforce_pkce: always
        hmac_secret:
          path: identity_providers.oidc.hmac.key
        authorization_policies:
          argocd:
            default_policy: deny
            rules:
              - policy: two_factor
                subject: "group:argocd-admin"
              - policy: two_factor
                subject: "group:full-admin"
              - policy: one_factor
                subject: "group:argocd-user"
        clients:
          - client_id: argocd
            client_name: Argo CD
            # Don't ask user for consent to provide their OIDC scopes to ArgoCD
            consent_mode: implicit
            public: true
            authorization_policy: argocd
            require_pkce: true
            pkce_challenge_method: S256
            scopes:
              - openid
              - profile
              - email
              - groups
              - offline_access
            grant_types:
              - authorization_code
              - refresh_token
            response_types:
              - code
            redirect_uris:
              - https://argocd.msng.to/auth/callback
              - https://argocd.msng.to/pkce/verify
          # token_endpoint_auth_method: client_secret_post matches what
          # oauth2-proxy / golang.org/x/oauth2 sends at the token endpoint.
          # client_secret is a bcrypt hash of the mittwald-generated secret in
          # oauth2-proxy-secrets. The hash can be regenerated with:
          # authelia crypto hash generate bcrypt --password <plaintext>
          - client_id: oauth2-proxy
            client_name: OAuth2 Proxy
            consent_mode: implicit
            client_secret: '$2b$12$407JaO6LrgVmhnL4tO46vOcZwW4vsM0qTTHAXXpuJF7TkhNxOTTDy'
            token_endpoint_auth_method: client_secret_post
            authorization_policy: one_factor
            require_pkce: true
            pkce_challenge_method: S256
            scopes:
              - openid
              - profile
              - email
              - groups
              - offline_access
            grant_types:
              - authorization_code
              - refresh_token
            response_types:
              - code
            redirect_uris:
              - https://msng.to/oauth2/callback
          # Internal oauth2-proxy (k8s/platform/oauth2-proxy-internal) fronting
          # the syncthing GUI with no internal-network bypass. client_secret is a
          # bcrypt hash of the mittwald-generated secret in
          # oauth2-proxy-internal-secrets. BOOTSTRAP: the hash below is a
          # placeholder — after first sync, regenerate it from the real value:
          #   kubectl -n oauth2-proxy-internal get secret oauth2-proxy-internal-secrets \
          #     -o jsonpath='{.data.client-secret}' | base64 -d
          #   authelia crypto hash generate bcrypt --password <that-value>
          # then commit the new hash here. (See oauth2-proxy-internal/README.md.)
          - client_id: oauth2-proxy-internal
            client_name: OAuth2 Proxy (internal)
            consent_mode: implicit
            client_secret: '$2b$12$rDLnW0tP8RhDrelNhajlGendwesVQ.hx.9xHq154ShVdzSb8HBgCG'
            token_endpoint_auth_method: client_secret_post
            authorization_policy: two_factor
            require_pkce: true
            pkce_challenge_method: S256
            scopes:
              - openid
              - profile
              - email
              - groups
              - offline_access
            grant_types:
              - authorization_code
              - refresh_token
            response_types:
              - code
            redirect_uris:
              - https://syncthing.msng.to/oauth2/callback
          # copyparty's dedicated oauth2-proxy (k8s/apps/copyparty), used as a
          # Traefik forwardAuth middleware in front of the PUBLIC files.msng.to.
          # Group membership (copyparty-users / copyparty-admins) is enforced by
          # oauth2-proxy's allowed_groups and mapped onto per-volume permissions
          # inside copyparty, so the groups claim must be released here.
          # two_factor because this instance is internet-facing and fronts every
          # personal file; drop to one_factor if that proves too heavy.
          # BOOTSTRAP: the client_secret hash below is a placeholder — after
          # first sync, regenerate it from the real value:
          #   kubectl -n copyparty get secret copyparty-oauth2-proxy-secrets \
          #     -o jsonpath='{.data.client-secret}' | base64 -d
          #   authelia crypto hash generate bcrypt --password <that-value>
          # then commit the new hash here. (See k8s/apps/copyparty/README.md.)
          - client_id: copyparty
            client_name: copyparty
            consent_mode: implicit
            client_secret: '$2b$12$5ZEqIhQ9proDImmlbb0XQOMr3newPf61Pkh3CVl4tDB1MvQalsF5C'
            token_endpoint_auth_method: client_secret_post
            authorization_policy: two_factor
            require_pkce: true
            pkce_challenge_method: S256
            scopes:
              - openid
              - profile
              - email
              - groups
              - offline_access
            grant_types:
              - authorization_code
              - refresh_token
            response_types:
              - code
            redirect_uris:
              - https://files.msng.to/oauth2/callback
        jwks:
          - key_id: argocd
            algorithm: RS256
            use: sig
            key:
              path: /secrets/oidc-jwks/oidc.jwk.RS256.pem

  pod:
    kind: Deployment
    replicas: 2
    env:
      - name: TZ
        value: America/Denver
      - name: AUTHELIA_LOG_LEVEL
        value: debug
      - name: AUTHELIA_NOTIFIER_SMTP_USERNAME
        valueFrom:
          secretKeyRef:
            name: smtp-creds
            key: username
    # Add step CA to Authelia's trusted certificates
    extraVolumeMounts:
      - name: certificates
        mountPath: /certificates
        readOnly: true
      - name: ca-trust-store-config
        mountPath: /config
        readOnly: true
    extraVolumes:
      - name: certificates
        configMap:
          name: cluster-ca-bundle
      - name: ca-trust-store-config
        configMap:
          name: authelia-ca-trust-store
    resources:
      limits:
        cpu: '4.00'
        memory: '500Mi'
      requests:
        cpu: '0.25'
        memory: '125Mi'
    securityContext:
      container:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65534

  secret:
    # Generate our own secrets for authelia
    existingSecret: authelia-secrets
    additionalSecrets:
      lldap-authelia-bind-user:
        items:
          - key: password
            path: password.txt
      authelia-psql-app:
        items:
          - key: password
            path: password.txt
      smtp-creds:
        items:
          - key: password
            path: 'notifier.smtp.password.txt'
      authelia-oidc-jwks:
        path: oidc-jwks
        items:
          - key: oidc.jwk.RS256.pem
            path: oidc.jwk.RS256.pem


# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-4.0.1/charts/library/common/values.schema.json
# Docs: https://bjw-s-labs.github.io/helm-charts/docs/app-template/
app-template:
  controllers:
    lldap:
      replicas: 1
      suffix: lldap
      strategy: Recreate
      containers:
        lldap:
          image:
            repository: ghcr.io/lldap/lldap
            # TODO make sure renovatebot can update this
            tag: "2026-07-19-alpine-rootless"
            pullPolicy: IfNotPresent
          env:
            # debugging
            # LLDAP_VERBOSE: "true"
            TZ: America/Denver
            LLDAP_LDAP_BASE_DN: dc=msng,dc=to
            LLDAP_LDAPS_OPTIONS__ENABLED: "true"
            LLDAP_LDAPS_OPTIONS__CERT_FILE: /certs/ldaps/tls.crt
            LLDAP_LDAPS_OPTIONS__KEY_FILE: /certs/ldaps/tls.key
            LLDAP_JWT_SECRET:
              secretKeyRef:
                name: lldap-admin-user
                key: lldap-jwt-secret
            LLDAP_KEY_SEED:
              secretKeyRef:
                name: lldap-admin-user
                key: lldap-key-seed
            # LLDAP_KEY_FILE is set to an empty string to silence a warning about using key seed to generate key file
            LLDAP_KEY_FILE: ""
            LLDAP_LDAP_USER_PASS:
              secretKeyRef:
                name: lldap-admin-user
                key: lldap-ldap-user-pass
            UID: &UID 1000
            GID: &GID 1000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - /app/lldap
                    - healthcheck
                    - --config-file
                    - /data/lldap_config.toml
                initialDelaySeconds: 5
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 5
            readiness:
              enabled: true
              type: TCP
              spec:
                initialDelaySeconds: 5
                periodSeconds: 10
                timeoutSeconds: 1
                failureThreshold: 3
  defaultPodOptions:
    automountServiceAccountToken: false
    securityContext:
      runAsNonRoot: true
      runAsUser: *UID
      runAsGroup: *GID
      fsGroup: *GID
      fsGroupChangePolicy: OnRootMismatch

  service:
    lldap:
      forceRename: lldap
      controller: lldap
      ports:
        http:
          port: 17170
        ldaps:
          port: 6360
          protocol: TCP
          appProtocol: ldaps

  ingress:
    lldap:
      forceRename: lldap
      enabled: true
      hosts:
        - host: &lldapHost lldap.msng.to
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: lldap
                port: http
      tls:
        - hosts:
            - *lldapHost

  persistence:
    lldap-data:
      accessMode: ReadWriteOnce
      type: persistentVolumeClaim
      size: 100Mi
      storageClass: longhorn
      labels:
        recurring-job.longhorn.io/source: "enabled"
        recurring-job-group.longhorn.io/backup: "enabled"
      globalMounts:
        - path: /data
    lldap-tls:
      type: secret
      name: lldap-ldaps-tls-certificate
      globalMounts:
        - path: /certs/ldaps
