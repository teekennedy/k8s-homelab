exemptions:
  # CSI drivers require privileged access and host networking for kernel-level NFS
  # mount/unmount operations. These are standard requirements for any CSI node plugin.
  - controllerNames:
      - csi-nfs-node
    rules:
      - hostNetworkSet
      - runAsPrivileged
      - runAsRootAllowed
      - privilegeEscalationAllowed
      - dangerousCapabilities
  - controllerNames:
      - csi-nfs-controller
    rules:
      - hostNetworkSet
      - runAsPrivileged
      - runAsRootAllowed
      - privilegeEscalationAllowed
      - dangerousCapabilities
  # CSI plugins register with the kubelet and mount volumes under
  # /var/lib/kubelet.
  - controllerNames:
      - csi-nfs-node
      - csi-nfs-controller
    rules:
      - hostPathSet
  # The driver container gets its liveness from the liveness-probe sidecar. The
  # chart has no settings for readiness, or for probing the CSI sidecars.
  - controllerNames:
      - csi-nfs-node
      - csi-nfs-controller
    rules:
      - readinessProbeMissing
      - livenessProbeMissing
