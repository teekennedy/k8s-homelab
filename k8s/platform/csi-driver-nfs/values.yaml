nfs:
  server: borg-2.msng.to

  storageClasses:
    - name: nfs
      share: /k8s
      reclaimPolicy: Delete
      mountOptions:
        - nfsvers=4.2
        - xprtsec=mtls
    - name: nfs-backups
      share: /backups
      reclaimPolicy: Retain
      mountOptions:
        - nfsvers=4.2
        - xprtsec=mtls

# upstream defaults: https://github.com/kubernetes-csi/csi-driver-nfs/blob/master/charts/latest/csi-driver-nfs/values.yaml
csi-driver-nfs:
  # Tags only: the chart builds each image from image.baseRepo and the
  # repository default.
