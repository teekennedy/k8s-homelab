apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: {{ .Release.Namespace }}
  # Most fields in a statefulset are immutable
  # Tell ArgoCD to delete-then-create the resource to sync changes
  annotations:
    argocd.argoproj.io/sync-options: Force=true,Replace=true
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/component: valkey
spec:
  serviceName: valkey-headless
  # Replication set: one primary + N-1 replicas, with a Sentinel co-located in
  # every pod (quorum is a majority). See files/valkey-entrypoint.sh for how
  # each pod discovers its role from Sentinel at startup.
  replicas: {{ .Values.valkey.replicas }}
  # OrderedReady so valkey-0 (the bootstrap primary) is Ready before the
  # replicas start and discover it.
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
      app.kubernetes.io/component: valkey
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/component: valkey
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # Spread the pods across distinct nodes so a single node loss never takes
      # more than one replica (and never breaks Sentinel quorum).
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: valkey
                app.kubernetes.io/component: valkey
            topologyKey: kubernetes.io/hostname
      containers:
      - name: valkey
        image: {{ .Values.valkey.image }}
        securityContext:
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 6379
          name: valkey
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: VALKEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.valkey.secretName }}
              key: valkey-password
        - name: SENTINEL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.valkey.secretName }}
              key: sentinel-password
        # maxmemory tracks the container memory limit (in bytes via the
        # downward API) so resizing resources.limits.memory propagates to
        # Valkey's eviction threshold without manual config updates.
        - name: VALKEY_MAXMEMORY
          valueFrom:
            resourceFieldRef:
              containerName: valkey
              resource: limits.memory
              divisor: "1"
        command:
        - sh
        - /etc/valkey/valkey-entrypoint.sh
        volumeMounts:
        - name: config
          mountPath: /etc/valkey
          readOnly: true
        - name: data
          mountPath: /data
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - valkey-cli -a "$VALKEY_PASSWORD" --no-auth-warning ping
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - valkey-cli -a "$VALKEY_PASSWORD" --no-auth-warning ping
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      - name: sentinel
        image: {{ .Values.valkey.image }}
        securityContext:
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 26379
          name: sentinel
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: VALKEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.valkey.secretName }}
              key: valkey-password
        - name: SENTINEL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.valkey.secretName }}
              key: sentinel-password
        command:
        - sh
        - /etc/valkey/sentinel-entrypoint.sh
        volumeMounts:
        - name: config
          mountPath: /etc/valkey
          readOnly: true
        - name: sentinel-conf
          mountPath: /sentinel
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - valkey-cli -p 26379 -a "$SENTINEL_PASSWORD" --no-auth-warning ping
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - valkey-cli -p 26379 -a "$SENTINEL_PASSWORD" --no-auth-warning ping
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
      volumes:
      - name: config
        configMap:
          name: valkey-config
      # Writable location for Sentinel's self-rewritten config.
      - name: sentinel-conf
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        recurring-job.longhorn.io/source: "enabled"
        recurring-job-group.longhorn.io/ephemeral: "enabled"
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: {{ .Values.valkey.persistence.storageClass }}
      resources:
        requests:
          storage: {{ .Values.valkey.persistence.size }}
