# Passwords for the Valkey replication set. Hex-encoded so the values are safe
# to embed verbatim in the redis+sentinel:// connection strings Forgejo is
# given (see forgejo.gitea.additionalConfigFromEnvs in values.yaml) — a
# password containing @ / : ? or & would silently corrupt the URI.
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.valkey.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: "valkey-password,sentinel-password"
    secret-generator.v1.mittwald.de/encoding: "hex"
    secret-generator.v1.mittwald.de/length: "32"
type: Opaque
