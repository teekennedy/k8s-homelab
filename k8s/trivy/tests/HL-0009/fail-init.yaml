apiVersion: apps/v1
kind: Deployment
metadata:
  name: root-init
spec:
  selector:
    matchLabels: {app: root-init}
  template:
    metadata:
      labels: {app: root-init}
    spec:
      initContainers:
        - name: init
          image: example.test/init:1
      containers:
        - name: app
          image: example.test/app:1
          securityContext:
            runAsUser: 1000
