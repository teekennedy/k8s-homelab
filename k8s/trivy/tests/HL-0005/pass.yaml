apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backed-up
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/backup: enabled
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ephemeral
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/ephemeral: enabled
spec:
  storageClassName: longhorn-strict-local
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
# Another provisioner's volume is none of Longhorn's business.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs
spec:
  storageClassName: nfs-csi
  accessModes: [ReadWriteMany]
  resources: {requests: {storage: 1Gi}}
---
# An empty class binds a static PV.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: static
spec:
  storageClassName: ""
  volumeName: static
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: labelled-template
spec:
  serviceName: labelled-template
  selector:
    matchLabels: {app: labelled-template}
  template:
    metadata:
      labels: {app: labelled-template}
    spec:
      containers:
        - name: app
          image: example.test/app:1
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          recurring-job.longhorn.io/source: enabled
          recurring-job-group.longhorn.io/backup: enabled
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: labelled-database
spec:
  instances: 1
  inheritedMetadata:
    labels:
      recurring-job.longhorn.io/source: enabled
      recurring-job-group.longhorn.io/backup: enabled
  storage:
    size: 1Gi
---
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: labelled-prometheus
spec:
  storage:
    volumeClaimTemplate:
      metadata:
        labels:
          recurring-job.longhorn.io/source: enabled
          recurring-job-group.longhorn.io/ephemeral: enabled
      spec:
        storageClassName: longhorn
        resources: {requests: {storage: 1Gi}}
