apiVersion: apps/v1
kind: Deployment
metadata:
  name: env-literal
spec:
  selector:
    matchLabels: {app: env-literal}
  template:
    metadata:
      labels: {app: env-literal}
    spec:
      containers:
        - name: app
          image: example.test/app:1
          env:
            - name: DB_PASSWORD
              value: hunter2
