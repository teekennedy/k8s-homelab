apiVersion: apps/v1
kind: Deployment
metadata:
  name: pull-if-not-present
spec:
  selector:
    matchLabels: {app: pull-if-not-present}
  template:
    metadata:
      labels: {app: pull-if-not-present}
    spec:
      containers:
        - name: app
          image: example.test/app:1
          imagePullPolicy: IfNotPresent
        - name: unset
          image: example.test/app:1
