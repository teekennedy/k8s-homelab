# Default values for spoolman.
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-4.0.1/charts/library/common/values.schema.json
# Docs: https://bjw-s-labs.github.io/helm-charts/docs/app-template/
app-template:
  service:
    spoolman:
      controller: spoolman
      ports:
        http:
          port: &httpPort 8000

  controllers:
    spoolman:
      strategy: Recreate
      containers:
        spoolman:
          image:
            repository: ghcr.io/donkie/spoolman
            tag: "0.27.1@sha256:1ebb4f6a62c2e72a07f18b07ebfdbd96322f5bc2eb72570af3088f68d7c393b1"
            pullPolicy: IfNotPresent
          env:
            TZ: America/Denver
            PUID: &UID 1000
            PGID: &GID 1000
            # Nightly backup at midnight to the NAS (see nasBackups). Spoolman
            # hardcodes 5 rotated copies; restic keeps the history.
            SPOOLMAN_AUTOMATIC_BACKUP: "TRUE"
            SPOOLMAN_DIR_BACKUPS: /backups
            # The file log can't be turned off, so keep it off the PVC; logs are
            # collected from stdout.
            SPOOLMAN_DIR_LOGS: /logs
          command:
            - uvicorn
            - spoolman.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: *httpPort
                failureThreshold: 5
                initialDelaySeconds: 0
                periodSeconds: 10
                successThreshold: 1
                timeoutSeconds: 1
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: *httpPort
                failureThreshold: 3
                initialDelaySeconds: 0
                periodSeconds: 10
                successThreshold: 1
                timeoutSeconds: 1
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 384Mi
  defaultPodOptions:
    automountServiceAccountToken: false
    securityContext:
      runAsNonRoot: true
      runAsUser: *UID
      runAsGroup: *GID
      fsGroup: *GID
      fsGroupChangePolicy: OnRootMismatch

  ingress:
    spoolman:
      enabled: true
      hosts:
        - host: &spoolmanHost spoolman.msng.to
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: spoolman
                port: http
      tls:
        - hosts:
            - *spoolmanHost

  persistence:
    data:
      accessMode: ReadWriteOnce
      type: persistentVolumeClaim
      size: 100Mi
      storageClass: longhorn
      # Backed up by spoolman itself to the NAS, so no Longhorn backup
      # snapshot is pinning deleted blocks.
      labels:
        recurring-job.longhorn.io/source: "enabled"
        recurring-job-group.longhorn.io/ephemeral: "enabled"
      globalMounts:
        - path: /home/app/.local/share/spoolman
    backups:
      type: persistentVolumeClaim
      existingClaim: spoolman-backups
      globalMounts:
        - path: /backups
    logs:
      type: emptyDir
      sizeLimit: 50Mi
      globalMounts:
        - path: /logs

# Static NFS volume for spoolman's database backups (templates/nas-backups.yaml).
nasBackups:
  server: borg-2.msng.to
  # NFSv4 path relative to the fsid=0 root (/storage/nas).
  path: /backups/spoolman
  storage: 1Gi
