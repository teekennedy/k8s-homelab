---
# RomM does its own auth, so the whole host goes to it as one rule.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "romm.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "romm.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.route.gateway.name }}
      namespace: {{ .Values.route.gateway.namespace }}
      sectionName: {{ .Values.route.gateway.sectionName }}
  hostnames:
    - {{ .Values.route.host | quote }}
  rules:
    - backendRefs:
        - name: {{ include "romm.fullname" . }}
          port: {{ .Values.service.port }}
