---
# Signs RomM's session JWTs.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "romm.fullname" . }}-auth
  namespace: {{ .Release.Namespace }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: ROMM_AUTH_SECRET_KEY
    secret-generator.v1.mittwald.de/length: "64"
type: Opaque
