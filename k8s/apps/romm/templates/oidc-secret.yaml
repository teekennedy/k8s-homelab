---
# The OIDC client secret. Generated in-cluster so no plaintext is committed, and
# reflected into the auth-system namespace, where it is registered as
# `oidcClientSecrets.clients.romm`.
apiVersion: v1
kind: Secret
metadata:
  name: romm-oidc-authelia
  namespace: {{ .Release.Namespace }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: client-secret
    secret-generator.v1.mittwald.de/length: "32"
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: auth-system
type: Opaque
