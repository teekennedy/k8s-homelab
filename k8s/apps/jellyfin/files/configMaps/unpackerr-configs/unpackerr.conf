# Unpackerr config: https://unpackerr.zip/docs/install/configuration
# Only settings that differ from the defaults, plus the Starr apps. API keys
# come from UN_SONARR_0_API_KEY and UN_RADARR_0_API_KEY.

## How often to poll Sonarr and Radarr (default 2m).
interval = "10m"
## Extraction attempts before giving up (default 2).
max_retries = 3
## The history file is written next to this config, which is a read-only
## ConfigMap mount. Nothing reads it without the web UI.
keep_history = 0

[webserver]
## No web UI or API. It is on by default, would print a generated admin
## password to the log, and saves would rewrite this read-only file.
listen_addr = ""

[sonarr.0]
url = "http://jellyfin-arrs.jellyfin.svc.cluster.local:8989"
paths = ["/data/torrents/complete/shows"]

[radarr.0]
url = "http://jellyfin-arrs.jellyfin.svc.cluster.local:7878"
paths = ["/data/torrents/complete/movies"]
