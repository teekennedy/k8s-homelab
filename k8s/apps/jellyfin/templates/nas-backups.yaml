{{- /*
One static PV/PVC per directory under /storage/nas/backups on the NAS, mounted
via mTLS-protected NFS. Apps write their own backups here and keep only the
latest one. The directories (owned 1200:1200) are pre-created by the nfs-mtls
module's tmpfiles rules.
*/}}
{{- range $name, $volume := .Values.nasBackups.volumes }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ $.Release.Name }}-{{ $name }}-backups
  labels:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/name: {{ $.Chart.Name }}
spec:
  capacity:
    storage: {{ $volume.storage }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.2
    - xprtsec=mtls
  nfs:
    server: {{ $.Values.nasBackups.server }}
    path: {{ $volume.path }}
  claimRef:
    name: {{ $.Release.Name }}-{{ $name }}-backups
    namespace: {{ $.Release.Namespace }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $.Release.Name }}-{{ $name }}-backups
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/name: {{ $.Chart.Name }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: {{ $.Release.Name }}-{{ $name }}-backups
  resources:
    requests:
      storage: {{ $volume.storage }}
{{- end }}
