{{- /*
The uv project in files/qbittorrent-password-hash/, without its tests.
*/}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jellyfin-qbittorrent-password-hash
  namespace: {{ .Release.Namespace }}
data:
  {{- range list "hash_password.py" "pyproject.toml" "uv.lock" ".python-version" }}
  {{ . }}: |-
    {{- $.Files.Get (printf "files/qbittorrent-password-hash/%s" .) | nindent 4 }}
  {{- end }}
