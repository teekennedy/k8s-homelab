---
apiVersion: batch/v1
kind: Job
metadata:
  name: jellyfin-qbittorrent-password-hash
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: generate-hash
          image: "{{ .Values.qbittorrentPasswordHash.pythonImage }}"
          command:
            - sh
            - -c
            - |
              python3 - <<'EOF'
{{ .Files.Get "files/qbittorrent-password-hash/hash_password.py" | indent 14 }}
              EOF
          env:
            - name: QBITTORRENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jellyfin-qbittorrent-admin
                  key: password
          volumeMounts:
            - name: shared
              mountPath: /shared
      containers:
        - name: create-secret
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          image: "{{ .Values.qbittorrentPasswordHash.kubectlImage }}"
          command:
            - sh
            - -c
            - |
              HASH=$(cat /shared/password-hash)
              kubectl create secret generic jellyfin-qbittorrent-password-hash \
                --from-literal=hash="$HASH" \
                --dry-run=client -o yaml | kubectl apply -f -
              echo "Secret jellyfin-qbittorrent-password-hash created/updated successfully"
          volumeMounts:
            - name: shared
              mountPath: /shared
      volumes:
        - name: shared
          emptyDir: {}
      serviceAccountName: jellyfin-qbittorrent-password-hash
