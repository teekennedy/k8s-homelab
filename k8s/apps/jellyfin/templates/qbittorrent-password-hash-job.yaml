---
apiVersion: batch/v1
kind: Job
metadata:
  name: jellyfin-qbittorrent-password-hash
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: generate-hash
          image: "{{ .Values.qbittorrentPasswordHash.image.repository }}:{{ .Values.qbittorrentPasswordHash.image.tag }}"
          command:
            - sh
            - -c
            - |-
              set -eu
              # uv builds the project's environment beside it, and /app is a
              # read-only ConfigMap mount, so run from a writable copy.
              cp -rL /app/. /project/
              mkdir -p /project/tmp
              cd /project
              exec uv run --frozen --no-dev --no-cache --no-python-downloads --link-mode copy \
                python hash_password.py
          env:
            - name: QBITTORRENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jellyfin-qbittorrent-admin
                  key: password
            - name: HOME
              value: /project
            - name: TMPDIR
              value: /project/tmp
          volumeMounts:
            - name: shared
              mountPath: /shared
            - name: project
              mountPath: /app
              readOnly: true
            - name: workdir
              mountPath: /project
      containers:
        - name: create-secret
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          image: "{{ .Values.qbittorrentPasswordHash.kubectlImage }}"
          command:
            - sh
            - -c
            - |
              HASH=$(cat /shared/password-hash)
              kubectl create secret generic jellyfin-qbittorrent-password-hash \
                --from-literal=hash="$HASH" \
                --dry-run=client -o yaml | kubectl apply -f -
              echo "Secret jellyfin-qbittorrent-password-hash created/updated successfully"
          volumeMounts:
            - name: shared
              mountPath: /shared
      volumes:
        - name: shared
          emptyDir: {}
        - name: project
          configMap:
            name: jellyfin-qbittorrent-password-hash
        - name: workdir
          emptyDir: {}
      serviceAccountName: jellyfin-qbittorrent-password-hash
