{{- if .Values.exporter.enabled }}
{{- /*
The exporter's uv project, mounted at /app in the jellyfin-exporter pod, which
copies it somewhere writable and runs it with `uv run --frozen`, so the pod
gets the dependencies and Python that the tests ran against. Its tests stay in
files/jellyfin-exporter/.
*/}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jellyfin-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: jellyfin-exporter
data:
  {{- range list "exporter.py" "pyproject.toml" "uv.lock" ".python-version" }}
  {{ . }}: |-
    {{- $.Files.Get (printf "files/jellyfin-exporter/%s" .) | nindent 4 }}
  {{- end }}
{{- end }}
