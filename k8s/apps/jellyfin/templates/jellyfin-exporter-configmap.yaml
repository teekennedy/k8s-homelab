{{- $exporter := (index .Values "app-template" "controllers" "exporter") | default dict }}
{{- if $exporter.enabled }}
{{- /*
Mounted at /app in the jellyfin-exporter pod, which copies it somewhere
writable and runs it with `uv run --script`: exporter.py's PEP 723 header
carries its own dependencies. Its tests, pyproject.toml and uv.lock live
alongside it in files/jellyfin-exporter/ and are deliberately not shipped here.
*/}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jellyfin-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: jellyfin-exporter
data:
  exporter.py: |-
    {{- .Files.Get "files/jellyfin-exporter/exporter.py" | nindent 4 }}
{{- end }}
