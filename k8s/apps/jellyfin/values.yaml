# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-3.2.0/charts/library/common/values.schema.json
# Docs: https://bjw-s-labs.github.io/helm-charts/docs/app-template/

qbittorrentPasswordHash:
  # Deliberately in values.yaml (not templates/qbittorrent-password-hash-job.yaml)
  # so that renovate can pick them up.
  pythonImage: python:3.14-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
  kubectlImage: bitnami/kubectl:latest@sha256:999d5eb28f404b45f15117f2a110ff23c6164f76edac261d75d783b6e88252b7

# Prometheus resources this chart owns. They live here rather than in
# monitoring-system so that a jellyfin deployment carries its own scrape
# targets and alerts.
#
# Everything scoped to jellyfin-exporter also requires exporter.enabled below;
# turning the exporter off takes its ServiceMonitor and alert rules with it,
# whatever these flags say.
monitoring:
  exporter:
    serviceMonitor:
      enabled: true
    # JellyfinStreamActive is what blocks kured from rebooting a node while
    # somebody is watching. Without it, reboots are ungated.
    prometheusRule:
      enabled: true
  qbittorrent:
    serviceMonitor:
      enabled: true

# Exports Jellyfin metrics to Prometheus.
#
# Deliberately not an app-template controller: its Deployment, Service and
# ConfigMap live in templates/ so the pod template can carry a checksum over
# files/jellyfin-exporter/exporter.py. app-template can only checksum ConfigMaps
# it generates from its own values, and a subchart cannot read the parent
# chart's files -- see templates/jellyfin-exporter-deployment.yaml. Because
# those are all chart-owned, `enabled` here is the single switch for the whole
# exporter: Deployment, Service, ConfigMap, ServiceMonitor and alert rules.
exporter:
  enabled: true
  replicas: 1
  image:
    # The python-flavoured tag ships an interpreter, so a pod start only has to
    # fetch exporter.py's own dependencies. The bare `uv` image would download a
    # whole CPython first.
    repository: ghcr.io/astral-sh/uv
    tag: python3.14-alpine@sha256:9d9939d9d43f7d0d4814eeeb4aa65a4afde878a86875bc8521d443967c49db21
  # Same non-root uid/gid as the jellyfin container. The exporter only ever
  # writes to its own emptyDir.
  runAsUser: 1200
  runAsGroup: 1200
  port: 9101
  jellyfinUrl: http://jellyfin-main:8096
  # Created out of band, not by this chart: it holds a Jellyfin API key minted
  # in the admin dashboard.
  apiKeySecret:
    name: jellyfin-exporter-api-key
    key: JELLYFIN_API_KEY
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

app-template:
  defaultPodOptions:
    automountServiceAccountToken: false
  controllers:
    debug:
      replicas: 0
      containers:
        jellyfin-debug:
          image:
            repository: alpine
            tag: latest@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
          command:
            - sleep
            - infinity
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi

    main:
      replicas: 1
      pod:
        securityContext:
          fsGroup: &gid 1200
          fsGroupChangePolicy: "OnRootMismatch"
          runAsUser: 1200
          runAsGroup: *gid
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              # Match Intel UHD 7xx series and Iris Xe graphics or better.
              # Device ID can be found here: https://dgpu-docs.intel.com/devices/hardware-table.html#gpus-with-supported-drivers
              nodeSelectorTerms:
                # borg-0
                - matchExpressions:
                    - key: gpu.intel.com/device-id.0300-7d67.present
                      operator: In
                      values: ["true"]
                # borg-2
                - matchExpressions:
                    - key: gpu.intel.com/device-id.0300-a7a0.present
                      operator: In
                      values: ["true"]
      containers:
        jellyfin:
          image:
            repository: ghcr.io/jellyfin/jellyfin
            tag: 12.2@sha256:c3efa69a22f2691fc88d6bb035e87a8560e395a6047f062fb381c61c3185e8f5
          env:
            TZ: America/Denver
            JELLYFIN_DATA_DIR: "/data"
            JELLYFIN_CONFIG_DIR: "/data/config"
            JELLYFIN_CACHE_DIR: "/data/cache"
            JELLYFIN_LOG_DIR: "/data/log"
          probes:
            # Use /System/Ping for startup probe.
            #
            # Jellyfin runs a "setup server" during schema migrations before
            # Kestrel starts (Jellyfin.Server/ServerSetupApp/SetupServer.cs).
            # The setup server maps /health to a check that reports 200
            # Degraded, flipping the response code to 503 if migrations fail.
            #
            # /System/Ping, on the other hand, returns 200 only once the real
            # server is listening, which makes for a much better startup probe.
            # It keeps liveness out of the migration window, and a failed
            # migration sits un-Ready and readable instead of crashlooping.
            #
            # 180 x 10s = 30 minutes, which is the migration budget; the 10s
            # period keeps an ordinary no-migration restart detected quickly.
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /System/Ping
                  port: 8096
                failureThreshold: 180
                periodSeconds: 10
                successThreshold: 1
                timeoutSeconds: 3
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8096
                failureThreshold: 3
                periodSeconds: 30
                successThreshold: 1
                timeoutSeconds: 10
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8096
                failureThreshold: 3
                periodSeconds: 10
                successThreshold: 1
                timeoutSeconds: 5
          resources:
            requests:
              cpu: 1000m
              memory: 1Gi
              gpu.intel.com/i915: "1"
            limits:
              memory: 6Gi
              gpu.intel.com/i915: "1"
    seerr:
      replicas: 1
      pod:
        securityContext:
          fsGroup: *gid
          fsGroupChangePolicy: "OnRootMismatch"
          runAsUser: 1200
          runAsGroup: *gid
      containers:
        seerr:
          image:
            repository: ghcr.io/seerr-team/seerr
            tag: v3.5.0@sha256:27602401178d54f1964442287b9f23f67a3fa2252645ee8065839ea1c3f69e45
          env:
            TZ: America/Denver
            API_KEY:
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: SEERR_API_KEY
          resources:
            # observed resource usage:
            #   cpu: 2m average, 45m max
            #   mem: ~275Mi min, 331Mi max
            requests:
              cpu: 500m
              memory: 400Mi
            limits:
              memory: 800Mi
          # https://docs.seerr.dev/getting-started/docker
          probes:
            # Gate liveness until the app is actually serving, so a slow first
            # boot can't be mistaken for a hang. Seerr runs schema migrations on
            # startup, and liveness alone would restart the pod ~65s in,
            # potentially mid-migration.
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/v1/status
                  port: 5055
                failureThreshold: 30
                periodSeconds: 5
                successThreshold: 1
                timeoutSeconds: 3
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/v1/status
                  port: 5055
                failureThreshold: 3
                periodSeconds: 15
                successThreshold: 1
                timeoutSeconds: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/v1/status
                  port: 5055
                periodSeconds: 10
                timeoutSeconds: 3
    arrs:
      replicas: 1
      pod:
        securityContext:
          fsGroup: *gid
          fsGroupChangePolicy: "OnRootMismatch"
          runAsUser: 1200
          runAsGroup: *gid
      containers:
        # https://docs.linuxserver.io/images/docker-prowlarr/
        prowlarr:
          image:
            repository: lscr.io/linuxserver/prowlarr
            tag: 2.4.0.5397-ls152@sha256:3e9bd62ca90c97c5df75b7012e10a29f6926e62807deeddc1dc89e6e2fd141e1
          env:
            TZ: America/Denver
            PROWLARR__AUTH__APIKEY:
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: PROWLARR_API_KEY
          probes:
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 9696
                failureThreshold: 30
                periodSeconds: 10
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 9696
                failureThreshold: 5
                periodSeconds: 30
                timeoutSeconds: 5
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 9696
                periodSeconds: 10
                timeoutSeconds: 5
          resources:
            requests:
              cpu: 60m
              memory: 384Mi
            limits:
              memory: 768Mi
        # https://docs.linuxserver.io/images/docker-radarr/
        radarr:
          image:
            repository: lscr.io/linuxserver/radarr
            tag: 6.2.1.10461-ls308@sha256:39da107b5a9371fdaa651bd188049b863716a815385eb3a30d41071b7e1aeb33
          env:
            # https://wiki.servarr.com/en/radarr/environment-variables
            TZ: America/Denver
            RADARR__AUTH__APIKEY:
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: RADARR_API_KEY
            RADARR__LOG__ANALYTICSENABLED: "false"
            RADARR__LOG__CONSOLELEVEL: "info"
            RADARR__LOG__DBENABLED: "false"
            RADARR__UPDATE__AUTOMATICALLY: "false"
          probes:
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 7878
                failureThreshold: 30
                periodSeconds: 10
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 7878
                failureThreshold: 5
                periodSeconds: 30
                timeoutSeconds: 5
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 7878
                periodSeconds: 10
                timeoutSeconds: 5
          resources:
            requests:
              cpu: 30m
              memory: 512Mi
            limits:
              memory: 768Mi
        # https://docs.linuxserver.io/images/docker-sonarr/
        sonarr:
          image:
            repository: lscr.io/linuxserver/sonarr
            tag: 4.0.19.2979-ls316@sha256:fbb15bb4fb14d1ffe017f6be0e3fed8f1b300e4687e329767da0b61f36ba1eed
          env:
            # https://wiki.servarr.com/en/sonarr/environment-variables
            TZ: America/Denver
            SONARR__AUTH__APIKEY:
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: SONARR_API_KEY
            # Disable analytics
            SONARR__LOG__ANALYTICSENABLED: "false"
            # Stdout log level
            SONARR__LOG__CONSOLELEVEL: "info"
            # Disable sonarr log database
            SONARR__LOG__DBENABLED: "false"
            # Disable automatic updates
            SONARR__UPDATE__AUTOMATICALLY: "false"
          probes:
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 8989
                failureThreshold: 30
                periodSeconds: 10
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 8989
                failureThreshold: 5
                periodSeconds: 30
                timeoutSeconds: 5
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 8989
                periodSeconds: 10
                timeoutSeconds: 5
          resources:
            requests:
              cpu: 40m
              memory: 512Mi
            limits:
              memory: 768Mi
    unpackerr:
      pod:
        securityContext:
          fsGroup: *gid
          fsGroupChangePolicy: "OnRootMismatch"
          runAsUser: 1200
          runAsGroup: *gid
      replicas: 1
      containers:
        unpackerr:
          # https://github.com/Unpackerr/unpackerr/pkgs/container/unpackerr
          image:
            repository: ghcr.io/unpackerr/unpackerr
            tag: v0.16.1@sha256:406586865431b40b29353d899fb75a788f5384743f7f381444db5fe55d206914
          env:
            TZ: America/Denver
            UN_SONARR_0_API_KEY:
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: SONARR_API_KEY
            UN_RADARR_0_API_KEY:
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: RADARR_API_KEY
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
    cleanuparr:
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: "OnRootMismatch"
          runAsUser: 1000
          runAsGroup: 1000
      replicas: 1
      containers:
        cleanuparr:
          # https://cleanuparr.github.io/Cleanuparr/
          image:
            repository: ghcr.io/cleanuparr/cleanuparr
            tag: 2.10.9@sha256:cfada3e5721451403a878ef67afb317692bb3afe277328b28ce4470bfba915d0
          env:
            TZ: America/Denver
            PORT: "11011"
            BASE_PATH: ""
            PUID: "1000"
            PGID: "1000"
            UMASK: "022"
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 11011
                failureThreshold: 3
                initialDelaySeconds: 30
                periodSeconds: 30
                timeoutSeconds: 10
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 11011
                failureThreshold: 3
                initialDelaySeconds: 30
                periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 512Mi
            limits:
              memory: 1Gi
    downloader:
      replicas: 1
      pod:
        dnsPolicy: "None"
        dnsConfig:
          nameservers:
            - 127.0.0.1
      initContainers:
        # Updates qBittorrent password from generated hash
        password-updater:
          image:
            repository: alpine
            tag: "3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6"
          command:
            - /scripts/update-password.sh
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      containers:
        # https://docs.linuxserver.io/images/docker-qbittorrent/
        qbittorrent:
          image:
            repository: lscr.io/linuxserver/qbittorrent
            tag: 5.2.3_v2.0.13-ls469@sha256:b024436f8ca665d16d9a997d26fd27fdf867ee5566ba09f32764e7b2976d3e02
          env:
            TZ: America/Denver
            PUID: "1200"
            PGID: "1200"
          probes:
            # TCP: the web API only skips authentication for localhost, and the
            # kubelet probes from the node's address.
            startup:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8080
                failureThreshold: 30
                periodSeconds: 10
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8080
                failureThreshold: 5
                periodSeconds: 30
                timeoutSeconds: 5
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8080
                periodSeconds: 10
                timeoutSeconds: 5
          resources:
            requests:
              cpu: 750m
              memory: 1Gi
            limits:
              memory: 6Gi
        gluetun:
          image:
            repository: docker.io/qmcgaw/gluetun
            tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              memory: 384Mi
          env:
            TZ: America/Denver
            # Don't check for new versions
            VERSION_INFORMATION: "off"
            VPN_SERVICE_PROVIDER: protonvpn
            VPN_TYPE: wireguard
            VPN_PORT_FORWARDING: "on"
            PORT_FORWARD_ONLY: "on"
            # https://github.com/qdm12/gluetun-wiki/blob/main/setup/options/dns.md
            # DNS_KEEP_NAMESERVER: "on"
            SERVER_COUNTRIES: United States
            VPN_PORT_FORWARDING_UP_COMMAND: /bin/sh -c 'wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{`{{PORTS}}`}}}" http://127.0.0.1:8080/api/v2/app/setPreferences 2>&1'
          envFrom:
            # create secret with kubectl -n jellyfin create secret generic gluetun-wg-1
            # include value WIREGUARD_PRIVATE_KEY. All other wireguard-related values are not needed for protonvpn
            # See https://github.com/qdm12/gluetun-wiki/blob/main/setup/providers/protonvpn.md#wireguard-only
            - secretRef:
                name: gluetun-wg-1
          # https://github.com/qdm12/gluetun-wiki/blob/main/setup/advanced/kubernetes.md#adding-ipv6-rule--file-exists
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "(ip rule del table 51820; ip -6 rule del table 51820) || true"]
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          probes:
            # gluetun's health server listens on localhost only, so use its own
            # healthcheck command. It fails while the VPN is down.
            liveness:
              enabled: true
              custom: true
              spec:
                exec:
                  command: ["/gluetun-entrypoint", "healthcheck"]
                failureThreshold: 10
                periodSeconds: 30
                timeoutSeconds: 10
            readiness:
              enabled: true
              custom: true
              spec:
                exec:
                  command: ["/gluetun-entrypoint", "healthcheck"]
                periodSeconds: 15
                timeoutSeconds: 10
        qbittorrent-metrics:
          image:
            repository: ghcr.io/martabal/qbittorrent-exporter
            tag: v2.0.3@sha256:bc4fa09481634ee894ebfb4d47c8aa239a32a12567b043afa01fa42a3075d1a5
          probes:
            # TCP: /metrics fails whenever qBittorrent itself is unreachable.
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8090
                failureThreshold: 5
                periodSeconds: 30
                timeoutSeconds: 5
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8090
                periodSeconds: 10
                timeoutSeconds: 5
          env:
            QBITTORRENT_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: jellyfin-qbittorrent-admin
                  key: username
            QBITTORRENT_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: jellyfin-qbittorrent-admin
                  key: password
            QBITTORRENT_BASE_URL: http://localhost:8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
    configarr:
      type: cronjob
      cronjob:
        schedule: "0 */8 * * *"
        successfulJobsHistory: 1
        failedJobsHistory: 1
      pod:
        restartPolicy: Never
      initContainers:
        write-secrets-yaml:
          image:
            repository: alpine
            tag: 3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
          envFrom:
            - secretRef:
                name: api-keys
          command:
            - /bin/sh
            - -c
            - |
              cat <<EOF >/app/config/secrets.yml
              SONARR_API_KEY: "${SONARR_API_KEY}"
              RADARR_API_KEY: "${RADARR_API_KEY}"
              EOF
              chmod 600 /app/config/secrets.yml
      containers:
        configarr:
          image:
            repository: ghcr.io/raydak-labs/configarr
            tag: 1.34.1@sha256:3443bef6be53f7f8580bad13f6e7946cabc80ba4e4f247e2a23b767febd7af3c
            pullPolicy: IfNotPresent
          tty: true # for color support
          env:
            LOG_STACKTRACE: "true"
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              memory: 192Mi
  service:
    main:
      controller: main
      ports:
        http:
          port: 8096
          protocol: HTTP
    seerr:
      controller: seerr
      ports:
        http:
          port: 5055
          protocol: HTTP
    cleanuparr:
      controller: cleanuparr
      ports:
        http:
          port: 11011
          protocol: HTTP
    arrs:
      controller: arrs
      ports:
        prowlarr:
          port: 9696
          protocol: HTTP
        radarr:
          port: 7878
          protocol: HTTP
        sonarr:
          port: 8989
          protocol: HTTP
    downloader:
      controller: downloader
      ports:
        qbittorrent:
          port: 8080
          protocol: HTTP
        qbittorrent-metrics:
          port: 8090
          protocol: HTTP
  ingress:
    jellyfin:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: wspublic
      hosts:
        - host: &jellyfinHost jellyfin.msng.to
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - hosts:
            - *jellyfinHost
    seerr:
      enabled: true
      hosts:
        - host: &seerrHost seerr.msng.to
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: seerr
                port: http
      tls:
        - hosts:
            - *seerrHost
    # Jellyseerr was renamed to Seerr upstream, and the service moved from
    # jellyseerr.msng.to to seerr.msng.to. This Ingress keeps the old hostname
    # resolvable (external-dns reads the host, Traefik terminates TLS for it) so
    # bookmarks and app-configured URLs get a permanent redirect to the new host
    # instead of a dead name. Traefik's redirectRegex answers `permanent: true`
    # with a 308, not a 301, so the method and body survive the hop.
    # The backend is never reached: the middleware redirects first.
    seerr-legacy-redirect:
      enabled: true
      annotations:
        traefik.ingress.kubernetes.io/router.middlewares: jellyfin-seerr-legacy-redirect@kubernetescrd
      hosts:
        - host: &seerrLegacyHost jellyseerr.msng.to
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: seerr
                port: http
      tls:
        - hosts:
            - *seerrLegacyHost
    qbittorrent:
      enabled: true
      hosts:
        - host: &qbittorrentHost qbittorrent.msng.to
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: downloader
                port: qbittorrent
      tls:
        - hosts:
            - *qbittorrentHost
    cleanuparr:
      enabled: true
      hosts:
        - host: &cleanuparrHost cleanuparr.msng.to
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: cleanuparr
                port: http
      tls:
        - hosts:
            - *cleanuparrHost
    prowlarr:
      enabled: true
      hosts:
        - host: &prowlarrHost prowlarr.msng.to
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: arrs
                port: prowlarr
      tls:
        - hosts:
            - *prowlarrHost
    radarr:
      enabled: true
      hosts:
        - host: &radarrHost radarr.msng.to
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: arrs
                port: radarr
      tls:
        - hosts:
            - *radarrHost
    sonarr:
      enabled: true
      hosts:
        - host: &sonarrHost sonarr.msng.to
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: arrs
                port: sonarr
      tls:
        - hosts:
            - *sonarrHost
  persistence:
    data:
      accessMode: ReadWriteMany
      type: persistentVolumeClaim
      size: 50Ti
      storageClass: smb
      advancedMounts:
        debug:
          jellyfin-debug:
            - path: /data
        main:
          jellyfin:
            - path: /media
              readOnly: true
              subPath: media
        arrs:
          radarr:
            - path: /data
          sonarr:
            - path: /data
        unpackerr:
          unpackerr:
            - path: /data
        downloader:
          qbittorrent:
            - path: /data
    jellyfin-data:
      accessMode: ReadWriteOnce
      type: persistentVolumeClaim
      # As of 2025-07-22 this was using 5.4GB
      size: 100Gi
      storageClass: longhorn
      labels:
        recurring-job.longhorn.io/source: "enabled"
        recurring-job-group.longhorn.io/backup: "enabled"
      advancedMounts:
        main:
          jellyfin:
            - path: /data
    jellyfin-cache:
      accessMode: ReadWriteOnce
      type: persistentVolumeClaim
      # As of 2026-01-07 this was using 2.6GB, almost all of it transcodes,
      # which now live on the emptyDir below. The image cache that remains was
      # 245MB as of 2026-08-15, so this is oversized -- but Longhorn volumes
      # cannot shrink, and unused space in it costs nothing but disk.
      size: 20Gi
      storageClass: longhorn
      labels:
        recurring-job.longhorn.io/source: "enabled"
        recurring-job-group.longhorn.io/ephemeral: "enabled"
      advancedMounts:
        main:
          jellyfin:
            - path: /data/cache
    # Transcode segments are regenerated on demand and are worthless across a
    # restart, so they can live on an emptyDir.
    jellyfin-transcodes:
      type: emptyDir
      sizeLimit: 50Gi
      advancedMounts:
        main:
          jellyfin:
            - path: /data/cache/transcodes
    # Replace the image's CA bundle with our cluster CA bundle so the LDAP-Auth
    # plugin can validate LLDAP's LDAPS cert, which is issued by the
    # internal-ca ClusterIssuer. The plugin validates against the system CA
    # store, and .NET on Linux reads that store from OpenSSL's default path
    # /usr/lib/ssl/cert.pem, which itself is a symlink to this file.
    system-ca-bundle:
      type: configMap
      name: system-ca-bundle
      advancedMounts:
        main:
          jellyfin:
            - path: /etc/ssl/certs/ca-certificates.crt
              readOnly: true
              subPath: ca-certificates.crt
    jellyfin-configs:
      type: configMap
      name: jellyfin-configs
      advancedMounts:
        main:
          jellyfin:
            - path: /data/config/logging.json
              readOnly: true
              subPath: logging.json
    cleanuparr-data:
      accessMode: ReadWriteOnce
      type: persistentVolumeClaim
      size: 500Mi
      storageClass: longhorn
      labels:
        recurring-job.longhorn.io/source: "enabled"
        recurring-job-group.longhorn.io/backup: "enabled"
      advancedMounts:
        cleanuparr:
          cleanuparr:
            - path: /config
    configarr-repos:
      type: emptyDir
      advancedMounts:
        configarr:
          configarr:
            - path: /app/repos
    configarr-config:
      type: configMap
      name: configarr
      advancedMounts:
        configarr:
          configarr:
            - path: /app/config/config.yml
              readOnly: true
              subPath: config.yml
    configarr-secrets:
      type: emptyDir
      advancedMounts:
        configarr:
          write-secrets-yaml:
            - path: /app/config
          configarr:
            - path: /app/config/secrets.yml
              readOnly: true
              subPath: secrets.yml
    seerr-data:
      accessMode: ReadWriteOnce
      type: persistentVolumeClaim
      # As of 2025-07-22 this was using 7.4MB
      size: 1Gi
      storageClass: longhorn
      labels:
        recurring-job.longhorn.io/source: "enabled"
        recurring-job-group.longhorn.io/backup: "enabled"
      advancedMounts:
        seerr:
          seerr:
            - path: /app/config
    seerr-cache:
      accessMode: ReadWriteOnce
      type: persistentVolumeClaim
      # As of 2025-10-27 this was using 165MB
      # As of 2026-06-03 this was using 897MB
      size: 5Gi
      storageClass: longhorn
      labels:
        recurring-job.longhorn.io/source: "enabled"
        recurring-job-group.longhorn.io/ephemeral: "enabled"
      advancedMounts:
        seerr:
          seerr:
            - path: /app/config/cache
    prowlarr-data:
      accessMode: ReadWriteOnce
      type: persistentVolumeClaim
      # As of 2025-07-22 this was using 105MB
      # As of 2026-03-17 this was using 886MB
      size: 2Gi
      storageClass: longhorn
      labels:
        recurring-job.longhorn.io/source: "enabled"
        recurring-job-group.longhorn.io/backup: "enabled"
      advancedMounts:
        arrs:
          prowlarr:
            - path: /config
    radarr-data:
      accessMode: ReadWriteOnce
      type: persistentVolumeClaim
      # As of 2025-07-22 this was using 266MB
      size: 5Gi
      storageClass: longhorn
      labels:
        recurring-job.longhorn.io/source: "enabled"
        recurring-job-group.longhorn.io/backup: "enabled"
      advancedMounts:
        arrs:
          radarr:
            - path: /config
    # Mounts
    # /config longhorn secondary
    # /config/Backups smb
    # /config/MediaCover longhorn cache
    # /config/logs emptydir
    sonarr-data:
      accessMode: ReadWriteOnce
      type: persistentVolumeClaim
      # As of 2025-07-22 this was using 317MB
      size: 5Gi
      storageClass: longhorn
      labels:
        recurring-job.longhorn.io/source: "enabled"
        recurring-job-group.longhorn.io/backup: "enabled"
      advancedMounts:
        arrs:
          sonarr:
            - path: /config
    arr-backups:
      accessMode: ReadWriteMany
      type: persistentVolumeClaim
      size: 10Gi
      storageClass: smb-backups
      retain: true
      advancedMounts:
        arrs:
          sonarr:
            - path: /config/Backups
              subPath: sonarr
    sonarr-cache:
      accessMode: ReadWriteOnce
      type: persistentVolumeClaim
      size: 5Gi
      storageClass: longhorn
      labels:
        recurring-job.longhorn.io/source: "enabled"
        recurring-job-group.longhorn.io/ephemeral: "enabled"
      advancedMounts:
        arrs:
          sonarr:
            - path: /config/MediaCover
    sonarr-logs:
      type: emptyDir
      advancedMounts:
        arrs:
          sonarr:
            - path: /config/logs
    qbittorrent-data:
      accessMode: ReadWriteOnce
      type: persistentVolumeClaim
      # As of 2025-07-22 this was using 151MB
      size: 1Gi
      storageClass: longhorn
      labels:
        recurring-job.longhorn.io/source: "enabled"
        recurring-job-group.longhorn.io/backup: "enabled"
      advancedMounts:
        downloader:
          password-updater:
            - path: /config
          qbittorrent:
            - path: /config
    qbittorrent-password-hash:
      type: secret
      name: jellyfin-qbittorrent-password-hash
      defaultMode: 0400
      advancedMounts:
        downloader:
          password-updater:
            - path: /tmp/qbittorrent-password
              readOnly: true
    qbittorrent-update-script:
      type: configMap
      name: jellyfin-qbittorrent-update-password
      defaultMode: 0555
      advancedMounts:
        downloader:
          password-updater:
            - path: /scripts
              readOnly: true
    unpackerr-configs:
      type: configMap
      name: unpackerr-configs
      advancedMounts:
        unpackerr:
          unpackerr:
            - path: /config/unpackerr.conf
              readOnly: true
              subPath: unpackerr.conf
  secrets:
    # This autogenerated secret is used wherever environment variables and configuration files allow, but still need to manually be setup with the following:
    # - prowlarr: add apps for sonarr and radarr
    # - seerr: add sonarr, radarr, and jellyfin API keys
    api-keys:
      forceRename: api-keys
      annotations:
        secret-generator.v1.mittwald.de/autogenerate: SONARR_API_KEY,RADARR_API_KEY,PROWLARR_API_KEY,SEERR_API_KEY
        secret-generator.v1.mittwald.de/encoding: hex
        # Arr apps use 32 hex characters for their own autogenerated API keys.
        # If you use a different length, Radarr errors out (and possibly others do too)
        secret-generator.v1.mittwald.de/length: "32"
      stringData: {}
    qbittorrent-admin:
      annotations:
        secret-generator.v1.mittwald.de/autogenerate: password
        secret-generator.v1.mittwald.de/length: "24"
      stringData:
        username: admin
