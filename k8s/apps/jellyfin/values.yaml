# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-3.2.0/charts/library/common/values.schema.json
# Docs: https://bjw-s-labs.github.io/helm-charts/docs/app-template/

qbittorrentPasswordHash:
  # Deliberately in values.yaml (not templates/qbittorrent-password-hash-job.yaml)
  # so that renovate can pick them up.
  image:
    # Python must match files/qbittorrent-password-hash/.python-version.
    repository: ghcr.io/astral-sh/uv
    tag: python3.15-alpine@sha256:8d2c75bbf0f4155bc2a4ae2297bcd33bea4e775fd68ca21d6c38c1220b720735
  kubectlImage: alpine/kubectl:1.37.1@sha256:a5d0fbecab3f7b6c2ab7398f1daa73a3e0ed6ece18556d21698233e9e3759cc7

# Static NFS volumes for the apps' own backups (templates/nas-backups.yaml),
# each claimed as jellyfin-<name>-backups. Each app keeps only its latest
# backup here; restic snapshots /storage/nas/backups to S3 for history
# (k8s/platform/restic).
nasBackups:
  server: borg-2.msng.to
  volumes:
    # Paths are NFSv4 paths relative to the fsid=0 root (/storage/nas).
    arr-stack:
      path: /backups/arr-stack
      storage: 10Gi
    jellyfin:
      path: /backups/jellyfin
      storage: 10Gi

# Prometheus resources this chart owns. They live here rather than in
# monitoring-system so that a jellyfin deployment carries its own scrape
# targets and alerts.
#
# Everything scoped to jellyfin-exporter also requires exporter.enabled below;
# turning the exporter off takes its ServiceMonitor and alert rules with it,
# whatever these flags say.
monitoring:
  exporter:
    serviceMonitor:
      enabled: true
    # JellyfinStreamActive is what blocks kured from rebooting a node while
    # somebody is watching. Without it, reboots are ungated.
    prometheusRule:
      enabled: true
  qbittorrent:
    serviceMonitor:
      enabled: true

# Exports Jellyfin metrics to Prometheus.
#
# Deliberately not an app-template controller: its Deployment, Service and
# ConfigMap live in templates/ so the pod template can carry a checksum over
# the project in files/jellyfin-exporter/. app-template can only checksum ConfigMaps
# it generates from its own values, and a subchart cannot read the parent
# chart's files -- see templates/jellyfin-exporter-deployment.yaml. Because
# those are all chart-owned, `enabled` here is the single switch for the whole
# exporter: Deployment, Service, ConfigMap, ServiceMonitor and alert rules.
exporter:
  enabled: true
  replicas: 1
  image:
    # The python-flavoured tag ships an interpreter, so a pod start only has to
    # fetch exporter.py's own dependencies. Its Python must match
    # files/jellyfin-exporter/.python-version: uv never downloads one.
    repository: ghcr.io/astral-sh/uv
    tag: python3.15-alpine@sha256:8d2c75bbf0f4155bc2a4ae2297bcd33bea4e775fd68ca21d6c38c1220b720735
  # Same non-root uid/gid as the jellyfin container. The exporter only ever
  # writes to its own emptyDir.
  runAsUser: 1200
  runAsGroup: 1200
  port: 9101
  jellyfinUrl: http://jellyfin-main:8096
  # Created out of band, not by this chart: it holds a Jellyfin API key minted
  # in the admin dashboard.
  apiKeySecret:
    name: jellyfin-exporter-api-key
    key: JELLYFIN_API_KEY
  # Mounted read-only to export jellyfin_media_size_bytes. Remove to disable.
  media:
    claimName: jellyfin-data
    subPath: media
    # Seconds between scans. A full scan took ~1s over SMB in Oct 2026.
    interval: 900
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# Keeps the main controller's image on every node it can run on, so a rollout
# or drain doesn't pull ~750MB while Jellyfin is down. Image and node affinity
# come from app-template.controllers.main. See
# templates/jellyfin-image-prepull-daemonset.yaml.
imagePrepull:
  enabled: true
  resources:
    requests:
      cpu: 1m
      memory: 8Mi
    limits:
      memory: 16Mi

app-template:
  defaultPodOptions:
    automountServiceAccountToken: false
  controllers:
    debug:
      replicas: 0
      containers:
        jellyfin-debug:
          image:
            repository: alpine
            tag: "3.24.4@sha256:93b41ef40b1677fce8fcc64ff4af09daddfacf5040afde618bc46c1e2d1cc7d4"
          command:
            - sleep
            - infinity
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi

    main:
      replicas: 1
      pod:
        securityContext:
          fsGroup: &gid 1200
          fsGroupChangePolicy: "OnRootMismatch"
          runAsUser: 1200
          runAsGroup: *gid
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              # Match Intel UHD 7xx series and Iris Xe graphics or better.
              # Device ID can be found here: https://dgpu-docs.intel.com/devices/hardware-table.html#gpus-with-supported-drivers
              nodeSelectorTerms:
                # borg-0
                - matchExpressions:
                    - key: gpu.intel.com/device-id.0300-7d67.present
                      operator: In
                      values: ["true"]
                # borg-2
                - matchExpressions:
                    - key: gpu.intel.com/device-id.0300-a7a0.present
                      operator: In
                      values: ["true"]
      containers:
        jellyfin:
          image:
            repository: ghcr.io/jellyfin/jellyfin
            tag: 12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
          env:
            TZ: America/Denver
            JELLYFIN_DATA_DIR: "/data"
            JELLYFIN_CONFIG_DIR: "/data/config"
            JELLYFIN_CACHE_DIR: "/data/cache"
            JELLYFIN_LOG_DIR: "/data/log"
          probes:
            # Use /System/Ping for startup probe.
            #
            # Jellyfin runs a "setup server" during schema migrations before
            # Kestrel starts (Jellyfin.Server/ServerSetupApp/SetupServer.cs).
            # The setup server maps /health to a check that reports 200
            # Degraded, flipping the response code to 503 if migrations fail.
            #
            # /System/Ping, on the other hand, returns 200 only once the real
            # server is listening, which makes for a much better startup probe.
            # It keeps liveness out of the migration window, and a failed
            # migration sits un-Ready and readable instead of crashlooping.
            #
            # 900 x 2s = 30 minutes, which is the migration budget. Jellyfin is
            # down for users until this and readiness pass, so both poll every
            # 2s rather than leaving a ready server waiting on the next probe.
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /System/Ping
                  port: 8096
                failureThreshold: 900
                periodSeconds: 2
                successThreshold: 1
                timeoutSeconds: 3
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8096
                failureThreshold: 3
                periodSeconds: 30
                successThreshold: 1
                timeoutSeconds: 10
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8096
                # 15 x 2s keeps the 30s of failures it takes to pull a running
                # server out of the Service.
                failureThreshold: 15
                periodSeconds: 2
                successThreshold: 1
                timeoutSeconds: 5
          resources:
            requests:
              cpu: 1000m
              memory: 1Gi
              gpu.intel.com/i915: "1"
            limits:
              memory: 6Gi
              gpu.intel.com/i915: "1"
    arrs:
      replicas: 1
      pod:
        securityContext:
          fsGroup: *gid
          fsGroupChangePolicy: "OnRootMismatch"
          runAsUser: 1200
          runAsGroup: *gid
      initContainers:
        # Radarr's recycle bin (configarr media_management): Radarr refuses a
        # folder that doesn't exist. Same share as the library, so deleting is a
        # move rather than a copy.
        recycle-bin:
          image:
            repository: alpine
            tag: "3.24.4@sha256:93b41ef40b1677fce8fcc64ff4af09daddfacf5040afde618bc46c1e2d1cc7d4"
          command: ["mkdir", "-p", "/data/media/.recycle/radarr"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      containers:
        # https://docs.linuxserver.io/images/docker-prowlarr/
        prowlarr:
          image:
            repository: lscr.io/linuxserver/prowlarr
            tag: 2.7.0.5723-ls168@sha256:6660787a99b2e58203539583663c973b48979fc00ff2cb78dc0ea17429e1f6ef
          env:
            # https://wiki.servarr.com/en/prowlarr/environment-variables
            TZ: America/Denver
            PROWLARR__AUTH__APIKEY:
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: PROWLARR_API_KEY
            PROWLARR__LOG__ANALYTICSENABLED: "false"
            # Log files are only written at level info or below; logs are
            # collected from stdout, so turn them off.
            PROWLARR__LOG__LEVEL: "off"
            PROWLARR__LOG__CONSOLELEVEL: "info"
            PROWLARR__LOG__DBENABLED: "false"
          probes:
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 9696
                failureThreshold: 30
                periodSeconds: 10
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 9696
                failureThreshold: 5
                periodSeconds: 30
                timeoutSeconds: 5
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 9696
                periodSeconds: 10
                timeoutSeconds: 5
          resources:
            requests:
              cpu: 60m
              memory: 384Mi
            limits:
              memory: 768Mi
        # https://docs.linuxserver.io/images/docker-radarr/
        radarr:
          image:
            repository: lscr.io/linuxserver/radarr
            tag: 6.4.4.10685-ls326@sha256:51a9ac2a9eb47afc833541e5fd6c11b86eb9f810694c22fa2429e3078e9194b2
          env:
            # https://wiki.servarr.com/en/radarr/environment-variables
            TZ: America/Denver
            RADARR__AUTH__APIKEY:
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: RADARR_API_KEY
            RADARR__LOG__ANALYTICSENABLED: "false"
            # Log files are only written at level info or below; logs are
            # collected from stdout, so turn them off.
            RADARR__LOG__LEVEL: "off"
            RADARR__LOG__CONSOLELEVEL: "info"
            RADARR__LOG__DBENABLED: "false"
            RADARR__UPDATE__AUTOMATICALLY: "false"
          probes:
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 7878
                failureThreshold: 30
                periodSeconds: 10
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 7878
                failureThreshold: 5
                periodSeconds: 30
                timeoutSeconds: 5
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 7878
                periodSeconds: 10
                timeoutSeconds: 5
          resources:
            requests:
              cpu: 30m
              memory: 512Mi
            limits:
              memory: 768Mi
        # https://docs.linuxserver.io/images/docker-sonarr/
        sonarr:
          image:
            repository: lscr.io/linuxserver/sonarr
            tag: 4.0.20.3014-ls329@sha256:44b06045a98bc1f237b9ffefc4b28dab64cb29305e4a2a94875ae93b5224e4cc
          env:
            # https://wiki.servarr.com/en/sonarr/environment-variables
            TZ: America/Denver
            SONARR__AUTH__APIKEY:
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: SONARR_API_KEY
            # Disable analytics
            SONARR__LOG__ANALYTICSENABLED: "false"
            # Log files are only written at level info or below; logs are
            # collected from stdout, so turn them off.
            SONARR__LOG__LEVEL: "off"
            # Stdout log level
            SONARR__LOG__CONSOLELEVEL: "info"
            # Disable sonarr log database
            SONARR__LOG__DBENABLED: "false"
            # Disable automatic updates
            SONARR__UPDATE__AUTOMATICALLY: "false"
          probes:
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 8989
                failureThreshold: 30
                periodSeconds: 10
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 8989
                failureThreshold: 5
                periodSeconds: 30
                timeoutSeconds: 5
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 8989
                periodSeconds: 10
                timeoutSeconds: 5
          resources:
            requests:
              cpu: 40m
              memory: 512Mi
            limits:
              memory: 768Mi
    unpackerr:
      pod:
        securityContext:
          fsGroup: *gid
          fsGroupChangePolicy: "OnRootMismatch"
          runAsUser: 1200
          runAsGroup: *gid
      replicas: 1
      containers:
        unpackerr:
          # https://github.com/Unpackerr/unpackerr/pkgs/container/unpackerr
          image:
            repository: ghcr.io/unpackerr/unpackerr
            tag: v0.16.1@sha256:406586865431b40b29353d899fb75a788f5384743f7f381444db5fe55d206914
          env:
            TZ: America/Denver
            UN_SONARR_0_API_KEY:
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: SONARR_API_KEY
            UN_RADARR_0_API_KEY:
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: RADARR_API_KEY
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
    cleanuparr:
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: "OnRootMismatch"
          runAsUser: 1000
          runAsGroup: 1000
      replicas: 1
      containers:
        cleanuparr:
          # https://cleanuparr.github.io/Cleanuparr/
          image:
            repository: ghcr.io/cleanuparr/cleanuparr
            tag: 2.11.0@sha256:1898c3219e7e7ecaf9fcb8474691b6d67d56d0798b01b85690975bae14df11b5
          env:
            TZ: America/Denver
            PORT: "11011"
            BASE_PATH: ""
            PUID: "1000"
            PGID: "1000"
            UMASK: "022"
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 11011
                failureThreshold: 3
                initialDelaySeconds: 30
                periodSeconds: 30
                timeoutSeconds: 10
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 11011
                failureThreshold: 3
                initialDelaySeconds: 30
                periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 512Mi
            limits:
              memory: 1Gi
    downloader:
      replicas: 1
      pod:
        dnsPolicy: "None"
        dnsConfig:
          nameservers:
            - 127.0.0.1
      initContainers:
        # Updates qBittorrent password from generated hash
        password-updater:
          image:
            repository: alpine
            tag: "3.24.4@sha256:93b41ef40b1677fce8fcc64ff4af09daddfacf5040afde618bc46c1e2d1cc7d4"
          command:
            - /scripts/update-password.sh
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      containers:
        # https://docs.linuxserver.io/images/docker-qbittorrent/
        qbittorrent:
          image:
            repository: lscr.io/linuxserver/qbittorrent
            tag: 5.3.0_v2.1.2-ls486@sha256:05c1454f9a32967affc1f34f67f8cc0cc57dd805dca45489fe797095a6286556
          env:
            TZ: America/Denver
            PUID: "1200"
            PGID: "1200"
          probes:
            # TCP: the web API only skips authentication for localhost, and the
            # kubelet probes from the node's address.
            startup:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8080
                failureThreshold: 30
                periodSeconds: 10
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8080
                failureThreshold: 5
                periodSeconds: 30
                timeoutSeconds: 5
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8080
                periodSeconds: 10
                timeoutSeconds: 5
          resources:
            requests:
              cpu: 750m
              memory: 1Gi
            limits:
              memory: 6Gi
        gluetun:
          image:
            repository: docker.io/qmcgaw/gluetun
            tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              memory: 384Mi
          env:
            TZ: America/Denver
            # Don't check for new versions
            VERSION_INFORMATION: "off"
            VPN_SERVICE_PROVIDER: protonvpn
            VPN_TYPE: wireguard
            VPN_PORT_FORWARDING: "on"
            PORT_FORWARD_ONLY: "on"
            # https://github.com/qdm12/gluetun-wiki/blob/main/setup/options/dns.md
            # DNS_KEEP_NAMESERVER: "on"
            SERVER_COUNTRIES: United States
            VPN_PORT_FORWARDING_UP_COMMAND: /bin/sh -c 'wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{`{{PORTS}}`}}}" http://127.0.0.1:8080/api/v2/app/setPreferences 2>&1'
          envFrom:
            # create secret with kubectl -n jellyfin create secret generic gluetun-wg-1
            # include value WIREGUARD_PRIVATE_KEY. All other wireguard-related values are not needed for protonvpn
            # See https://github.com/qdm12/gluetun-wiki/blob/main/setup/providers/protonvpn.md#wireguard-only
            - secretRef:
                name: gluetun-wg-1
          # https://github.com/qdm12/gluetun-wiki/blob/main/setup/advanced/kubernetes.md#adding-ipv6-rule--file-exists
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "(ip rule del table 51820; ip -6 rule del table 51820) || true"]
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          probes:
            # gluetun's health server listens on localhost only, so use its own
            # healthcheck command. It fails while the VPN is down.
            liveness:
              enabled: true
              custom: true
              spec:
                exec:
                  command: ["/gluetun-entrypoint", "healthcheck"]
                failureThreshold: 10
                periodSeconds: 30
                timeoutSeconds: 10
            readiness:
              enabled: true
              custom: true
              spec:
                exec:
                  command: ["/gluetun-entrypoint", "healthcheck"]
                periodSeconds: 15
                timeoutSeconds: 10
        qbittorrent-metrics:
          image:
            repository: ghcr.io/martabal/qbittorrent-exporter
            tag: v2.0.4@sha256:9289fc5ad5cef7af6af5af5ab5ed7b8d609827490ba374df858905d66da7ec5f
          probes:
            # TCP: /metrics fails whenever qBittorrent itself is unreachable.
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8090
                failureThreshold: 5
                periodSeconds: 30
                timeoutSeconds: 5
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8090
                periodSeconds: 10
                timeoutSeconds: 5
          env:
            QBITTORRENT_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: jellyfin-qbittorrent-admin
                  key: username
            QBITTORRENT_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: jellyfin-qbittorrent-admin
                  key: password
            QBITTORRENT_BASE_URL: http://localhost:8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
    configarr:
      type: cronjob
      cronjob:
        schedule: "0 */8 * * *"
        successfulJobsHistory: 1
        failedJobsHistory: 1
      pod:
        restartPolicy: Never
      initContainers:
        write-secrets-yaml:
          image:
            repository: alpine
            tag: "3.24.4@sha256:93b41ef40b1677fce8fcc64ff4af09daddfacf5040afde618bc46c1e2d1cc7d4"
          envFrom:
            - secretRef:
                name: api-keys
          command:
            - /bin/sh
            - -c
            - |
              cat <<EOF >/app/config/secrets.yml
              SONARR_API_KEY: "${SONARR_API_KEY}"
              RADARR_API_KEY: "${RADARR_API_KEY}"
              EOF
              chmod 600 /app/config/secrets.yml
      containers:
        configarr:
          image:
            repository: ghcr.io/raydak-labs/configarr
            tag: 1.39.1@sha256:e61e12c776f33d2e14a8d7ded4b27fc7253181df9b8fd3a6c7e510f323cf8f46
            pullPolicy: IfNotPresent
          tty: true # for color support
          env:
            LOG_STACKTRACE: "true"
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              memory: 192Mi
        # Backup interval/retention live in each app's database, which
        # configarr doesn't manage. See files/arr-backup-settings.
        arr-backup-settings:
          # Python must match files/arr-backup-settings/.python-version.
          image:
            repository: ghcr.io/astral-sh/uv
            tag: python3.15-alpine@sha256:8d2c75bbf0f4155bc2a4ae2297bcd33bea4e775fd68ca21d6c38c1220b720735
          # uv builds the project's environment beside it, and /app is a
          # read-only ConfigMap mount, so run from a writable copy.
          command:
            - sh
            - -c
            - |-
              set -eu
              cp -rL /app/. /project/
              mkdir -p /project/tmp
              cd /project
              exec uv run --frozen --no-dev --no-cache --no-python-downloads --link-mode copy \
                python reconcile.py
          env:
            HOME: /project
            TMPDIR: /project/tmp
            PYTHONUNBUFFERED: "1"
          envFrom:
            - secretRef:
                name: api-keys
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
    # Jellyfin only backs up on request, so this calls its backup API nightly
    # and then deletes the older archives. See files/jellyfin-backup.
    jellyfin-backup:
      type: cronjob
      cronjob:
        # Before borg-2's 02:00 restic run copies the NAS off-site, and clear of
        # kured's 04:00 reboot window, which can move Jellyfin or reboot the
        # NAS. A backup takes ~10s and runs live.
        schedule: "30 1 * * *"
        concurrencyPolicy: Forbid
        successfulJobsHistory: 1
        failedJobsHistory: 1
        # Fail rather than sit Pending (and block later runs) while there is
        # no Jellyfin pod to schedule next to.
        activeDeadlineSeconds: 7200
      pod:
        restartPolicy: Never
        securityContext:
          fsGroup: *gid
          # The root of jellyfin-data already matches, so this skips a
          # recursive chown of the whole volume on every run.
          fsGroupChangePolicy: "OnRootMismatch"
          runAsUser: 1200
          runAsGroup: *gid
        # jellyfin-data is ReadWriteOnce, so it can only be mounted on the node
        # Jellyfin's pod is running on.
        affinity:
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: jellyfin
                    app.kubernetes.io/controller: main
      containers:
        jellyfin-backup:
          # Python must match files/jellyfin-backup/.python-version.
          image:
            repository: ghcr.io/astral-sh/uv
            tag: python3.15-alpine@sha256:8d2c75bbf0f4155bc2a4ae2297bcd33bea4e775fd68ca21d6c38c1220b720735
          # uv builds the project's environment beside it, and /app is a
          # read-only ConfigMap mount, so run from a writable copy.
          command:
            - sh
            - -c
            - |-
              set -eu
              cp -rL /app/. /project/
              mkdir -p /project/tmp
              cd /project
              exec uv run --frozen --no-dev --no-cache --no-python-downloads --link-mode copy \
                python backup.py
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            JELLYFIN_URL: http://jellyfin-main:8096
            BACKUP_DIR: /backups
            DATA_DIR: /jellyfin-data
            HOME: /project
            TMPDIR: /project/tmp
            PYTHONUNBUFFERED: "1"
          envFrom:
            # Manual: create an API key named `jellyfin-backup` in the Jellyfin
            # dashboard, then
            # kubectl -n jellyfin create secret generic jellyfin-backup-api-key --from-literal=JELLYFIN_API_KEY="$(pbpaste)"
            - secretRef:
                name: jellyfin-backup-api-key
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
  service:
    main:
      controller: main
      ports:
        http:
          port: 8096
          protocol: HTTP
    cleanuparr:
      controller: cleanuparr
      ports:
        http:
          port: 11011
          protocol: HTTP
    arrs:
      controller: arrs
      ports:
        prowlarr:
          port: 9696
          protocol: HTTP
        radarr:
          port: 7878
          protocol: HTTP
        sonarr:
          port: 8989
          protocol: HTTP
    downloader:
      controller: downloader
      ports:
        qbittorrent:
          port: 8080
          protocol: HTTP
        qbittorrent-metrics:
          port: 8090
          protocol: HTTP
  ingress:
    jellyfin:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: wspublic
      hosts:
        - host: &jellyfinHost jellyfin.msng.to
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - hosts:
            - *jellyfinHost
    qbittorrent:
      enabled: true
      hosts:
        - host: &qbittorrentHost qbittorrent.msng.to
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: downloader
                port: qbittorrent
      tls:
        - hosts:
            - *qbittorrentHost
    cleanuparr:
      enabled: true
      hosts:
        - host: &cleanuparrHost cleanuparr.msng.to
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: cleanuparr
                port: http
      tls:
        - hosts:
            - *cleanuparrHost
    prowlarr:
      enabled: true
      hosts:
        - host: &prowlarrHost prowlarr.msng.to
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: arrs
                port: prowlarr
      tls:
        - hosts:
            - *prowlarrHost
    radarr:
      enabled: true
      hosts:
        - host: &radarrHost radarr.msng.to
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: arrs
                port: radarr
      tls:
        - hosts:
            - *radarrHost
    sonarr:
      enabled: true
      hosts:
        - host: &sonarrHost sonarr.msng.to
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: arrs
                port: sonarr
      tls:
        - hosts:
            - *sonarrHost
  persistence:
    data:
      accessMode: ReadWriteMany
      type: persistentVolumeClaim
      size: 50Ti
      storageClass: smb
      advancedMounts:
        debug:
          jellyfin-debug:
            - path: /data
        main:
          jellyfin:
            - path: /media
              readOnly: true
              subPath: media
        arrs:
          recycle-bin:
            - path: /data
          radarr:
            - path: /data
          sonarr:
            - path: /data
        unpackerr:
          unpackerr:
            - path: /data
        downloader:
          qbittorrent:
            - path: /data
    jellyfin-data:
      accessMode: ReadWriteOnce
      type: persistentVolumeClaim
      # As of 2025-07-22 this was using 5.4GB
      size: 100Gi
      storageClass: longhorn
      labels:
        recurring-job.longhorn.io/source: "enabled"
        recurring-job-group.longhorn.io/ephemeral: "enabled"
      advancedMounts:
        main:
          jellyfin:
            - path: /data
        jellyfin-backup:
          jellyfin-backup:
            - path: /jellyfin-data
              readOnly: true
    jellyfin-cache:
      accessMode: ReadWriteOnce
      type: persistentVolumeClaim
      # As of 2026-01-07 this was using 2.6GB, almost all of it transcodes,
      # which now live on the emptyDir below. The image cache that remains was
      # 245MB as of 2026-08-15, so this is oversized -- but Longhorn volumes
      # cannot shrink, and unused space in it costs nothing but disk.
      size: 20Gi
      storageClass: longhorn
      labels:
        recurring-job.longhorn.io/source: "enabled"
        recurring-job-group.longhorn.io/ephemeral: "enabled"
      advancedMounts:
        main:
          jellyfin:
            - path: /data/cache
    # Transcode segments are regenerated on demand and are worthless across a
    # restart, so they can live on an emptyDir.
    jellyfin-transcodes:
      type: emptyDir
      sizeLimit: 50Gi
      advancedMounts:
        main:
          jellyfin:
            - path: /data/cache/transcodes
    # Replace the image's CA bundle with our cluster CA bundle so the LDAP-Auth
    # plugin can validate LLDAP's LDAPS cert, which is issued by the
    # internal-ca ClusterIssuer. The plugin validates against the system CA
    # store, and .NET on Linux reads that store from OpenSSL's default path
    # /usr/lib/ssl/cert.pem, which itself is a symlink to this file.
    system-ca-bundle:
      type: configMap
      name: system-ca-bundle
      advancedMounts:
        main:
          jellyfin:
            - path: /etc/ssl/certs/ca-certificates.crt
              readOnly: true
              subPath: ca-certificates.crt
    jellyfin-configs:
      type: configMap
      name: jellyfin-configs
      advancedMounts:
        main:
          jellyfin:
            # logging.json is merged over logging.default.json, and its WriteTo
            # list only replaces the defaults by index, so the default File
            # sink survives. Replace both to log to the console only. Jellyfin
            # only writes logging.default.json when it is missing.
            - path: /data/config/logging.default.json
              readOnly: true
              subPath: logging.json
            - path: /data/config/logging.json
              readOnly: true
              subPath: logging.json
    # FFmpeg and plugin logs can't be turned off; keep them off the PVC.
    jellyfin-logs:
      type: emptyDir
      advancedMounts:
        main:
          jellyfin:
            - path: /data/log
    # Jellyfin's own backup folder on the NAS. Jellyfin hardcodes it as
    # {JELLYFIN_DATA_DIR}/data/backups, so the doubled "data" can't be avoided.
    jellyfin-backups:
      type: persistentVolumeClaim
      existingClaim: jellyfin-jellyfin-backups
      advancedMounts:
        main:
          jellyfin:
            - path: /data/data/backups
        jellyfin-backup:
          jellyfin-backup:
            - path: /backups
    jellyfin-backup-project:
      type: configMap
      name: jellyfin-backup
      advancedMounts:
        jellyfin-backup:
          jellyfin-backup:
            - path: /app
              readOnly: true
    jellyfin-backup-workdir:
      type: emptyDir
      advancedMounts:
        jellyfin-backup:
          jellyfin-backup:
            - path: /project
    cleanuparr-data:
      accessMode: ReadWriteOnce
      type: persistentVolumeClaim
      size: 500Mi
      storageClass: longhorn
      labels:
        recurring-job.longhorn.io/source: "enabled"
        recurring-job-group.longhorn.io/ephemeral: "enabled"
      advancedMounts:
        cleanuparr:
          cleanuparr:
            - path: /config
    # Cleanuparr's file log can't be turned off; keep it off the PVC.
    cleanuparr-logs:
      type: emptyDir
      advancedMounts:
        cleanuparr:
          cleanuparr:
            - path: /config/logs
    configarr-repos:
      type: emptyDir
      advancedMounts:
        configarr:
          configarr:
            - path: /app/repos
    configarr-config:
      type: configMap
      name: configarr
      advancedMounts:
        configarr:
          configarr:
            - path: /app/config/config.yml
              readOnly: true
              subPath: config.yml
    configarr-secrets:
      type: emptyDir
      advancedMounts:
        configarr:
          write-secrets-yaml:
            - path: /app/config
          configarr:
            - path: /app/config/secrets.yml
              readOnly: true
              subPath: secrets.yml
    arr-backup-settings:
      type: configMap
      name: arr-backup-settings
      advancedMounts:
        configarr:
          arr-backup-settings:
            - path: /app
              readOnly: true
    arr-backup-settings-workdir:
      type: emptyDir
      advancedMounts:
        configarr:
          arr-backup-settings:
            - path: /project
    prowlarr-data:
      accessMode: ReadWriteOnce
      type: persistentVolumeClaim
      # As of 2026-10-28 the filesystem held 76MB (most of it logs, since
      # disabled). Longhorn's "actual size" was 1.8GB of deleted blocks pinned
      # by its daily Longhorn backup snapshot, which trim can't reclaim. Hence
      # trim-only; Prowlarr's own backups go to the NAS.
      size: 2Gi
      storageClass: longhorn
      labels:
        recurring-job.longhorn.io/source: "enabled"
        recurring-job-group.longhorn.io/ephemeral: "enabled"
      advancedMounts:
        arrs:
          prowlarr:
            - path: /config
    radarr-data:
      accessMode: ReadWriteOnce
      type: persistentVolumeClaim
      # As of 2025-07-22 this was using 266MB
      size: 5Gi
      storageClass: longhorn
      labels:
        recurring-job.longhorn.io/source: "enabled"
        recurring-job-group.longhorn.io/ephemeral: "enabled"
      advancedMounts:
        arrs:
          radarr:
            - path: /config
    sonarr-data:
      accessMode: ReadWriteOnce
      type: persistentVolumeClaim
      # As of 2025-07-22 this was using 317MB
      size: 5Gi
      storageClass: longhorn
      labels:
        recurring-job.longhorn.io/source: "enabled"
        recurring-job-group.longhorn.io/ephemeral: "enabled"
      advancedMounts:
        arrs:
          sonarr:
            - path: /config
    # The apps' own backups (default folder /config/Backups) go to the NAS,
    # one subdir per app. See nasBackups above.
    arr-stack-backups:
      type: persistentVolumeClaim
      existingClaim: jellyfin-arr-stack-backups
      advancedMounts:
        arrs:
          prowlarr:
            - path: /config/Backups
              subPath: prowlarr
          radarr:
            - path: /config/Backups
              subPath: radarr
          sonarr:
            - path: /config/Backups
              subPath: sonarr
    sonarr-cache:
      accessMode: ReadWriteOnce
      type: persistentVolumeClaim
      size: 5Gi
      storageClass: longhorn
      labels:
        recurring-job.longhorn.io/source: "enabled"
        recurring-job-group.longhorn.io/ephemeral: "enabled"
      advancedMounts:
        arrs:
          sonarr:
            - path: /config/MediaCover
    qbittorrent-data:
      accessMode: ReadWriteOnce
      type: persistentVolumeClaim
      # As of 2025-07-22 this was using 151MB
      size: 1Gi
      storageClass: longhorn
      labels:
        recurring-job.longhorn.io/source: "enabled"
        recurring-job-group.longhorn.io/backup: "enabled"
      advancedMounts:
        downloader:
          password-updater:
            - path: /config
          qbittorrent:
            - path: /config
    qbittorrent-password-hash:
      type: secret
      name: jellyfin-qbittorrent-password-hash
      defaultMode: 0400
      advancedMounts:
        downloader:
          password-updater:
            - path: /tmp/qbittorrent-password
              readOnly: true
    qbittorrent-update-script:
      type: configMap
      name: jellyfin-qbittorrent-update-password
      defaultMode: 0555
      advancedMounts:
        downloader:
          password-updater:
            - path: /scripts
              readOnly: true
    unpackerr-configs:
      type: configMap
      name: unpackerr-configs
      advancedMounts:
        unpackerr:
          unpackerr:
            - path: /config/unpackerr.conf
              readOnly: true
              subPath: unpackerr.conf
  secrets:
    # This autogenerated secret is used wherever environment variables and configuration files allow, but still need to manually be setup with the following:
    # - prowlarr: add apps for sonarr and radarr
    api-keys:
      forceRename: api-keys
      annotations:
        secret-generator.v1.mittwald.de/autogenerate: SONARR_API_KEY,RADARR_API_KEY,PROWLARR_API_KEY
        secret-generator.v1.mittwald.de/encoding: hex
        # Arr apps use 32 hex characters for their own autogenerated API keys.
        # If you use a different length, Radarr errors out (and possibly others do too)
        secret-generator.v1.mittwald.de/length: "32"
        # The seerr chart's request-withdrawal cleanup reads Radarr.
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: seerr
      stringData: {}
    qbittorrent-admin:
      annotations:
        secret-generator.v1.mittwald.de/autogenerate: password
        secret-generator.v1.mittwald.de/length: "24"
      stringData:
        username: admin
