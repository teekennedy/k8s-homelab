apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-sandbox-controller
  namespace: agent-sandbox-system
spec:
  podSelector:
    matchLabels:
      app: agent-sandbox-controller
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Scraping only, from monitoring-system.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring-system
      ports:
        - port: metrics
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # The kube API server, by the node VLAN and its real port: egress is
    # matched after the Service DNAT, so a rule on the `kubernetes` ClusterIP
    # (10.43.0.1:443) never matches and every new connection is refused.
    - to:
        - ipBlock:
            cidr: 10.69.80.0/25
      ports:
        - port: 6443
          protocol: TCP
