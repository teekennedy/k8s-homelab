# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agent-sandbox-controller
  namespace: agent-sandbox-system
  labels:
    # kube-prometheus-stack in monitoring-system discovers by this label; see
    # k8s/platform/monitoring-system.
    release: monitoring-system
spec:
  selector:
    matchLabels:
      app: agent-sandbox-controller
  namespaceSelector:
    matchNames:
      - agent-sandbox-system
  endpoints:
    - port: metrics
      interval: 30s
