apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-sandbox-controller
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        # Distroless nonroot base image's uid, pinned so a base-image change
        # surfaces as CreateContainerConfigError rather than a silent root container.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-sandbox-controller
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Upstream's manifest ships no probes; these are the controller-runtime
          # defaults its manager already registers on the :8081 health port.
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
