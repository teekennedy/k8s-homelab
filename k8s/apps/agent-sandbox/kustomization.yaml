apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Pinned release: renovate.json's kustomize customManager tracks this URL
# (kustomize's built-in manager has no github-releases datasource).
resources:
  - https://github.com/kubernetes-sigs/agent-sandbox/releases/download/v1.0.2/sandbox.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml

patches:
  # ArgoCD creates the namespace (CreateNamespace=true in application.yaml),
  # like every other app in this repo.
  - patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: agent-sandbox-system
      $patch: delete
  - path: patches/deployment.yaml
    target:
      kind: Deployment
      name: agent-sandbox-controller
