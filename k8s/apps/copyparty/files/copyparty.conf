# copyparty configuration — rendered by templates/configmap.yaml.
#
# The container image ships its own /z/initcfg which sets `chdir: /w` and
# `no-crt`, and ends with `% /cfg` — so this file is picked up automatically by
# being mounted into /cfg. Inline comments need TWO spaces before the '#'.
#
# Every option here is deliberate; see README.md for the reasoning.

[global]
  # --- identity -------------------------------------------------------------
  # There is no [accounts] section: copyparty has no local passwords at all.
  # Identity is asserted by the oauth2-proxy forwardAuth middleware in front of
  # us, which strips any client-supplied copies of these headers and replaces
  # them with values from the Authelia session.
  idp-h-usr: X-Auth-Request-Preferred-Username
  # Fallback: oauth2-proxy always sets X-Auth-Request-User, but only sets
  # Preferred-Username when the IdP released a preferred_username claim.
  idp-h-usr: X-Auth-Request-User
  idp-h-grp: X-Auth-Request-Groups
  # Remember users AND groups across restarts. Without this, a user's shares and
  # IdP-derived state are unavailable until they make their first request after
  # a restart (upstream docs/idp.md).
  idp-store: 3
  idp-db: /state/idp.db
  # Only IdP auth is possible; drop the --ipu (auth-by-IP) leg of the default
  # precedence list so there is exactly one way in.
  auth-ord: idp
  # Login/logout buttons drive the oauth2-proxy flow instead of copyparty's own
  # password form (which has no accounts behind it).
  # Fixed target, NOT {dst}: the login link renders on the public root ([/]
  # below), which stays unauthenticated even after login (Traefik never runs
  # forwardAuth there). {dst} would bounce the browser right back to that same
  # headerless page — still anonymous, login link still showing, a silent
  # loop. /f/ is the gated volume, so landing there after login actually
  # reflects the new session.
  idp-login: /oauth2/start?rd=/f/
  idp-login-t: Sign in with SSO
  idp-logout: /oauth2/sign_out

  # --- reverse-proxy trust --------------------------------------------------
  # CRITICAL: --xff-src gates BOTH the real-ip header and the IdP headers above.
  # If this doesn't cover Traefik's pod IP, copyparty silently ignores the
  # identity headers and treats every request as anonymous.
  xff-src: {{ .Values.podCidr }}
  xff-hdr: x-forwarded-for
  # Traefik appends the client IP to any inbound XFF, so the trustworthy entry
  # is the rightmost one it added: -1 = closest proxy.
  rproxy: -1
  # Absolute URLs (share links, opengraph, upload links) use the public origin.
  site: https://{{ .Values.host }}/

  # --- disabled protocols ---------------------------------------------------
  # Web UI only. WebDAV is the only one of these that is on by default; FTP,
  # SFTP, TFTP, SMB, WOPI, RSS, OPDS and zeroconf (mDNS/SSDP) are all opt-in and
  # are simply never enabled — copyparty has no negative flag for them.
  no-dav
  # Ask crawlers not to index a personal file server.
  no-robots
  # We terminate TLS at Traefik; serve plaintext and never mint a self-signed
  # cert (the config dir is on a PVC, but there's no reason to have one).
  http-only
  no-crt

  # --- logging (stdout -> Loki) ---------------------------------------------
  # No ANSI colour: escape sequences would end up as literal garbage in Loki.
  no-ansi
  # Default log lines carry only HH:MM:SS. Prefixing the ISO date makes each
  # line self-describing once it is out of the pod's context.
  log-date: %Y-%m-%d
  # Default --log-tdec (millisecond precision) is kept; it's useful for ordering
  # and cheap. NOTE: --no-ansi only removes colour — the indexer and
  # thumbnail-cleaner still emit bare cursor-control codes on a few startup
  # lines, which look garbled in Loki. Cosmetic, and there is no flag for it.

  # --- version checking ------------------------------------------------------
  # Deliberately NOT setting vc-url: the advisory checker is default-disabled and
  # stays that way, because renovate is what upgrades this deployment.

  # --- indexing + deduplication ---------------------------------------------
  # e2dsa: index every volume on startup (including read-only ones). Required
  # for search, upload-undo, expired-share cleanup, folder thumbnails, and safe
  # deduplication.
  e2dsa
  # e2ts: read media tags from new/unindexed files, which powers the media
  # player, the search-by-tag UI and opengraph titles.
  e2ts
  # Symlink-based dedup (copyparty's default), paired with e2dsa above, which is
  # the combination upstream recommends. Both volumes sit on the same NFS
  # filesystem so --hardlink would also work, but hardlinks look like ordinary
  # files to everything else: editing one silently rewrites every duplicate,
  # which is a nasty surprise on a personal drive. --reflink is not an option at
  # all; NFS is not copy-on-write.
  dedup
  # Deliberately NOT setting --xlink (cross-volume dedup); upstream flags it as
  # probably buggy.
  #
  # Also deliberately NOT setting --re-maxage (periodic rescan): copyparty
  # force-disables --fika whenever symlink dedup is on, so uploads and deletes
  # are blocked for the duration of every scan. copyparty is the only writer
  # here (syncthing writes to a different NAS dir), so the startup scan plus
  # index-on-upload is enough. If files ever do arrive out-of-band, an admin can
  # trigger a one-off rescan from the control panel's [reload] button.
  # Never follow a symlink out of the volume, and never cross a filesystem
  # boundary. Costs some directory-listing performance; worth it on a public
  # instance. Dedup symlinks stay inside the volume, so they are unaffected.
  xvol
  xdev

  # --- state / cache location -----------------------------------------------
  # Thumbnails + up2k.db for every volume on the Longhorn PVC rather than in a
  # .hist folder inside each volume: SQLite must not live on NFS, and thumbnail
  # reads want SSD. XDG_CONFIG_HOME is pointed at /state too (see deployment).
  hist: /state/hist

  # --- sharing --------------------------------------------------------------
  # Creates the virtual /share folder that share-links are served from. Traefik
  # lets that prefix through without an SSO session; the share's own
  # password/expiry is the access control, and copyparty still enforces volume
  # ACLs underneath.
  shr: /share
  shr-db: /state/shares.db
  # Only signed-in users can mint a share (the default, made explicit).
  shr-who: auth

  # --- browser UX -----------------------------------------------------------
  # Grid/thumbnail view by default — this is a photo-and-document drive.
  grid
  # Desktop-style selection: ctrl-click to pick, shift-click for ranges.
  gsel
  # Sort "file 2" before "file 10".
  nsort
  name: {{ .Values.host }}
  bname: files
  # Show the running version on the control panel to admins only.
  ver-who: a
  # Reject uploads that would leave less than 512 GiB free on the NAS.
  df: 512

  # --- opengraph ------------------------------------------------------------
  # Rich embeds when a share link is pasted into chat. Scoped to bot user-agents
  # via og-ua so that real browsers keep working hotlinks (enabling --og
  # unconditionally disables hotlinking, as the opengraph spec demands).
  og
  og-ua: (Discord|Slack|Twitter|Telegram|Mastodon|WhatsApp|Signal|facebookexternalhit|Bluesky)

# There is no public volume. copyparty's own JS treats the site ROOT as an API
# surface regardless of which volume the user is actually browsing (?ls, ?setck
# and friends all target `/`), so Traefik lets every request through to `/`
# unauthenticated by default (see ingress.yaml) rather than gating it — gating
# root meant every one of those calls 302'd into Authelia, which the browser
# then refused to follow cross-origin (CORS), leaving the UI spinning forever.
# For nearly all of those calls forwardAuth never runs, so copyparty never sees
# identity headers and this volume is unreachable — anonymous and logged-in
# alike just get a same-origin "access denied" instead of a blocked redirect.
# The one exception is `/?h` (control-panel link, see
# ingressroute-controlpanel.yaml), which IS gated — it's a plain page
# navigation, not a background XHR, so a 302 into Authelia works fine there.
# That's what the accs below are for; they're otherwise inert. The one real
# volume for actual files is `[/f]` below. Backed by /void, a dedicated
# emptyDir untouched by anything else in the pod (not /w — that would make
# `-e2dsa` index the real data twice under two volume prefixes; and not /tmp —
# copyparty's own scratch writes there aren't guaranteed to stay out of the way
# of the boot scan).
[/]
  /void
  accs:
    # No `*` — stays invisible on every ungated path. rwmd./A only matter on
    # the one gated path (/?h), where they light up the control panel.
    rwmd.: @{{ .Values.groups.users }}
    A: @{{ .Values.groups.admins }}, @{{ .Values.groups.superAdmins }}
  flags:
    ui_norepl  # No π repl
    ui_nosrvi  # No server info (name, disk usage)
    ui_notree  # No tree sidebar (can still be opened by clicking on tree in breadcrumbs)

# Short name: this is the one volume anyone ever actually uses, so it should be
# quick to type/bookmark. Anonymous access is share-links only (--shr above);
# there is no read-only public window onto this data.
[/f]
  /w
  accs:
    # No entry for `*` — anonymous users cannot see that this volume exists.
    rwmd.: @{{ .Values.groups.users }}
    A: @{{ .Values.groups.admins }}, @{{ .Values.groups.superAdmins }}
  flags:
    ui_norepl  # No π repl
    ui_nosrvi  # No server info (name, disk usage)
    ui_notree  # No tree sidebar (can still be opened by clicking on tree in breadcrumbs)
