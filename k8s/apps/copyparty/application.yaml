apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: copyparty
  namespace: argocd
spec:
  destination:
    name: in-cluster
    namespace: copyparty
  project: default
  ignoreDifferences:
    # cookie-secret / client-secret are filled in-cluster by mittwald
    # secret-generator; don't fight it.
    - jsonPointers:
        - /data
      kind: Secret
      name: copyparty-oauth2-proxy-secrets
      namespace: copyparty
  source:
    path: k8s/apps/copyparty
    repoURL: https://github.com/teekennedy/k8s-homelab
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
    retry:
      backoff:
        duration: 1m
        factor: 2
        maxDuration: 16m
      limit: 10
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
