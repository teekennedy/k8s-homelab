---
# copyparty trusts the identity headers Traefik injects (see middleware.yaml), so
# nothing else in the cluster may be able to talk to :3923 directly — otherwise a
# compromised pod could assert any username it liked and walk straight past SSO.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "copyparty.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "copyparty.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "copyparty.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.traefikNamespace }}
      ports:
        - port: 3923
          protocol: TCP
