---
# Secret consumed by the oauth2-proxy subchart via config.existingSecret.
# - client-id is a stable identifier matching the Authelia OIDC client_id.
# - client-secret is autogenerated by mittwald. Authelia stores a bcrypt hash of
#   this value in its configmap (k8s/platform/auth-system/values.yaml) — see the
#   BOOTSTRAP note there for regenerating it after the first sync.
# - cookie-secret encrypts the session cookie (32 bytes -> AES-256).
apiVersion: v1
kind: Secret
metadata:
  name: copyparty-oauth2-proxy-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "copyparty.labels" . | nindent 4 }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: cookie-secret,client-secret
    secret-generator.v1.mittwald.de/length: "32"
type: Opaque
stringData:
  client-id: copyparty
