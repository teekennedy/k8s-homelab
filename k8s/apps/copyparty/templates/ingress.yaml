{{- $fullName := include "copyparty.fullname" . -}}
{{- $ns := .Release.Namespace -}}
---
# Default route: EVERY path on files.msng.to requires an Authelia session
# before Traefik will forward it, except the exceptions carved out below. The
# middleware order matters — `signin` (errors) must wrap `forwardauth` so it
# can turn its 401 into a redirect to the login flow.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  namespace: {{ $ns }}
  labels:
    {{- include "copyparty.labels" . | nindent 4 }}
  annotations:
    # Public entrypoint; also the annotation external-dns filters on to put this
    # record in the public zone.
    traefik.ingress.kubernetes.io/router.entrypoints: {{ .Values.entrypoint }}
    traefik.ingress.kubernetes.io/router.middlewares: >-
      {{ $ns }}-{{ $fullName }}-signin@kubernetescrd,{{ $ns }}-{{ $fullName }}-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  name: http
  tls:
    # No secretName: Traefik serves the *.msng.to wildcard as its default cert.
    - hosts:
        - {{ .Values.host }}
---
# /oauth2 goes to the proxy itself (sign_in / start / callback / sign_out), not
# to copyparty. It doesn't need the forwardAuth/signin middlewares above — it
# IS the auth flow.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-oauth2
  namespace: {{ $ns }}
  labels:
    {{- include "copyparty.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: {{ .Values.entrypoint }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: copyparty-auth
                port:
                  number: 80
  tls:
    - hosts:
        - {{ .Values.host }}
---
# Unauthenticated routes (.Values.unauthenticatedPaths). Traefik ranks routers
# by rule specificity, so these longer PathPrefix rules win over the catch-all
# `/` router above without needing an explicit priority. copyparty applies its
# own ACLs regardless — an anonymous request only ever resolves through
# `/share`, whose links carry their own password/expiry.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-public
  namespace: {{ $ns }}
  labels:
    {{- include "copyparty.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: {{ .Values.entrypoint }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          {{- range .Values.unauthenticatedPaths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  name: http
          {{- end }}
  tls:
    - hosts:
        - {{ .Values.host }}
