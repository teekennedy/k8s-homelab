{{- $fullName := include "copyparty.fullname" . -}}
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/traefik.io/ingressroute_v1alpha1.json
#
# `GET /?setck=js=y`, unauthenticated.
#
# copyparty serves share pages with the file table rendered server-side and
# `ls0 = null`, then the browser hydrates: util.js `setck()` XHRs the site ROOT
# at /?setck=js=y (telling the server this client has JS, so later page loads
# embed the listing), and only in that request's callback does it fetch
# `<share>/?ls` and render the grid, thumbnails, sorting and search.
#
# The root is behind forwardAuth, so for an anonymous share visitor that XHR got
# a 302 to Authelia, which the browser then refused to follow cross-origin. The
# callback never ran, hydration never happened, and the CORS failure surfaced as
# an uncaught page error — harmless in Firefox (the server-rendered table stays)
# but in Safari it lands mid-render and leaves the listing blank until a
# same-page navigation re-renders it.
#
# An Ingress cannot match on query strings, hence the IngressRoute. It is pinned
# to the exact `setck=js=y` value: the handler (httpcli.py `setck`) accepts any
# `k=v` up to 9 chars and sets it as a cookie, and there is no reason to hand
# anonymous callers a cookie-writing primitive on this origin. Every other
# preference cookie is written by logged-in users, who clear forwardAuth anyway.
#
# The response is `o7\n` plus a Set-Cookie; the handler runs before any volume
# is touched, so this exposes no listing and no file.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $fullName }}-setck
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "copyparty.labels" . | nindent 4 }}
  annotations:
    # Not functional for an IngressRoute (entryPoints live in the spec) — this is
    # the annotation the external-dns instances filter on to decide which zone
    # this name belongs in. Same value as the Ingresses, same record.
    traefik.ingress.kubernetes.io/router.entrypoints: {{ .Values.entrypoint }}
spec:
  entryPoints:
    - {{ .Values.entrypoint }}
  routes:
    - kind: Rule
      match: Host(`{{ .Values.host }}`) && Path(`/`) && Query(`setck`, `js=y`)
      # Explicit priority to take precedence over / rule.
      priority: 1000
      services:
        - name: {{ $fullName }}
          port: {{ .Values.service.port }}
  tls: {}
