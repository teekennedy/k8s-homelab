{{- $fullName := include "copyparty.fullname" . -}}
---
# forwardAuth against this chart's dedicated oauth2-proxy. Only the auth
# subrequest goes to the proxy — request bodies go straight to copyparty, which
# is what makes multi-GB uploads viable.
#
# Traefik DELETES each header named in authResponseHeaders from the incoming
# request before copying the auth response's values in, so a client cannot
# smuggle its own X-Auth-Request-* headers past this middleware. That, plus
# copyparty's xff-src (pod CIDR only) and the NetworkPolicy restricting :3923 to
# Traefik, is what stands in for copyparty's --idp-h-key shared secret — a
# secret would have to be committed in cleartext to both this Middleware and the
# ConfigMap, which buys nothing over the three controls above.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullName }}-forwardauth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "copyparty.labels" . | nindent 4 }}
spec:
  forwardAuth:
    address: http://copyparty-auth.{{ .Release.Namespace }}.svc.cluster.local/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      # copyparty's --idp-h-usr reads these two (first one wins).
      - X-Auth-Request-Preferred-Username
      - X-Auth-Request-User
      # --idp-h-grp; maps onto the @copyparty-* volume ACLs.
      - X-Auth-Request-Groups
      - X-Auth-Request-Email
---
# Catches the 401 from the forwardAuth middleware and redirects the browser into
# the Authelia login flow instead of showing a bare error. Must be listed BEFORE
# the forwardAuth middleware on the Ingress so it wraps (and therefore sees the
# response of) that middleware.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullName }}-signin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "copyparty.labels" . | nindent 4 }}
spec:
  errors:
    status:
      - "401"
    service:
      name: copyparty-auth
      port: 80
    query: "/oauth2/sign_in?rd={url}"
