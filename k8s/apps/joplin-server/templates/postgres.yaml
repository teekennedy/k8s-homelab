# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/postgresql.cnpg.io/cluster_v1.json
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.psql.clusterName }}
  namespace: {{ .Release.Namespace }}
spec:
  # Single instance: this is a 2-person personal app, not shared infra like
  # forgejo's 3-instance HA cluster. A node failure means a few minutes of
  # sync downtime, not data loss — barman-cloud below still gives WAL-archived
  # point-in-time recovery.
  instances: 1
  imageName: {{ .Values.psql.image }}
  primaryUpdateStrategy: unsupervised
  storage:
    size: 5Gi
    storageClass: longhorn-strict-local
  enableSuperuserAccess: true
  monitoring:
    enablePodMonitor: true
  affinity:
    nodeSelector:
      node.msng.to/cnpg-storage: "true"
  resources:
    requests:
      memory: "256Mi"
    limits:
      memory: "1Gi"
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ .Values.psql.clusterName }}
  bootstrap:
    initdb:
      database: joplin
      owner: joplin
