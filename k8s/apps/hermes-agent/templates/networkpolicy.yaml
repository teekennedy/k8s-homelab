{{- $fullName := include "hermes-agent.fullname" . -}}
---
# The gateway holds the model key and the Signal account. In: the dashboard,
# through Traefik. Out: the internet (model API, Signal, the web tools), the
# sandbox, and the OIDC issuer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermes-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hermes-agent.gatewaySelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.traefikNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: dashboard
          protocol: TCP
  egress:
    {{- include "hermes-agent.egressDNS" . | nindent 4 }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "hermes-agent.sandboxSelectorLabels" . | nindent 14 }}
      ports:
        - port: ssh
          protocol: TCP
    # The OIDC issuer, on the public gateway VIP: Traefik's public HTTPS
    # entrypoint once the VIP is DNAT'd, the VIP itself otherwise.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.traefikNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: wspublic
          protocol: TCP
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.lanCidr }}
      ports:
        - port: 443
          protocol: TCP
    {{- include "hermes-agent.egressInternet" . | nindent 4 }}
---
# The sandbox runs whatever the model writes. In: SSH from the gateway. Out:
# the internet, and nothing on the LAN or in the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-sandbox
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermes-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hermes-agent.sandboxSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "hermes-agent.gatewaySelectorLabels" . | nindent 14 }}
      ports:
        - port: ssh
          protocol: TCP
  egress:
    {{- include "hermes-agent.egressDNS" . | nindent 4 }}
    {{- include "hermes-agent.egressInternet" . | nindent 4 }}
