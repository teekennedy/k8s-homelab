{{- $fullName := include "hermes-agent.fullname" . -}}
---
# The Hermes gateway: the agent loop, Signal, cron and the dashboard, in one
# process tree. One replica: the data volume has a single writer.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermes-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  serviceName: {{ $fullName }}
  selector:
    matchLabels:
      {{- include "hermes-agent.gatewaySelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # The managed config is mounted by subPath, which never updates in place.
        checksum/config: {{ include "hermes-agent.managedConfig" . | sha256sum }}
      labels:
        {{- include "hermes-agent.gatewaySelectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        # Both volumes belong to the hermes user, which signal-cli runs as too.
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        # The sandbox's agent group: files it makes group-readable only.
        supplementalGroups:
          - 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The sandbox's SSH identity, copied in because ssh refuses a private
        # key it owns but others can read, and pinned in known_hosts so the
        # sandbox's host key is never trusted on first use.
        - name: ssh-setup
          image: {{ include "hermes-agent.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -ec
            - |
              umask 077
              mkdir -p /opt/data/.ssh
              cp /ssh/client/ssh-privatekey /opt/data/.ssh/id_rsa.new
              mv /opt/data/.ssh/id_rsa.new /opt/data/.ssh/id_rsa
              printf '[%s]:%s %s\n' "$SANDBOX_HOST" "$SANDBOX_PORT" \
                "$(cat /ssh/host/ssh-publickey)" > /opt/data/.ssh/known_hosts
          env:
            - name: SANDBOX_HOST
              value: {{ include "hermes-agent.sandboxHost" . | quote }}
            - name: SANDBOX_PORT
              value: {{ .Values.sandbox.port | quote }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: ssh-client
              mountPath: /ssh/client
              readOnly: true
            - name: ssh-host
              mountPath: /ssh/host
              readOnly: true
      containers:
        - name: hermes
          image: {{ include "hermes-agent.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - gateway
            - run
          env:
            # Outside the data volume and root-owned, so the agent cannot
            # unpin what git pins.
            - name: HERMES_MANAGED_DIR
              value: /etc/hermes-managed
            # The image confines file-tool writes to /opt/data, judged by path
            # alone even when the SSH backend performs them in the sandbox.
            # /home/agent is the sandbox's home, mounted read-only here.
            - name: HERMES_WRITE_SAFE_ROOT
              value: /opt/data:/home/agent
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_PORT
              value: {{ .Values.service.port | quote }}
            - name: HERMES_DASHBOARD_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}-oidc
                  key: client-secret
            # /health for the probes and, over localhost, the iOS connector's
            # jobs. Nothing outside the pod is admitted to the port.
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}-api-server
                  key: API_SERVER_KEY
            {{- if .Values.signal.enabled }}
            - name: SIGNAL_HTTP_URL
              value: {{ printf "http://127.0.0.1:%v" .Values.signal.port | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.envSecretName }}
                optional: true
          ports:
            - name: dashboard
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: api
              containerPort: 8642
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 5
            failureThreshold: {{ div .Values.gateway.startupSeconds 5 }}
          livenessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 10
            timeoutSeconds: 5
          # The image's init (s6-overlay) starts as root, takes ownership of
          # the data volume and drops every service to the hermes user
          # (10000). These are the capabilities that takes.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - KILL
                - SETGID
                - SETUID
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: managed-config
              mountPath: /etc/hermes-managed/config.yaml
              subPath: config.yaml
              readOnly: true
            # Browser tools want more than the runtime's 64Mi.
            - name: shm
              mountPath: /dev/shm
            # The sandbox's home at the sandbox's path: the gateway delivers
            # MEDIA:/home/agent/... attachments and forwards images from its
            # own filesystem.
            - name: sandbox-home
              mountPath: /home/agent
              readOnly: true
            {{- if .Values.connector.enabled }}
            # hermes-mobile-mcp, the phone's sensor tools, which Hermes runs.
            - name: hermes-mobile
              mountPath: /opt/hermes-mobile
              subPath: opt/hermes-mobile
              readOnly: true
            {{- end }}
        {{- if .Values.connector.enabled }}
        # The Hermes iOS connector: holds a WebSocket to the relay and runs the
        # phone's messages as jobs on the API server above. On the Hermes image,
        # because it shells out to the hermes CLI, with the connector itself
        # mounted from the relay image.
        - name: hermes-mobile
          image: {{ include "hermes-agent.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -ec
            - |
              # Upstream's skill teaches Hermes when to use the phone's tools.
              mkdir -p "$HERMES_HOME/skills"
              rm -rf "$HERMES_HOME/skills/hermes-ios"
              cp -R /opt/hermes-mobile/skills/hermes-ios "$HERMES_HOME/skills/"
              # Registers with the relay once; the credential it gets back is
              # kept in the connector's state. Retries rather than exiting,
              # so a relay outage never takes the pod out of its Service.
              until [ -f "$HERMES_MOBILE_CONNECTOR_HOME/state.json" ] ||
                hermes-mobile setup --skip-mcp; do
                sleep 30
              done
              exec hermes-mobile run
          env:
            - name: PATH
              value: /opt/hermes-mobile/connector/bin:/opt/hermes/bin:/opt/hermes/.venv/bin:/usr/local/bin:/usr/bin:/bin
            - name: HOME
              value: /tmp
            - name: HERMES_HOME
              value: /opt/data
            - name: HERMES_MOBILE_CONNECTOR_HOME
              value: {{ include "hermes-agent.connectorHome" . }}
            - name: HERMES_MOBILE_RELAY_URL
              value: {{ printf "https://%s/v1" .Values.relay.host | quote }}
            - name: CONNECTOR_SETUP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "hermes-agent.relayName" . }}
                  key: CONNECTOR_SETUP_SECRET
            - name: HERMES_API_SERVER_URL
              value: http://127.0.0.1:8642
            - name: HERMES_API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}-api-server
                  key: API_SERVER_KEY
          # Ready once registered with the relay, not while connected to it:
          # this container's readiness is the pod's, and the dashboard must
          # not go with the relay.
          readinessProbe:
            exec:
              command:
                - test
                - -f
                - {{ printf "%s/state.json" (include "hermes-agent.connectorHome" .) }}
            periodSeconds: 10
          # The connector records last_error when the relay refuses or drops
          # it and clears it on the next accepted connection. Ten minutes of
          # failing to connect restarts it.
          livenessProbe:
            exec:
              command:
                - /opt/hermes-mobile/connector/bin/python
                - -c
                - |
                  import json, pathlib, sys
                  p = pathlib.Path("{{ include "hermes-agent.connectorHome" . }}/state.json")
                  sys.exit(1 if p.exists() and json.loads(p.read_text()).get("last_error") else 0)
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.connector.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: hermes-mobile
              mountPath: /opt/hermes-mobile
              subPath: opt/hermes-mobile
              readOnly: true
            - name: connector-tmp
              mountPath: /tmp
        {{- end }}
        {{- if .Values.signal.enabled }}
        - name: signal-cli
          image: {{ printf "%s:%s" .Values.signal.image.repository .Values.signal.image.tag | quote }}
          imagePullPolicy: {{ .Values.signal.image.pullPolicy }}
          # No account named: the daemon serves whichever accounts are on the
          # volume, and Hermes names its own in each call. Bound to every
          # address only so the kubelet can probe it; it has no authentication,
          # and the NetworkPolicy admits no one to the port.
          args:
            - --config
            - /var/lib/signal-cli
            - daemon
            - --http
            - {{ printf "0.0.0.0:%v" .Values.signal.port | quote }}
          env:
            - name: HOME
              value: /var/lib/signal-cli
          ports:
            - name: signal
              containerPort: {{ .Values.signal.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/v1/check
              port: signal
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/v1/check
              port: signal
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/check
              port: signal
            periodSeconds: 10
            timeoutSeconds: 5
          # As the hermes user rather than the image's: Hermes hands it
          # attachments by path, and the data volume is 0700 to that user.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.signal.resources | nindent 12 }}
          volumeMounts:
            - name: signal
              mountPath: /var/lib/signal-cli
            - name: data
              mountPath: /opt/data
              readOnly: true
            # signal-cli unpacks its native libraries here and loads them.
            - name: signal-tmp
              mountPath: /tmp
        {{- end }}
      volumes:
        # Read-only also keeps the kubelet from applying fsGroup to it.
        - name: sandbox-home
          persistentVolumeClaim:
            claimName: {{ include "hermes-agent.sandboxHomeClaim" . }}
            readOnly: true
        - name: managed-config
          configMap:
            name: {{ $fullName }}-managed
            defaultMode: 0444
        - name: ssh-client
          secret:
            secretName: {{ $fullName }}-ssh-client
            defaultMode: 0440
            items:
              - key: ssh-privatekey
                path: ssh-privatekey
        - name: ssh-host
          secret:
            secretName: {{ $fullName }}-ssh-host
            defaultMode: 0440
            items:
              - key: ssh-publickey
                path: ssh-publickey
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        {{- if .Values.connector.enabled }}
        # The relay image's /opt/hermes-mobile: the connector, its MCP server
        # and their Python.
        - name: hermes-mobile
          image:
            reference: {{ .Values.relay.image | quote }}
            pullPolicy: {{ .Values.relay.pullPolicy }}
        - name: connector-tmp
          emptyDir:
            sizeLimit: 256Mi
        {{- end }}
        {{- if .Values.signal.enabled }}
        - name: signal-tmp
          emptyDir: {}
        {{- end }}
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- with omit .Values.gateway.affinity "podAffinity" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        # On the sandbox's node: its home volume is ReadWriteOnce, so both
        # pods mount it only from one node.
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "hermes-agent.sandboxSelectorLabels" . | nindent 18 }}
      {{- with .Values.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          recurring-job.longhorn.io/source: "enabled"
          recurring-job-group.longhorn.io/backup: "enabled"
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.persistence.data.storageClass }}
        resources:
          requests:
            storage: {{ .Values.persistence.data.size }}
    {{- if .Values.signal.enabled }}
    - metadata:
        name: signal
        labels:
          recurring-job.longhorn.io/source: "enabled"
          recurring-job-group.longhorn.io/backup: "enabled"
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.persistence.signal.storageClass }}
        resources:
          requests:
            storage: {{ .Values.persistence.signal.size }}
    {{- end }}
