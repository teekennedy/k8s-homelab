{{- $fullName := include "hermes-agent.fullname" . -}}
---
# The dashboard's OIDC client secret. Generated in-cluster and reflected into
# auth-system, where it is registered as `oidcClientSecrets.clients.{{ .Values.oidc.clientId }}`.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-oidc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermes-agent.labels" . | nindent 4 }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: client-secret
    secret-generator.v1.mittwald.de/length: "32"
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: auth-system
type: Opaque
---
# Hermes refuses to start its API server without a key, and would otherwise
# write one of its own to the data volume.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-api-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermes-agent.labels" . | nindent 4 }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: API_SERVER_KEY
    secret-generator.v1.mittwald.de/length: "48"
type: Opaque
---
# The gateway's identity towards the sandbox: the gateway mounts the private
# half, the sandbox the public half as its authorized key.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-ssh-client
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermes-agent.labels" . | nindent 4 }}
  annotations:
    secret-generator.v1.mittwald.de/type: ssh-keypair
type: Opaque
---
# The sandbox's host key: the sandbox mounts the private half, the gateway
# pins the public half.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-ssh-host
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermes-agent.labels" . | nindent 4 }}
  annotations:
    secret-generator.v1.mittwald.de/type: ssh-keypair
type: Opaque
{{- if .Values.relay.enabled }}
---
# The iOS relay's own keys. INTERNAL_API_KEY guards its /internal and push-send
# endpoints; CONNECTOR_SETUP_SECRET is what `hermes-mobile setup` must present
# to register a connector. Hex, so it pastes into a shell unquoted.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hermes-agent.relayName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermes-agent.labels" . | nindent 4 }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: INTERNAL_API_KEY,CONNECTOR_SETUP_SECRET
    secret-generator.v1.mittwald.de/encoding: hex
    secret-generator.v1.mittwald.de/length: "64"
type: Opaque
{{- end }}
