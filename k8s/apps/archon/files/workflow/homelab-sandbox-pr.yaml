name: homelab-sandbox-pr
description: |
  Make a change to ops/k8s-homelab with Claude Code running in a single-use
  Kubernetes agent-sandbox, open a pull request on git.msng.to, and keep fixing
  the branch until the Woodpecker PR check goes green.

  Use when: you want a change made to the homelab repo — a chart, a NixOS
  module, CI, OpenTofu — and you want it to arrive as a PR whose checks already
  pass. Describe the change in the trigger message; that message is the agent's
  whole brief.

  NOT for: answering questions about the repo (nothing is pushed, so there is
  nothing to open), changes to a repo other than ops/k8s-homelab, or anything
  that needs to write to the live cluster — the sandbox's cluster access is
  read-only by design.

# Every node is a bash node driving kubectl and the Forgejo/Woodpecker APIs, or
# a durable wait; the model runs inside the sandbox, not here.
#
# Script paths are absolute rather than "$WORKFLOW_DIR/...": Archon rewrites
# `$NAME` tokens in a node body before the shell sees them, so the one path
# that matters is kept out of that pass. The scripts still read $WORKFLOW_DIR
# from the environment to find each other.
mutates_checkout: false
interactive: false
returns: summary

nodes:
  # -------------------------------------------------------------------------
  - id: implement
    # Fresh sandbox off $BASE_BRANCH. Prints the pushed commit SHA.
    bash: /opt/archon-workflow/scripts/run-agent.sh implement
    # Sandbox budget (SANDBOX_TIMEOUT_SECONDS, 1h) plus the driver's own slack
    # for image pull, PVC provisioning and log collection.
    timeout: 4500000

  # -------------------------------------------------------------------------
  - id: open-pr
    bash: /opt/archon-workflow/scripts/open-pr.sh
    depends_on: [implement]
    timeout: 120000

  # -------------------------------------------------------------------------
  # Green-until loop. Each iteration reports on the pipeline the previous
  # iteration waited for, fixes it if it was red, then arms and waits for the
  # pipeline covering whatever is now at the head of the branch.
  #
  # The wait is durable, not a poll: Archon persists an absolute deadline and
  # releases the worker until a signal resumes the run. What sends that signal
  # is the ci-signal relay sidecar; see README.md, "The CI loop".
  #
  # `await-ci` is last on purpose: a loop_group supports a wait only as the sole
  # terminal sink of its body. That is why the fix happens at the TOP of the
  # next iteration rather than after the wait in the same one.
  - id: ci-loop
    depends_on: [open-pr]
    loop_group:
      nodes:
        - id: ci-verdict
          bash: /opt/archon-workflow/scripts/ci-verdict.sh
          # Prints none | success | failure. On failure it also writes the tail
          # of the failing Woodpecker step logs to $ARTIFACTS_DIR/ci-failure.log.
          timeout: 600000
        - id: fix
          bash: /opt/archon-workflow/scripts/run-agent.sh fix
          depends_on: [ci-verdict]
          # Skipped on the first iteration, where there is no verdict yet.
          when: "$ci-verdict.output == 'failure'"
          timeout: 4500000
        - id: arm-ci
          bash: /opt/archon-workflow/scripts/arm-ci.sh
          depends_on: [fix]
          # `fix` is skipped on the first iteration and whenever CI was green,
          # so this cannot join on its success.
          trigger_rule: all_done
          timeout: 300000
        - id: await-ci
          depends_on: [arm-ci]
          wait:
            event: ci.complete
            # 45 minutes. Must stay under ciSignal.deadlineSeconds (1h), so
            # a notification that beats this node still has something to retry
            # against. Expiring is not the end of the run: ci-verdict.sh fails
            # it on the next iteration and says the signal never arrived.
            deadline_ms: 2700000
      until_bash: /opt/archon-workflow/scripts/ci-green.sh
      # Up to 6 pipelines waited on, so up to 5 fix attempts (the first
      # iteration has nothing to fix). Exhausting the bound fails the run rather
      # than reporting a still-red PR as done.
      max_iterations: 6

  # -------------------------------------------------------------------------
  # Terminal output: one JSON object naming the PR, the branch, the commit CI
  # actually went green on, and how many sandbox attempts it took.
  - id: summary
    bash: /opt/archon-workflow/scripts/summary.sh
    depends_on: [ci-loop]
    timeout: 60000
