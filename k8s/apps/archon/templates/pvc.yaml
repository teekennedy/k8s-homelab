---
# /.archon — workspaces, worktrees and per-run artifacts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "archon.fullname" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "archon.labels" . | nindent 4 }}
    {{- with .Values.persistence.data.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.data.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size }}
---
# /home/appuser — rebuildable, so not in the backup group.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "archon.fullname" . }}-home
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "archon.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.home.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.home.size }}
