---
# Created empty: the forgejo-resources Job (k8s/platform/forgejo) fills this
# and registers the matching webhook, so exactly one component owns the value.
# See README.md, "The Forgejo webhook".
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "archon.fullname" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "archon.labels" . | nindent 4 }}
type: Opaque
data: {}
