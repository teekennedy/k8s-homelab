# Daily base backup of archon-psql to s3proxy → /storage/nas/backups/postgres/archon-psql/
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/scheduledbackup_v1.json
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ .Values.psql.clusterName }}
  namespace: {{ .Release.Namespace }}
spec:
  configuration:
    endpointURL: http://s3proxy.s3-proxy.svc.cluster.local
    destinationPath: s3://postgres/
    s3Credentials:
      accessKeyId:
        name: cnpg-s3-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-s3-credentials
        key: SECRET_ACCESS_KEY
    data:
      compression: bzip2
  retentionPolicy: "14d"
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ .Values.psql.clusterName }}-daily
  namespace: {{ .Release.Namespace }}
spec:
  # Staggered from auth-system (2:58), joplin (3:15) and forgejo (8:40) so the
  # backups don't pile onto s3proxy at once.
  schedule: "40 25 3 * * *"
  backupOwnerReference: self
  cluster:
    name: {{ .Values.psql.clusterName }}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io

# Credentials for CNPG to authenticate to s3proxy.
---
apiVersion: v1
kind: Secret
metadata:
  name: cnpg-s3-credentials
  namespace: {{ .Release.Namespace }}
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: "s3-proxy/s3proxy-credentials"
data: {}
