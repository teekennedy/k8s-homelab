# Default values for openhands. See README.md for the architecture this chart
# implements.

replicaCount: 1

image:
  repository: ghcr.io/openhands/agent-canvas
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

nameOverride: ""
fullnameOverride: ""

service:
  # The image's unified entry point: the static frontend plus a path-routing
  # proxy in front of the agent server and the automation backend. Nothing else
  # in the pod is meant to be reached from outside it.
  port: 8000

# --- Application config -----------------------------------------------------
app:
  # Anonymous PostHog telemetry. Off: session titles and run outcomes for a
  # private infrastructure repo are not ours to ship offsite.
  #
  # Takes two variables, because the frontend's PostHog key is baked into the
  # published bundle at build time and cannot be unset from here:
  #   VITE_DO_NOT_TRACK          read by the entrypoint, which turns off the
  #                              agent server's exporter and the automation
  #                              backend. Not read by the browser at runtime.
  #   AGENT_CANVAS_DISABLE_TELEMETRY
  #                              read by the static server, which injects
  #                              window.__AGENT_CANVAS_DO_NOT_TRACK__ into the
  #                              page. The frontend then never initializes
  #                              PostHog at all.
  #
  # The second is the one that matters for the browser: without it the consent
  # modal appears, the anonymous install event is sent *before* anyone answers
  # it, and a "no" is only ever recorded in that one browser's localStorage.
  telemetryDisabled: true
  # Used to build callback URLs and injected into automation runs, so it has to
  # be the externally reachable URL rather than the Service name. Also the
  # cloud API the frontend is locked to: the same origin, so it authenticates
  # by the oauth2-proxy cookie.
  baseURL: https://openhands.msng.to

automation:
  # The automation service in the canvas pod. Reached by the app server only.
  port: 18001

# --- Forge (Forgejo) --------------------------------------------------------
forge:
  url: https://git.msng.to
  owner: ops
  repo: k8s-homelab
  # Committer identity on everything the agent pushes.
  authorName: OpenHands
  authorEmail: openhands@msng.to
  # Provisioned by the forgejo-resources Job in k8s/platform/forgejo (see the
  # `openhands` entry under forgejo-resources.users there). Keys: username,
  # password, token.
  secretName: openhands-forgejo-user
  # The forge as an event source for automations (README.md, "Event
  # triggers"). `source` is what an automation's trigger names; empty turns it
  # off. The Secret is filled by the forgejo-resources Job, which registers
  # the webhook that signs with it; key: webhook-secret.
  webhook:
    source: forgejo
    secretName: openhands-forge-webhook
  # Where the credential helper in templates/configmap-gitconfig.yaml is
  # mounted. GIT_CONFIG_GLOBAL points every git invocation in the pod at it.
  gitConfigPath: /etc/openhands/gitconfig

# --- CI (Woodpecker) --------------------------------------------------------
ci:
  url: https://ci.msng.to
  # Personal access token for a Woodpecker account that can read this repo's
  # pipeline logs and restart a pipeline. Provisioned by the
  # woodpecker-resources Job in k8s/platform/woodpecker (see the `openhands`
  # entry under woodpecker-resources.users there); key: token.
  secretName: openhands-woodpecker

# --- Model credentials ------------------------------------------------------
# Read by the ACP agent the agent server spawns. Created by hand; see README.md,
# "Prerequisites". Optional so the pod still starts before it exists — the
# failure is then a session that cannot authenticate, which is visible in the
# UI, rather than a pod that never schedules.
anthropic:
  secretName: openhands-anthropic

# --- Remote Control ---------------------------------------------------------
# A separate, long-lived pod running `claude remote-control` in server mode, so
# a session can be driven from claude.ai/code or the Claude mobile app. It
# shares only the namespace and the model credential with the canvas.
#
# It has to be its own pod rather than a feature of the canvas: Remote Control
# refuses to start when any of DO_NOT_TRACK, DISABLE_TELEMETRY,
# CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC or DISABLE_GROWTHBOOK is set, and
# the canvas sets the first of those deliberately (see app.telemetryDisabled).
# There is no way to have both in one process.
remoteControl:
  # Off by default: Remote Control requires an eligible claude.ai subscription
  # login, and whether a `claude setup-token` OAuth token counts as one is the
  # open question this gate exists for. Turn on once verified — the pod exits
  # with "You must be logged in to use Remote Control" if it is not.
  enabled: false
  # Shown in claude.ai/code and the mobile app's session list.
  sessionName: homelab
  # The CLI is installed by an initContainer rather than baked into an image of
  # our own. Pinned and in values.yaml so renovate can see it; the canvas image
  # bundles a copy of the binary, but at a path inside the ACP adapter's
  # node_modules that no version constraint here would govern.
  # renovate: datasource=npm depName=@anthropic-ai/claude-code
  cliVersion: "2.1.273"
  # renovate: datasource=docker depName=node
  nodeImage: node:24-slim
  # HOME for the session, on the volume below: the checkout, the trust record
  # and the CLI's own state all live here, so a restart resumes rather than
  # starts over.
  home: /work
  storage:
    size: 10Gi
    storageClass: longhorn
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi

podSecurityContext:
  runAsNonRoot: true
  # The image's `openhands` user; fsGroup is what gets the mounted volumes
  # owned by it, since running non-root skips the image's own chown.
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  # False, and not fixable by mounting more volumes: running shell commands
  # anywhere on the filesystem is what the agent is for.
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "4"
    memory: 8Gi

persistence:
  # ~/.openhands — the automation service's SQLite database and uploaded run
  # tarballs. Enrolled in the Longhorn recurring backup group.
  data:
    mountPath: /home/openhands/.openhands
    size: 20Gi
    storageClass: longhorn
    labels:
      recurring-job.longhorn.io/source: "enabled"
      recurring-job-group.longhorn.io/backup: "enabled"

serviceAccount:
  create: true
  # No cluster access: nothing in this chart reads or writes the Kubernetes API.
  automount: false
  annotations: {}
  name: ""

traefikNamespace: kube-system
monitoringNamespace: monitoring-system

networkPolicy:
  # MetalLB VIP pool (.100-.119) that git.msng.to resolves into; /27 at .96 is
  # the smallest CIDR-aligned block covering the full pool.
  lanCidr: "10.69.80.96/27"
  # The node VLAN. The apiserver is host-networked on every node, so the app
  # server reaches it by ipBlock on :6443 — a podSelector cannot match it.
  nodeCidr: "10.69.80.0/25"

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

# --- Metrics ----------------------------------------------------------------
# Served by the app server on a port of its own: token and cost figures per
# conversation and per model, and sandbox counts. See README.md, "Metrics".
metrics:
  enabled: true
  port: 9102
  serviceMonitor:
    enabled: true
    interval: 60s
    # kube-prometheus-stack in monitoring-system discovers by this label.
    labels:
      release: monitoring-system

# --- App server -------------------------------------------------------------
# Serves the cloud API the frontend speaks in locked-cloud mode, and runs one
# Sandbox per conversation from the specs below. See README.md, "App server".
appServer:
  # The python-flavoured tag ships an interpreter, so a pod start only fetches
  # the locked dependencies in files/app-server/uv.lock.
  # renovate: datasource=docker depName=ghcr.io/astral-sh/uv
  image: ghcr.io/astral-sh/uv:python3.13-alpine
  port: 8080
  # Sandbox webhooks only. A port of its own so the NetworkPolicy can admit
  # sandbox pods to it and to nothing else on this server.
  webhookPort: 8081
  # Set by oauth2-proxy (pass_user_headers) on every request it forwards.
  userHeader: X-Forwarded-User
  # How often the reconciler compares rows to Sandboxes in the cluster.
  reconcileIntervalSeconds: 60
  # How long a new conversation may wait for its sandbox to report RUNNING.
  startTimeoutSeconds: 300
  # What is declared here rather than owned by the Settings UI, per ACP server
  # (the agent profile form's "agent" choice).
  acpServers:
    claude-code:
      # What a conversation launches, whatever command a profile carries.
      # Resolved on the sandbox's PATH, which sandboxSpecs.claudeAdapterVersion
      # heads. The agent profile form shows the frontend's own command for
      # the preset instead, an npx run of that same version; any other text
      # there would make the form call the profile "Custom".
      command: [claude-agent-acp]
      # The model new conversations start on: one of the model picker's ids
      # (default, opus[1m], sonnet, haiku) or a full model id. Written to the
      # stored settings and every profile of this server whenever this value
      # changes; until it changes again, the model picker's choice stands.
      model: sonnet
  # First-boot settings and agent profile, so a browser on a new device needs
  # no setup. Written to the database once; the Settings UI owns them after
  # that. Shapes: GET /api/v1/settings and POST /api/agent-profiles/{name}.
  defaults:
    agent_settings:
      agent_kind: acp
      acp_server: claude-code
    conversation_settings:
      max_iterations: 500
      confirmation_mode: false
    app_preferences:
      language: en
      user_consents_to_analytics: false
    agent_profile:
      name: default
      agent_kind: acp
      acp_server: claude-code
  # What the app server enforces on sandboxes, once a reconcile interval. 0
  # switches a limit off. See README.md, "Limits".
  limits:
    # Sandboxes running at once; suspended ones do not count. A conversation
    # started past it fails with the reason, and an automation run is skipped.
    maxRunningSandboxes: 8
    # A conversation's sandbox with no activity and no working agent is
    # suspended: the pod goes, the volume stays, opening it again resumes it.
    idleSuspendMinutes: 60
    # A sandbox left suspended this long is deleted WITH ITS VOLUME — any
    # work in it that was never pushed goes too. The transcript stays.
    deleteSuspendedAfterDays: 7
    # An automation run's sandbox that never got a conversation: the run
    # failed while the sandbox was starting, and nothing else will delete it.
    automationOrphanMinutes: 10
    # An automation run's sandbox, whatever it is doing. Longer than any
    # run's timeout (30 minutes at most).
    automationMaxMinutes: 120
    # Events kept per conversation; the oldest are dropped first.
    maxEventsPerConversation: 20000
  # SQLite database: sandboxes, minted API keys, settings and the conversation
  # history. The only copy, so it is backed up.
  storage:
    size: 5Gi
    storageClass: longhorn
    labels:
      recurring-job.longhorn.io/source: "enabled"
      recurring-job-group.longhorn.io/backup: "enabled"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

# --- Sandbox specs ----------------------------------------------------------
# Pod templates the app server instantiates, one Sandbox
# (agents.x-k8s.io/v1beta1) per sandbox. Each spec gets its own ServiceAccount
# and NetworkPolicy; the sandbox's own session key, encryption key and webhook
# config are minted per sandbox into a Secret the Sandbox owns.
#
# A conversation runs on the spec its agent profile is named after: a profile
# called `isolated`, or `isolated-<anything>`, gets the `isolated` spec. The
# app server keeps a profile of that name in the picker for every spec but the
# default. See README.md, "Sandbox specs".
sandboxSpecs:
  # Every other agent profile, every automation run, and a request that names
  # no spec.
  default: repo
  # Track the tag the canvas image is built from.
  # renovate: datasource=docker depName=ghcr.io/openhands/agent-server
  image: ghcr.io/openhands/agent-server:1.53.0-python
  # The Claude Code ACP adapter, installed over the image's own at sandbox
  # start. It carries the Claude Code CLI, which decides what the model
  # picker's aliases ("Claude Opus (1M)", "Claude Sonnet") resolve to and
  # refuses a model newer than itself — so bumping this is how a new model
  # arrives. A failed install falls back to the image's adapter. Empty: use
  # the image's.
  # renovate: datasource=npm depName=@agentclientprotocol/claude-agent-acp
  claudeAdapterVersion: "0.87.0"
  specs:
    # Work on ops/k8s-homelab: reaches the model and the forge, nothing else.
    repo:
      egress: lan
      forgeCredentials: true
      storage:
        size: 20Gi
        storageClass: longhorn
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "2"
          memory: 4Gi
    # Anything whose input is not trusted. Reaches the model and nothing on the
    # LAN — no forge token, no git credentials, no route to any homelab service.
    isolated:
      egress: internet
      forgeCredentials: false
      storage:
        size: 10Gi
        storageClass: longhorn
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "2"
          memory: 4Gi

# --- Automations ------------------------------------------------------------
# Scheduled and event-driven runs, each in a sandbox of its own that is deleted
# when the run ends. Keyed by name; the app server keeps the automation service
# in step with this map, so removing an entry deletes the automation. See
# README.md, "Automations".
#
#   nightly-triage:
#     # A cron trigger, or an event trigger on a registered webhook source:
#     #   {type: event, source: forgejo, on: created}
#     trigger: {type: cron, schedule: "0 6 * * *", timezone: America/Denver}
#     # The first message of the run's conversation.
#     prompt: |
#       List the open issues on ops/k8s-homelab and label the unlabelled ones.
#     # Seconds a run may take; the automation service's default is 10 minutes.
#     timeout: 1800
#     # false switches it off. An automation the service disabled after
#     # repeated failures is re-enabled from the UI, not from here.
#     enabled: true
automations:
  # Exists to be dispatched by hand when checking that runs still work; the
  # schedule is once a year so that it costs nothing left alone.
  # A comment that mentions the agent, on an issue or a pull request, from the
  # one account allowed to spend model budget this way.
  forge-mention:
    trigger:
      type: event
      source: forgejo
      "on": created
      filter: "(icontains(comment.body, '@openhands') || icontains(review.content, '@openhands')) && sender.login == 'tkennedy'"
    prompt: |
      Someone mentioned you in a comment on the forge. The event payload below
      has the comment, and the issue or pull request it was made on.

      Read the whole thread through the Forgejo API before acting, then do what
      the comment asks. If it asks for a code change, make it on a branch and
      open or update a pull request, following the forgejo-iterate skill.
      Finish by replying on the same thread with what you did, or with what
      stopped you. Do not mention yourself in the reply.
    timeout: 1800
  smoke:
    trigger: {type: cron, schedule: "0 0 1 1 *"}
    prompt: |
      Create /workspace/project/smoke.txt containing the output of `date -u`,
      then reply DONE.

# --- SSO front door ---------------------------------------------------------
# A dedicated oauth2-proxy instance in reverse-proxy mode: it owns
# openhands.msng.to and forwards authenticated traffic on. The application
# authenticates its own API with a session key that it generates and injects
# into the page it serves, which gates nothing a browser cannot replay — this
# proxy is the access control. See README.md, "Security posture".
oauth2ProxyInstance:
  # Must equal the Authelia client_id and the auth-system
  # oidcClientSecrets.clients key.
  clientId: openhands
  # Must equal oauth2-proxy.config.existingSecret, and the auth-system
  # oidcClientSecrets.clients value must point at <namespace>/<this name>.
  secretName: openhands-oauth2-proxy-secrets
  labelsTemplate: openhands.labels

oauth2-proxy:
  fullnameOverride: openhands-auth
  config:
    existingSecret: openhands-oauth2-proxy-secrets
    configFile: |-
      provider = "oidc"
      oidc_issuer_url = "https://authelia.msng.to"
      redirect_url = "https://openhands.msng.to/oauth2/callback"
      cookie_domains = ["openhands.msng.to"]
      cookie_name = "_oauth2_proxy_openhands"
      cookie_expire = "168h"
      cookie_refresh = "1h"
      cookie_secure = true
      cookie_httponly = true
      cookie_samesite = "lax"
      whitelist_domains = ["openhands.msng.to"]
      email_domains = ["*"]
      reverse_proxy = true
      code_challenge_method = "S256"
      # offline_access is what gets a refresh token: without one the session
      # ends with the ID token, an hour in, whatever cookie_expire says.
      scope = "openid profile email groups offline_access"
      real_client_ip_header = "X-Real-Ip"
      skip_provider_button = true
      allowed_groups = ["openhands-admins", "full-admin"]
      # The one hole in the SSO gate: a forge webhook carries no Authelia
      # session. Scoped to POST on the event-ingestion path, where an HMAC over
      # the raw body is the authentication — the automation service rejects an
      # unsigned delivery, and answers 404 for a source nobody has registered.
      # See README.md, "Automations".
      skip_auth_routes = ["POST=^/api/automation/v1/events/"]
      upstreams = ["http://openhands.openhands.svc.cluster.local:8000/"]
      trusted_proxy_ips = ["10.42.0.0/16"]

  replicaCount: 2

  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  service:
    portNumber: 80

  ingress:
    enabled: false
  # group, kind and weight are what the API server defaults them to. Spelled
  # out, rules included, because server-side apply otherwise reports the
  # defaulted fields as drift.
  gatewayApi:
    enabled: true
    gatewayRef:
      group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: kube-system
      sectionName: websecure
    hostnames:
      - openhands.msng.to
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - group: ""
            kind: Service
            # oauth2-proxy.fullnameOverride and service.portNumber.
            name: openhands-auth
            port: 80
            weight: 1
