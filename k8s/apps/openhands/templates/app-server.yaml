{{- $fullName := include "openhands.fullname" . -}}
{{- $name := printf "%s-app-server" $fullName -}}
{{- $cfg := .Values.appServer -}}
---
# Source for files/app-server. ConfigMap keys cannot contain "/", so the package
# is stored flat as "app_server.<file>" and the directory is restored by the
# volume's `items` (see the appServerSourceItems helper).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-source
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
data:
  pyproject.toml: |-
    {{- .Files.Get "files/app-server/pyproject.toml" | nindent 4 }}
  uv.lock: |-
    {{- .Files.Get "files/app-server/uv.lock" | nindent 4 }}
  {{- range $path, $_ := .Files.Glob "files/app-server/app_server/*.py" }}
  {{ printf "app_server.%s" (base $path) }}: |-
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
---
# First-boot settings and agent profile (appServer.defaults). Read only while
# the database has none of its own.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-defaults
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
data:
  defaults.json: {{ $cfg.defaults | toJson | quote }}
---
# Automation definitions (values.yaml, automations), which the app server
# pushes to the automation service and reads each run's prompt from.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-automations
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
data:
  automations.json: {{ .Values.automations | toJson | quote }}
---
# The secret the forge signs its webhook deliveries with. Created empty: the
# forgejo-resources Job (k8s/platform/forgejo) fills it and registers the
# matching webhook, so exactly one component owns the value.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.forge.webhook.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
type: Opaque
data: {}
---
# X-Service-API-Key: what the automation service presents to mint the bearer
# key it uses for everything else. Autogenerated in-cluster, never committed.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-keys
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: service-api-key
    secret-generator.v1.mittwald.de/length: "48"
type: Opaque
---
# Encrypts the conversation secrets store at rest. Its own Secret, not a field
# added to the one above, so it exists before the first pod that reads it.
# Losing it makes every stored conversation secret undecryptable.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-secrets-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: key
    secret-generator.v1.mittwald.de/length: "48"
type: Opaque
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
    app.kubernetes.io/component: app-server
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Single writer: one SQLite database on a ReadWriteOnce volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "openhands.appServerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openhands.labels" . | nindent 8 }}
        app.kubernetes.io/component: app-server
      annotations:
        # uv reads the source once at startup; a ConfigMap change alone never
        # restarts the pod.
        checksum/source: {{ printf "%s%s%s" (.Files.Get "files/app-server/pyproject.toml") (.Files.Get "files/app-server/uv.lock") (.Files.Glob "files/app-server/app_server/*.py").AsConfig | sha256sum }}
        checksum/specs: {{ include (print $.Template.BasePath "/sandbox-specs.yaml") . | sha256sum }}
        checksum/defaults: {{ $cfg.defaults | toJson | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      # The one workload in this chart that talks to the Kubernetes API; see
      # templates/app-server-rbac.yaml for exactly what it may do.
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The Settings UI renders itself from the agent server's settings
        # schemas, which depend only on its version. Ask the very image the
        # sandboxes run, once per pod start, so they always agree. Best
        # effort: without them only the Settings page is degraded.
        - name: dump-schemas
          image: {{ .Values.sandboxSpecs.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -u
              cd /tmp
              openhands-agent-server --port 18999 >/tmp/agent-server.log 2>&1 &
              pid=$!
              for name in agent-schema conversation-schema; do
                for _ in $(seq 1 90); do
                  curl -sf -H "X-Session-API-Key: $OH_SESSION_API_KEYS_0" \
                    -o "/schemas/$name.json" \
                    "http://127.0.0.1:18999/api/settings/$name" && break
                  sleep 1
                done
                [ -s "/schemas/$name.json" ] || echo "could not fetch $name" >&2
              done
              kill "$pid" 2>/dev/null
              exit 0
          env:
            - name: HOME
              value: /tmp
            - name: OH_SESSION_API_KEYS_0
              value: schema-dump
            - name: OH_ENABLE_VSCODE
              value: "false"
            - name: DO_NOT_TRACK
              value: "1"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: schemas
              mountPath: /schemas
            - name: dump-tmp
              mountPath: /tmp
      containers:
        - name: app-server
          image: {{ $cfg.image }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |-
              set -eu
              # uv builds the environment beside the project, and /app is a
              # read-only ConfigMap mount, so run from a writable copy.
              cp -rL /app/. /project/
              mkdir -p /project/tmp
              cd /project
              exec uv run --frozen --no-dev --no-cache --link-mode copy \
                python -m app_server.main
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DATA_DIR
              value: /data
            - name: SPECS_DIR
              value: /etc/openhands-app-server/specs
            - name: DEFAULT_SANDBOX_SPEC
              value: {{ .Values.sandboxSpecs.default | quote }}
            - name: PUBLIC_URL
              value: {{ .Values.app.baseURL | quote }}
            - name: INTERNAL_URL
              value: {{ include "openhands.appServerURL" . | quote }}
            - name: WEBHOOK_URL
              value: {{ include "openhands.appServerWebhookURL" . | quote }}
            - name: SCHEMAS_DIR
              value: /etc/openhands-app-server/schemas
            - name: SETTINGS_SEED_FILE
              value: /etc/openhands-app-server/defaults/defaults.json
            - name: START_TIMEOUT_SECONDS
              value: {{ $cfg.startTimeoutSeconds | quote }}
            - name: AUTOMATION_URL
              value: {{ printf "http://%s.%s.svc.cluster.local:%v" (include "openhands.fullname" .) .Release.Namespace .Values.automation.port | quote }}
            - name: AUTOMATIONS_FILE
              value: /etc/openhands-app-server/automations/automations.json
            - name: FORGE_WEBHOOK_SOURCE
              value: {{ .Values.forge.webhook.source | quote }}
            - name: FORGE_WEBHOOK_FILE
              value: /etc/openhands-app-server/forge-webhook/webhook-secret
            - name: SECRETS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}-secrets-key
                  key: key
            - name: AUTOMATION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "openhands.fullname" . }}-canvas-keys
                  key: session-api-key
            - name: SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}-keys
                  key: service-api-key
            - name: USER_HEADER
              value: {{ $cfg.userHeader | quote }}
            - name: HTTP_PORT
              value: {{ $cfg.port | quote }}
            - name: WEBHOOK_PORT
              value: {{ $cfg.webhookPort | quote }}
            - name: AGENT_SERVER_PORT
              value: {{ .Values.service.port | quote }}
            - name: RECONCILE_INTERVAL_SECONDS
              value: {{ $cfg.reconcileIntervalSeconds | quote }}
            # uv keeps its state under HOME and unpacks wheels through a temp
            # directory; the root filesystem is read-only, so both point at the
            # emptyDir.
            - name: HOME
              value: /project
            - name: TMPDIR
              value: /project/tmp
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: http
              containerPort: {{ $cfg.port }}
              protocol: TCP
            - name: webhook
              containerPort: {{ $cfg.webhookPort }}
              protocol: TCP
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # The first thing the container does is install its dependencies
          # from PyPI, so hold liveness off until it is serving.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          volumeMounts:
            - name: source
              mountPath: /app
              readOnly: true
            - name: project
              mountPath: /project
            - name: specs
              mountPath: /etc/openhands-app-server/specs
              readOnly: true
            - name: data
              mountPath: /data
            - name: schemas
              mountPath: /etc/openhands-app-server/schemas
              readOnly: true
            - name: defaults
              mountPath: /etc/openhands-app-server/defaults
              readOnly: true
            # A directory mount, so the key appears when the forge fills it.
            - name: forge-webhook
              mountPath: /etc/openhands-app-server/forge-webhook
              readOnly: true
            # Re-read on every sync, so an edit lands without a restart.
            - name: automations
              mountPath: /etc/openhands-app-server/automations
              readOnly: true
      volumes:
        - name: source
          configMap:
            name: {{ $name }}-source
            items:
              {{- include "openhands.appServerSourceItems" . | nindent 14 }}
        # Writable working copy of /app: the virtualenv and uv's own state.
        - name: project
          emptyDir: {}
        - name: specs
          configMap:
            name: {{ $fullName }}-sandbox-specs
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}
        - name: schemas
          emptyDir: {}
        - name: dump-tmp
          emptyDir: {}
        - name: defaults
          configMap:
            name: {{ $name }}-defaults
        - name: automations
          configMap:
            name: {{ $name }}-automations
        - name: forge-webhook
          secret:
            secretName: {{ .Values.forge.webhook.secretName }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
    app.kubernetes.io/component: app-server
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $cfg.port }}
      targetPort: http
      protocol: TCP
    - name: webhook
      port: {{ $cfg.webhookPort }}
      targetPort: webhook
      protocol: TCP
  selector:
    {{- include "openhands.appServerSelectorLabels" . | nindent 4 }}
