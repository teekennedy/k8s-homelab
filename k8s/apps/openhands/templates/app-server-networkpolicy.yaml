---
# The app server holds the sandbox lifecycle and the only route into any
# sandbox, so its ingress is exactly its callers: the canvas pod (the
# browser's API calls and the automation service, on the API port), sandbox
# pods (their webhooks, on a port of their own), the metrics scraper (on a
# third) and Alertmanager (on a fourth). A sandbox therefore cannot reach the
# API, and so cannot create sandboxes, nor the alerts port, and so cannot
# start a run.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openhands.fullname" . }}-app-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "openhands.appServerSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "openhands.canvasSelectorLabels" . | nindent 14 }}
      ports:
        - port: http
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              {{- include "openhands.runtimeSelectorLabels" . | nindent 14 }}
      ports:
        - port: webhook
          protocol: TCP
    {{- if .Values.alerts.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.monitoringNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - port: alerts
          protocol: TCP
    {{- end }}
    {{- if .Values.metrics.enabled }}
    # The metrics port, and only it, for the scraper.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.monitoringNamespace }}
      ports:
        - port: metrics
          protocol: TCP
    {{- end }}
  egress:
    {{- include "openhands.egressDNS" . | nindent 4 }}
    # The apiserver: host-networked, so an ipBlock on the nodes.
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.nodeCidr }}
      ports:
        - port: 6443
          protocol: TCP
    # The canvas pod's automation service, for the browser's automation calls.
    - to:
        - podSelector:
            matchLabels:
              {{- include "openhands.canvasSelectorLabels" . | nindent 14 }}
      ports:
        - port: automation
          protocol: TCP
    # Sandbox agent servers, through the runtime proxy.
    - to:
        - podSelector:
            matchLabels:
              {{- include "openhands.runtimeSelectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
    # The forge's API, for the repository picker.
    {{- include "openhands.egressForge" . | nindent 4 }}
    # PyPI, for the dependencies installed at startup, and Discord, for
    # automations that report there.
    {{- include "openhands.egressInternet" . | nindent 4 }}
