{{- $root := . -}}
{{- $fullName := include "openhands.fullname" . -}}
{{- range $spec, $cfg := .Values.sandboxSpecs.specs }}
---
# What a spec is for. Ingress is the app server's runtime proxy only; egress is
# the spec's declared class, plus the webhook port that carries its events
# back.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-runtime-%s" $fullName $spec }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "openhands.labels" $root | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "openhands.runtimeSelectorLabels" $root | nindent 6 }}
      openhands.msng.to/sandbox-spec: {{ $spec }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "openhands.appServerSelectorLabels" $root | nindent 14 }}
      ports:
        - port: http
          protocol: TCP
  egress:
    {{- include "openhands.egressDNS" $root | nindent 4 }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "openhands.appServerSelectorLabels" $root | nindent 14 }}
      ports:
        - port: webhook
          protocol: TCP
    {{- if eq $cfg.egress "lan" }}
    {{- include "openhands.egressForge" $root | nindent 4 }}
    {{- end }}
    {{- if $cfg.daggerEngine }}
    # Dagger's kube-pod:// transport is `kubectl exec` through the apiserver,
    # which is host-networked, so only an ipBlock on the nodes can match it.
    - to:
        - ipBlock:
            cidr: {{ $root.Values.networkPolicy.nodeCidr }}
      ports:
        - port: 6443
          protocol: TCP
    {{- end }}
    {{- if ne $cfg.egress "none" }}
    {{- include "openhands.egressInternet" $root | nindent 4 }}
    {{- end }}
{{- end }}
