{{- $name := printf "%s-app-server" (include "openhands.fullname" .) -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
# Namespace-scoped, and only what the sandbox lifecycle needs. No pods/exec,
# nothing cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
rules:
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["list", "create", "patch", "delete"]
  # Status only: an agent server that exited is a Failed pod, which the
  # Sandbox's own conditions do not say.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  # Create only. Each sandbox gets a Secret holding its minted keys, owned by
  # the Sandbox so the garbage collector deletes it. Without get, list or
  # update, this grant cannot read any Secret in the namespace — including the
  # model and forge credentials sandboxes are given by reference.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
