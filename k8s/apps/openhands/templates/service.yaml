apiVersion: v1
kind: Service
metadata:
  name: {{ include "openhands.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
    app.kubernetes.io/component: canvas
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.automation.port }}
      targetPort: automation
      protocol: TCP
      name: automation
  selector:
    {{- include "openhands.canvasSelectorLabels" . | nindent 4 }}
