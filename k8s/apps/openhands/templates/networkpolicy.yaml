---
# The application has no authentication of its own worth the name — the session
# key it mints is injected into the page it serves — so the only thing between
# a pod in this cluster and a shell on the agent's filesystem is this policy
# plus oauth2-proxy. See README.md, "Security posture".
#
# Egress is deliberately narrow and deliberately not "all ports": verified on
# this cluster's netpol controller (k3s/kube-router) that a portless egress
# rule is enforced as allow-nothing, not allow-all, once the same policy has
# other rules that do name ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openhands.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "openhands.canvasSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The entry point, from oauth2-proxy. The agent server in this pod is not
    # exposed at all.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oauth2-proxy
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: http
          protocol: TCP
    # The automation service, for the app server alone: it forwards the
    # browser's automation calls with this service's key.
    - from:
        - podSelector:
            matchLabels:
              {{- include "openhands.appServerSelectorLabels" . | nindent 14 }}
      ports:
        - port: automation
          protocol: TCP
    {{- if .Values.metrics.enabled }}
    # The metrics sidecar's port, and only it: the scraper cannot reach the
    # entry point and oauth2-proxy cannot reach the exporter.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.monitoringNamespace }}
      ports:
        - port: metrics
          protocol: TCP
    {{- end }}
  egress:
    {{- include "openhands.egressDNS" . | nindent 4 }}
    # The app server: every /api and /runtime call the frontend makes.
    - to:
        - podSelector:
            matchLabels:
              {{- include "openhands.appServerSelectorLabels" . | nindent 14 }}
      ports:
        - port: http
          protocol: TCP
    {{- include "openhands.egressForge" . | nindent 4 }}
    # The model API, and the package registries the ACP agent's own toolchain
    # pulls from.
    {{- include "openhands.egressInternet" . | nindent 4 }}
---
# oauth2-proxy itself: reachable only from the gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openhands.fullname" . }}-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.traefikNamespace }}
