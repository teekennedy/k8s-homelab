apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "openhands.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
spec:
  # Headless Service for stable pod DNS. Nothing addresses the pod by its
  # ordinal name, but a StatefulSet requires the field.
  serviceName: {{ include "openhands.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  # Single writer: both volumes are ReadWriteOnce, and the agent server's
  # session state assumes one process owns them. A StatefulSet rollout
  # terminates the old pod before creating its replacement, which is what makes
  # that safe; the claims are separate objects rather than volumeClaimTemplates
  # so they can carry backup labels and be resized without the immutability
  # rules on a StatefulSet's claim templates.
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "openhands.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openhands.labels" . | nindent 8 }}
        app.kubernetes.io/component: canvas
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # GIT_CONFIG_GLOBAL is read once per git process, but the mounted file
        # is what supplies the credential helper — roll the pod when it changes
        # so a session started before the edit isn't left with the old one.
        checksum/gitconfig: {{ include (print $.Template.BasePath "/configmap-gitconfig.yaml") . | sha256sum }}
        # Skills are copied into the agent's home at pod start, so a change to
        # files/skills/ only takes effect on a fresh pod.
        checksum/skills: {{ include (print $.Template.BasePath "/configmap-skills.yaml") . | sha256sum }}
        checksum/start: {{ printf "%s%s" (.Files.Get "files/canvas/start.sh") (.Files.Get "files/canvas/patch_frontend.py") | sha256sum }}
        {{- if .Values.metrics.enabled }}
        checksum/metrics: {{ include (print $.Template.BasePath "/configmap-metrics.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "openhands.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        # See the seedSkillsScript helper for why two directories, and why a
        # copy rather than a mount. Both directories are emptyDir, so the copy
        # re-runs as a full refresh on every start.
        - name: seed-skills
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              {{- include "openhands.seedSkillsScript" . | nindent 14 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: agents-home
              mountPath: /home/openhands/.agents
            - name: claude-home
              mountPath: /home/openhands/.claude
            - name: skills
              mountPath: /opt/openhands-skills
              readOnly: true
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # files/canvas/start.sh, not the image's entrypoint: that one cannot
          # lock the frontend to the app server's cloud API.
          command:
            - /usr/bin/tini
            - --
            - bash
            - /etc/openhands-canvas/start.sh
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            # Reached by the app server only, which forwards the browser's
            # automation calls with this service's key.
            - name: automation
              containerPort: {{ .Values.automation.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: APP_SERVER_URL
              value: {{ include "openhands.appServerURL" . | quote }}
            # Same origin as the page, which is what makes the frontend
            # authenticate by cookie — the oauth2-proxy session — rather than
            # ask for an API key.
            - name: LOCK_TO_CLOUD
              value: {{ .Values.app.baseURL | quote }}
            {{- with .Values.sandboxSpecs.claudeAdapterVersion }}
            # Written into the frontend's built-in Claude Code command, so the
            # agent profile form shows the version sandboxes run.
            - name: CLAUDE_ADAPTER_VERSION
              value: {{ . | quote }}
            {{- end }}
            - name: LOCAL_BACKEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "openhands.fullname" . }}-canvas-keys
                  key: session-api-key
            # What the automation service mints its per-run API keys with.
            - name: APP_SERVER_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "openhands.fullname" . }}-app-server-keys
                  key: service-api-key
            # Goes into automation callback URLs and is injected into runs, so
            # it has to be the URL a browser uses, not the Service name.
            - name: AUTOMATION_BASE_URL
              value: {{ .Values.app.baseURL | quote }}
            {{- if .Values.app.telemetryDisabled }}
            # Two variables, covering the server side and the browser
            # separately — see values.yaml, app.telemetryDisabled.
            - name: VITE_DO_NOT_TRACK
              value: "1"
            - name: AGENT_CANVAS_DISABLE_TELEMETRY
              value: "1"
            {{- end }}
            # --- Forge ------------------------------------------------------
            # Read by the credential helper in the mounted gitconfig, and by
            # anything else in a session that needs to call the Forgejo API.
            {{- include "openhands.forgeEnv" . | nindent 12 }}
          envFrom:
            # CLAUDE_CODE_OAUTH_TOKEN and/or ANTHROPIC_API_KEY; see README.md,
            # "Prerequisites".
            - secretRef:
                name: {{ .Values.anthropic.secretName }}
                optional: true
          # The static frontend: what a browser loads first, and what the pod
          # lives and dies with (see start.sh).
          startupProbe:
            httpGet:
              path: /canvas/
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /canvas/
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /canvas/
              port: http
            periodSeconds: 30
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.data.mountPath }}
            - name: workspace
              mountPath: {{ .Values.persistence.workspace.mountPath }}
            # The agent's own config directories: skills seeded above, plus
            # whatever state it writes beside them. Deliberately not persisted —
            # the skills come from git on every start and the rest is
            # rebuildable.
            - name: agents-home
              mountPath: /home/openhands/.agents
            - name: claude-home
              mountPath: /home/openhands/.claude
            - name: gitconfig
              mountPath: {{ .Values.forge.gitConfigPath }}
              subPath: gitconfig
              readOnly: true
            - name: start
              mountPath: /etc/openhands-canvas
              readOnly: true
        {{- if .Values.metrics.enabled }}
        # Reads the conversation list over loopback and renders it as Prometheus
        # text. In this pod, not its own Deployment, because the session key it
        # authenticates with lives on the data volume.
        - name: metrics
          image: {{ .Values.metrics.image }}
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /app/server.py
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: LOG_LEVEL
              value: info
            - name: METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            - name: AGENT_SERVER_URL
              value: "http://127.0.0.1:18000"
            - name: SESSION_API_KEY_FILE
              value: {{ printf "%s/agent-canvas/api-key.txt" .Values.persistence.data.mountPath | quote }}
            - name: MIN_SCRAPE_INTERVAL_SECONDS
              value: {{ .Values.metrics.minScrapeIntervalSeconds | quote }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.metrics.resources | nindent 12 }}
          volumeMounts:
            # Read-only: the sidecar only ever reads the session key.
            - name: data
              mountPath: {{ .Values.persistence.data.mountPath }}
              readOnly: true
            - name: metrics-src
              mountPath: /app
              readOnly: true
        {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "openhands.fullname" . }}-data
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ include "openhands.fullname" . }}-workspace
        - name: agents-home
          emptyDir: {}
        - name: claude-home
          emptyDir: {}
        {{- if .Values.metrics.enabled }}
        - name: metrics-src
          configMap:
            name: {{ include "openhands.fullname" . }}-metrics
            defaultMode: 0444
        {{- end }}
        - name: skills
          configMap:
            name: {{ include "openhands.fullname" . }}-skills
            defaultMode: 0444
            items:
              {{- include "openhands.skillVolumeItems" . | nindent 14 }}
        - name: gitconfig
          configMap:
            name: {{ include "openhands.fullname" . }}-gitconfig
            defaultMode: 0444
        - name: start
          configMap:
            name: {{ include "openhands.fullname" . }}-canvas-start
            defaultMode: 0444
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
