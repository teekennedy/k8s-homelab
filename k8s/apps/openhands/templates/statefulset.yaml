apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "openhands.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
spec:
  # Headless Service for stable pod DNS. Nothing addresses the pod by its
  # ordinal name, but a StatefulSet requires the field.
  serviceName: {{ include "openhands.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  # Single writer: both volumes are ReadWriteOnce, and the agent server's
  # session state assumes one process owns them. A StatefulSet rollout
  # terminates the old pod before creating its replacement, which is what makes
  # that safe; the claims are separate objects rather than volumeClaimTemplates
  # so they can carry backup labels and be resized without the immutability
  # rules on a StatefulSet's claim templates.
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "openhands.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openhands.labels" . | nindent 8 }}
        app.kubernetes.io/component: canvas
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # GIT_CONFIG_GLOBAL is read once per git process, but the mounted file
        # is what supplies the credential helper — roll the pod when it changes
        # so a session started before the edit isn't left with the old one.
        checksum/gitconfig: {{ include (print $.Template.BasePath "/configmap-gitconfig.yaml") . | sha256sum }}
        # Skills are copied into the agent's home at pod start, so a change to
        # files/skills/ only takes effect on a fresh pod.
        checksum/skills: {{ include (print $.Template.BasePath "/configmap-skills.yaml") . | sha256sum }}
        {{- if .Values.metrics.enabled }}
        checksum/metrics: {{ include (print $.Template.BasePath "/configmap-metrics.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "openhands.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        # Skills land in two directories because two different readers look for
        # them, and neither reads the other's path:
        #   ~/.agents/skills   the agent server's own user-skill search path, so
        #                      the skill is listed in the UI and reaches the
        #                      agent context. ~/.openhands/skills would work too
        #                      but is on the data volume, which would outlive
        #                      git as the source of truth.
        #   ~/.claude/skills   read natively by the Claude Code CLI that the ACP
        #                      session spawns.
        # Copied in rather than mounted: a ConfigMap mounted at either path would
        # make that directory root-owned and read-only, and the agent writes its
        # own state beside the skills in both. The copy re-runs on every start
        # and both directories are emptyDir, so a removed skill does not linger.
        - name: seed-skills
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p "$HOME/.agents/skills" "$HOME/.claude/skills"
              # The glob skips the ConfigMap volume's own ..data and
              # ..<timestamp> entries, which are not skills; -L resolves the
              # symlink each remaining entry actually is.
              for src in /opt/openhands-skills/*/; do
                [ -d "$src" ] || continue
                cp -rLf "$src" "$HOME/.agents/skills/"
                cp -rLf "$src" "$HOME/.claude/skills/"
              done
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: agents-home
              mountPath: /home/openhands/.agents
            - name: claude-home
              mountPath: /home/openhands/.claude
            - name: skills
              mountPath: /opt/openhands-skills
              readOnly: true
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            # Goes into automation callback URLs and is injected into runs, so
            # it has to be the URL a browser uses, not the Service name.
            - name: AUTOMATION_BASE_URL
              value: {{ .Values.app.baseURL | quote }}
            {{- if .Values.app.telemetryDisabled }}
            # Two variables, covering the server side and the browser
            # separately — see values.yaml, app.telemetryDisabled.
            - name: VITE_DO_NOT_TRACK
              value: "1"
            - name: AGENT_CANVAS_DISABLE_TELEMETRY
              value: "1"
            {{- end }}
            # --- Forge ------------------------------------------------------
            # Read by the credential helper in the mounted gitconfig, and by
            # anything else in a session that needs to call the Forgejo API.
            - name: GIT_CONFIG_GLOBAL
              value: {{ .Values.forge.gitConfigPath | quote }}
            - name: FORGEJO_URL
              value: {{ .Values.forge.url | quote }}
            - name: FORGEJO_OWNER
              value: {{ .Values.forge.owner | quote }}
            - name: FORGEJO_REPO
              value: {{ .Values.forge.repo | quote }}
            - name: FORGEJO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.forge.secretName }}
                  key: username
            - name: FORGEJO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.forge.secretName }}
                  key: token
            # --- CI ---------------------------------------------------------
            # Read by the forgejo-iterate skill to pull failing step logs and
            # restart a flaky pipeline.
            - name: WOODPECKER_URL
              value: {{ .Values.ci.url | quote }}
            - name: WOODPECKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ci.secretName }}
                  key: token
                  # Provisioned by a Job that may not have run yet on a cold
                  # bootstrap. Optional because only the log-reading half of
                  # the skill needs it.
                  optional: true
          envFrom:
            # CLAUDE_CODE_OAUTH_TOKEN and/or ANTHROPIC_API_KEY; see README.md,
            # "Prerequisites".
            - secretRef:
                name: {{ .Values.anthropic.secretName }}
                optional: true
          # /alive is proxied through to the agent server, so it answers only
          # once the process behind the entry point is actually up.
          startupProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 10
            # Up to 5 minutes: a first boot generates the encryption key and
            # the session key and runs the automation database migrations
            # before anything binds.
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 30
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.data.mountPath }}
            - name: workspace
              mountPath: {{ .Values.persistence.workspace.mountPath }}
            # The agent's own config directories: skills seeded above, plus
            # whatever state it writes beside them. Deliberately not persisted —
            # the skills come from git on every start and the rest is
            # rebuildable.
            - name: agents-home
              mountPath: /home/openhands/.agents
            - name: claude-home
              mountPath: /home/openhands/.claude
            - name: gitconfig
              mountPath: {{ .Values.forge.gitConfigPath }}
              subPath: gitconfig
              readOnly: true
        {{- if .Values.metrics.enabled }}
        # Reads the conversation list over loopback and renders it as Prometheus
        # text. In this pod, not its own Deployment, because the session key it
        # authenticates with lives on the data volume.
        - name: metrics
          image: {{ .Values.metrics.image }}
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /app/server.py
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: LOG_LEVEL
              value: info
            - name: METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            - name: AGENT_SERVER_URL
              value: "http://127.0.0.1:18000"
            - name: SESSION_API_KEY_FILE
              value: {{ printf "%s/agent-canvas/api-key.txt" .Values.persistence.data.mountPath | quote }}
            - name: MIN_SCRAPE_INTERVAL_SECONDS
              value: {{ .Values.metrics.minScrapeIntervalSeconds | quote }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.metrics.resources | nindent 12 }}
          volumeMounts:
            # Read-only: the sidecar only ever reads the session key.
            - name: data
              mountPath: {{ .Values.persistence.data.mountPath }}
              readOnly: true
            - name: metrics-src
              mountPath: /app
              readOnly: true
        {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "openhands.fullname" . }}-data
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ include "openhands.fullname" . }}-workspace
        - name: agents-home
          emptyDir: {}
        - name: claude-home
          emptyDir: {}
        {{- if .Values.metrics.enabled }}
        - name: metrics-src
          configMap:
            name: {{ include "openhands.fullname" . }}-metrics
            defaultMode: 0444
        {{- end }}
        - name: skills
          configMap:
            name: {{ include "openhands.fullname" . }}-skills
            defaultMode: 0444
            items:
              {{- include "openhands.skillVolumeItems" . | nindent 14 }}
        - name: gitconfig
          configMap:
            name: {{ include "openhands.fullname" . }}-gitconfig
            defaultMode: 0444
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
