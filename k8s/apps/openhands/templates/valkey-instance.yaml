{{/*
oauth2-proxy's session store, from the valkey-instance library chart.
Configured under `valkeyInstance` in values.yaml.

In a cookie, a session's refresh token is held by the browser, and every
request made in parallel once it is due redeems it on its own; Authelia
answers the second use of a rotated token by revoking the session. Here the
proxy replicas take a lock to refresh, and the rest wait for the result.

In memory only: losing it costs a sign-in.
*/}}
