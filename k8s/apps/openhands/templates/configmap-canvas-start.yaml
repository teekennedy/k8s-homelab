---
# The canvas pod's entrypoint; see the comment at the top of the script.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openhands.fullname" . }}-canvas-start
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
data:
  start.sh: |-
    {{- .Files.Get "files/canvas/start.sh" | nindent 4 }}
---
# The key the canvas pod's agent server and automation service accept. The app
# server holds it too, to reach the automation service for the browser.
# Autogenerated in-cluster, never committed.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openhands.fullname" . }}-canvas-keys
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: session-api-key
    secret-generator.v1.mittwald.de/length: "48"
type: Opaque
