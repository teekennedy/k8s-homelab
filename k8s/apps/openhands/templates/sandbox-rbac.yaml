{{- $root := . -}}
{{- $fullName := include "openhands.fullname" . -}}
{{- range $spec, $cfg := .Values.sandboxSpecs.specs }}
---
# The identity a sandbox on this spec runs as. No permissions and no mounted
# token: a spec that needs cluster access gets a Role here, deliberately and
# visibly.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ printf "%s-runtime-%s" $fullName $spec }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "openhands.labels" $root | nindent 4 }}
automountServiceAccountToken: {{ or $cfg.daggerEngine $cfg.clusterRead | default false }}
{{- if $cfg.daggerEngine }}
---
# Reach the shared Dagger engine over `kube-pod://`, which is `kubectl exec`.
# Names the engine pod and omits `list`, which `kubectl exec` does not need.
# The woodpecker and renovate charts carry the same grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-runtime-%s-dagger-exec" $fullName $spec }}
  namespace: {{ $root.Values.daggerEngineNamespace }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: [{{ $root.Values.daggerEnginePod | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    resourceNames: [{{ $root.Values.daggerEnginePod | quote }}]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-runtime-%s-dagger-exec" $fullName $spec }}
  namespace: {{ $root.Values.daggerEngineNamespace }}
subjects:
  - kind: ServiceAccount
    name: {{ printf "%s-runtime-%s" $fullName $spec }}
    namespace: {{ $root.Release.Namespace }}
roleRef:
  kind: Role
  name: {{ printf "%s-runtime-%s-dagger-exec" $fullName $spec }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- if $cfg.clusterRead }}
---
# Read-only access to the cluster for `kubectl`, through the built-in `view`
# role: everything namespaced but Secrets, Roles and RoleBindings. It does not
# cover the cluster-scoped objects a debugging session asks about first, which
# are added here.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-runtime-%s-cluster-read" $fullName $spec }}
  labels:
    {{- include "openhands.labels" $root | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-runtime-%s-cluster-read" $fullName $spec }}
  labels:
    {{- include "openhands.labels" $root | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ printf "%s-runtime-%s" $fullName $spec }}
    namespace: {{ $root.Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ printf "%s-runtime-%s-cluster-read" $fullName $spec }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-runtime-%s-view" $fullName $spec }}
  labels:
    {{- include "openhands.labels" $root | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ printf "%s-runtime-%s" $fullName $spec }}
    namespace: {{ $root.Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
