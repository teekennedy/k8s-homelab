---
# ~/.openhands — settings, the encrypted secret store, conversation history and
# the automation database.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "openhands.fullname" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
    {{- with .Values.persistence.data.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.data.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size }}
---
# ~/workspace — per-session checkouts, rebuildable, so not in the backup group.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "openhands.fullname" . }}-workspace
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.workspace.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.workspace.size }}
