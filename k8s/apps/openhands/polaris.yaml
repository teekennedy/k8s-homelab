exemptions:
  # The app server's source code: it names keys and secrets because it
  # handles them, but every value it uses comes from a Secret at runtime.
  - controllerNames:
      - openhands-app-server-source
    rules:
      - sensitiveConfigmapContent
  # The repo sandbox spec runs Dagger on the shared engine over `kube-pod://`,
  # which is `kubectl exec`. Mirrors the woodpecker dagger-pipeline grant.
  - controllerNames:
      - openhands-runtime-repo-dagger-exec
    rules:
      - rolePodExecAttach
  - controllerNames:
      - openhands-runtime-repo-dagger-exec
    rules:
      - rolebindingRolePodExecAttach
