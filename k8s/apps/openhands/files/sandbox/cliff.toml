[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
  {{ commit.message | split(pat="\n") | first | upper_first }} ({{ commit.id | truncate(length=8, end="") }})\
  {% if commit.breaking %} **BREAKING**{% endif %}
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
tag_pattern = "^openhands-sandbox-[0-9]+\\.[0-9]+\\.[0-9]+$"
include_paths = [
  "k8s/apps/openhands/files/sandbox/**",
]
# Any conventional commit touching those paths releases at least a patch, so a
# Renovate `chore(deps)` lockfile bump publishes a refreshed image.
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^(chore|build|ci|docs|style|test)", group = "Other" },
]

[bump]
# The images pushed by hand before this (1.53.0-python-1 to -3) were never
# tagged in git, so there is nothing to bump from.
initial_tag = "openhands-sandbox-0.2.0"
