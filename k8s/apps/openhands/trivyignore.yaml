misconfigurations:
  # The dump-schemas init container starts a throwaway agent server on
  # localhost and reads its schemas back; OH_SESSION_API_KEYS_0 is the
  # placeholder key the two share.
  - id: HL-0006 # sensitive env literal
    paths: [Deployment/openhands/openhands-app-server.yaml]
  # The repo sandbox spec runs Dagger on the shared engine over `kube-pod://`,
  # which is `kubectl exec`.
  - id: KSV-0053 # exec into pods
    paths: [Role/dagger-engine/openhands-runtime-repo-dagger-exec.yaml]
