apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: openhands
  namespace: argocd
spec:
  destination:
    name: in-cluster
    namespace: openhands
  project: default
  ignoreDifferences:
    - jsonPointers:
        - /spec/volumeName
        - /spec/storageClassName
        # Longhorn stores the expanded capacity in bytes (e.g. 10737418240) rather
        # than the human-readable form (e.g. 10Gi), causing ArgoCD to see a diff
        # and attempt a patch that Kubernetes rejects as reducing the storage request.
        - /spec/resources/requests/storage
      kind: PersistentVolumeClaim
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    # cookie-secret / client-secret are filled in-cluster by mittwald
    # secret-generator; don't fight it.
    - jsonPointers:
        - /data
      kind: Secret
      name: openhands-oauth2-proxy-secrets
      namespace: openhands
  source:
    path: k8s/apps/openhands
    repoURL: https://git.msng.to/ops/k8s-homelab
    targetRevision: main
  syncPolicy:
    # internal-gateway-access, never external — see README.md, "Security posture".
    managedNamespaceMetadata:
      labels:
        internal-gateway-access: "true"
    automated:
      prune: true
    retry:
      backoff:
        duration: 1m
        factor: 2
        maxDuration: 16m
      limit: 10
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
