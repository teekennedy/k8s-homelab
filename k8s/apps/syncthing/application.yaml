apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: syncthing
  namespace: argocd
spec:
  destination:
    name: in-cluster
    namespace: syncthing
  project: default
  ignoreDifferences:
    # cookie-secret / client-secret are filled in-cluster by mittwald
    # secret-generator; don't fight it.
    - jsonPointers:
        - /data
      kind: Secret
      name: syncthing-oauth2-proxy-secrets
      namespace: syncthing
  source:
    path: k8s/apps/syncthing
    repoURL: https://git.msng.to/ops/k8s-homelab
    targetRevision: main
  syncPolicy:
    # Label the namespace so the internal traefik-gateway's HTTPRoute
    # namespacePolicy (from: Selector) permits this app's HTTPRoute to attach.
    managedNamespaceMetadata:
      labels:
        internal-gateway-access: "true"
    automated:
      prune: true
    retry:
      backoff:
        duration: 1m
        factor: 2
        maxDuration: 16m
      limit: 10
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
