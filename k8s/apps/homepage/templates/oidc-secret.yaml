---
# Homepage's OIDC client secret, reused as-is from the former oauth2-proxy
# instance's Secret (same name, same autogenerated client-secret value) so the
# swap to native OIDC needs no re-registration with Authelia: this value is
# already mirrored via reflector and bcrypt-hashed into the client Authelia has
# on file for the `homepage` client_id
# (k8s/platform/auth-system/values.yaml, oidcClientSecrets.clients.homepage).
# The unused cookie-secret key oauth2-proxy used to autogenerate here is
# harmless leftover — ArgoCD ignores this Secret's /data (see application.yaml)
# so it is never pruned.
apiVersion: v1
kind: Secret
metadata:
  name: homepage-oauth2-proxy-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: client-secret
    secret-generator.v1.mittwald.de/length: "32"
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: auth-system
type: Opaque
---
# NextAuth's own session-cookie signing secret (HOMEPAGE_AUTH_SECRET).
# Unrelated to the OIDC client secret above and deliberately NOT reflected to
# auth-system: the IdP has no business knowing it.
apiVersion: v1
kind: Secret
metadata:
  name: homepage-auth-secret
  namespace: {{ .Release.Namespace }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: auth-secret
    secret-generator.v1.mittwald.de/length: "64"
type: Opaque
