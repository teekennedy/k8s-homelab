apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: homepage
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: homepage
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: homepage
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Kubelet health probes (liveness/readiness)
    - from:
        - ipBlock:
            cidr: 10.69.80.0/24
      ports:
        - protocol: TCP
          port: 3000
    # oauth2-proxy reverse-proxies authenticated traffic from the public
    # msng.to ingress into homepage. Traefik no longer talks to homepage
    # directly — it forwards to oauth2-proxy, which forwards here.
    #
    # The proxy is a sibling in THIS namespace (it used to have its own), so this
    # is a bare podSelector. Adding a namespaceSelector back would stop matching
    # and make homepage unreachable.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oauth2-proxy
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # DNS resolution via CoreDNS pods
    # (kube-proxy DNATs kube-dns ClusterIP to CoreDNS pod IPs
    # before NetworkPolicy evaluation, so namespaceSelector is needed)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes API server (k3s runs apiserver on host network)
    # kube-proxy DNATs ClusterIP 10.43.0.1:443 to node-IP:6443
    - to:
        - ipBlock:
            cidr: 10.69.80.0/24
      ports:
        - protocol: TCP
          port: 6443
    # Widget API calls through Traefik
    # servicelb DNATs node-IP:443 to Traefik pod IPs, so we target
    # the pods directly rather than the pre-DNAT node IPs
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
