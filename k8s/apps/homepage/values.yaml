configRollout:
  # Deliberately in values.yaml (not templates/config-rollout.yaml) so that
  # renovate can pick it up.
  kubectlImage: alpine/kubectl:1.37.1@sha256:a5d0fbecab3f7b6c2ab7398f1daa73a3e0ed6ece18556d21698233e9e3759cc7

# https://github.com/M0NsTeRRR/helm-charts/tree/main/charts/homepage
homepage:
  image:
    registry: ghcr.io
    repository: gethomepage/homepage
    tag: "v2.7.0@sha256:19c5c09184458a41b7b5915e71463a39f36cd33540f41bdbed008791b8182d5f"
  # Homepage owns the apex msng.to Ingress and gates it with OIDC login.
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: wspublic
      # public-rate-limit is defined by templates/traefik-rate-limit.yaml
      traefik.ingress.kubernetes.io/router.middlewares: homepage-public-rate-limit@kubernetescrd
    hosts:
      - host: msng.to
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - msng.to
  config:
    allowedHosts:
      - msng.to
  volumeMounts:
    - name: homepage-config
      mountPath: /app/config/settings.yaml
      subPath: settings.yaml
    - name: homepage-config
      mountPath: /app/config/kubernetes.yaml
      subPath: kubernetes.yaml
    - name: homepage-config
      mountPath: /app/config/services.yaml
      subPath: services.yaml
    - name: homepage-config
      mountPath: /app/config/bookmarks.yaml
      subPath: bookmarks.yaml
    - name: homepage-config
      mountPath: /app/config/widgets.yaml
      subPath: widgets.yaml
    - name: homepage-config
      mountPath: /app/config/custom.js
      subPath: custom.js
    - name: nas
      mountPath: /mnt/nas
      readOnly: true
  volumes:
    - name: homepage-config
      configMap:
        name: homepage-configs
    - name: nas
      persistentVolumeClaim:
        claimName: homepage-nas
  extraEnv:
    - name: LOG_TARGETS
      value: stdout
    # --- Built-in OIDC login (https://gethomepage.dev/installation/#security-authentication) ---
    - name: HOMEPAGE_AUTH_ENABLED
      value: "true"
    - name: HOMEPAGE_EXTERNAL_URL
      value: https://msng.to
    # NextAuth session-signing secret.
    - name: HOMEPAGE_AUTH_SECRET
      valueFrom:
        secretKeyRef:
          name: homepage-auth-secret
          key: auth-secret
    - name: HOMEPAGE_OIDC_ISSUER
      value: https://authelia.msng.to
    # Must equal the Authelia client_id (k8s/platform/auth-system/values.yaml).
    - name: HOMEPAGE_OIDC_CLIENT_ID
      value: homepage
    - name: HOMEPAGE_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: homepage-oauth2-proxy-secrets
          key: client-secret
    - name: HOMEPAGE_OIDC_NAME
      value: Authelia
    # Read-only token for the unprivileged `homepage` Forgejo user. Written
    # into this namespace by forgejo-resources (k8s/platform/forgejo/values.yaml).
    - name: HOMEPAGE_VAR_FORGEJO_API_KEY
      valueFrom:
        secretKeyRef:
          name: homepage-forgejo-credentials
          key: token
  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      memory: 512Mi
