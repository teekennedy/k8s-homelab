# https://github.com/M0NsTeRRR/helm-charts/tree/main/charts/homepage
homepage:
  image:
    registry: ghcr.io
    repository: gethomepage/homepage
    tag: "v1.13.2"
  # Homepage is fronted by oauth2-proxy in reverse-proxy mode (see
  # k8s/platform/oauth2-proxy). The msng.to ingress and TLS are owned by the
  # oauth2-proxy chart, which forwards authenticated traffic to this service.
  ingress:
    enabled: false
  config:
    allowedHosts:
      - msng.to
  volumeMounts:
    - name: homepage-config
      mountPath: /app/config/settings.yaml
      subPath: settings.yaml
    - name: homepage-config
      mountPath: /app/config/kubernetes.yaml
      subPath: kubernetes.yaml
    - name: homepage-config
      mountPath: /app/config/services.yaml
      subPath: services.yaml
    - name: homepage-config
      mountPath: /app/config/bookmarks.yaml
      subPath: bookmarks.yaml
    - name: homepage-config
      mountPath: /app/config/widgets.yaml
      subPath: widgets.yaml
    - name: homepage-config
      mountPath: /app/config/custom.js
      subPath: custom.js
    - name: nas
      mountPath: /mnt/nas
      readOnly: true
  volumes:
    - name: homepage-config
      configMap:
        name: homepage-configs
    - name: nas
      persistentVolumeClaim:
        claimName: homepage-nas
  extraEnv:
    - name: LOG_TARGETS
      value: stdout
  extraEnvFrom:
    - secretRef:
        name: homepage-secrets

secret-sync:
  enabled: true
  cron:
    enabled: false
  schedule: "*/30 * * * *"
  image:
    repository: golang
    tag: 1.26.4-alpine
  events:
    enabled: true
    eventBusName: homepage-secret-sync
    eventSourceName: homepage-secret-sync
    sensorName: homepage-secret-sync
    eventSourceServiceAccount: homepage-secret-sync-eventsource
    sensorServiceAccount: homepage-secret-sync-sensor
  rollout:
    enabled: true
    namespace: homepage
    deployment: homepage
    annotation: homepage-secret-sync/restarted-at
  output-secret:
    name: homepage-secrets
    namespace: homepage
    type: Opaque
  mappings:
    - env: HOMEPAGE_VAR_JELLYSEERR_API_KEY
      source:
        namespace: jellyfin
        name: api-keys
        key: SEERR_API_KEY
    - env: HOMEPAGE_VAR_SONARR_API_KEY
      source:
        namespace: jellyfin
        name: api-keys
        key: SONARR_API_KEY
    - env: HOMEPAGE_VAR_RADARR_API_KEY
      source:
        namespace: jellyfin
        name: api-keys
        key: RADARR_API_KEY
    - env: HOMEPAGE_VAR_PROWLARR_API_KEY
      source:
        namespace: jellyfin
        name: api-keys
        key: PROWLARR_API_KEY
    - env: HOMEPAGE_VAR_GITEA_API_KEY
      source:
        namespace: gitea
        name: homepage-gitea-credentials
        key: token
    - env: HOMEPAGE_VAR_JELLYFIN_API_KEY
      source:
        namespace: jellyfin
        name: jellyfin-homepage-api-key
        key: api-key
      optional: true
    - env: HOMEPAGE_VAR_QBITTORRENT_USERNAME
      source:
        namespace: jellyfin
        name: qbittorrent-credentials
        key: username
      optional: true
    - env: HOMEPAGE_VAR_QBITTORRENT_PASSWORD
      source:
        namespace: jellyfin
        name: qbittorrent-credentials
        key: password
      optional: true
    - env: HOMEPAGE_VAR_ARGOCD_API_KEY
      source:
        namespace: argocd
        name: readonly-argocd-token
        key: token
      optional: true
