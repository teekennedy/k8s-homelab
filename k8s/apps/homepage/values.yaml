# https://github.com/M0NsTeRRR/helm-charts/tree/main/charts/homepage
homepage:
  image:
    registry: ghcr.io
    repository: gethomepage/homepage
    tag: "v1.13.2"
  # Homepage is fronted by the oauth2-proxy instance defined at the bottom of this
  # file, in reverse-proxy mode: that instance owns the msng.to Ingress and TLS
  # and forwards authenticated traffic to this Service, so homepage must not claim
  # the hostname itself.
  ingress:
    enabled: false
  config:
    allowedHosts:
      - msng.to
  volumeMounts:
    - name: homepage-config
      mountPath: /app/config/settings.yaml
      subPath: settings.yaml
    - name: homepage-config
      mountPath: /app/config/kubernetes.yaml
      subPath: kubernetes.yaml
    - name: homepage-config
      mountPath: /app/config/services.yaml
      subPath: services.yaml
    - name: homepage-config
      mountPath: /app/config/bookmarks.yaml
      subPath: bookmarks.yaml
    - name: homepage-config
      mountPath: /app/config/widgets.yaml
      subPath: widgets.yaml
    - name: homepage-config
      mountPath: /app/config/custom.js
      subPath: custom.js
    - name: nas
      mountPath: /mnt/nas
      readOnly: true
  volumes:
    - name: homepage-config
      configMap:
        name: homepage-configs
    - name: nas
      persistentVolumeClaim:
        claimName: homepage-nas
  extraEnv:
    - name: LOG_TARGETS
      value: stdout
  extraEnvFrom:
    - secretRef:
        name: homepage-secrets

# Assembles homepage-secrets from API keys owned by other namespaces. Runs as an
# ArgoCD PostSync hook (templates/secret-sync.yaml). This used to be triggered
# lazily by an Argo Events EventBus/EventSource/Sensor watching the source
# Secrets; that was removed as more machinery than the problem warranted.
secret-sync:
  enabled: true
  image:
    repository: golang
    tag: 1.26.5-alpine
  rollout:
    enabled: true
    namespace: homepage
    deployment: homepage
    annotation: homepage-secret-sync/restarted-at
  output-secret:
    name: homepage-secrets
    namespace: homepage
    type: Opaque
  mappings:
    - env: HOMEPAGE_VAR_JELLYSEERR_API_KEY
      source:
        namespace: jellyfin
        name: api-keys
        key: SEERR_API_KEY
    - env: HOMEPAGE_VAR_FORGEJO_API_KEY
      source:
        namespace: forgejo
        name: homepage-forgejo-credentials
        key: token
    - env: HOMEPAGE_VAR_JELLYFIN_API_KEY
      source:
        namespace: jellyfin
        name: jellyfin-homepage-api-key
        key: api-key
      optional: true

# OAuth2 reverse proxy
oauth2ProxyInstance:
  clientId: homepage
  # Must equal oauth2-proxy.config.existingSecret below, and
  # oidcClientSecrets.clients.oauth2-proxy must point at homepage/<this name>.
  secretName: homepage-oauth2-proxy-secrets
  middleware:
    # This instance is a reverse proxy, not a Traefik forwardAuth target: it owns
    # the Ingress below and forwards upstream itself.
    enabled: false

# https://github.com/oauth2-proxy/manifests/blob/main/helm/oauth2-proxy/values.yaml
oauth2-proxy:
  config:
    existingSecret: homepage-oauth2-proxy-secrets
    configFile: |-
      provider = "oidc"
      oidc_issuer_url = "https://authelia.msng.to"
      redirect_url = "https://msng.to/oauth2/callback"
      # Apex form (no leading dot): RFC 6265 cookies set with Domain=msng.to
      # apply to msng.to AND all subdomains.
      cookie_domains = ["msng.to"]
      cookie_expire = "168h"
      cookie_refresh = "1h"
      cookie_secure = true
      cookie_httponly = true
      cookie_samesite = "lax"
      whitelist_domains = [".msng.to"]
      email_domains = ["*"]
      reverse_proxy = true
      pass_authorization_header = true
      pass_access_token = true
      set_xauthrequest = true
      code_challenge_method = "S256"
      scope = "openid profile email"
      # Bypass auth for clients on the internal network, mirroring the
      # previous Authelia internal-network bypass.
      trusted_ips = ["10.69.0.0/16"]
      # Traefik overwrites X-Real-Ip with the connecting client's address and
      # does not trust client-supplied values, so trusted_ips can't be spoofed.
      real_client_ip_header = "X-Real-Ip"
      # Reverse-proxy upstream: oauth2-proxy receives all traffic for msng.to
      # and forwards authenticated requests to homepage. Unauthenticated
      # requests get a real 302 redirect to /oauth2/start (no Traefik errors
      # middleware in the path), so the sign-in flow is fully seamless.
      skip_provider_button = true
      # Serve /.well-known/ unauthenticated (RFC 9116 security.txt lives here, used
      # by the redteam engagement's domain-control challenge). Everything else on
      # msng.to still requires auth and reverse-proxies to homepage. Order matters:
      # the more specific upstream must come first.
      skip_auth_regex = ['^/\.well-known/']
      upstreams = [
        "http://redteam-wellknown.redteam.svc.cluster.local/.well-known/",
        "http://homepage.homepage.svc.cluster.local/",
      ]
      trusted_proxy_ips = ["10.42.0.0/16"]

  replicaCount: 2

  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  service:
    portNumber: 80

  # oauth2-proxy fronts the entire apex domain and reverse-proxies
  # authenticated traffic to the homepage upstream defined above.
  # Homepage's own ingress is disabled.
  ingress:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: wspublic
      # public-rate-limit is defined by templates/traefik-rate-limit.yaml
      traefik.ingress.kubernetes.io/router.middlewares: homepage-public-rate-limit@kubernetescrd
    path: /
    pathType: Prefix
    hosts:
      - msng.to
    tls:
      - hosts:
          - msng.to
