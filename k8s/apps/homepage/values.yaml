# https://github.com/M0NsTeRRR/helm-charts/tree/main/charts/homepage
homepage:
  image:
    registry: ghcr.io
    repository: gethomepage/homepage
    tag: "v2.0.0"
  # Homepage owns the apex msng.to Ingress directly and gates it with its own
  # built-in OIDC login (see the HOMEPAGE_AUTH_* / HOMEPAGE_OIDC_* env vars
  # below and templates/oidc-secret.yaml) — the dedicated oauth2-proxy reverse
  # proxy that used to front it is gone.
  #
  # NOTE: unlike the old oauth2-proxy front door, homepage's auth gate is
  # purely application-level with no IP allowlist, so the previous LAN bypass
  # (trusted_ips) is intentionally not replicated: LAN clients now hit the same
  # Authelia login as everyone else.
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: wspublic
      # public-rate-limit is defined by templates/traefik-rate-limit.yaml
      traefik.ingress.kubernetes.io/router.middlewares: homepage-public-rate-limit@kubernetescrd
    hosts:
      - host: msng.to
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - msng.to
  config:
    allowedHosts:
      - msng.to
  volumeMounts:
    - name: homepage-config
      mountPath: /app/config/settings.yaml
      subPath: settings.yaml
    - name: homepage-config
      mountPath: /app/config/kubernetes.yaml
      subPath: kubernetes.yaml
    - name: homepage-config
      mountPath: /app/config/services.yaml
      subPath: services.yaml
    - name: homepage-config
      mountPath: /app/config/bookmarks.yaml
      subPath: bookmarks.yaml
    - name: homepage-config
      mountPath: /app/config/widgets.yaml
      subPath: widgets.yaml
    - name: homepage-config
      mountPath: /app/config/custom.js
      subPath: custom.js
    - name: nas
      mountPath: /mnt/nas
      readOnly: true
  volumes:
    - name: homepage-config
      configMap:
        name: homepage-configs
    - name: nas
      persistentVolumeClaim:
        claimName: homepage-nas
  extraEnv:
    - name: LOG_TARGETS
      value: stdout
    # --- Built-in OIDC login (https://gethomepage.dev/installation/#security-authentication) ---
    - name: HOMEPAGE_AUTH_ENABLED
      value: "true"
    - name: HOMEPAGE_EXTERNAL_URL
      value: https://msng.to
    # 32+ byte NextAuth session-signing secret, unrelated to the OIDC client
    # secret below. Autogenerated in-cluster, never sent to Authelia. See
    # templates/oidc-secret.yaml.
    - name: HOMEPAGE_AUTH_SECRET
      valueFrom:
        secretKeyRef:
          name: homepage-auth-secret
          key: auth-secret
    - name: HOMEPAGE_OIDC_ISSUER
      value: https://authelia.msng.to
    # Must equal the Authelia client_id (k8s/platform/auth-system/values.yaml).
    - name: HOMEPAGE_OIDC_CLIENT_ID
      value: homepage
    - name: HOMEPAGE_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: homepage-oauth2-proxy-secrets
          key: client-secret
    - name: HOMEPAGE_OIDC_NAME
      value: Authelia
  extraEnvFrom:
    - secretRef:
        name: homepage-secrets

# Assembles homepage-secrets from API keys owned by other namespaces. Runs as an
# ArgoCD PostSync hook (templates/secret-sync.yaml). This used to be triggered
# lazily by an Argo Events EventBus/EventSource/Sensor watching the source
# Secrets; that was removed as more machinery than the problem warranted.
secret-sync:
  enabled: true
  image:
    repository: golang
    tag: 1.26.5-alpine
  rollout:
    enabled: true
    namespace: homepage
    deployment: homepage
    annotation: homepage-secret-sync/restarted-at
  output-secret:
    name: homepage-secrets
    namespace: homepage
    type: Opaque
  mappings:
    - env: HOMEPAGE_VAR_SEERR_API_KEY
      source:
        namespace: jellyfin
        name: api-keys
        key: SEERR_API_KEY
    - env: HOMEPAGE_VAR_FORGEJO_API_KEY
      source:
        namespace: forgejo
        name: homepage-forgejo-credentials
        key: token
    - env: HOMEPAGE_VAR_JELLYFIN_API_KEY
      source:
        namespace: jellyfin
        name: jellyfin-homepage-api-key
        key: api-key
      optional: true
