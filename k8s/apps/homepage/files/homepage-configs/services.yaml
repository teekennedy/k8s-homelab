- Media:
    - Jellyfin:
        icon: sh-jellyfin.svg
        href: https://jellyfin.msng.to
        description: Media server
        namespace: jellyfin
        app: jellyfin
        podSelector: "app.kubernetes.io/controller=main"
        # From jellyfin-exporter via Prometheus. The native jellyfin widget
        # needs a Jellyfin API key, and those are always full admin.
        widget:
          type: prometheusmetric
          url: https://prometheus.msng.to
          refreshInterval: 30000
          metrics:
            - label: Streaming
              query: sum(jellyfin_active_streams)
            # prometheusmetric shows at most four metrics.
            - label: Library
              query: sum(jellyfin_media_size_bytes)
              format:
                type: bytes
                options:
                  maximumFractionDigits: 1
            - label: Movies
              query: max(jellyfin_library_items{type="movie"})
              format:
                type: number
            - label: Shows
              query: max(jellyfin_library_items{type="series"})
              format:
                type: number
    # No widget: Seerr's API key is admin-level and Seerr has no metrics.
    - Seerr:
        icon: sh-seerr.svg
        href: https://seerr.msng.to
        description: Request media
        namespace: jellyfin
        app: jellyfin
        podSelector: "app.kubernetes.io/controller=seerr"
- Apps:
    - Forgejo:
        icon: sh-forgejo.svg
        href: https://git.msng.to
        description: Git repository host
        namespace: forgejo
        app: forgejo
        widget:
          # Homepage has no forgejo widget type yet
          # (gethomepage/homepage#3433). Forgejo's API is Gitea-compatible, so
          # the gitea widget works against it unchanged.
          type: gitea
          url: https://git.msng.to
          key: "{{HOMEPAGE_VAR_FORGEJO_API_KEY}}"
          cache: 3
    - Spoolman:
        icon: sh-spoolman.svg
        href: https://spoolman.msng.to
        description: Filament spool inventory
        namespace: spoolman
        app: spoolman
        widget:
          type: spoolman
          url: https://spoolman.msng.to
          cache: 3
    - Syncthing:
        icon: sh-syncthing.svg
        href: https://syncthing.msng.to
        description: File sync
        namespace: syncthing
        app: syncthing
    - Copyparty:
        icon: sh-copyparty.svg
        href: https://files.msng.to
        description: File host
        namespace: copyparty
        app: copyparty
    - FreshRSS:
        icon: sh-freshrss.svg
        href: https://rss.msng.to
        description: RSS feed reader
        namespace: freshrss
        app: freshrss
- Cluster:
    - Grafana:
        icon: sh-grafana.svg
        href: https://grafana.msng.to
        description: Monitoring and dashboards
        namespace: monitoring-system
        app: grafana
    - Prometheus:
        icon: sh-prometheus.svg
        href: https://prometheus.msng.to
        description: Metrics and alerting
        namespace: monitoring-system
        app: prometheus
        widget:
          type: prometheus
          url: https://prometheus.msng.to
          cache: 3
