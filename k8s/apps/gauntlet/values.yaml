# Default values for gauntlet.

# Internal gateway only: the event runs on the LAN.
gateway:
  name: traefik-gateway
  namespace: kube-system
  sectionName: websecure

rollPage:
  host: gauntlet.msng.to
  image:
    # Python with no third-party packages: server.py only uses the standard
    # library. Its Python must match files/roll-page/.python-version.
    repository: ghcr.io/astral-sh/uv
    tag: python3.15-alpine@sha256:f008ab85c84befffaaa8cbde7eb2b749331769df4e18be766269d0c4904deb40
  port: 8080
  romm:
    # In-cluster API address, used by the server.
    url: http://romm.romm.svc.cluster.local:8080
    # Address the TV's browser opens to play.
    publicUrl: https://romm.msng.to
    # Console-mode player, which starts the game as soon as it loads; {id}
    # is the ROM id. `/rom/{id}/ejs` is the regular player with a Play button.
    playPath: /console/rom/{id}/play
    collection: Gauntlet
    # Created out of band, not by this chart: a RomM client API token
    # (Administration → Client API Tokens) with roms.read and collections.read.
    tokenSecret:
      name: romm-api-token
      key: ROMM_API_TOKEN
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

persistence:
  # The tournament record (tournament.json): players, results and vetoes.
  data:
    size: 1Gi
    storageClass: longhorn
    labels:
      recurring-job.longhorn.io/source: "enabled"
      recurring-job-group.longhorn.io/backup: "enabled"
