{{- $c := dict "ctx" . "component" "roll-page" }}
{{- $v := .Values.rollPage }}
{{- $static := .Files.Glob "files/roll-page/static/*" }}
{{- $project := list "server.py" "pyproject.toml" "uv.lock" ".python-version" }}
{{- /*
The uv project in files/roll-page/ and its static/ files, mounted at /app. The
tests are not shipped.
*/}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: roll-page
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gauntlet.componentLabels" $c | nindent 4 }}
data:
  {{- range $project }}
  {{ . }}: |-
    {{- $.Files.Get (printf "files/roll-page/%s" .) | nindent 4 }}
  {{- end }}
  {{- range $path, $_ := $static }}
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: roll-page
  labels:
    {{- include "gauntlet.componentLabels" $c | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Single writer: the tournament record lives on an RWO volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "gauntlet.componentSelectorLabels" $c | nindent 6 }}
  template:
    metadata:
      annotations:
        # The server reads its project once at startup; restart it when the
        # ConfigMap changes.
        checksum/config: {{ printf "%s%s" (.Files.Glob "files/roll-page/{server.py,pyproject.toml,uv.lock,.python-version}").AsConfig ($static.AsConfig) | sha256sum }}
      labels:
        {{- include "gauntlet.componentLabels" $c | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: roll-page
          image: "{{ $v.image.repository }}:{{ $v.image.tag }}"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |-
              set -eu
              # uv builds the project's environment beside it, and /app is a
              # read-only ConfigMap mount, so run from a writable copy.
              cp -rL /app/. /project/
              mkdir -p /project/tmp
              cd /project
              exec uv run --frozen --no-dev --no-cache --no-python-downloads --link-mode copy \
                python server.py
          env:
            - name: HOME
              value: /project
            - name: TMPDIR
              value: /project/tmp
            - name: PORT
              value: {{ $v.port | quote }}
            - name: STATIC_DIR
              value: /app/static
            - name: DATA_DIR
              value: /data
            - name: ROMM_URL
              value: {{ $v.romm.url | quote }}
            - name: ROMM_PUBLIC_URL
              value: {{ $v.romm.publicUrl | quote }}
            - name: ROMM_PLAY_PATH
              value: {{ $v.romm.playPath | quote }}
            - name: ROMM_COLLECTION
              value: {{ $v.romm.collection | quote }}
            # Optional so the page still comes up, and says what's missing,
            # before the token exists.
            - name: ROMM_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $v.romm.tokenSecret.name }}
                  key: {{ $v.romm.tokenSecret.key }}
                  optional: true
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: http
              containerPort: {{ $v.port }}
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: data
              mountPath: /data
            - name: workdir
              mountPath: /project
      volumes:
        - name: workdir
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: roll-page-data
        - name: app
          configMap:
            name: roll-page
            items:
              {{- range $project }}
              - key: {{ . }}
                path: {{ . }}
              {{- end }}
              {{- range $path, $_ := $static }}
              - key: {{ base $path }}
                path: static/{{ base $path }}
              {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: roll-page
  labels:
    {{- include "gauntlet.componentLabels" $c | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $v.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "gauntlet.componentSelectorLabels" $c | nindent 4 }}
