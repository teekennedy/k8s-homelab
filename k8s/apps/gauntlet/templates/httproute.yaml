---
# Serves the TV page (/) and the referee page (/ref).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: roll-page
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gauntlet.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName }}
  hostnames:
    - {{ .Values.rollPage.host | quote }}
  rules:
    - backendRefs:
        - name: roll-page
          port: {{ .Values.rollPage.port }}
