---
# JWT signing key and the referee's admin password for Bracket.
apiVersion: v1
kind: Secret
metadata:
  name: bracket-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: JWT_SECRET,ADMIN_PASSWORD
    secret-generator.v1.mittwald.de/length: "32"
type: Opaque
