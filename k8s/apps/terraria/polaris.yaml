exemptions:
  # terraria-docker uses a PUID/PGID entrypoint that starts as root to execute gosu and
  # drop to the configured non-root user (UID 1200). The root start is intentional and
  # safe; the actual server process runs as the non-root PUID.
  - controllerNames:
      - terraria
    rules:
      - runAsRootAllowed
  - controllerNames:
      - terraria
    rules:
      - privilegeEscalationAllowed
  # The game server only has a startup probe: a recurring TCP probe on the game
  # port registers as a connecting player.
  - controllerNames:
      - terraria
    rules:
      - readinessProbeMissing
      - livenessProbeMissing
