misconfigurations:
  # terraria-docker uses a PUID/PGID entrypoint that starts as root to execute
  # gosu and drop to the configured non-root user (UID 1200). The root start is
  # intentional; the server process itself runs as the non-root PUID.
  - id: KSV-0001 # privilege escalation
    paths: [Deployment/terraria/terraria.yaml]
  - id: HL-0009 # can run as root
    paths:
      - Deployment/terraria/terraria.yaml
      # Not hardened yet: neither sets a user.
      - Deployment/terraria/terraria-discord-bot.yaml
      - Deployment/terraria/terraria-terraria-web.yaml
  # The game server only has a startup probe: a recurring TCP probe on the game
  # port registers as a connecting player.
  - id: HL-0001 # liveness probe
    paths: &server [Deployment/terraria/terraria.yaml]
  - id: HL-0002 # readiness probe
    paths: *server
