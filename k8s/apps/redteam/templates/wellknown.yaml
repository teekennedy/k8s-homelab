---
# Tiny static server for /.well-known/security.txt. An init container reads the
# mittwald-generated NONCE (required: the pod will not start until the secret value
# exists), hashes it, and substitutes the hash into security.txt — so the published
# X-RedTeam-Auth-SHA256 always matches the live nonce with zero manual steps.
# A dedicated IngressRoute below routes msng.to's /.well-known/ here, ahead of and
# unauthenticated by homepage's own OIDC login — Traefik routers aren't
# namespace-scoped, so this works from the redteam namespace without a
# cross-namespace service reference. Independent of session replicas.
apiVersion: v1
kind: ConfigMap
metadata:
  name: redteam-wellknown
data:
  security.txt: |-
{{ .Files.Get "files/security.txt" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redteam-wellknown
  labels:
    app: redteam-wellknown
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redteam-wellknown
  template:
    metadata:
      labels:
        app: redteam-wellknown
    spec:
      securityContext:
        runAsNonRoot: true
        # fsGroup matches nginx-unprivileged's group so both containers can use the
        # shared emptyDir (render-hash writes it, nginx reads it).
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Substitute sha256(NONCE) into the served security.txt.
        - name: render-hash
          image: busybox:stable
          securityContext:
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              HASH=$(printf %s "$NONCE" | sha256sum | cut -d' ' -f1)
              sed "s/REPLACE_WITH_SHA256_OF_NONCE/$HASH/" /tmpl/security.txt > /out/security.txt
          env:
            # Required (optional defaults to false): blocks startup until mittwald
            # has populated the nonce.
            - name: NONCE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.nonce }}
                  key: NONCE
          volumeMounts:
            - name: tmpl
              mountPath: /tmpl
              readOnly: true
            - name: content
              mountPath: /out
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:stable
          securityContext:
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html/.well-known
              readOnly: true
      volumes:
        - name: tmpl
          configMap:
            name: redteam-wellknown
        - name: content
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redteam-wellknown
spec:
  selector:
    app: redteam-wellknown
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
# The well-known server is the one pod in the namespace that SHOULD accept ingress
# (from Traefik, via the IngressRoute below). default-deny-all covers everything
# else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redteam-wellknown
spec:
  podSelector:
    matchLabels:
      app: redteam-wellknown
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
          protocol: TCP
---
# This path used to inherit homepage-public-rate-limit by virtue of traversing
# oauth2-proxy's single Ingress for all of msng.to. Now that it has its own
# IngressRoute, it needs its own rate limit to keep the same protection —
# same average/burst as templates/traefik-rate-limit.yaml in k8s/apps/homepage.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: wellknown-rate-limit
spec:
  rateLimit:
    average: 20
    burst: 40
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/traefik.io/ingressroute_v1alpha1.json
#
# Routes msng.to's /.well-known/ straight here, unauthenticated, ahead of
# homepage's own OIDC-gated `/` router — homepage no longer sits behind a
# reverse proxy that can carve out this bypass itself (see the oauth2-proxy
# removal in k8s/apps/homepage), so this chart now owns the routing decision.
# Traefik routers are matched cluster-wide regardless of which namespace the
# IngressRoute object lives in, so living here next to redteam-wellknown's own
# Service needs no cross-namespace service reference.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: redteam-wellknown
  annotations:
    # Not functional for an IngressRoute (entryPoints live in the spec) — this is
    # the annotation the external-dns instances filter on to decide which zone
    # this name belongs in. msng.to already has a record from homepage's own
    # Ingress; this just documents the entrypoint for anyone reading the object.
    traefik.ingress.kubernetes.io/router.entrypoints: wspublic
spec:
  entryPoints:
    - wspublic
  routes:
    - kind: Rule
      match: Host(`msng.to`) && PathPrefix(`/.well-known/`)
      # Explicit priority so this beats homepage's own `/` router.
      priority: 1000
      middlewares:
        - name: wellknown-rate-limit
      services:
        - name: redteam-wellknown
          port: 80
  tls: {}
