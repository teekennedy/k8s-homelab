# Custom session image: needs claude, kubectl, git, curl, nmap, nc, jq, python3.
image: "ghcr.io/teekennedy/k8s-homelab-devenv:v0.1.0-claude-redteam"

# Repo the internal session pre-clones (unauthenticated read; public via mirror).
repoURL: "https://git.msng.to/ops/k8s-homelab"

# kube API server ClusterIP — used by FIREWALL_OUTBOUND_SUBNETS so the external
# pod's oracle (kubectl) bypasses the VPN tunnel.
kubeApiCidr: "10.43.0.1/32"

# Internal subnet treated as "the LAN" for the internal scenario.
lanCidr: "10.69.0.0/16"

gluetun:
  image: qmcgaw/gluetun:v3.41.3
  # Custom self-hosted WireGuard endpoint (see README: why not a commercial VPN).
  # Non-secret bits here; WIREGUARD_PRIVATE_KEY + WIREGUARD_ADDRESSES come from the
  # redteam-vpn Secret.
  env:
    VPN_SERVICE_PROVIDER: "custom"
    VPN_TYPE: "wireguard"
    VPN_ENDPOINT_IP: "206.189.227.35"
    VPN_ENDPOINT_PORT: "51820"
    WIREGUARD_PUBLIC_KEY: "cBJ3QEZLte5clASdcg97kWKx//xV9ha6yVWp+XGr72E="

# Secret names you must create (see README prerequisites).
secrets:
  anthropic: redteam-anthropic # ANTHROPIC_API_KEY (or OAuth)
  vpn: redteam-vpn             # WIREGUARD_PRIVATE_KEY, WIREGUARD_ADDRESSES
  nonce: redteam-nonce         # NONCE (auto-generated by mittwald; see nonce-secret.yaml)

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi
