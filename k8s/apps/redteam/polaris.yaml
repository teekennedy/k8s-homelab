exemptions:
  # The VPN sidecar needs the host's /dev/net/tun device to create its tunnel.
  - controllerNames:
      - redteam-external
    rules:
      - hostPathSet
  # The session containers are `sleep infinity` shells entered with kubectl exec.
  - controllerNames:
      - redteam-external
      - redteam-internal
    rules:
      - readinessProbeMissing
      - livenessProbeMissing
