---
# With DISABLE_BUILTIN_AUTH, Wizarr's /login makes any caller an admin, so
# oauth2-proxy must be the only way in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "wizarr.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wizarr.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "wizarr.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oauth2-proxy
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: http
          protocol: TCP
