apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: wizarr
  namespace: argocd
spec:
  destination:
    name: in-cluster
    namespace: wizarr
  project: default
  ignoreDifferences:
    - jsonPointers:
        - /spec/volumeName
        - /spec/storageClassName
        # Longhorn reports the size in bytes, which ArgoCD reads as a diff.
        - /spec/resources/requests/storage
      kind: PersistentVolumeClaim
    # Filled in-cluster by mittwald secret-generator; don't fight it.
    - jsonPointers:
        - /data
      kind: Secret
      name: wizarr-oauth2-proxy-secrets
      namespace: wizarr
  source:
    path: k8s/apps/wizarr
    repoURL: https://git.msng.to/ops/k8s-homelab
    targetRevision: main
    # Render with `helmfile template` instead of ArgoCD's native Helm support.
    plugin:
      name: helmfile
  syncPolicy:
    # Opts the namespace into public exposure; without it the HTTPRoute is not
    # admitted by the gateway.
    managedNamespaceMetadata:
      labels:
        external-gateway-access: "true"
    automated:
      prune: true
    retry:
      backoff:
        duration: 1m
        factor: 2
        maxDuration: 16m
      limit: 10
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
