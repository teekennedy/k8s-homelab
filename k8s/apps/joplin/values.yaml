# Default values for joplin.

replicaCount: 1

image:
  repository: joplin/server
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "3.7.4@sha256:d5e57f8c999743a9fd4a2145503b9d43afe4862a5fcf0c0809170198ad58cbb5"

route:
  host: joplin.msng.to
  # Selects the public entrypoint. Consumed by external-dns, not by the router.
  entrypoint: wspublic
  gateway:
    name: traefik-gateway
    namespace: kube-system
    sectionName: websecurepublic

service:
  port: 22300

serviceAccount:
  create: true
  # The app never talks to the Kubernetes API.
  automount: false
  annotations: {}
  name: ""

# --- Postgres (CNPG) --------------------------------------------------------
# Single instance: a 2-person app doesn't need forgejo's 3-instance HA
# cluster. barman-cloud WAL archiving still gives point-in-time recovery.
psql:
  clusterName: joplin-psql
  image: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie@sha256:23719505c7cc417b043ffd9998b44ab8d57fec1d92f0bf11b231a1754a5962f2

# --- App config --------------------------------------------------------
appBaseUrl: https://joplin.msng.to
# Filesystem-driver attachment storage. Path must match the PVC mount in
# deployment.yaml.
storageDriver: "Type=Filesystem; Path=/data"

# Mailer, needed for notebook-share invitations. Credentials come from the
# smtp-creds secret (reflected from auth-system; see terraform/main.tf).
smtp:
  host: email-smtp.us-west-2.amazonaws.com
  port: 587
  security: starttls
  senderName: "Joplin Server"
  senderEmail: joplin@msng.to

podSecurityContext:
  runAsNonRoot: true
  # The image doesn't pin a UID in its Dockerfile; confirmed by inspection
  # (`id joplin` -> uid=1001 gid=1001). Re-check on any major image bump.
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 1Gi

persistence:
  # Note attachments (images, PDFs, files pasted into notes). Notes
  # themselves live in Postgres. Longhorn's recurring backup-to-NAS job
  # (same group every other app's data volume uses) covers this PVC too.
  data:
    size: 20Gi
    storageClass: longhorn
    labels:
      recurring-job.longhorn.io/source: "enabled"
      recurring-job-group.longhorn.io/backup: "enabled"

nodeSelector: {}

tolerations: []

affinity: {}
