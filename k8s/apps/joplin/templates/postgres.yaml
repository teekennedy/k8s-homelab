# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/postgresql.cnpg.io/cluster_v1.json
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.psql.clusterName }}
  namespace: {{ .Release.Namespace }}
spec:
  # Single instance: a node failure means a few minutes of sync downtime,
  # not data loss — barman-cloud below still gives WAL-archived
  # point-in-time recovery.
  instances: 1
  enablePDB: false
  imageName: {{ .Values.psql.image }}
  primaryUpdateStrategy: unsupervised
  # Promote an up-to-date replica before restarting the primary, so an image
  # update never takes the primary down in place. Falls back to a plain
  # restart when there is no replica.
  primaryUpdateMethod: switchover
  # Pooled clients never disconnect on their own, so a smart shutdown always
  # waits out its full timeout (default 180s) before escalating to fast.
  smartShutdownTimeout: 15
  # CNPG copies these labels onto the PVCs it creates. Postgres is recovered
  # through CNPG, not Longhorn backups, so the volumes only get trimmed.
  inheritedMetadata:
    labels:
      recurring-job.longhorn.io/source: "enabled"
      recurring-job-group.longhorn.io/ephemeral: "enabled"
  storage:
    size: 5Gi
    storageClass: longhorn-strict-local
  enableSuperuserAccess: true
  monitoring:
    enablePodMonitor: true
    # One series per postgres setting per instance; nothing reads them.
    podMonitorMetricRelabelings:
      - action: drop
        sourceLabels: [__name__]
        regex: cnpg_pg_settings_setting
  affinity:
    nodeSelector:
      node.msng.to/cnpg-storage: "true"
  resources:
    requests:
      memory: "256Mi"
    limits:
      memory: "1Gi"
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ .Values.psql.clusterName }}
  bootstrap:
    initdb:
      database: joplin
      owner: joplin
