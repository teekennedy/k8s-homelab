apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "joplin.fullname" . }}
  labels:
    {{- include "joplin.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Single writer: the attachment PVC is RWO, and nothing here supports
  # multiple app instances sharing it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "joplin.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "joplin.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "joplin.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: APP_PORT
              value: {{ .Values.service.port | quote }}
            - name: APP_BASE_URL
              value: {{ .Values.appBaseUrl | quote }}
            - name: DB_CLIENT
              value: pg
            - name: STORAGE_DRIVER
              value: {{ .Values.storageDriver | quote }}
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.psql.clusterName }}-app
                  key: host
            - name: POSTGRES_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.psql.clusterName }}-app
                  key: dbname
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.psql.clusterName }}-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.psql.clusterName }}-app
                  key: password
            # Notebook-share invitations require a working mailer to be
            # discoverable/acceptable at all — there's no reliable in-app
            # fallback without one.
            - name: MAILER_ENABLED
              value: "1"
            - name: MAILER_HOST
              value: {{ .Values.smtp.host | quote }}
            - name: MAILER_PORT
              value: {{ .Values.smtp.port | quote }}
            - name: MAILER_SECURITY
              value: {{ .Values.smtp.security | quote }}
            - name: MAILER_NOREPLY_NAME
              value: {{ .Values.smtp.senderName | quote }}
            - name: MAILER_NOREPLY_EMAIL
              value: {{ .Values.smtp.senderEmail | quote }}
            - name: MAILER_AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: smtp-creds
                  key: username
            - name: MAILER_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smtp-creds
                  key: password
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            # Writable paths pm2 and the app need under a read-only root:
            # PM2_HOME, yarn's cache dir, and the app's own log/temp dirs
            # under its WORKDIR.
            - name: pm2-home
              mountPath: /opt/pm2
            - name: tmp
              mountPath: /tmp
            - name: app-logs
              mountPath: /home/joplin/packages/server/logs
            - name: app-temp
              mountPath: /home/joplin/packages/server/temp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "joplin.fullname" . }}-data
        - name: pm2-home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: app-logs
          emptyDir: {}
        - name: app-temp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
