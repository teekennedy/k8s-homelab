{{- if .Values.seed.enabled }}
{{- $fullName := include "wake-word-trainer.fullname" . -}}
{{- /*
The name carries a hash of the image and the phone-recordings switch: a Job's
pod template cannot be changed in place, so a change makes a new Job (the old
one is pruned). Each new Job exits at once once <work>/.seeded exists.
*/ -}}
{{- $hash := printf "%s-%v" (include "wake-word-trainer.image" .) .Values.phoneRecordings.enabled | sha256sum | trunc 8 }}
---
# One-time: datasets, TTS samples and the static feature sets (pipeline steps
# 1-3) onto the work volume, and the phone recordings split into takes.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullName }}-seed-{{ $hash }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wake-word-trainer.labels" . | nindent 4 }}
    app.kubernetes.io/component: seed
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "wake-word-trainer.labels" . | nindent 8 }}
        app.kubernetes.io/component: seed
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "wake-word-trainer.podSecurityContext" . | nindent 8 }}
      containers:
        - name: seed
          image: {{ include "wake-word-trainer.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - seed
            - --whisper-url={{ .Values.collector.whisper.url }}
          env:
            {{- include "wake-word-trainer.pipelineEnv" . | nindent 12 }}
          securityContext:
            {{- include "wake-word-trainer.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.seed.resources | nindent 12 }}
          volumeMounts:
            - name: work
              mountPath: /data/work
            - name: data
              mountPath: /data/clips
              subPath: clips
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: {{ $fullName }}-work
        - name: data
          persistentVolumeClaim:
            claimName: {{ $fullName }}-data
        - name: tmp
          emptyDir:
            sizeLimit: 16Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
      {{- with .Values.seed.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
