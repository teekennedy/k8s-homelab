{{- $fullName := include "wake-word-trainer.fullname" . -}}
---
# X-Capture-Token: what the Voice PE sends with every upload. Copied by hand
# into the ESPHome secrets.yaml (README.md, "Device").
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-capture-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wake-word-trainer.labels" . | nindent 4 }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: token
    secret-generator.v1.mittwald.de/length: "40"
type: Opaque
---
# X-Internal-Token: the trainer and publisher's credential for the collector's
# /internal API.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-internal-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wake-word-trainer.labels" . | nindent 4 }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: token
    secret-generator.v1.mittwald.de/length: "40"
type: Opaque
