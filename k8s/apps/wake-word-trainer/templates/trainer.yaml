{{- $fullName := include "wake-word-trainer.fullname" . -}}
{{- $t := .Values.trainer -}}
---
# Nightly: the gate, and a training run only when it passes. The run's result
# goes to the collector; the publisher in the collector's pod publishes a
# promoted model from there. The collector's "train now" button creates a Job
# from this template with WWT_FORCE=1.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "wake-word-trainer.cronjobName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wake-word-trainer.labels" . | nindent 4 }}
    app.kubernetes.io/component: trainer
spec:
  schedule: {{ $t.schedule | quote }}
  timeZone: {{ $t.timeZone | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        {{- include "wake-word-trainer.labels" . | nindent 8 }}
        app.kubernetes.io/component: trainer
    spec:
      # A failed run is reported to the collector and retried by the next
      # night's gate, not by the Job.
      backoffLimit: 0
      activeDeadlineSeconds: {{ $t.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "wake-word-trainer.labels" . | nindent 12 }}
            {{- include "wake-word-trainer.workVolumeLabels" . | nindent 12 }}
            app.kubernetes.io/component: trainer
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            {{- include "wake-word-trainer.podSecurityContext" . | nindent 12 }}
          containers:
            - name: train
              image: {{ include "wake-word-trainer.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args: [train]
              env:
                {{- include "wake-word-trainer.pipelineEnv" . | nindent 16 }}
                - name: WWT_COLLECTOR_URL
                  value: {{ include "wake-word-trainer.collectorUrl" . }}
                - name: WWT_INTERNAL_TOKEN_FILE
                  value: /secrets/internal/token
                - name: WWT_PUBLISHED_DIR
                  value: /publish
                - name: WWT_REPEATS
                  value: {{ $t.repeats | quote }}
                - name: WWT_TRAIN_ARGS
                  value: {{ $t.trainArgs | quote }}
                - name: WWT_WORKERS
                  value: {{ $t.workers | quote }}
                - name: WWT_TARGET_FAPH
                  value: {{ $t.targetFaph | quote }}
                - name: WWT_FORCE
                  value: "0"
              securityContext:
                {{- include "wake-word-trainer.containerSecurityContext" . | nindent 16 }}
              resources:
                {{- toYaml $t.resources | nindent 16 }}
              volumeMounts:
                - name: work
                  mountPath: /data/work
                - name: data
                  mountPath: /data/clips
                  subPath: clips
                  readOnly: true
                - name: data
                  mountPath: /data/runs
                  subPath: runs
                # The published model, to re-measure it on this run's test data.
                - name: publish
                  mountPath: /publish
                  readOnly: true
                - name: internal-token
                  mountPath: /secrets/internal
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: shm
                  mountPath: /dev/shm
          volumes:
            - name: work
              persistentVolumeClaim:
                claimName: {{ $fullName }}-work
            - name: data
              persistentVolumeClaim:
                claimName: {{ $fullName }}-data
            - name: publish
              persistentVolumeClaim:
                claimName: {{ $fullName }}-publish
            - name: internal-token
              secret:
                secretName: {{ $fullName }}-internal-token
            - name: tmp
              emptyDir:
                sizeLimit: 8Gi
            # Python multiprocessing (feature building, checkpoint sweeps).
            - name: shm
              emptyDir:
                medium: Memory
                sizeLimit: 2Gi
          {{- with $t.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          affinity:
            {{- include "wake-word-trainer.workVolumeAffinity" (dict "root" . "affinity" $t.affinity) | nindent 12 }}
          {{- with $t.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
