{{- $fullName := include "wake-word-trainer.fullname" . -}}
{{- $c := .Values.collector -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullName }}-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wake-word-trainer.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
# "Train now": read the nightly CronJob and create a Job from it. Nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullName }}-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wake-word-trainer.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: [{{ include "wake-word-trainer.cronjobName" . | quote }}]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullName }}-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wake-word-trainer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullName }}-collector
subjects:
  - kind: ServiceAccount
    name: {{ $fullName }}-collector
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wake-word-trainer.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $c.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "wake-word-trainer.collectorSelectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wake-word-trainer.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Single writer: one SQLite database on a ReadWriteOnce volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "wake-word-trainer.collectorSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wake-word-trainer.labels" . | nindent 8 }}
        app.kubernetes.io/component: collector
    spec:
      serviceAccountName: {{ $fullName }}-collector
      # Only for "train now"; see the Role above.
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        {{- include "wake-word-trainer.podSecurityContext" . | nindent 8 }}
      initContainers:
        # Once per volume: later starts find the file and exit.
        - name: fetch-model
          image: {{ include "wake-word-trainer.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - fetch-model
            - --url={{ $c.whisper.url }}
            - --dest=/data/state/models/{{ $c.whisper.file }}
          securityContext:
            {{- include "wake-word-trainer.containerSecurityContext" . | nindent 12 }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: state
              mountPath: /data/state
            - name: tmp
              mountPath: /tmp
      containers:
        - name: collector
          image: {{ include "wake-word-trainer.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --port={{ $c.port }}
          env:
            - name: WWT_STATE_DIR
              value: /data/state
            - name: WWT_CLIPS_DIR
              value: /data/clips
            - name: WWT_RUNS_DIR
              value: /data/runs
            - name: WWT_CAPTURE_TOKEN_FILE
              value: /secrets/capture/token
            - name: WWT_INTERNAL_TOKEN_FILE
              value: /secrets/internal/token
            - name: WWT_WHISPER_MODEL
              value: /data/state/models/{{ $c.whisper.file }}
            - name: WWT_WHISPER_THREADS
              value: {{ $c.whisper.threads | quote }}
            - name: WWT_GATE_MIN_POSITIVES
              value: {{ .Values.gate.minPositives | quote }}
            - name: WWT_GATE_MIN_FALSE_ACCEPTS
              value: {{ .Values.gate.minFalseAccepts | quote }}
            - name: WWT_RUN_TIMEOUT_HOURS
              value: {{ div .Values.trainer.activeDeadlineSeconds 3600 | add1 | quote }}
            - name: WWT_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WWT_CRONJOB
              value: {{ include "wake-word-trainer.cronjobName" . }}
          ports:
            - name: http
              containerPort: {{ $c.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 4
          securityContext:
            {{- include "wake-word-trainer.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /data/state
            - name: data
              mountPath: /data/clips
              subPath: clips
            - name: data
              mountPath: /data/runs
              subPath: runs
              readOnly: true
            - name: capture-token
              mountPath: /secrets/capture
              readOnly: true
            - name: internal-token
              mountPath: /secrets/internal
              readOnly: true
            - name: tmp
              mountPath: /tmp
        # Publishes the newest promoted run, as the collector reports it.
        # Copyparty's UID: the only writer of the public folder.
        - name: publisher
          image: {{ include "wake-word-trainer.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - publish
            - --watch
            - --heartbeat=/run/publisher/heartbeat
            {{- if .Values.publisher.dryRun }}
            - --dry-run
            - --live-dir=/publish-live
            {{- end }}
          env:
            - name: WWT_COLLECTOR_URL
              value: http://localhost:{{ $c.port }}
            - name: WWT_INTERNAL_TOKEN_FILE
              value: /secrets/internal/token
            - name: WWT_RUNS_DIR
              value: /data/runs
            - name: WWT_PUBLISHED_DIR
              value: /publish
          # The loop touches the heartbeat on every pass. Liveness restarts a
          # loop stuck past a worst-case pass (collector retries included);
          # readiness only says it started, so a slow publish never takes the
          # collector out of its Service.
          livenessProbe:
            exec:
              command:
                - wake-word-trainer
                - check-heartbeat
                - /run/publisher/heartbeat
                - --max-age=900
            periodSeconds: 60
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - wake-word-trainer
                - check-heartbeat
                - /run/publisher/heartbeat
            periodSeconds: 30
            timeoutSeconds: 10
          securityContext:
            {{- include "wake-word-trainer.containerSecurityContext" . | nindent 12 }}
            runAsUser: {{ .Values.publishUid }}
            runAsGroup: {{ .Values.publishUid }}
          resources:
            {{- toYaml .Values.publisher.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data/runs
              subPath: runs
              readOnly: true
            {{- if .Values.publisher.dryRun }}
            # A scratch copy: the dry run never touches the public folder.
            - name: publish-scratch
              mountPath: /publish
            - name: publish
              mountPath: /publish-live
              readOnly: true
            {{- else }}
            - name: publish
              mountPath: /publish
            {{- end }}
            - name: internal-token
              mountPath: /secrets/internal
              readOnly: true
            - name: publisher-run
              mountPath: /run/publisher
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ $fullName }}-state
        - name: data
          persistentVolumeClaim:
            claimName: {{ $fullName }}-data
        - name: publish
          persistentVolumeClaim:
            claimName: {{ $fullName }}-publish
        {{- if .Values.publisher.dryRun }}
        - name: publish-scratch
          emptyDir:
            sizeLimit: 64Mi
        {{- end }}
        - name: capture-token
          secret:
            secretName: {{ $fullName }}-capture-token
        - name: internal-token
          secret:
            secretName: {{ $fullName }}-internal-token
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: publisher-run
          emptyDir:
            sizeLimit: 1Mi
      {{- with $c.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
