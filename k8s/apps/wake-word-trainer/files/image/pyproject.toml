[project]
name = "wake-word-trainer"
version = "0.1.0"
description = "Collect, review and retrain the Okay GLaDOS microWakeWord model"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "uvicorn>=0.38",
]

[project.optional-dependencies]
# Transcription, and the phone-recording segmenter the seed Job runs. Left out
# of the test environment: the tests use a fake transcriber.
whisper = [
    "numpy>=2",
    "pywhispercpp>=1.3",
    "soundfile>=0.13",
]

[project.scripts]
wake-word-trainer = "wake_word_trainer.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wake_word_trainer"]

[tool.pytest.ini_options]
pythonpath = ["."]
