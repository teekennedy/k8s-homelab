---
# Seerr's admin API key. Seerr takes it from the API_KEY env var over the one
# in settings.json.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-api-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "seerr.ownLabels" . | nindent 4 }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: api-key
    secret-generator.v1.mittwald.de/encoding: hex
    secret-generator.v1.mittwald.de/length: "32"
type: Opaque
{{- if and .Values.apiUserProxy.enabled .Values.apiUserProxy.withdrawCleanup.enabled }}
---
# The arr apps' API keys, reflected from jellyfin/api-keys. The proxy uses
# RADARR_API_KEY to check when Radarr added a withdrawn movie.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-arr-api-keys
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "seerr.ownLabels" . | nindent 4 }}
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: jellyfin/api-keys
type: Opaque
data: {}
{{- end }}
---
# The OIDC client secret. Reflected into auth-system, where it is registered as
# `oidcClientSecrets.clients.seerr`.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-oidc-authelia
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "seerr.ownLabels" . | nindent 4 }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: client-secret
    secret-generator.v1.mittwald.de/length: "32"
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: auth-system
type: Opaque
