---
# Seerr's admin API key. Seerr takes it from the API_KEY env var over the one
# in settings.json.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-api-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "seerr.ownLabels" . | nindent 4 }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: api-key
    secret-generator.v1.mittwald.de/encoding: hex
    secret-generator.v1.mittwald.de/length: "32"
type: Opaque
---
# The OIDC client secret. Reflected into auth-system, where it is registered as
# `oidcClientSecrets.clients.seerr`.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-oidc-authelia
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "seerr.ownLabels" . | nindent 4 }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: client-secret
    secret-generator.v1.mittwald.de/length: "32"
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: auth-system
type: Opaque
