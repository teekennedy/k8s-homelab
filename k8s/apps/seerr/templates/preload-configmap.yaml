{{- /*
Modules preloaded into the Seerr server process through NODE_OPTIONS.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-preload
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "seerr.ownLabels" . | nindent 4 }}
data:
  {{- range list "oidc-settings.mjs" "rate-limits.cjs" }}
  {{ . }}: |
    {{- $.Files.Get (printf "files/%s" .) | nindent 4 }}
  {{- end }}
