{{- if .Values.route.enabled }}
---
# Seerr does its own auth, so the whole host goes to it as one rule.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # external-dns selector; not read by the router.
    traefik.ingress.kubernetes.io/router.entrypoints: {{ .Values.route.entrypoint }}
  labels:
    {{- include "seerr.ownLabels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.route.gateway.name }}
      namespace: {{ .Values.route.gateway.namespace }}
      sectionName: {{ .Values.route.gateway.sectionName }}
  hostnames:
    - {{ .Values.route.host | quote }}
  rules:
    - backendRefs:
        - name: {{ .Release.Name }}
          port: {{ index .Values "seerr-chart" "service" "port" }}
{{- range .Values.route.legacyHosts }}
---
# Permanently redirects a previous hostname of this service, keeping the path.
# 308 rather than 301 so the method and body survive the hop.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $.Release.Name }}-redirect-{{ . | replace "." "-" }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: {{ $.Values.route.entrypoint }}
  labels:
    {{- include "seerr.ownLabels" $ | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $.Values.route.gateway.name }}
      namespace: {{ $.Values.route.gateway.namespace }}
      sectionName: {{ $.Values.route.gateway.sectionName }}
  hostnames:
    - {{ . | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: {{ $.Values.route.host | quote }}
            statusCode: 308
{{- end }}
{{- end }}
