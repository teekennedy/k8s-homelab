---
# The OIDC client secret. Generated in-cluster so no plaintext is committed, and
# reflected into the auth-system namespace, where it is registered as
# `oidcClientSecrets.clients.freshrss`.
apiVersion: v1
kind: Secret
metadata:
  name: freshrss-oidc-authelia
  namespace: {{ .Release.Namespace }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: client-secret
    secret-generator.v1.mittwald.de/length: "32"
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: auth-system
type: Opaque
---
# mod_auth_openidc's OIDCCryptoPassphrase, used to encrypt its own session
# state. The IdP has no business knowing it, so unlike the Secret above this one
# is deliberately NOT reflectable — keeping it separate is what allows that
# distinction.
apiVersion: v1
kind: Secret
metadata:
  name: freshrss-oidc-crypto
  namespace: {{ .Release.Namespace }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: crypto-key
    secret-generator.v1.mittwald.de/length: "64"
type: Opaque
