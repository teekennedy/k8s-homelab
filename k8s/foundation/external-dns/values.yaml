external-dns:
  image:
    repository: registry.k8s.io/external-dns/external-dns
    tag: v0.23.0@sha256:1854499e2b08cee47c40a08e356bff20dcb192dbcfde8378fc3f900f12cad5a3
  provider:
    name: cloudflare
  policy: sync
  txtOwnerId: homelab
  env:
    - name: CF_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: cloudflare-api-token
          key: value
    - name: DEFAULT_TARGET
      valueFrom:
        configMapKeyRef:
          name: ddns-public-ip
          key: ip
  extraArgs:
    - "--default-targets=$(DEFAULT_TARGET)"
    - "--force-default-targets"
    - "--annotation-filter=traefik.ingress.kubernetes.io/router.entrypoints in (wspublic)"
  sources:
    - service
    - ingress
    - gateway-httproute
    - traefik-proxy # Traefik IngressRoute CRDs
  interval: 5m
  triggerLoopOnEvent: true
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 256Mi
    limits:
      memory: 384Mi

# Internal instance: resolves non-wspublic resources to cluster IPs
# in Unifi DNS so internal clients avoid NAT reflection.
external-dns-internal:
  fullnameOverride: external-dns-internal
  image:
    repository: registry.k8s.io/external-dns/external-dns
    tag: v0.23.0@sha256:1854499e2b08cee47c40a08e356bff20dcb192dbcfde8378fc3f900f12cad5a3
  policy: sync
  provider:
    name: webhook
    webhook:
      image:
        repository: ghcr.io/kashalls/external-dns-unifi-webhook
        tag: v0.9.0@sha256:22f4106f44a0b9ac3c97cf29bbfef93026c1164492152dc797a1d6dc86ddfbb5
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65534
      env:
        - name: UNIFI_HOST
          value: "https://10.69.80.1"
        - name: UNIFI_API_KEY
          valueFrom:
            secretKeyRef:
              name: unifi-api-key
              key: api-key
        - name: UNIFI_SKIP_TLS_VERIFY
          value: "true"
      livenessProbe:
        httpGet:
          path: /healthz
          port: http-webhook
        initialDelaySeconds: 10
        periodSeconds: 10
      readinessProbe:
        httpGet:
          path: /readyz
          port: http-webhook
        initialDelaySeconds: 5
        periodSeconds: 10
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 192Mi
  txtOwnerId: homelab-internal
  sources:
    - service
    - ingress
    - gateway-httproute
    - traefik-proxy
  annotationFilter: "traefik.ingress.kubernetes.io/router.entrypoints notin (wspublic)"
  interval: 5m
  triggerLoopOnEvent: true
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 256Mi
    limits:
      memory: 384Mi

# Internal instance for public services: resolves wspublic resources
# to the public MetalLB VIP in Unifi DNS so they're reachable from the LAN.
external-dns-public-internal:
  fullnameOverride: external-dns-public-internal
  image:
    repository: registry.k8s.io/external-dns/external-dns
    tag: v0.23.0@sha256:1854499e2b08cee47c40a08e356bff20dcb192dbcfde8378fc3f900f12cad5a3
  policy: sync
  provider:
    name: webhook
    webhook:
      image:
        repository: ghcr.io/kashalls/external-dns-unifi-webhook
        tag: v0.9.0@sha256:22f4106f44a0b9ac3c97cf29bbfef93026c1164492152dc797a1d6dc86ddfbb5
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65534
      env:
        - name: UNIFI_HOST
          value: "https://10.69.80.1"
        - name: UNIFI_API_KEY
          valueFrom:
            secretKeyRef:
              name: unifi-api-key
              key: api-key
        - name: UNIFI_SKIP_TLS_VERIFY
          value: "true"
      livenessProbe:
        httpGet:
          path: /healthz
          port: http-webhook
        initialDelaySeconds: 10
        periodSeconds: 10
      readinessProbe:
        httpGet:
          path: /readyz
          port: http-webhook
        initialDelaySeconds: 5
        periodSeconds: 10
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 192Mi
  txtOwnerId: homelab-public-internal
  sources:
    - service
    - ingress
    - gateway-httproute
    - traefik-proxy
  annotationFilter: "traefik.ingress.kubernetes.io/router.entrypoints in (wspublic)"
  extraArgs:
    - --default-targets=10.69.80.120
    - --force-default-targets
  interval: 5m
  triggerLoopOnEvent: true
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 256Mi
    limits:
      memory: 384Mi

ddnsUpdater:
  enabled: true
  image:
    repository: alpine/curl
    tag: "8.21.0@sha256:a1c44bab54d88e18ea9a6a4ecefab7f2d230b968567b78960fcaff8d51b7f067"
  period: "300" # seconds
  publicIpProvider: https://checkip.amazonaws.com
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 64Mi
