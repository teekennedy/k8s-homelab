exemptions:
  - controllerNames:
      - argocd-application-controller
    rules:
      - clusterrolePodExecAttach
      - clusterrolebindingClusterAdmin
      - clusterrolebindingPodExecAttach
  - controllerNames:
      - argocd-argo-events-controller-manager
    rules:
      - clusterrolePodExecAttach
      - clusterrolebindingPodExecAttach
      - privilegeEscalationAllowed
      - runAsRootAllowed
  - controllerNames:
      - argocd-repo-server
    rules:
      - rolePodExecAttach
      - rolebindingClusterAdminRole
      - rolebindingRolePodExecAttach
  - controllerNames:
      - argocd-server
    rules:
      - clusterrolePodExecAttach
      - clusterrolebindingPodExecAttach
  # The helmfile config-management sidecar serves a unix socket to the repo
  # server and has nothing to probe.
  - controllerNames:
      - argocd-repo-server
    rules:
      - readinessProbeMissing
      - livenessProbeMissing
