argo-cd:
  global:
    domain: argocd.msng.to
    # logging:
    #   level: debug
    env:
      - name: TZ
        value: America/Denver

  configs:
    # argocd-cmd-params-cm configmap
    params:
      server.insecure: true
      controller.diff.server.side: false
    # argocd-cm configmap
    cm:
      # ArgoCD's default annotation tracking stores a large amount of data in annotations for large resources.
      # This can cause sync errors when the maximum annotation size is exceeded.
      # Use labels instead of annotations for resource tracking.
      application.resourceTrackingMethod: label
      resource.ignoreResourceUpdatesEnabled: true
      resource.customizations.ignoreResourceUpdates.argoproj.io_Application: |
        jsonPointers:
        # Ignore when ownerReferences change, for example when a parent ApplicationSet changes often.
        - /metadata/ownerReferences
        # Ignore reconciledAt, since by itself it doesn't indicate any important change.
        - /status/reconciledAt
        jqPathExpressions:
        # Ignore lastTransitionTime for conditions; helpful when SharedResourceWarnings are being regularly updated but not
        # actually changing in content.
        - .status?.conditions[]?.lastTransitionTime
      resource.customizations.ignoreResourceUpdates.all: |
        jsonPointers:
          - /status
      resource.customizations.health.PersistentVolumeClaim: |
        hs = {}
        if obj.status ~= nil then
          if obj.status.phase == "Bound" then
            hs.status = "Healthy"
            hs.message = obj.status.phase
            return hs
          end
          if obj.status.phase == "Pending" then
            if obj.spec ~= nil and obj.spec.storageClassName == "local-path" then
              hs.status = "Healthy"
              hs.message = "Pending (WaitForFirstConsumer - will bind when pod schedules)"
              return hs
            end
            hs.status = "Progressing"
            hs.message = "Waiting for PVC to bind"
            return hs
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for PVC"
        return hs
      oidc.config: |
        name: Authelia
        issuer: https://authelia.msng.to
        clientID: argocd
        enablePKCEAuthentication: true
        requestedScopes:
          - openid
          - profile
          - email
          - groups
        requestedIDTokenClaims:
          groups:
            essential: true
    # create readonly account for Homepage stats
    accounts.readonly: apiKey
    rbac:
      policy.default: role:none
      policy.csv: |
        p, role:readonly, applications, get, */*, allow
        p, role:readonly, projects, get, *, allow
        p, role:readonly, repositories, get, *, allow
        p, role:readonly, clusters, get, *, allow
        g, argocd-admin, role:admin
        g, full-admin, role:admin
        g, argocd-user, role:readonly
        g, readonly, role:readonly
    # ConfigMap for the helmfile Config Management Plugin (paired with the
    # repoServer.extraContainers sidecar below).
    # Ref: https://argo-cd.readthedocs.io/en/stable/operator-manual/config-management-plugins/
    cmp:
      create: true
      plugins:
        helmfile:
          generate:
            command: [sh, -c]
            args:
              # The plugin's cwd is the Application's source path (e.g.
              # k8s/foundation/argocd), and ARGOCD_APP_SOURCE_PATH gives us
              # that same path relative to the repo root where
              # helmfile.yaml.gotmpl lives. Count its segments and cd up that
              # many levels, rather than hardcoding a fixed chart depth.
              - |
                set -euo pipefail
                rest="$ARGOCD_APP_SOURCE_PATH"
                segments=0
                while [ -n "$rest" ]; do
                  segments=$((segments + 1))
                  case "$rest" in
                    */*) rest="${rest#*/}" ;;
                    *) rest="" ;;
                  esac
                done
                up=""
                i=0
                while [ "$i" -lt "$segments" ]; do
                  up="../$up"
                  i=$((i + 1))
                done
                cd "${up:-.}"
                exec helmfile --environment "${ARGOCD_ENV_HELMFILE_ENVIRONMENT:-production}" --selector "name=$ARGOCD_APP_NAME" template
  server:
    ingress:
      enabled: false
    metrics: &metrics
      enabled: true
      serviceMonitor:
        enabled: true
  # Authelia OIDC is configured under configs.cm.oidc.config
  dex:
    enabled: false
  controller:
    metrics: *metrics
  repoServer:
    metrics: *metrics
    # helmfile CMP sidecar: renders k8s/<tier>/<name> charts via `helmfile template`
    # instead of ArgoCD's native Helm autodetection. Each application.yaml opts in
    # via `source.plugin.name: helmfile`.
    extraContainers:
      - name: cmp-helmfile
        image: ghcr.io/helmfile/helmfile:v1.7.4
        imagePullPolicy: IfNotPresent
        command:
          - /var/run/argocd/argocd-cmp-server
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        env:
          # The image defaults HOME to /helm, which is only writable by root;
          # redirect it (and Helm's own cache/config/data dirs) to the
          # writable cmp-tmp emptyDir now that the container runs non-root.
          - name: HOME
            value: /tmp
          - name: HELM_CACHE_HOME
            value: /tmp/helm/cache
          - name: HELM_CONFIG_HOME
            value: /tmp/helm/config
          - name: HELM_DATA_HOME
            value: /tmp/helm/data
        volumeMounts:
          - mountPath: /var/run/argocd
            name: var-files
          - mountPath: /home/argocd/cmp-server/plugins
            name: plugins
          - mountPath: /home/argocd/cmp-server/config/plugin.yaml
            subPath: helmfile.yaml
            name: argocd-cmp-cm
          # Filesystem separation from the repo-server's own /tmp, per the CMP docs.
          - mountPath: /tmp
            name: cmp-tmp
    volumes:
      - name: argocd-cmp-cm
        configMap:
          name: argocd-cmp-cm
      - name: cmp-tmp
        emptyDir: {}
  redis:
    metrics:
      enabled: false
# https://github.com/argoproj/argo-helm/blob/main/charts/argocd-apps/values.yaml
argocd-apps:
  applications:
    k8s-root:
      namespace: argocd
      project: default
      destination:
        name: in-cluster
        namespace: argocd
      source:
        repoURL: https://git.msng.to/ops/k8s-homelab
        targetRevision: main
        path: k8s
        directory:
          include: "*/application.yaml"
          exclude: "*/**/application.yaml"
          recurse: true
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - RespectIgnoreDifferences=true

argo-events:
  controller:
    rbac:
      namespaced: false
    replicas: 1
