# https://github.com/kubereboot/charts/tree/main/charts/kured
kured:
  revisionHistoryLimit: 3
  # https://kured.dev/docs/configuration/
  configuration:
    timeZone: America/Denver
    prometheusUrl: http://monitoring-system-kube-pro-prometheus.monitoring-system.svc.cluster.local:9090
    # kured uses the shoutrrr library for sending notifications
    # Shoutrrr docs for generic webhooks: https://containrrr.dev/shoutrrr/v0.7/services/generic/
    notifyUrl: generic+http://kured-webhook.kured.svc.cluster.local:8080
    messageTemplateDrain: "event=drain node=%s"
    messageTemplateReboot: "event=reboot node=%s"
    messageTemplateUncordon: "event=uncordon node=%s"
    # How often to check for sentinel file
    period: "3m0s"
    rebootCommand: "/run/current-system/sw/bin/systemctl reboot"
    # Alerts kured should ignore.
    alertFilterRegexp: "^(KubeVersionMismatch|LonghornVolumeActualSpaceUsedWarning|LonghornNodeStorageWarning|LonghornDiskStorageWarning|CPUThrottlingHigh|ZFSScrubTooOld|JellyfinExporterDown)$"
    # Only firing alerts should block reboot
    alertFiringOnly: true
    # Give drain operation up to 30 minutes to complete (for Longhorn replica evacuation)
    drainTimeout: "30m"
    # Keep trying to evict pods for up to 30 minutes before timeout
    skipWaitForDeleteTimeoutSeconds: 1800
    # If a drain fails or times out, force a reboot instead of giving up.
    # This prevents the node from continuing to run when it has been marked unschedulable in Longhorn.
    forceReboot: true
    # How long after successful reboot to wait before releasing lock.
    # Gives the cluster some time to settle after node comes back online.
    lockReleaseDelay: 5m

webhook:
  enabled: true
  image:
    repository: python
    tag: 3.14-alpine
  alertmanagerUrl: http://monitoring-system-kube-pro-alertmanager.monitoring-system.svc.cluster.local:9093
  drainSilenceDuration: 1h
  drainSilenceAlerts:
    - CNPGInstanceNotReady
    - LonghornVolumeStatusWarning
    - LonghornVolumeActualSpaceUsedWarning
    - NodeSystemSaturation
    - NodeCPUHighUsage
    - LonghornInstanceManagerCPUUsageWarning
    - LonghornManagerNotReady
    - LonghornCSINotReady
    - HighDiskIOUtilization
    - HighDiskLatency
    - HighDiskQueueDepth
    # Rebooting a node drops iSCSI sessions to any Longhorn replicas it hosts,
    # causing transient I/O errors + EXT4 journal aborts on OTHER nodes that
    # have volumes attached to those replicas until the session reconnects.
    - NodeBlockDeviceIOError
    - NodeFilesystemError
  postRebootSilenceDuration: 15m
  rebootAlertTtl: 6h
  postRebootSilenceAlerts:
    - KubePodNotReady
    - KubeDaemonSetRolloutStuck
    - LonghornNodeDown
