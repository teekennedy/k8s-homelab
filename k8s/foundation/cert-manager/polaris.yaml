exemptions:
  # The chart has no probe settings for the cainjector.
  - controllerNames:
      - cert-manager-cainjector
    rules:
      - readinessProbeMissing
      - livenessProbeMissing
  # The chart only offers a liveness probe for the controller.
  - controllerNames:
      - cert-manager
    rules:
      - readinessProbeMissing
