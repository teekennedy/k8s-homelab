# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/longhorn.io/recurringjob_v1beta2.json
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: all-trim-daily
  namespace: {{ .Release.Namespace }}
spec:
  concurrency: 1
  cron: 0 4 * * *     # 04:00 daily
  groups:
  - ephemeral
  - backup
  retain: 0
  task: filesystem-trim

# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/longhorn.io/recurringjob_v1beta2.json
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: system-backup-daily
  namespace: {{ .Release.Namespace }}
spec:
  task: system-backup
  cron: "0 2 * * *"   # 02:00 daily
  retain: 30
  parameters:
    # Don't backup volumes as part of this job
    volume-backup-policy: disabled

# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/longhorn.io/recurringjob_v1beta2.json
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-daily
  namespace: {{ .Release.Namespace }}
spec:
  concurrency: 1
  cron: "30 2 * * *"         # 02:30 daily
  groups: ["backup"]
  retain: 1
  task: backup
  labels:
    job: backup-daily
