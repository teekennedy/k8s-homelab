# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/longhorn.io/recurringjob_v1beta2.json
#
# Times are America/Denver. Everything here finishes before 02:00, when the
# restic backups start (borg-2's weekly run copies these backups off-site), and
# well before kured's 04:00 reboot window (the backup target is on borg-2, the
# first host it reboots).
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: all-trim-daily
  namespace: {{ .Release.Namespace }}
spec:
  concurrency: 1
  cron: "45 1 * * *"  # 01:45 daily, after backup-daily
  groups:
  - ephemeral
  - backup
  retain: 0
  task: filesystem-trim

# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/longhorn.io/recurringjob_v1beta2.json
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: system-backup-daily
  namespace: {{ .Release.Namespace }}
spec:
  task: system-backup
  cron: "0 1 * * *"   # 01:00 daily
  retain: 30
  parameters:
    # Don't backup volumes as part of this job
    volume-backup-policy: disabled

# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/longhorn.io/recurringjob_v1beta2.json
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-daily
  namespace: {{ .Release.Namespace }}
spec:
  concurrency: 1
  cron: "15 1 * * *"         # 01:15 daily
  groups: ["backup"]
  retain: 1
  task: backup
  labels:
    job: backup-daily
