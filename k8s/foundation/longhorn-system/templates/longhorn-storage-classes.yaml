---
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: longhorn-rc1
  namespace: {{ .Release.Namespace }}
provisioner: driver.longhorn.io
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
parameters:
  numberOfReplicas: "1"
  # staleReplicaTimeout: "2880" # 48 hours in minutes
  # fromBackup: ""
  # fsType: "ext4"
reclaimPolicy: Retain
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-rc2
  namespace: {{ .Release.Namespace }}
parameters:
  numberOfReplicas: "2"
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
---
# A single replica storage class with strict-local data locality
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: longhorn-strict-local
  namespace: {{ .Release.Namespace }}
provisioner: driver.longhorn.io
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
parameters:
  numberOfReplicas: "1" # Required for strict-local
  dataLocality: "strict-local"
  staleReplicaTimeout: "720" # 12 hours in minutes
reclaimPolicy: Delete
