# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/monitoring.coreos.com/prometheusrule_v1.json
# Based on https://longhorn.io/docs/1.10.0/monitoring/alert-rules-example/
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    prometheus: longhorn
    role: alert-rules
  name: prometheus-longhorn-rules
  namespace: {{ .Release.Namespace }}
spec:
  groups:
  - name: longhorn.rules
    rules:
    - alert: LonghornVolumeActualSpaceUsedWarning
      annotations:
        description: The actual space used by Longhorn volume for the PVC {{`{{$labels.pvc}}`}} in the {{`{{$labels.pvc_namespace}}`}} namespace is at {{`{{$value | printf "%.f"}}`}}% capacity for
          more than 5 minutes.
        summary: The actual used space of Longhorn volume is over 90% of the capacity.
        custom_link_text: volume
        custom_link_url: https://{{ .Values.longhorn.ingress.host }}/#/volume/{{`{{$labels.volume}}`}}
      expr: (longhorn_volume_actual_size_bytes / longhorn_volume_capacity_bytes) * 100 > 90
      for: 5m
      labels:
        issue: The actual used space of Longhorn volume for PVC {{`{{$labels.pvc}}`}} in the {{`{{$labels.pvc_namespace}}`}} namespace is high.
        severity: warning
    # longhorn_volume_robustness is one series per state (unknown, healthy,
    # degraded, faulted) set to 1 for the current one, not a single 0-3 gauge.
    - alert: LonghornVolumeStatusCritical
      annotations:
        description: Longhorn volume {{`{{$labels.volume}}`}} on {{`{{$labels.node}}`}} is Fault for
          more than 2 minutes.
        summary: Longhorn volume {{`{{$labels.volume}}`}} is Fault
        custom_link_text: volume
        custom_link_url: https://{{ .Values.longhorn.ingress.host }}/#/volume/{{`{{$labels.volume}}`}}
      expr: longhorn_volume_robustness{state="faulted"} == 1
      for: 5m
      labels:
        issue: Longhorn volume {{`{{$labels.volume}}`}} is Fault.
        severity: critical
    - alert: LonghornVolumeStatusWarning
      annotations:
        description: There are {{`{{$value}}`}} Longhorn volumes in Degraded state for
          more than 5 minutes.
        summary: Longhorn volumes are Degraded
        custom_link_text: volumes
        custom_link_url: https://{{ .Values.longhorn.ingress.host }}/#/volume?field=status&stateValue=detached
      expr: count(longhorn_volume_robustness{state="degraded"} == 1) > 0
      for: 5m
      labels:
        issue: Longhorn volumes are Degraded.
        severity: warning
    # A strict-local volume holds exactly one replica, so an unschedulable one
    # is a surplus replica. Longhorn then rejects every update to the volume,
    # including the detach on the next pod restart.
    - alert: LonghornStrictLocalReplicaUnschedulable
      annotations:
        description: Longhorn strict-local volume {{`{{$labels.volume}}`}} for the PVC {{`{{$labels.pvc}}`}} in the {{`{{$labels.pvc_namespace}}`}} namespace has had an
          unschedulable replica ({{`{{$labels.reason}}`}}) for more than 15 minutes. Delete the stopped replica that has no node before the volume next detaches.
        summary: Longhorn strict-local volume {{`{{$labels.volume}}`}} has an unschedulable replica
        custom_link_text: volume
        custom_link_url: https://{{ .Values.longhorn.ingress.host }}/#/volume/{{`{{$labels.volume}}`}}
      expr: kube_longhorn_volume_status_condition{type="Scheduled", data_locality="strict-local"} == 0
      for: 15m
      labels:
        issue: Longhorn strict-local volume {{`{{$labels.volume}}`}} has an unschedulable replica.
        severity: warning
    - alert: LonghornNodeStorageWarning
      annotations:
        description: The used storage of node {{`{{$labels.node}}`}} is at {{`{{$value}}`}}% capacity for
          more than 5 minutes.
        summary:  The used storage of node is over 70% of the capacity.
      expr: (longhorn_node_storage_usage_bytes / longhorn_node_storage_capacity_bytes) * 100 > 70
      for: 5m
      labels:
        issue: The used storage of node {{`{{$labels.node}}`}} is high.
        severity: warning
        custom_link_text: node
        custom_link_url: https://{{ .Values.longhorn.ingress.host }}/#/node?field=name&value={{`{{$labels.node}}`}}
    - alert: LonghornDiskStorageWarning
      annotations:
        description: The used storage of disk {{`{{$labels.disk}}`}} on node {{`{{$labels.node}}`}} is at {{`{{$value}}`}}% capacity for
          more than 5 minutes.
        summary:  The used storage of disk is over 70% of the capacity.
        custom_link_text: node
        custom_link_url: https://{{ .Values.longhorn.ingress.host }}/#/node?field=name&value={{`{{$labels.node}}`}}
      expr: (longhorn_disk_usage_bytes / longhorn_disk_capacity_bytes) * 100 > 70
      for: 5m
      labels:
        issue: The used storage of disk {{`{{$labels.disk}}`}} on node {{`{{$labels.node}}`}} is high.
        severity: warning
    - alert: LonghornNodeDown
      annotations:
        description: There are {{`{{$value}}`}} Longhorn nodes which have been offline for more than 5 minutes.
        summary: Longhorn nodes is offline
      expr: (avg(longhorn_node_count_total) or on() vector(0)) - (count(longhorn_node_status{condition="ready"} == 1) or on() vector(0)) > 0
      for: 5m
      labels:
        issue: There are {{`{{$value}}`}} Longhorn nodes offline
        severity: critical
    - alert: LonghornInstanceManagerCPUUsageWarning
      annotations:
        description: Longhorn instance manager {{`{{$labels.instance_manager}}`}} on {{`{{$labels.node}}`}} has CPU Usage / CPU request is {{`{{$value}}`}}% for
          more than 10 minutes.
        summary: Longhorn instance manager {{`{{$labels.instance_manager}}`}} on {{`{{$labels.node}}`}} has CPU Usage / CPU request is over 300%.
      expr: (longhorn_instance_manager_cpu_usage_millicpu/longhorn_instance_manager_cpu_requests_millicpu) * 100 > 300
      for: 10m
      labels:
        issue: Longhorn instance manager {{`{{$labels.instance_manager}}`}} on {{`{{$labels.node}}`}} consumes 3 times the CPU request.
        severity: warning
    # A failed Backup object stays in Error until it is deleted, so this keeps
    # firing after a later backup of the same volume succeeds. Backups of
    # volumes that no longer exist are ignored: the UI lists backups per
    # volume, so those can only be cleaned up with
    # `kubectl -n longhorn-system delete backups.longhorn.io <name>`.
    - alert: LonghornBackupFailed
      annotations:
        description: Longhorn backup {{`{{$labels.backup}}`}} of volume {{`{{$labels.volume}}`}} is in the Error state.
        summary: Longhorn backup {{`{{$labels.backup}}`}} failed
        custom_link_text: backups
        custom_link_url: https://{{ .Values.longhorn.ingress.host }}/#/backup
      expr: longhorn_backup_state == 4 and on (volume) group by (volume) (longhorn_volume_robustness)
      for: 5m
      labels:
        issue: Longhorn backup {{`{{$labels.backup}}`}} of volume {{`{{$labels.volume}}`}} failed.
        severity: warning
    # backup-daily runs at 02:30, so 36h means at least one run was missed.
    # Volumes that were never backed up report 0 and are skipped.
    - alert: LonghornVolumeBackupStale
      annotations:
        description: The newest backup of the PVC {{`{{$labels.pvc}}`}} in the {{`{{$labels.pvc_namespace}}`}} namespace is {{`{{$value | humanizeDuration}}`}} old.
        summary: Longhorn volume {{`{{$labels.pvc_namespace}}`}}/{{`{{$labels.pvc}}`}} has not been backed up recently
        custom_link_text: volume
        custom_link_url: https://{{ .Values.longhorn.ingress.host }}/#/volume/{{`{{$labels.volume}}`}}
      expr: (time() - longhorn_volume_last_backup_at) > 36 * 3600 and longhorn_volume_last_backup_at > 0
      for: 1h
      labels:
        issue: Longhorn volume for PVC {{`{{$labels.pvc}}`}} in the {{`{{$labels.pvc_namespace}}`}} namespace has a stale backup.
        severity: warning
