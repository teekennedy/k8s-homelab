# Longhorn 1.12 renders its own restrictive NetworkPolicy for longhorn-manager
# (networkPolicies.restrictInternalTraffic, on by default), which only admits
# Longhorn's own components on TCP/9500 -- the port the longhorn-backend
# ServiceMonitor scrapes for metrics. That policy isn't ours to edit (it comes
# from the charts.longhorn.io dependency, not this chart's templates), so this
# is an additive allow rule rather than a replacement: NetworkPolicies for the
# same pods are OR'd together, so this opens the one port Prometheus needs
# without touching Longhorn's own lockdown.
#
# See https://longhorn.io/docs/1.12.1/monitoring/prometheus-and-grafana-setup/
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-to-longhorn-manager
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring-system
      ports:
        - protocol: TCP
          port: 9500
---
# The UI has no auth of its own; the oauth2-proxy instance reverse-proxies it.
# This keeps the UI reachable ONLY from that proxy's pods, so nothing in-cluster
# can bypass SSO by hitting the longhorn-frontend Service directly.
# kubectl port-forward is unaffected and remains the break-glass path.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-ui-sso-only
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: longhorn-ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oauth2-proxy
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: http
          protocol: TCP
