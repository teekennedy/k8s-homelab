# https://github.com/longhorn/charts/blob/v1.8.x/charts/longhorn/values.yaml
longhorn:
  defaultSettings:
    allowCollectingLonghornUsageMetrics: false
    defaultDataLocality: best-effort
    # Only nodes that have the label node.longhorn.io/create-default-disk=true will get a disk added at /var/lib/longhorn
    createDefaultDiskLabeledNodes: true
    # -- Maximum number of engines that are allowed to concurrently upgrade on each node after Longhorn Manager is upgraded. When the value is "0", Longhorn does not automatically upgrade volume engines to the new default engine image version.
    concurrentAutomaticEngineUpgradePerNodeLimit: "1"
    # -- Maximum number of replicas that can be concurrently rebuilt on each node. Increase this to speed up replica evacuation during node drains.
    concurrentReplicaRebuildPerNodeLimit: "1"
    # -- Policy for handling node drains. Blocks the drain only while the node holds the last healthy replica of a volume and that replica is running.
    # The default (block-if-contains-last-replica) also blocks on stopped replicas, so every single-replica volume would stall the drain until kured's drainTimeout forces the reboot.
    nodeDrainPolicy: allow-if-replica-is-stopped
    # -- Default number of replicas for new volumes. With 3 nodes and good backup coverage, 2 replicas provides better fault tolerance during node maintenance.
    defaultReplicaCount: "2"
    # -- Timeout in seconds for communication between the engine and replica processes. Increase this to tolerate I/O spikes from applications like Prometheus compaction.
    engineReplicaTimeout: "16"
    # -- Upgrade Checker that periodically checks for new Longhorn versions. When a new version is available, a notification appears on the Longhorn UI. This setting is enabled by default
    upgradeChecker: false
  defaultBackupStore:
    # CIFS export on borg-2 (/storage/nas/backups/longhorn). Uses host networking for mTLS.
    backupTarget: cifs://borg-2.msng.to/longhorn-backup?cifsOptions=uid=1201,gid=1201,mfsymlinks,noserverino
    backupTargetCredentialSecret: cifs-secret
    # -- Number of seconds that Longhorn waits before checking the default backupstore for new backups.
    # This setting affects Disaster Recovery volumes which are incrementally restored from backup on an ongoing basis.
    # See https://longhorn.io/docs/archives/1.7.1/concepts/#34-backupstore-update-intervals-rto-and-rpo
    pollInterval: ~
  # The UI has no auth of its own, so it is not exposed directly: the
  # oauth2-proxy instance below owns longhorn.msng.to and reverse-proxies it.
  ingress:
    enabled: false
  metrics:
    serviceMonitor:
      enabled: true
      # Manager-internal client and workqueue histograms; nothing reads them.
      metricRelabelings:
        - action: drop
          sourceLabels: [__name__]
          regex: longhorn_(rest_client|workqueue)_[a-z_]+
  persistence:
    reclaimPolicy: Retain
  longhornManager:
    resources:
      requests:
        cpu: 400m
        memory: 768Mi
      limits:
        memory: 1Gi
  longhornGlobalManager:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 192Mi

# --- SSO front door ---------------------------------------------------------
# A dedicated oauth2-proxy instance reverse-proxying the Longhorn UI. No
# trusted_ips bypass: every client, LAN included, must authenticate, and only
# longhorn-admins (or full-admin) are admitted. templates/network-policy.yaml
# limits the UI pods to this proxy so nothing in-cluster can skip the gate.
#
# Authelia's own storage is on Longhorn, so a Longhorn outage can take SSO down
# with it. Break-glass access that needs no SSO:
#   kubectl -n longhorn-system port-forward svc/longhorn-frontend 8080:80

# The repo-specific glue, from the oauth2-proxy-instance library chart
# (templates/oauth2-proxy-instance.yaml).
oauth2ProxyInstance:
  # Must equal the Authelia client_id and the oidcClientSecrets.clients key in
  # k8s/platform/auth-system/values.yaml.
  clientId: longhorn
  # Must equal oauth2-proxy.config.existingSecret below, and
  # oidcClientSecrets.clients.longhorn must point at longhorn-system/<this name>.
  secretName: longhorn-oauth2-proxy-secrets
  middleware:
    # Reverse proxy, not a Traefik forwardAuth target.
    enabled: false

# https://github.com/oauth2-proxy/manifests/blob/main/helm/oauth2-proxy/values.yaml
oauth2-proxy:
  # Pin the Service name so the HTTPRoute backendRef is stable.
  fullnameOverride: longhorn-auth
  config:
    existingSecret: longhorn-oauth2-proxy-secrets
    configFile: |-
      provider = "oidc"
      oidc_issuer_url = "https://authelia.msng.to"
      redirect_url = "https://longhorn.msng.to/oauth2/callback"
      # Host-scoped cookie with a distinct name so it never collides with the
      # public instance's Domain=msng.to cookie on this subdomain.
      cookie_domains = ["longhorn.msng.to"]
      cookie_name = "_oauth2_proxy_longhorn"
      cookie_expire = "168h"
      cookie_refresh = "1h"
      cookie_secure = true
      cookie_httponly = true
      cookie_samesite = "lax"
      # A cookie of its own per sign-in attempt. An expired session sends
      # every request of a page load to sign in at once, and with one shared
      # cookie the callback is checked against the last attempt's PKCE
      # verifier rather than its own: a 500.
      cookie_csrf_per_request = true
      cookie_csrf_expire = "5m"
      whitelist_domains = ["longhorn.msng.to"]
      email_domains = ["*"]
      reverse_proxy = true
      code_challenge_method = "S256"
      # groups scope so allowed_groups can be enforced.
      scope = "openid profile email groups"
      # NO trusted_ips: internal clients must authenticate.
      real_client_ip_header = "X-Real-Ip"
      skip_provider_button = true
      allowed_groups = ["longhorn-admins", "full-admin"]
      upstreams = ["http://longhorn-frontend.longhorn-system.svc.cluster.local/"]
      trusted_proxy_ips = ["10.42.0.0/16"]

  replicaCount: 2

  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

  service:
    portNumber: 80

  # Exposed via the subchart's own HTTPRoute on the internal traefik-gateway's
  # websecure listener. No entrypoint annotation, so external-dns-internal
  # resolves the hostname to the gateway VIP. The namespace must carry the
  # internal-gateway-access label for the gateway to admit the route; see
  # syncPolicy.managedNamespaceMetadata in application.yaml.
  #
  # group, kind and weight are what the API server defaults them to. Spelled
  # out, rules included, because server-side apply otherwise reports the
  # defaulted fields as drift.
  ingress:
    enabled: false
  gatewayApi:
    enabled: true
    gatewayRef:
      group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: kube-system
      sectionName: websecure
    hostnames:
      - longhorn.msng.to
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - group: ""
            kind: Service
            # oauth2-proxy.fullnameOverride and service.portNumber.
            name: longhorn-auth
            port: 80
            weight: 1
