# Full nginx.conf (not a conf.d snippet): the Deployment overrides the image's
# ENTRYPOINT to run `nginx -c` directly, skipping docker-entrypoint.sh. Those
# entrypoint scripts rewrite files under /etc/nginx, which a read-only root
# filesystem forbids.
#
# Every path nginx would otherwise write to lives under /tmp (an emptyDir), for
# the same reason. No `user` directive — the container already runs as uid 101.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  include       /etc/nginx/mime.types;
  default_type  text/html;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  # This server only ever answers Traefik's internal sub-request for the error
  # body; logging every one of them would duplicate Traefik's own access log
  # during exactly the incidents when logs matter most.
  access_log off;
  server_tokens off;

  sendfile on;
  keepalive_timeout 15;

  server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    # Traefik fetches the body at whatever path the errors middleware's `query`
    # names, but the page is the same for every URL that 503s, so serve it
    # unconditionally rather than depending on that path matching a file.
    location / {
      try_files /index.html =404;
      add_header Cache-Control "no-store" always;
    }
  }
}
