<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!-- The page checks back on its own so a recovered backend takes over without
     anyone reaching for reload. Kept at 60s: long enough not to hammer, and it
     doubles as the cadence for a fresh reason line. -->
<meta http-equiv="refresh" content="60">
<title>We&rsquo;ll be right back</title>
<style>
  :root {
    --void:     #0b0c0a;
    --phosphor: #e8e4d9;
    --amber:    #d9a441;
    --cyan:     #4fb3b8;
    --carmine:  #b3423a;

    --display: ui-sans-serif, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--void);
    color: var(--phosphor);
    font-family: var(--display);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(0.9rem, 2.5vh, 1.6rem);
    padding: clamp(0.75rem, 3vw, 2.5rem);
    overflow: hidden;
  }

  /* ── The tube ─────────────────────────────────────────────────
     A CRT is 4:3 whatever the window is, so the screen is sized by
     whichever of width or height runs out first and keeps its ratio. The
     picture then fills it edge to edge, with every word of copy placed
     inside the test pattern rather than under it. */
  .set {
    position: relative;
    /* The third term is the height budget converted to a width: viewport height
       less the page padding, the gap and the line below the tube. */
    width: min(64rem, 100%, calc((100dvh - 5.5rem) * 4 / 3));
    aspect-ratio: 4 / 3;
    /* Text inside the picture scales with the tube, not the viewport, so the
       composition holds at every size. 1cqw = 1% of the screen's width. */
    container-type: inline-size;
    background:
      radial-gradient(120% 90% at 50% 42%, #131512 0%, var(--void) 62%, #050605 100%);
    /* Not a rounded rectangle: the sides bow out and the corners tuck in,
       which is the profile of an actual tube. The shape lives in an SVG
       clipPath (see #crt) because only objectBoundingBox units scale with the
       element — CSS path() takes fixed pixel coordinates and would clip the
       tube down to a 1px corner. The radius is the floor if the clip is
       unsupported. */
    border-radius: 9% / 12%;
    clip-path: url(#crt);
    box-shadow: inset 0 0 clamp(3rem, 9vw, 7rem) rgba(0, 0, 0, 0.75);
  }

  /* Kept out of the flow: it only carries the clip path. */
  .defs { position: absolute; width: 0; height: 0; }

  .pattern, .scan, .hum, .overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .scan, .hum, .overlay { pointer-events: none; }

  /* ── Copy, positioned against the pattern ─────────────────────
     Every block is anchored by its centre to a point in the SVG's 480×360
     coordinate space (x/480, y/360 as percentages), so type and pattern stay
     locked together no matter how the tube is scaled. */
  .overlay > * {
    position: absolute;
    left: 50%;
    transform: translate(-50%, -50%);
    margin: 0;
    text-align: center;
  }

  .hud {
    font-family: var(--mono);
    font-size: 1.67cqw;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    white-space: nowrap;
    color: #8d9086;
  }

  /* In the bands the circle leaves clear, between it and the frame line. */
  .hud.status { top: 12.8%; color: var(--carmine); }
  .hud.code   { top: 88.6%; color: var(--amber); }

  .hud.status::before {
    content: "";
    display: inline-block;
    vertical-align: middle;
    width: 0.5em;
    height: 0.5em;
    margin-right: 0.6em;
    margin-top: -0.15em;
    border-radius: 50%;
    background: var(--carmine);
    box-shadow: 0 0 0.6em var(--carmine);
  }

  /* The station plate, where the portrait used to sit: the headline takes the
     most prominent position on the card, with the ident above it.
     The plate is drawn here rather than as an SVG rect so the box is always
     exactly the size of the type it frames — an SVG rect has to be sized in
     advance, and any floor applied to the headline pushes the words out of it. */
  .plate {
    top: 33.3%;
    width: fit-content;
    max-width: 46%;
    padding: 1.5cqw 1.6cqw;
    background: #0b0c0a;
    border: 0.32cqw solid var(--amber);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.55em;
  }

  .ident {
    font-family: var(--mono);
    font-size: 1.45cqw;
    letter-spacing: 0.34em;
    text-indent: 0.34em;
    color: var(--amber);
  }

  h1 {
    /* The UA's default heading margin is what pushes the ident off the top of
       the plate; the flex gap above sets the spacing instead. */
    margin: 0;
    font-size: 4.17cqw;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-indent: 0.08em;
    text-transform: uppercase;
    line-height: 1.05;
    /* Misconverged CRT guns. */
    text-shadow:
      -0.022em 0 0 rgba(179, 66, 58, 0.55),
       0.022em 0 0 rgba(79, 179, 184, 0.55);
  }

  /* The announcement and the rotating line are anchored as one block rather
     than separately: when a floor makes the type large relative to the tube,
     two independent anchors grow into each other. Stacked in a flex column
     they can only ever push outward, into the space the pattern leaves. */
  .message {
    top: 66.4%;
    width: 49%;
    display: flex;
    flex-direction: column;
    gap: 1.4cqw;
  }

  .lede {
    margin: 0;
    font-size: 2.4cqw;
    line-height: 1.35;
    color: #a8aa9e;
    text-wrap: balance;
  }

  .svc {
    color: var(--phosphor);
    font-family: var(--mono);
    letter-spacing: 0.04em;
  }

  /* The rotating line, set apart from the announcement above it. No balancing
     here: it makes a two-line sentence fall to three, which is a line the
     circle has no room for. */
  .reason {
    margin: 0 auto;
    /* The circle narrows fast at this height, so the block is capped near the
       chord width there. */
    max-width: 82%;
    font-family: var(--mono);
    font-size: 1.8cqw;
    line-height: 1.4;
    color: var(--amber);
    opacity: 0.92;
  }

  /* ── Outside the tube ────────────────────────────────────────── */
  .aside {
    flex: none;
    margin: 0;
    text-align: center;
    font-size: clamp(0.72rem, 1.6vw, 0.88rem);
    color: #83867c;
  }

  .aside a {
    color: var(--cyan);
    text-decoration-color: rgba(79, 179, 184, 0.45);
    text-underline-offset: 0.22em;
  }

  .aside a:hover,
  .aside a:focus-visible { text-decoration-color: var(--cyan); }

  /* ── CRT atmosphere ──────────────────────────────────────────── */
  .scan {
    background: repeating-linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0.28) 0 1px,
      transparent 1px 3px
    );
    mix-blend-mode: multiply;
  }

  /* The one moving part: the mains-hum bar drifting up the tube. */
  .hum {
    background: linear-gradient(
      to bottom,
      transparent 0%,
      rgba(232, 228, 217, 0.048) 46%,
      rgba(232, 228, 217, 0.058) 50%,
      rgba(232, 228, 217, 0.048) 54%,
      transparent 100%
    );
    height: 42%;
    inset: auto 0 0 0;
    animation: roll 13s linear infinite;
  }

  @keyframes roll {
    from { transform: translateY(0); }
    to   { transform: translateY(-260%); }
  }

  /* Page-load tune-in: the picture collapses in from a scan line and settles.
     The copy is anchored by a centring transform, so it fades rather than
     scales — animating transform here would tear it off its position. */
  .pattern { animation: tune 620ms cubic-bezier(0.2, 0.8, 0.25, 1) both; }
  .overlay > * { animation: settle 620ms ease-out both; }

  .plate       { animation-delay: 200ms; }
  .message     { animation-delay: 280ms; }
  .hud         { animation-delay: 360ms; }
  .aside       { animation: settle 620ms ease-out 440ms both; }

  @keyframes tune {
    from { opacity: 0; transform: scaleY(0.02); filter: brightness(2.4); }
    60%  { opacity: 1; }
    to   { opacity: 1; transform: scaleY(1); filter: none; }
  }

  @keyframes settle {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .hum { display: none; }
    .pattern, .overlay > *, .aside { animation: none !important; }
  }

  /* On a small tube the copy, sized purely off it, would fall under a readable
     size. The floors below win there; the plate and the two copy blocks are
     widened to match so nothing spills outside the circle. SVG geometry is
     settable from CSS, which is what lets the plate grow with the type it
     holds. Keyed to the tube's own width rather than the viewport's, since a
     short landscape window also yields a small tube. */
  @container (max-width: 440px) {
    .hud     { font-size: max(0.5rem, 1.67cqw); }
    .ident   { font-size: max(0.44rem, 1.45cqw); letter-spacing: 0.28em; text-indent: 0.28em; }
    h1       { font-size: max(0.95rem, 4.17cqw); }
    .lede    { font-size: max(0.58rem, 2.4cqw); }
    .reason  { font-size: max(0.52rem, 1.8cqw); max-width: 100%; }
    /* Width is set by the circle's chord at this height, not by what keeps the
       line count down: a line wider than the chord breaks out of the picture,
       whereas an extra line only grows the block downward into space the
       hidden wedge has freed. */
    .message { top: 70%; width: 44%; }
    .plate   { max-width: 52%; }

    /* Floored type makes the copy block taller relative to the tube, and at
       this size the wedge is a 70px smudge nobody can read a greyscale off.
       Dropping it hands the block the room it needs. */
    .greyscale { display: none; }

    /* Same reasoning for the corner targets: their wedge lines are under a
       pixel wide once the tube is this small, so they alias into four grey
       blobs. The rings stay — those still read as circles. */
    .focus-detail { display: none; }
  }

  /* Below this the floors above are themselves too big: two lines of body copy
     no longer fit the chord, and the block grows past the bottom of the circle.
     The headline holds its size — it is the one line that has to carry. */
  @container (max-width: 330px) {
    .lede   { font-size: max(0.52rem, 2.4cqw); }
    .reason { font-size: max(0.47rem, 1.8cqw); }
  }
</style>
</head>
<body>
  <svg class="defs" aria-hidden="true">
    <defs>
      <clipPath id="crt" clipPathUnits="objectBoundingBox">
        <!-- A true superellipse, |x|^6.5 + |y|^6.5 = 1, sampled at 96 points and
             smoothed through them so curvature is continuous the whole way
             round. Building it as straight-ish sides joined to corner arcs
             leaves a tangent break at each join, which shows as a pinch where
             the corner ends. There are no joins here — one uniform shape.
             The exponent sets the squareness: 2 is an ellipse, higher is
             boxier; 6.5 puts the corner ~9.6% in from each edge.

             The samples are distributed by a 50/50 blend of arc length and
             turning angle, not by arc length alone. On a shape this square,
             nearly all the length is on the flats and nearly all the curvature
             is in the corners, so even spacing starves exactly the part that
             needs points. The blend holds the fit within 0.03 units of the

  <main class="set">
    <!-- Test pattern in the RCA "Indian-head" arrangement, minus the portrait:
         a castellated frame that bows with the tube, a crosshatch linearity
         grid, one large circle with four corner circles, converging resolution
         wedges, a burst block and a greyscale step wedge. The copy sits in the
         gaps the pattern leaves for it — see the .overlay below. -->
    <svg class="pattern" viewBox="0 0 480 360" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <!-- Offset so grid lines land on the centre of the frame (240, 180). -->
        <pattern id="grid" x="0" y="20" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M40 0H0V40" fill="none" stroke="#34382f" stroke-width="1"/>
        </pattern>

        <!-- Frequency bursts: four bar packs of increasing line density. -->
        <pattern id="b1" width="8" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#e8e4d9"/></pattern>
        <pattern id="b2" width="6" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="4" fill="#e8e4d9"/></pattern>
        <pattern id="b3" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="4" fill="#e8e4d9"/></pattern>
        <pattern id="b4" width="3" height="4" patternUnits="userSpaceOnUse"><rect width="1.5" height="4" fill="#e8e4d9"/></pattern>

        <!-- Corner beam-focus targets: each corner circle carries a miniature of
             the centre target — a ringed bullseye with four converging wedges
             on the axes — which is what the RCA card puts there. Focus and
             convergence fall off worst at the corners, so the same check is
             repeated where the deflection is hardest and read against the
             centre one.
             Drawn at 0,0 so each <use> only carries an x/y. -->
        <g id="focus-ring">
          <circle r="26" fill="none" stroke="#e8e4d9" stroke-width="1.3"/>
        </g>

        <!-- One wedge, pointing east; the other three are rotations of it. The
             lines converge toward the bullseye without meeting, so the point
             where they merge into one grey stroke is the resolution reading. -->
        <g id="focus-wedge" fill="none" stroke="#e8e4d9" stroke-width="0.9">
          <path d="M9.5 -0.9L25 -4.5M9.5 -0.45L25 -2.25M9.5 0L25 0M9.5 0.45L25 2.25M9.5 0.9L25 4.5"/>
        </g>

        <g id="focus-detail">
          <use href="#focus-wedge"/>
          <use href="#focus-wedge" transform="rotate(90)"/>
          <use href="#focus-wedge" transform="rotate(180)"/>
          <use href="#focus-wedge" transform="rotate(270)"/>
          <!-- Filled void first so the wedge apexes stop at the bullseye. -->
          <circle r="8" fill="#0b0c0a"/>
          <g fill="none" stroke="#e8e4d9" stroke-width="1.1">
            <circle r="8"/>
            <circle r="5.6"/>
            <circle r="3.2"/>
          </g>
        </g>

        <!-- The same superellipse as the tube, inset to the frame line, so the
             raster stops where the picture does. -->

<script>
(function () {
  // The errors middleware swaps the body server-side, so the address bar still
  // holds the original host — the first label names the service with no
  // per-service configuration anywhere.
  var host = (location.hostname || "").toLowerCase();
  var parts = host.split(".");
  var label = parts[0];
  var named =
    parts.length > 2 &&               // apex ("msng.to") names no service
    !/^\d+$/.test(label) &&           // leading octet of an IPv4 address
    !/^(www|localhost)$/.test(label) &&
    /^[a-z0-9][a-z0-9-]{0,29}$/.test(label);

  if (named) {
    var name = label.toUpperCase();
    document.getElementById("svc").textContent = name;
    document.title = name + " — We’ll be right back";
  }

  // One reason per load. The 60s meta refresh means a fresh one every minute a
  // visitor leaves the page open, which is the whole point of the bit.

  var reasons = [
    "The red light started blinking and won't stop.",
    "Someone is holding a screwdriver with great confidence.",
    "Is it DNS? Of course. It's always DNS.",
    "It worked yesterday, I swear.",
    "The servers formed a union and are negotiating terms.",
    "The 'harmless, one line change' that wasn't.",
    "Patch Tuesday again!? We did that last week.",
    "The problem is somewhere in the house. We are narrowing it down.",
    "We tried downloading more RAM and now have even less.",
    "A very small number was expected to be a much larger one.",
  ];
  document.getElementById("reason").textContent =
    reasons[Math.floor(Math.random() * reasons.length)];
})();
</script>
