# "Please stand by" page served in place of Traefik's bare `No available
# servers` text when a router has no healthy backends. See
# templates/standby.yaml; the middleware is attached to entrypoints below.
standby:
  enabled: true
  replicas: 2
  image:
    repository: nginxinc/nginx-unprivileged
    tag: 1.31.3-alpine
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      memory: 64Mi

# https://github.com/traefik/traefik-helm-chart/blob/master/traefik/VALUES.md
traefik:
  service:
    # Split into separate TCP and UDP services so HTTP/3 (UDP) can coexist with
    # HTTP/1.1+2 (TCP) on port 443. Kubernetes' MixedProtocolLBService is
    # gated/unsupported by some LB implementations (incl. our MetalLB setup),
    # so the chart's recommended workaround is dual Services sharing one VIP.
    # See https://github.com/kubernetes/kubernetes/issues/47249#issuecomment-587960741
    single: false
    annotations:
      metallb.io/address-pool: internal
      metallb.io/loadBalancerIPs: 10.69.80.100
      # Allow the TCP and UDP services to share the same MetalLB-assigned IP.
      # The value must match on every service that wants to share the VIP.
      metallb.io/allow-shared-ip: traefik-public
    spec:
      loadBalancerClass: metallb
  tlsStore:
    default:
      defaultCertificate:
        secretName: wildcard-tls-certificate

  providers:
    kubernetesGateway:
      enabled: true

  # Gateway API entrypoints. The default gateway (traefik-gateway in kube-system)
  # only accepts routes from its own namespace; instead of `from: All`, each
  # listener opens to HTTPRoutes in any namespace carrying the matching opt-in
  # label (apps set it via their ArgoCD Application's managedNamespaceMetadata),
  # so a namespace can't bind a hostname unintentionally. The web/websecure
  # listeners are internal-only (VIP 10.69.80.100, `internal-gateway-access`);
  # the websecurepublic listener is the public path (VIP 10.69.80.120 + CrowdSec,
  # `external-gateway-access`) and is the Gateway API equivalent of opting an
  # Ingress into the wspublic entrypoint. All HTTPS listeners terminate TLS with
  # the *.msng.to wildcard cert so routes get real HTTPS (required for
  # OIDC/oauth2-proxy on internal hosts).
  gateway:
    listeners:
      web:
        port: 8000
        protocol: HTTP
        namespacePolicy:
          from: Selector
          selector:
            matchLabels:
              internal-gateway-access: "true"
      websecure:
        port: 8443
        protocol: HTTPS
        certificateRefs:
          - group: ''
            kind: Secret
            name: wildcard-tls-certificate
        namespacePolicy:
          from: Selector
          selector:
            matchLabels:
              internal-gateway-access: "true"
      # Public listener. Port 8444 is the `wspublic` entrypoint's container port,
      # so Traefik's listener->entrypoint port-match binds HTTPRoutes attached
      # here to that entrypoint: they egress on the public VIP (10.69.80.120) and
      # inherit its CrowdSec bouncer middleware and HTTP/3 config, mirroring what
      # a `router.entrypoints: wspublic` Ingress annotation gives today. Public
      # exposure stays opt-in and double-locked: a route must BOTH name this
      # listener (parentRefs sectionName: websecurepublic) AND live in a namespace
      # labeled `external-gateway-access: "true"` (apps opt in via their ArgoCD
      # Application's managedNamespaceMetadata), so naming the listener alone
      # can't publish a hostname from an unlabeled namespace.
      websecurepublic:
        port: 8444
        protocol: HTTPS
        certificateRefs:
          - group: ''
            kind: Secret
            name: wildcard-tls-certificate
        namespacePolicy:
          from: Selector
          selector:
            matchLabels:
              external-gateway-access: "true"
  global:
    checkNewVersion: false
    sendAnonymousUsage: false
  deployment:
    replicas: 3
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    # Fetch the CrowdSec bouncer plugin into a local volume at pod startup so
    # Traefik doesn't need to download it from plugins.traefik.io on every
    # start. A cold cluster restart caused plugins.traefik.io to be unreachable
    # for 2/3 traefik pods, which disabled plugins for the pod's lifetime and
    # broke every router on the wspublic entrypoint (the bouncer is its
    # default middleware).
    additionalVolumes:
      - name: plugins-local
        emptyDir: {}
      # Writable /tmp for the plugin-fetch initContainer (its rootfs is RO)
      - name: plugin-fetch-tmp
        emptyDir: {}
    initContainers:
      - name: fetch-crowdsec-bouncer-plugin
        image: alpine/git:v2.52.0
        # HOME defaults to /root which we can't write to (non-root user + RO rootfs).
        # Point git at /tmp (a writable emptyDir) for its config dotfiles.
        env:
          - name: HOME
            value: /tmp
        command:
          - sh
          - -c
          - |
            set -eu
            PLUGIN_VERSION=v1.5.0
            PLUGIN_DIR=/plugins-local/src/github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
            for attempt in 1 2 3 4 5; do
              rm -rf "$PLUGIN_DIR"
              mkdir -p "$(dirname "$PLUGIN_DIR")"
              if git clone --depth 1 --branch "$PLUGIN_VERSION" \
                   https://github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin.git \
                   "$PLUGIN_DIR"; then
                echo "plugin cloned on attempt $attempt"
                exit 0
              fi
              echo "clone attempt $attempt failed, retrying in 5s..."
              sleep 5
            done
            echo "failed to clone crowdsec-bouncer plugin after 5 attempts" >&2
            exit 1
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          readOnlyRootFilesystem: true
        volumeMounts:
          - name: plugins-local
            mountPath: /plugins-local
          - name: plugin-fetch-tmp
            mountPath: /tmp
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
  # Required so the non-root plugin-fetch initContainer can write to its
  # emptyDir volumes (plugins-local and /tmp). The chart's default
  # podSecurityContext runs everything as uid/gid 65532 but doesn't set
  # fsGroup, leaving added emptyDirs owned root:root.
  podSecurityContext:
    runAsGroup: 65532
    runAsNonRoot: true
    runAsUser: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  nodeSelector:
    node-role.kubernetes.io/control-plane: "true"
  ports:
    # Ingress resources without an explicit router.entrypoints annotation are
    # attached to every entrypoint, including this default internal one - not
    # just `webpublic`/`wspublic`. Since Ingress-published DNS records point at
    # the internal VIP (traefik's default Service), that made plain HTTP on
    # `web` a silent bypass of the redirect configured on `webpublic`.
    web:
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
    websecure:
      http3:
        enabled: true
        advertisedPort: 443
      http:
        middlewares:
          - kube-system-traefik-standby@kubernetescrd
    webpublic:
      port: 8001
      expose:
        default: false
      exposedPort: 80
      protocol: TCP
      http:
        redirections:
          entryPoint:
            to: wspublic
            scheme: https
    # Entrypoint name kept ≤9 chars so the chart's auto-generated http3
    # container port (`wspublic-http3`, 14 chars) doesn't collide with the
    # TCP port name after the chart's 15-char truncation in
    # `traefik.portname`. The previous name `websecurepublic` was already
    # 15 chars, so the http3 variant truncated back to the same string and
    # produced a duplicate container port in the Deployment.
    wspublic:
      port: 8444
      expose:
        default: false
      exposedPort: 443
      protocol: TCP
      http:
        tls:
          enabled: true
        middlewares:
          # Listed before the bouncer so it wraps it: the errors middleware only
          # sees a response it sits outside of.
          - kube-system-traefik-standby@kubernetescrd
          - crowdsec-crowdsec-bouncer@kubernetescrd
      http3:
        enabled: true
        advertisedPort: 443
      # Disable read timeout so large uploads don't die mid-transfer
      transport:
        respondingTimeouts:
          readTimeout: "0s"
    terrariapublic:
      port: 7777
      expose:
        default: false
      exposedPort: 7777
      protocol: TCP
    metrics:
      port: 9101
      expose:
        default: true
      exposedPort: 9101
      protocol: TCP

  # Use local plugin mode for the CrowdSec bouncer. The plugin source is
  # fetched by the `fetch-crowdsec-bouncer-plugin` initContainer above into a
  # shared emptyDir volume (`plugins-local`), which the chart auto-mounts on
  # the Traefik container via the `type: localPath` config below. Traefik
  # then reads the plugin source from /plugins-local/src/<moduleName> instead
  # of downloading from plugins.traefik.io on every startup.
  experimental:
    localPlugins:
      crowdsec-bouncer:
        type: localPath
        moduleName: "github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
        volumeName: plugins-local
        mountPath: /plugins-local

  # Enable access logs for CrowdSec agent to parse
  accessLog:
    enabled: true
    format: json
    fields:
      headers:
        defaultMode: drop
        names:
          User-Agent: keep
          X-Forwarded-For: keep
          X-Real-IP: keep
