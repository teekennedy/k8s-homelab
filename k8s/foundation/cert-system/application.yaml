apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: cert-system
  namespace: argocd
spec:
  destination:
    name: in-cluster
    namespace: cert-system
  ignoreDifferences:
    - jsonPointers:
        - /spec/volumeName
        - /spec/storageClassName
        # Longhorn stores the expanded capacity in bytes (e.g. 10737418240) rather
        # than the human-readable form (e.g. 10Gi), causing ArgoCD to see a diff
        # and attempt a patch that Kubernetes rejects as reducing the storage request.
        - /spec/resources/requests/storage
      kind: PersistentVolumeClaim
    - jsonPointers:
        - /data
      kind: Secret
      name: lldap-authelia-bind-user
      namespace: auth-system
    - jsonPointers:
        - /data
      kind: Secret
      name: authelia-secrets
      namespace: auth-system
    - jsonPointers:
        - /data
      kind: Secret
      name: gitea-admin-secret
      namespace: gitea
    - jsonPointers:
        - /data
      kind: Secret
      name: monitoring-system-grafana
      namespace: monitoring-system
    - jsonPointers:
        - /data
      kind: Secret
      name: alertmanager-monitoring-system-kube-pro
      namespace: monitoring-system
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    # step-ca ConfigMaps are populated by the bootstrap Job (on first install) and by the
    # step-ca-acme-provisioner Job (post-install/upgrade). Helm renders them without data
    # (since inject is disabled); ignoreDifferences prevents ArgoCD from wiping their contents.
    - kind: ConfigMap
      name: step-ca-config
      namespace: cert-system
      jsonPointers:
        - /data
    - kind: ConfigMap
      name: step-ca-certs
      namespace: cert-system
      jsonPointers:
        - /data
    - kind: ConfigMap
      name: step-ca-secrets
      namespace: cert-system
      jsonPointers:
        - /data
  project: default
  source:
    path: k8s/foundation/cert-system
    repoURL: http://gitea-http.gitea:3000/ops/k8s-homelab
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      # selfHeal: false
    retry:
      backoff:
        duration: 1m
        factor: 2
        maxDuration: 16m
      limit: 10
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
