# Idempotently ensures the nixos ACME provisioner exists in step-ca.
# Runs after every install/upgrade; exits immediately if the provisioner is already present.
# If it adds the provisioner, it restarts the step-ca StatefulSet to pick up the updated ConfigMap.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: step-ca-acme-provisioner
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: step-ca-acme-provisioner
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      name: step-ca-acme-provisioner
    spec:
      serviceAccountName: step-ca-acme-provisioner
      restartPolicy: OnFailure
      containers:
        - name: add-provisioner
          image: alpine/kubectl:1.35.0
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail

              apk add --no-cache jq >/dev/null 2>&1

              NS="{{ .Release.Namespace }}"
              CM="step-ca-config"
              STS="step-ca"

              echo "Waiting for $CM ConfigMap to exist..."
              until kubectl get -n "$NS" configmap/"$CM" -o name >/dev/null 2>&1; do
                echo "  not yet available, retrying in 5s..."
                sleep 5
              done

              echo "Waiting for ca.json to be populated..."
              until kubectl get -n "$NS" configmap/"$CM" \
                -o jsonpath='{.data.ca\.json}' 2>/dev/null | \
                jq -e '.authority.provisioners' >/dev/null 2>&1; do
                echo "  ca.json not yet populated, retrying in 5s..."
                sleep 5
              done

              echo "Checking if nixos ACME provisioner already exists..."
              if kubectl get -n "$NS" configmap/"$CM" \
                -o jsonpath='{.data.ca\.json}' | \
                jq -e '.authority.provisioners[] | select(.name == "nixos")' >/dev/null 2>&1; then
                echo "nixos provisioner already present — nothing to do."
                exit 0
              fi

              echo "Adding nixos ACME provisioner..."
              kubectl get -n "$NS" configmap/"$CM" -o json | \
                jq '.data["ca.json"] |= (fromjson | .authority.provisioners += [{"type":"ACME","name":"nixos","forceCN":false,"requireEAB":true}] | tojson)' | \
                kubectl replace -f -

              echo "Restarting $STS StatefulSet to pick up the updated config..."
              kubectl rollout restart -n "$NS" statefulset/"$STS"

              echo "Done."
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: step-ca-acme-provisioner
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: step-ca-acme-provisioner
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "update"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: step-ca-acme-provisioner
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: step-ca-acme-provisioner
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: step-ca-acme-provisioner
    namespace: {{ .Release.Namespace }}
