# k3s CoreDNS loads *.override files into the main .:53 server block and
# *.server files as standalone server blocks. This ConfigMap is mounted at
# /etc/coredns/custom/ via the coredns Deployment in kube-system.
#
# borg-nodes.server: adds internal LAN IP entries for each borg host.
# Required for NFS mounts: the csi-driver-nfs storageclass uses a host-based
# DNS entry as the NFS server address, and pods need to resolve this to a LAN
# IP. Without this, NFS volume mounts would fail because borg-N.msng.to has no
# public DNS record and is unreachable via the cluster's upstream resolvers.
#
# This must be a standalone server block. k3s also injects a hosts plugin for
# NodeHosts into the main .:53 block, and CoreDNS allows only one hosts plugin
# per server block.
{{- if .Values.hosts }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  borg-nodes.server: |
    {{ .Values.publicDomain }}:53 {
      hosts {
        {{- range .Values.hosts }}
        {{ .ip }} {{ .name }}.{{ $.Values.publicDomain }}
        {{- end }}
        fallthrough
      }
      forward . /etc/resolv.conf
    }
{{- end }}
