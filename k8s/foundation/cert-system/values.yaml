nfsMtlsCertSync:
  # Deliberately in values.yaml (not templates/nfs-mtls-cert-sync.yaml) so
  # that renovate can pick it up.
  alpineImage: alpine:3@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6

cert-manager:
  installCRDs: true
  prometheus:
    enabled: true
    servicemonitor:
      enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 192Mi
    limits:
      memory: 256Mi
  cainjector:
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 256Mi
  webhook:
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        memory: 192Mi
  startupapicheck:
    resources:
      requests:
        cpu: 20m
        memory: 96Mi
      limits:
        memory: 192Mi

trust-manager:
  app:
    trust:
      namespace: cert-system
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 192Mi

# OpenSSH user CA backing the deploybot login on the borg hosts.
# See templates/deploybot-ssh-ca.yaml for why this is not a cert-manager issuer.
deploybotSshCa:
  # alpine/kubectl ships kubectl; openssh-keygen is apk-installed at runtime.
  # renovate: datasource=docker depName=alpine/kubectl
  image: alpine/kubectl:1.37.0@sha256:954b65dea0eb140219b440413ede17c2eca205866df350d3c1fbc84d28af14ae
  caSecretName: deploybot-ssh-ca
  certSecretName: deploybot-ssh-cert
  # Namespace the short-lived credential is published into. The RBAC allowing
  # that write lives with the consumer, in k8s/platform/woodpecker.
  targetNamespace: woodpecker
  # Must match services.nixos-selfupdate.user in nix/modules/selfupdate, which
  # is what sshd matches the certificate's principal against.
  principal: deploybot
  # Reissued twice as often as it expires, so there is always an overlap window.
  schedule: "0 */6 * * *"
  validity: 12h
