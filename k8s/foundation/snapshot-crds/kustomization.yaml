apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# VolumeSnapshot and VolumeGroupSnapshot CRDs (snapshot.storage.k8s.io,
# groupsnapshot.storage.k8s.io). Longhorn's csi-snapshotter sidecar watches
# these and errors every few seconds while they are missing.
#
# Only the CRDs: snapshot-controller, which is needed to actually take a
# VolumeSnapshot, is not installed.
#
# Renovate tracks the `?ref=` via its built-in kustomize manager.
resources:
  - github.com/kubernetes-csi/external-snapshotter/client/config/crd?ref=v8.7.0
