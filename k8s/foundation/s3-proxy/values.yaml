image:
  repository: andrewgaul/s3proxy
  tag: sha-871539d@sha256:d436a4c361359737084a375aca64e8f077f28e0e19fc907d53682a814309b5f3

# Capacity of the backups PV
capacity:
  storage: 10Ti

# JVM heap for s3proxy. The jclouds filesystem backend loads all bucket objects
# into memory for listings; the longhorn bucket has ~350k files requiring ~400MB+.
javaOpts: "-Xmx1536m"

resources:
  requests:
    cpu: 50m
    memory: 1Gi
  limits:
    memory: 2Gi
