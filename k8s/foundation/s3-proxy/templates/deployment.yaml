---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3proxy
  namespace: "{{ .Release.Namespace }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: s3proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s3proxy
    spec:
      containers:
        - name: s3proxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            - name: S3PROXY_ENDPOINT
              value: "http://0.0.0.0:8080"
            - name: S3PROXY_AUTHORIZATION
              value: "aws-v2-or-v4"
            - name: JCLOUDS_PROVIDER
              value: "filesystem"
            - name: JCLOUDS_FILESYSTEM_BASEDIR
              value: "/data"
            - name: S3PROXY_JAVA_OPTS
              value: {{ .Values.javaOpts | quote }}
            - name: S3PROXY_IDENTITY
              valueFrom:
                secretKeyRef:
                  name: s3proxy-credentials
                  key: ACCESS_KEY_ID
            - name: S3PROXY_CREDENTIAL
              valueFrom:
                secretKeyRef:
                  name: s3proxy-credentials
                  key: SECRET_ACCESS_KEY
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            runAsNonRoot: true
            runAsUser: 2001 # UID of the s3proxy user on the host
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /data
          resources: {{ toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: s3proxy-backups
