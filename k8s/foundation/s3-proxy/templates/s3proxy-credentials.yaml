---
apiVersion: v1
kind: Secret
metadata:
  name: s3proxy-credentials
  namespace: {{ .Release.Namespace }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: "SECRET_ACCESS_KEY"
    secret-generator.v1.mittwald.de/encoding: "hex"
    secret-generator.v1.mittwald.de/length: "32"
    # Reflect to namespaces that use s3proxy. Reflector leaves the copy in a
    # namespace missing from this list empty, so add each new consumer here.
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: auth-system,crowdsec,forgejo,joplin,longhorn-system,romm
stringData:
  ACCESS_KEY_ID: "homelab-s3proxy"
  # SECRET_ACCESS_KEY is auto-generated as a 32-character hex string.
