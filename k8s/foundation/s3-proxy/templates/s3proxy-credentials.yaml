---
apiVersion: v1
kind: Secret
metadata:
  name: s3proxy-credentials
  namespace: {{ .Release.Namespace }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: "SECRET_ACCESS_KEY"
    secret-generator.v1.mittwald.de/encoding: "hex"
    secret-generator.v1.mittwald.de/length: "32"
    # reflect secret to other namespaces that use s3proxy
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: auth-system,crowdsec,gitea,longhorn-system
stringData:
  ACCESS_KEY_ID: "homelab-s3proxy"
  # SECRET_ACCESS_KEY is auto-generated as a 32-character hex string.
