# https://github.com/cloudnative-pg/charts/tree/main/charts/cloudnative-pg
# yaml-language-server: $schema=https://raw.githubusercontent.com/cloudnative-pg/charts/refs/heads/main/charts/cloudnative-pg/values.schema.json
cnpg:
  podMonitorEnabled: true
  grafanaDashboard:
    create: true
cloudnative-pg:
  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      memory: 192Mi
plugin-barman-cloud:
  # The chart passes --leader-elect; a later flag overrides it. With one
  # replica and the chart's required Recreate strategy, two copies never
  # run at once, so the lease only cost an etcd write every 2s.
  additionalArgs:
    - --leader-elect=false
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      memory: 192Mi
