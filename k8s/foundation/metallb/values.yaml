metallb:
  loadBalancerClass: metallb
  # disable frr (legacy embedded mode) and frrk8s (new default BGP backend in 0.16+)
  # — not using BGP and FRR caused issues with kernel 6.18
  speaker:
    frr:
      enabled: false
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
      limits:
        memory: 256Mi
  frrk8s:
    enabled: false
  prometheus:
    rbacPrometheus: false
    serviceMonitor:
      enabled: false
  controller:
    resources:
      requests:
        cpu: 10m
        memory: 192Mi
      limits:
        memory: 384Mi
