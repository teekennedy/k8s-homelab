exemptions:
  # MetalLB speaker requires host network access to announce layer 2 addresses and may need
  # root for raw socket operations. METALLB_ML_SECRET_KEY (memberlist gossip key) is read
  # from a Secret reference but the env var name contains "SECRET", triggering a false positive.
  - controllerNames:
      - metallb-speaker
    rules:
      - hostNetworkSet
      - runAsRootAllowed
      - privilegeEscalationAllowed
      - sensitiveContainerEnvVar
  # MetalLB controller sets env vars with "SECRET" in the name (memberlist configuration)
  # that are sourced from a Secret reference, not plain-text literals.
  - controllerNames:
      - metallb-controller
    rules:
      - sensitiveContainerEnvVar
