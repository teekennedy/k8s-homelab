# Polaris checks for every helmfile release. This replaces Polaris's built-in
# config rather than merging with it, so every check is listed here and none of
# the built-in exemptions apply.
#
# A chart's own polaris.yaml is appended to this file, and may only set
# `exemptions`.
#
# Any failing check fails the audit, whatever its severity.
checks:
  # reliability
  tagNotSpecified: danger
  readinessProbeMissing: warning
  livenessProbeMissing: warning
  pdbDisruptionsIsZero: warning
  hpaMaxAvailability: warning
  hpaMinAvailability: warning
  pdbMinAvailableGreaterThanHPAMinReplicas: warning
  # One replica is normal here, and a PDB on a single replica blocks node drains.
  deploymentMissingReplicas: ignore
  missingPodDisruptionBudget: ignore
  topologySpreadConstraint: ignore
  # Wants a class on every pod, including upstream charts'.
  priorityClassNotSet: ignore
  # Wants app.kubernetes.io/instance to equal the resource name; Helm sets it
  # to the release name.
  metadataAndInstanceMismatched: ignore
  # Images are pinned by digest, so re-pulling is wasted work. Replaced by
  # pullPolicyAlways.
  pullPolicyNotAlways: ignore
  pullPolicyAlways: danger
  # Every Longhorn volume must be explicitly opted into a recurring-job group.
  # Longhorn puts unlabelled volumes in its `default` group, which no recurring
  # job targets, so they are silently never backed up or trimmed.
  longhornGroupPVC: danger
  longhornGroupStatefulSet: danger
  longhornGroupCNPG: danger
  longhornGroupAlertmanager: danger
  longhornGroupPrometheus: danger

  # efficiency
  cpuRequestsMissing: warning
  memoryRequestsMissing: warning
  memoryLimitsMissing: warning
  # CPU limits throttle; requests are what scheduling needs.
  cpuLimitsMissing: ignore

  # security
  hostIPCSet: danger
  hostPIDSet: danger
  hostNetworkSet: danger
  hostPortSet: warning
  hostPathSet: warning
  procMount: warning
  hostProcess: warning
  privilegeEscalationAllowed: danger
  runAsRootAllowed: danger
  runAsPrivileged: danger
  dangerousCapabilities: danger
  tlsSettingsMissing: warning
  sensitiveContainerEnvVar: danger
  sensitiveConfigmapContent: danger
  clusterrolePodExecAttach: danger
  rolePodExecAttach: danger
  clusterrolebindingPodExecAttach: danger
  rolebindingClusterRolePodExecAttach: danger
  rolebindingRolePodExecAttach: danger
  clusterrolebindingClusterAdmin: danger
  rolebindingClusterAdminClusterRole: danger
  rolebindingClusterAdminRole: danger
  # Only passes when a NetworkPolicy selects exactly one of the pod's labels,
  # and fails a deny-all egress or a namespace-wide selector.
  missingNetworkPolicy: ignore

  # Pending: wanted, but releases still fail them. Enable one at a time as the
  # failures are fixed or exempted.
  linuxHardening: ignore # warning
  insecureCapabilities: ignore # warning
  automountServiceAccountToken: ignore # warning
  notReadOnlyRootFilesystem: ignore # warning
  imageDigestMissing: ignore # danger

customChecks:
  pullPolicyAlways:
    successMessage: Image pull policy is not "Always"
    failureMessage: Image pull policy should not be "Always"
    category: Efficiency
    target: Container
    schema:
      '$schema': http://json-schema.org/draft-07/schema
      type: object
      properties:
        imagePullPolicy:
          not:
            const: Always
  imageDigestMissing:
    successMessage: Image is pinned by digest
    failureMessage: Image should be pinned by digest (@sha256:...)
    category: Security
    target: Container
    schema:
      '$schema': http://json-schema.org/draft-07/schema
      type: object
      required:
        - image
      properties:
        image:
          type: string
          pattern: '@sha256:[a-f0-9]{64}$'
  longhornGroupPVC:
    successMessage: Longhorn PVC is in a recurring-job group
    failureMessage: &lhFail >-
      Longhorn volume must set recurring-job.longhorn.io/source=enabled and
      join the backup or ephemeral recurring-job group
    category: Reliability
    target: PersistentVolumeClaim
    schema:
      '$schema': http://json-schema.org/draft-07/schema
      type: object
      # An unset class means the cluster default, which is Longhorn. An empty
      # string binds a static PV and is not checked.
      if: &lhPvcSpec
        required: [spec]
        properties:
          spec:
            anyOf:
              - not:
                  required: [storageClassName]
              - properties:
                  storageClassName:
                    pattern: ^longhorn
      then: &lhLabeled
        required: [metadata]
        properties:
          metadata: &lhMetadata
            required: [labels]
            properties:
              labels:
                type: object
                required: [recurring-job.longhorn.io/source]
                properties:
                  recurring-job.longhorn.io/source:
                    const: enabled
                anyOf:
                  - required: [recurring-job-group.longhorn.io/backup]
                  - required: [recurring-job-group.longhorn.io/ephemeral]
  longhornGroupStatefulSet:
    successMessage: Longhorn volumeClaimTemplates are in a recurring-job group
    failureMessage: *lhFail
    category: Reliability
    target: apps/StatefulSet
    schema:
      '$schema': http://json-schema.org/draft-07/schema
      type: object
      properties:
        spec:
          properties:
            volumeClaimTemplates:
              items:
                if: *lhPvcSpec
                then: *lhLabeled
  longhornGroupCNPG:
    successMessage: Longhorn-backed CNPG cluster is in a recurring-job group
    failureMessage: *lhFail
    category: Reliability
    target: postgresql.cnpg.io/Cluster
    schema:
      '$schema': http://json-schema.org/draft-07/schema
      type: object
      if:
        required: [spec]
        properties:
          spec:
            required: [storage]
            properties:
              storage:
                anyOf:
                  - not:
                      required: [storageClass]
                  - properties:
                      storageClass:
                        pattern: ^longhorn
      then:
        required: [spec]
        properties:
          spec:
            required: [inheritedMetadata]
            properties:
              inheritedMetadata: *lhMetadata
  longhornGroupAlertmanager:
    successMessage: Longhorn volumeClaimTemplate is in a recurring-job group
    failureMessage: *lhFail
    category: Reliability
    target: monitoring.coreos.com/Alertmanager
    schema: &lhOperatorStorage
      '$schema': http://json-schema.org/draft-07/schema
      type: object
      properties:
        spec:
          properties:
            storage:
              properties:
                volumeClaimTemplate:
                  if: *lhPvcSpec
                  then: *lhLabeled
  longhornGroupPrometheus:
    successMessage: Longhorn volumeClaimTemplate is in a recurring-job group
    failureMessage: *lhFail
    category: Reliability
    target: monitoring.coreos.com/Prometheus
    schema: *lhOperatorStorage
